<script>
/* لعبة «قطار الإشارة» — الكفّ (التوقف عن نشاط ممتع).
   قطار يسير ببطء ثابت في منظر متحرك. تظهر على أعمدة الإشارة رموز، وعليها أن تنقر «قف»
   حين يصل عمود فيه الرمز الهدف إلى علامة المحطة. تنتهي الجولة بصعود ٣ ركاب.

   وحدات القياس: المسافة بـ«عمود» (١ = المسافة بين عمودين S بالبكسل)، فالسرعة تتناسب
   مع حجم الشاشة. اتجاه القطار نحو اليسار (اتجاه القراءة العربية)، فتجري الأعمدة نحو اليمين. */
(function () {
  'use strict';
  var B = (window.Bustan = window.Bustan || {});
  var UI = B.UI, h = UI.h, art = B.art;

  var SHAPES = art.SHAPES, COLOR_KEYS = art.COLOR_KEYS;
  var SPEED = 0.5;     // أعمدة في الثانية (عمود كل ثانيتين)
  var BRAKE = 1.0;     // مدة الكبح بالثانية
  var QBRAKE = 0.5;    // كبح لحظة الاستفهام
  var LAUNCH = 1.3;    // مدة الانطلاق
  var ROUND_STOPS = 3; // ركاب الجولة

  /* ألوان مشتتات المستوى ٣: بعيدة عن لون الهدف (حذراً من تقارب الأحمر والأخضر) */
  var FAR_COLORS = {
    red: ['blue', 'yellow', 'purple'], green: ['purple', 'orange', 'blue'],
    blue: ['red', 'yellow', 'orange'], yellow: ['blue', 'purple', 'green'],
    purple: ['yellow', 'green', 'orange'], orange: ['blue', 'purple', 'green']
  };

  /* ══════════ منطق الجولة (دوال نقية قابلة للاختبار) ══════════ */
  function rand(n) { return Math.floor(Math.random() * n); }
  function pick(a) { return a[rand(a.length)]; }
  function sym(shape, color) { return { shape: shape, color: color }; }
  function same(a, b) { return !!a && !!b && a.shape === b.shape && a.color === b.color; }
  function otherShape(s) { return pick(SHAPES.filter(function (x) { return x !== s; })); }
  function farColor(c) { return pick(FAR_COLORS[c]); }
  function clamp(lo, v, hi) { return Math.max(lo, Math.min(hi, v)); }

  function distractor(level, T, T2) {
    if (level === 2) return sym(otherShape(T.shape), pick(COLOR_KEYS));            // شكل مختلف
    if (level === 3) return sym(T.shape, farColor(T.color));                        // نفس الشكل ولون مختلف
    var base = Math.random() < 0.5 ? T : T2;                                        // المستوى ٤: شبيه بأحد الهدفين
    return Math.random() < 0.5 ? sym(base.shape, farColor(base.color)) : sym(otherShape(base.shape), base.color);
  }

  /* يبني جولة: الهدف/الأهداف، وحلقة الأعمدة (K عموداً)، وهل القاعدة مقلوبة */
  function makeRound(level, K, prev) {
    var T;
    do { T = sym(pick(SHAPES), pick(COLOR_KEYS)); } while (prev && same(T, prev));
    var ring = [], i, half = Math.floor(K / 2);
    for (i = 0; i < K; i++) ring.push(null);
    var round = { level: level, K: K, targets: [T], inverted: false, ring: ring };

    ring[0] = T;
    if (level === 4) {
      var T2;
      do { T2 = sym(pick(SHAPES), pick(COLOR_KEYS)); } while (T2.shape === T.shape || T2.color === T.color);
      round.targets = [T, T2];
      ring[half] = T2;
    } else {
      ring[half] = T;
    }
    if (level === 5) round.inverted = true;

    var near = 0;
    for (i = 1; i < K; i++) {
      if (ring[i]) continue;
      if (level === 1) continue; // أعمدة فارغة
      if (level === 5) {
        // كل الأعمدة عليها رموز؛ اثنان منها شبيهان بالمستثنى (نفس الشكل ولون آخر)
        if (near < 2 && (i === 1 || i === half + 1)) { ring[i] = sym(T.shape, farColor(T.color)); near++; continue; }
        var s5;
        do { s5 = sym(pick(SHAPES), pick(COLOR_KEYS)); } while (same(s5, T) || same(s5, ring[i - 1]));
        ring[i] = s5;
        continue;
      }
      if (Math.random() < 0.8) {
        var s, guard = 0;
        do { s = distractor(level, T, round.targets[1]); guard++; }
        while ((round.targets.some(function (t) { return same(t, s); }) || same(s, ring[i - 1])) && guard < 20);
        if (!round.targets.some(function (t) { return same(t, s); })) ring[i] = s;
      }
    }
    return round;
  }

  /* هل العمود الذي عليه الرمز s صالح للتوقف في هذه الجولة؟ */
  function isValid(round, s) {
    if (!s) return false;
    if (round.inverted) return !same(s, round.targets[0]);
    return round.targets.some(function (t) { return same(t, s); });
  }

  /* ══════════ الحالة ══════════ */
  var st = null;

  function create(ctx) {
    st = {
      ctx: ctx, alive: true, raf: 0, last: 0, t: 0,
      pos: 0, v: SPEED, vFrom: SPEED, vTo: SPEED, vT: 1, vDur: 1,
      rings: [], active: null, round: null, phase: 'idle',
      stops: 0, need: ROUND_STOPS, errors: 0, fails: 0, missed: 0, wrong: 0, idle: 0,
      hint: false, armed: false, demo: false, token: 0, resolve: null,
      seated: [null, null, null], wagonBase: 0, lastTarget: null, lastAnimal: '',
      firstAnimals: [], smokeT: 0, cardShown: false, resizeT: 0,
      wheels: [], layers: [], cars: [], G: null, el: {}
    };
  }

  /* ══════════ الأبعاد ══════════ */
  function geometry(W, H, vp) {
    var u = clamp(0.8, Math.min(W / 400, H / 660), 1.6);
    var cs = 0.88 * u;
    var short = H < 500;                            // جوال أفقي: ارتفاع شحيح
    var D = vp.tablet ? 132 : (short ? 88 : 100);   // قطر زر «قف» (≥ حدّ اللمس)
    var us = vp.tablet ? 1.45 : 1;
    var zoneH = D + (vp.tablet ? 44 : (short ? 22 : 34));
    var locoW = 130 * cs, locoH = 100 * cs, wagW = 90 * cs, wagH = 110 * cs, gap = 3 * cs;
    var S = clamp(190, 0.3 * W, 300);
    var K = Math.ceil(W / S) + 3;
    var yTrack = Math.min(H - zoneH - 34 * u, H * 0.7);
    var trainW = locoW + ROUND_STOPS * (wagW + gap);
    var trainTop = yTrack - wagH * (108 / 110);
    var bw = clamp(64, Math.min(0.5 * S, trainTop - 14 - 62), 150);
    return {
      W: W, H: H, u: u, cs: cs, D: D, us: us, zoneH: zoneH, S: S, K: K,
      locoW: locoW, locoH: locoH, wagW: wagW, wagH: wagH, gap: gap,
      yTrack: yTrack, trainW: trainW, trainLeft: (W - trainW) / 2, trainTop: trainTop,
      bw: bw, pw: bw * 100 / 88, boardTop: trainTop - 14 - bw,
      mark: W / 2, markQ: W / 2 / S
    };
  }

  /* ══════════ بناء المشهد ══════════ */
  function layer(parent, kind, y, hgt, factor, tileW, cls) {
    var n = Math.ceil(st.G.W / tileW) + 1;
    var inner = '';
    for (var i = 0; i < n; i++) inner += art.sceneTile(kind, Math.round(tileW), Math.round(hgt));
    var el = h('div', { class: 'layer ' + (cls || ''), style: { top: y + 'px', height: hgt + 'px', width: n * tileW + 'px' }, html: inner });
    parent.appendChild(el);
    st.layers.push({ el: el, tileW: tileW, factor: factor });
    return el;
  }

  function build() {
    var ctx = st.ctx, stage = ctx.stage;
    stage.innerHTML = '';
    stage.classList.add('train-stage');
    st.wheels = []; st.layers = []; st.cars = [];
    var vp = UI.vp();
    var g = st.G = geometry(stage.clientWidth, stage.clientHeight, vp);
    var W = g.W, H = g.H;
    stage.style.setProperty('--us', g.us);
    stage.style.setProperty('--bw', g.bw + 'px');
    stage.style.setProperty('--D', g.D + 'px');

    var tileW = Math.max(600, 700 * g.u);

    // السماء والشمس
    stage.appendChild(h('div', { class: 'sky' }));
    stage.appendChild(h('div', { class: 'sun', style: { left: W * 0.6 + 'px', top: H * 0.07 + 'px', width: 120 * g.u + 'px' }, html: art.sun() }));

    // جبال بقمم ثلجية (أبطأ طبقة)

    var hmn = Math.min(g.yTrack * 0.42, 260 * g.u);
    var mtn = h('div', { class: 'layer l-mtn', style: { top: g.yTrack - hmn + 6 + 'px', height: hmn + 'px', width: 2 * tileW + 'px' }, html: art.mountains(tileW, hmn) + art.mountains(tileW, hmn) });
    stage.appendChild(mtn);
    st.layers.push({ el: mtn, tileW: tileW, factor: 0.05 });
    // طبقات parallax بسرعات مختلفة
    layer(stage, 'clouds', H * 0.02, H * 0.32, 0.035, tileW, 'l-clouds');
    // بالونات وطيور تطفو في السماء (زينة حيّة)
    var deco = h('div', { class: 'sky-deco' });
    [['#F2658E', '#FFD34E', 0.1, 0.2, 1], ['#8E5CF0', '#5CC8FF', 0.8, 0.26, 0.8], ['#19B394', '#FFE45E', 0.45, 0.17, 0.6]].forEach(function (b, i) {
      deco.appendChild(h('div', { class: 'balloon b' + i, style: { left: W * b[2] + 'px', top: H * b[3] + 'px', width: 54 * g.u * b[4] + 'px' }, html: art.balloon(b[0], b[1]) }));
    });
    [[0.3, 0.3, 1], [0.36, 0.27, 0.75], [0.33, 0.35, 0.6]].forEach(function (b, i) {
      deco.appendChild(h('div', { class: 'bird f' + i, style: { left: W * b[0] + 'px', top: H * b[1] + 'px', width: 44 * g.u * b[2] + 'px' }, html: art.bird(i === 1 ? '#3D8BFD' : '#FF8A3D') }));
    });
    stage.appendChild(deco);
    var hf = Math.min(g.yTrack * 0.42, 260 * g.u);
    layer(stage, 'far', g.yTrack - hf + 4, hf, 0.08, tileW, 'l-far');
    var hm = hf * 0.72;
    var midL = layer(stage, 'mid', g.yTrack - hm + 6, hm, 0.2, tileW, 'l-mid');
    var wm = Math.min(hm * 0.95, 140 * g.u);
    midL.appendChild(h('div', { class: 'windmill', style: { left: tileW * 0.3 + 'px', bottom: hm * 0.08 + 'px', width: wm * 100 / 140 + 'px', height: wm + 'px' }, html: art.windmill() }));

    // الأرض
    stage.appendChild(h('div', { class: 'ground', style: { top: g.yTrack - 8 * g.u + 'px' } }));

    // الأعمدة (خلف القطار)
    st.el.poles = h('div', { class: 'poles' });
    stage.appendChild(st.el.poles);

    // علامة المحطة: إطار مضيء حول المنطقة التي يُنقر عندها
    var P = g.S * 0.9;
    stage.appendChild(h('div', {
      class: 'bracket',
      style: { left: g.mark - P / 2 + 'px', width: P + 'px', top: g.boardTop - 12 + 'px', height: g.bw + 24 + 'px' }
    }, h('span', { class: 'bracket-tip' })));

    // القضبان والعوارض
    layer(stage, 'ties', g.yTrack + 2 * g.u, 12 * g.u, 1, 8 * 38 * g.u, 'l-ties');
    stage.appendChild(h('div', { class: 'rail', style: { top: g.yTrack - 2 * g.u + 'px', height: 7 * g.u + 'px' } }));

    // القطار
    st.el.train = h('div', { class: 'train' });
    stage.appendChild(st.el.train);
    st.el.smoke = h('div', { class: 'smoke-layer' });
    stage.appendChild(st.el.smoke);
    buildTrain();

    // المقدمة السريعة
    var foreTop = g.yTrack + 16 * g.u;
    var foreH = Math.max(40, H - g.zoneH + 10 - foreTop);
    layer(stage, 'fore', foreTop, foreH, 1.5, tileW, 'l-fore');
    stage.appendChild(h('div', { class: 'ground-front', style: { top: foreTop + foreH - 2 + 'px' } }));

    // الغروب (يظهر في الختام)
    st.el.dusk = h('div', { class: 'dusk' });
    stage.appendChild(st.el.dusk);

    buildOverlay();
    // أعمدة الحلقات الموجودة (عند تغيّر الحجم)
    st.rings.forEach(buildRingDom);
    applyHint();
    renderCard(st.round, true);
    if (st.armed) showHand(true);
    render();
  }

  function buildTrain() {
    var g = st.G, train = st.el.train;
    var loco = h('div', { class: 'car loco', style: { left: g.trainLeft + 'px', top: g.yTrack - g.locoH + 'px', width: g.locoW + 'px', height: g.locoH + 'px' }, html: art.loco() });
    train.appendChild(loco);
    st.cars.push({ el: loco, phase: 0 });
    for (var i = 0; i < ROUND_STOPS; i++) {
      var x = g.trainLeft + g.locoW + g.gap + i * (g.wagW + g.gap);
      var w = h('div', {
        class: 'car wagon', 'data-i': i,
        style: { left: x + 'px', top: g.yTrack - g.wagH * (108 / 110) + 'px', width: g.wagW + 'px', height: g.wagH + 'px' }, html: art.wagon(st.wagonBase + i)
      });
      var win = h('div', {
        class: 'win',
        style: { left: (14 / 90) * g.wagW + 'px', top: (34 / 110) * g.wagH + 'px', width: (62 / 90) * g.wagW + 'px', height: (46 / 110) * g.wagH + 'px' }
      });
      w.appendChild(win);
      train.appendChild(w);
      if (st.seated[i]) seatAnimal(i, st.seated[i], true);
      st.cars.push({ el: w, win: win, phase: (i + 1) * 0.7 });
    }
    // العجلات: نحتفظ بنصف القطر كي نحسب الدوران من المسافة
    var radii = [10, 10, 13];
    train.querySelectorAll('.loco .wheel').forEach(function (el, k) { st.wheels.push({ el: el, r: radii[k] * g.cs }); });
    train.querySelectorAll('.wagon .wheel').forEach(function (el) { st.wheels.push({ el: el, r: 9 * g.cs }); });
  }

  function seatAnimal(i, name, silent) {
    var g = st.G, car = st.cars[i + 1];
    var win = car ? car.win : st.el.train.querySelectorAll('.wagon .win')[i];
    if (!win) return;
    win.innerHTML = '';
    var size = 54 * g.cs;
    var a = h('div', { class: 'seat', style: { width: size + 'px', height: size + 'px' }, html: art.animal(name) });
    win.appendChild(a);
    if (!silent) UI.anim(a, [{ transform: 'rotate(0)' }, { transform: 'rotate(-9deg)' }, { transform: 'rotate(9deg)' }, { transform: 'rotate(0)' }], { dur: 700, fill: 'none', deco: true });
  }

  function buildOverlay() {
    var g = st.G, stage = st.ctx.stage, us = g.us;
    var ov = h('div', { class: 'overlay' });
    stage.appendChild(ov);
    st.el.overlay = ov;

    // ناظر المحطة ومعه البطاقة (على جهة البداية من الزر)
    st.el.card = h('div', { class: 'card' });
    var owl = h('div', { class: 'owl', style: { width: 84 * us + 'px', height: 92 * us + 'px' }, html: art.owl() });
    var dock = h('div', { class: 'dock', style: { width: 112 * us + 'px', height: 100 * us + 'px' } }, owl, st.el.card);
    ov.appendChild(dock);
    st.el.dock = dock; st.el.owl = owl;

    // زر «قف»: يعمل عند اللمس مباشرة
    var btn = h('button', { class: 'stop-btn', type: 'button', 'aria-label': B.S.buttons.stop, style: { width: g.D + 'px', height: g.D + 'px', fontSize: g.D * 0.4 + 'px' } },
      h('span', { class: 'stop-word', text: B.S.buttons.stop }));
    UI.bindPress(btn, onTap, { down: true });
    ov.appendChild(btn);
    st.el.btn = btn;
  }

  /* ══════════ الأعمدة ══════════ */
  function newRing(round, delay) {
    var poles = round.ring.map(function (s, i) {
      return { sym: s, valid: isValid(round, s), q: -1.5 - i - delay, consumed: false, inside: false, el: null };
    });
    return { round: round, poles: poles, wrap: true };
  }

  function buildRingDom(ring) {
    var g = st.G;
    ring.poles.forEach(function (p) {
      var el = h('div', { class: 'pole', style: { width: g.pw + 'px', top: g.boardTop - 4 * (g.pw / 100) + 'px' } },
        h('div', { class: 'halo' }),
        h('div', { class: 'pole-art', html: art.pole(p.sym) })
      );
      st.el.poles.appendChild(el);
      p.el = el;
      p.inside = Math.abs(p.q - g.markQ) <= 0.5;
    });
  }

  function removeRing(ring) {
    ring.poles.forEach(function (p) { if (p.el) p.el.remove(); });
    st.rings = st.rings.filter(function (r) { return r !== ring; });
    if (st.active === ring) st.active = null;
  }

  function applyHint() {
    if (!st.active) return;
    st.active.poles.forEach(function (p) {
      if (p.el) p.el.classList.toggle('blink', st.hint && p.valid);
    });
  }
  function setHint(on) { st.hint = on; applyHint(); }

  /* ══════════ البطاقة والناظر ══════════ */
  function renderCard(round, show) {
    var c = st.el.card;
    c.innerHTML = '';
    c.classList.toggle('two', !!round && round.targets.length === 2);
    c.classList.toggle('inverted', !!round && round.inverted);
    c.style.opacity = round && show ? '1' : '0';
    if (!round) return;
    round.targets.forEach(function (t) {
      c.appendChild(h('span', { class: 'card-sym', html: round.inverted ? art.symbolNot(t) : art.symbol(t) }));
    });
  }

  /* تمهيد: تظهر البطاقة كبيرة في وسط الشاشة ثم تنزل إلى مكانها */
  async function cardIntro(tok) {
    var ctx = st.ctx, g = st.G, c = st.el.card;
    if (st.cardShown) {
      await ctx.anim(c, [{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(.2)', opacity: 0 }], { dur: 220, fill: 'both' });
      if (tok !== st.token) return;
    }
    renderCard(st.round, false);
    if (B.audio) B.audio.play('card');
    var sr = ctx.stage.getBoundingClientRect(), cr = c.getBoundingClientRect();
    var cx = cr.left + cr.width / 2 - sr.left, cy = cr.top + cr.height / 2 - sr.top;
    var bigW = Math.min(g.W * 0.5, 230 * g.us) * (st.round.targets.length === 2 ? 0.9 : 1);
    var k = bigW / cr.width;
    var dx = g.W / 2 - cx, dy = Math.min(g.H * 0.36, g.boardTop - bigW * 0.4) - cy;
    var big = 'translate(' + dx + 'px,' + dy + 'px) scale(' + k + ')';
    st.el.card.classList.add('flying');
    await ctx.anim(c, [{ transform: 'translate(0,0) scale(.2)', opacity: 0 }, { transform: big, opacity: 1 }], { dur: 650, easing: UI.SPRING });
    if (tok !== st.token) return;
    await ctx.anim(c, [
      { transform: big }, { transform: big.replace('scale(' + k + ')', 'scale(' + k * 1.07 + ')'), offset: 0.25 },
      { transform: big }, { transform: big.replace('scale(' + k + ')', 'scale(' + k * 1.07 + ')'), offset: 0.75 }, { transform: big }
    ], { dur: 1000, easing: 'ease-in-out', fill: 'both' });
    if (tok !== st.token) return;
    await ctx.sleep(300);
    if (tok !== st.token) return;
    await ctx.anim(c, [{ transform: big, opacity: 1 }, { transform: 'translate(0,0) scale(1)', opacity: 1 }], { dur: 650, fill: 'both' });
    if (tok !== st.token) return;
    st.el.card.classList.remove('flying');
    c.getAnimations().forEach(function (a) { a.cancel(); });
    c.style.opacity = '1';
    st.cardShown = true;
  }

  /* ══════════ السرعة ══════════ */
  function setSpeed(to, dur) {
    st.vFrom = st.v; st.vTo = to; st.vT = 0; st.vDur = Math.max(0.05, dur);
  }

  /* ══════════ الحلقة الرئيسية ══════════ */
  function frame(now) {
    if (!st || !st.alive) return;
    var dt = Math.min(0.05, (now - st.last) / 1000) * UI.ts;
    st.last = now;
    if (!st.paused) step(dt); // الإيقاف المؤقت: لا حركة ولا عدّ ولا صوت
    st.raf = requestAnimationFrame(frame);
  }

  function step(dt) {
    var g = st.G;
    st.t += dt;
    if (st.vT < st.vDur) {
      st.vT = Math.min(st.vDur, st.vT + dt);
      var p = st.vT / st.vDur;
      st.v = st.vFrom + (st.vTo - st.vFrom) * (0.5 - 0.5 * Math.cos(Math.PI * p));
    }
    var dq = st.v * dt;
    st.pos += dq;

    // تحريك الحلقات
    st.rings.slice().forEach(function (ring) {
      ring.poles.forEach(function (p) {
        p.q += dq;
        if (ring.wrap && p.q > ring.round.K - 1.5) { p.q -= ring.round.K; p.inside = false; }
      });
      if (!ring.wrap && ring.poles.every(function (p) { return p.q * g.S > g.W + g.S; })) removeRing(ring);
    });

    if (st.active && st.phase === 'play') watchPlatform();

    // تشو تشو خفيف يتناسب إيقاعه مع السرعة
    if (st.v > 0.12 && UI.ts === 1) {
      st.chugT = (st.chugT || 0) + dt;
      if (st.chugT > 0.5 / (st.v / SPEED)) { st.chugT = 0; if (B.audio) B.audio.play('chug', Math.min(1, st.v / SPEED)); }
    }
    // دخان المدخنة
    if (st.v > 0.12) {
      st.smokeT += dt;
      if (st.smokeT > 0.9) { st.smokeT = 0; puff(false); }
    }
    render();
  }

  /* مراقبة منطقة المحطة: مرور الهدف بلا نقر، والتوقف التلقائي */
  function watchPlatform() {
    var g = st.G, ring = st.active;
    if (!ring) return;
    ring.poles.forEach(function (p) {
      var inside = Math.abs(p.q - g.markQ) <= 0.5;
      if (inside && !p.inside) p.inside = true;
      else if (!inside && p.inside && p.q > g.markQ) {
        p.inside = false;
        var wasConsumed = p.consumed;
        p.consumed = false;
        if (p.valid && !wasConsumed) onMiss();
      }
    });
    if (st.armed && st.phase === 'play' && st.v >= SPEED * 0.95) {
      var brakeDist = st.v * BRAKE / 2;
      for (var i = 0; i < ring.poles.length; i++) {
        var q = ring.poles[i], d = g.markQ - q.q;
        if (q.valid && !q.consumed && d <= brakeDist && d >= -0.3) { doStop(q, true); break; }
      }
    }
  }

  function onMiss() {
    if (st.round.inverted) { st.idle++; }
    else { st.missed++; st.fails++; st.errors++; }
    updateHelp();
  }

  /* سلّم المساعدة الصامتة */
  function updateHelp() {
    var inv = st.round.inverted;
    var hintNow = st.demo || (inv ? st.idle >= 2 : (st.missed >= 1 || st.wrong >= 2));
    var armNow = st.demo || (inv ? st.idle >= 4 : st.fails >= 3);
    if (hintNow && !st.hint) setHint(true);
    if (armNow && !st.armed) { st.armed = true; showHand(false); }
  }

  /* ══════════ النقر على «قف» ══════════ */
  function onTap() {
    if (!st || st.paused || st.phase !== 'play' || st.demo) return;
    if (st.v < SPEED * 0.25) return; // يتوقف أو ينطلق ببطء: نتجاهل
    var g = st.G, best = null, bd = 9;
    st.active.poles.forEach(function (p) {
      var d = Math.abs(p.q - g.markQ);
      if (d < bd) { bd = d; best = p; }
    });
    if (best && bd <= 0.55 && best.valid && !best.consumed) doStop(best, false);
    else wrongTap(bd <= 0.55 ? best : null);
  }

  function pressVisual() {
    var b = st.el.btn;
    b.classList.add('pressed');
    if (B.audio) B.audio.play('tap');
    setTimeout(function () { if (b) b.classList.remove('pressed'); }, 280 / UI.ts);
  }

  async function wrongTap(p) {
    var tok = ++st.token, ctx = st.ctx;
    st.phase = 'question';
    st.wrong++; st.fails++; st.errors++;
    setSpeed(0, QBRAKE);
    if (B.audio) B.audio.play('wrong');
    var bub = null;
    if (p && p.el) {
      bub = h('div', { class: 'q-bubble', style: { width: st.G.bw * 0.62 + 'px', left: '50%', marginLeft: -st.G.bw * 0.31 + 'px', top: -st.G.bw * 0.78 + 'px' }, html: art.bubbleQ() });
      p.el.appendChild(bub);
      UI.anim(bub, [{ transform: 'scale(.2)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { dur: 380, easing: UI.SPRING });
    }
    await ctx.sleep(QBRAKE * 1000 + 900);
    if (tok !== st.token) return;
    if (bub) UI.anim(bub, [{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(.6)' }], { dur: 300 }).then(function () { bub.remove(); });
    setSpeed(SPEED, 1.0);
    st.phase = 'play';
    updateHelp();
  }

  /* ══════════ التوقف وصعود الراكب ══════════ */
  function pickAnimal() {
    var names = art.ANIMAL_NAMES, n;
    do { n = pick(names); } while (n === st.lastAnimal);
    st.lastAnimal = n;
    return n;
  }

  function doStop(p, auto) {
    p.consumed = true;
    st.phase = 'boarding';
    setHint(false);
    if (st.armed) hideHand();
    st.armed = false;
    setSpeed(0, BRAKE);
    if (auto) pressVisual();
    if (B.audio) { B.audio.play('brake'); if (!auto) B.audio.play('right'); }
    board(p);
  }

  async function board(p) {
    var tok = ++st.token, ctx = st.ctx, g = st.G;
    await ctx.sleep(BRAKE * 1000 - 100);
    if (tok !== st.token) return;

    var idx = st.stops, name = pickAnimal();
    if (idx === 0) st.firstAnimals.push(name);

    // الراكب يظهر من لوحة العمود
    var fw = g.bw * 0.8;
    var px = p.q * g.S, py = g.boardTop + g.bw / 2;
    var fly = h('div', { class: 'flyer', style: { left: px - fw / 2 + 'px', top: py - fw / 2 + 'px', width: fw + 'px', height: fw + 'px' } });
    var inner = h('div', { class: 'flyer-in', html: art.animal(name) });
    fly.appendChild(inner);
    st.el.overlay.appendChild(fly);
    if (B.audio) B.audio.play('pop');
    await ctx.anim(inner, [{ transform: 'scale(.2)', opacity: 0 }, { transform: 'scale(1.12)', opacity: 1, offset: 0.7 }, { transform: 'scale(1)', opacity: 1 }], { dur: 420, easing: UI.SPRING });
    if (tok !== st.token) { fly.remove(); return; }
    await ctx.sleep(200);
    if (tok !== st.token) { fly.remove(); return; }

    // قفزة بشكل قوس إلى نافذة العربة
    var car = st.cars[idx + 1];
    var wl = parseFloat(car.el.style.left), wt = parseFloat(car.el.style.top);
    var wx = wl + parseFloat(car.win.style.left) + parseFloat(car.win.style.width) / 2;
    var wy = wt + parseFloat(car.win.style.top) + parseFloat(car.win.style.height) / 2;
    var dx = wx - (px), dy = wy - py;
    var sc = (54 * g.cs) / fw;
    var arc = Math.max(60, g.bw * 0.7);
    var a1 = ctx.anim(fly, [{ transform: 'translateX(0)' }, { transform: 'translateX(' + dx + 'px)' }], { dur: 700, easing: 'cubic-bezier(.45,.05,.55,.95)' });
    var a2 = ctx.anim(inner, [
      { transform: 'translateY(0) scale(1)', easing: 'cubic-bezier(.2,.7,.4,1)' },
      { transform: 'translateY(' + (-arc) + 'px) scale(1.05)', offset: 0.45, easing: 'cubic-bezier(.6,0,.9,.5)' },
      { transform: 'translateY(' + dy + 'px) scale(' + sc + ')' }
    ], { dur: 700 });
    await Promise.all([a1, a2]);
    if (tok !== st.token) { fly.remove(); return; }

    st.seated[idx] = name;
    seatAnimal(idx, name, false);
    fly.remove();
    sparkles(wx, wy, 5);
    if (B.audio) B.audio.play('sparkle');
    // العربة ترتجّ بلطف عند الاستقبال
    UI.anim(car.el, [{ transform: 'translateY(0) scale(1,1)' }, { transform: 'translateY(4px) scale(1.04,.94)' }, { transform: 'translateY(0) scale(1,1)' }], { dur: 420, easing: UI.SPRING, fill: 'none' });
    var r = car.el.getBoundingClientRect(), sr = ctx.stage.getBoundingClientRect();
    UI.burst(st.el.overlay, r.left + r.width / 2 - sr.left, r.top - sr.top + 10, { n: 8, spread: 60, dur: 900 });
    await ctx.sleep(650);
    if (tok !== st.token) return;

    st.stops++;
    st.fails = st.missed = st.wrong = st.idle = 0;
    if (st.stops >= st.need) finishRound(tok);
    else { st.phase = 'play'; setSpeed(SPEED, LAUNCH); if (B.audio) B.audio.play('toot'); }
  }

  async function finishRound(tok) {
    var ctx = st.ctx, g = st.G;
    st.phase = 'cheer';
    // علامة «تمّ» فوراً مكان الشكل المطلوب، فلا تظن الطفل أنه ما زال مطلوباً
    var cd = st.el.card;
    cd.classList.remove('two', 'inverted');
    cd.innerHTML = '<span class="card-sym">' + art.check() + '</span>';
    UI.anim(cd, [{ transform: 'scale(.4) rotate(-15deg)' }, { transform: 'scale(1.15)' }, { transform: 'none' }], { dur: 450, easing: UI.SPRING, fill: 'none' });
    // الأعمدة القديمة تبهت ولا يُحتسب عليها شيء
    st.rings.forEach(function (r) { r.poles.forEach(function (p) { if (p.el) p.el.classList.add('old'); }); });
    // احتفال: العربات تقفز بالتتابع، وفرقعة جسيمات، ونفخة دخان كبيرة
    st.cars.forEach(function (c, i) {
      UI.anim(c.el, [{ transform: 'translateY(0)' }, { transform: 'translateY(-14px)' }, { transform: 'translateY(0)' }], { dur: 560, delay: i * 110, easing: UI.SPRING, fill: 'none', deco: true });
    });
    UI.burst(st.el.overlay, g.W / 2, g.trainTop, { n: 26, spread: 170, dur: 1500 });
    for (var k = 0; k < 5; k++) setTimeout(puff.bind(null, true), (k * 140) / UI.ts);
    sparkles(g.W / 2, g.trainTop + 10, 8);
    if (B.audio) { B.audio.play('cheer'); B.audio.play('toot'); }
    await ctx.sleep(1500);
    if (tok !== st.token) return;
    // الركاب يودّعون: ينكمشون بلطف ثم تفرغ العربات
    var seats = st.el.train.querySelectorAll('.seat');
    var ps = [];
    seats.forEach(function (s, i) { ps.push(ctx.anim(s, [{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(1.12)', opacity: 1, offset: 0.3 }, { transform: 'scale(.1)', opacity: 0 }], { dur: 520, delay: i * 120 })); });
    await Promise.all(ps);
    if (tok !== st.token) return;
    st.seated = [null, null, null];
    st.cars.forEach(function (c) { if (c.win) c.win.innerHTML = ''; });
    st.wagonBase = (st.wagonBase + 1) % 5;
    st.el.train.querySelectorAll('.wagon').forEach(function (w, i) {
      var old = w.querySelector('svg');
      var fresh = art.wagon(st.wagonBase + i);
      old.outerHTML = fresh;
    });
    setSpeed(SPEED, LAUNCH);
    st.phase = 'idle';
    var res = st.resolve; st.resolve = null;
    if (res) res({ errors: st.demo ? 0 : st.errors });
  }

  /* شرارات صغيرة لامعة حول نقطة */
  function sparkles(x, y, n) {
    if (UI.reduced()) return;
    var cols = ['#FFF7C2', '#FFD34E', '#fff', '#B79BFF'];
    for (var i = 0; i < n; i++) {
      var sz = 14 + Math.random() * 14;
      var el = h('span', { class: 'spark', style: { left: x - sz / 2 + 'px', top: y - sz / 2 + 'px', width: sz + 'px', height: sz + 'px' }, html: art.sparkle(cols[i % 4]) });
      st.el.overlay.appendChild(el);
      var a = Math.random() * Math.PI * 2, d = 30 + Math.random() * 50;
      UI.anim(el, [
        { transform: 'translate(0,0) scale(0) rotate(0)', opacity: 1 },
        { transform: 'translate(' + Math.cos(a) * d + 'px,' + Math.sin(a) * d + 'px) scale(1.2) rotate(90deg)', opacity: 1, offset: 0.5 },
        { transform: 'translate(' + Math.cos(a) * d * 1.3 + 'px,' + Math.sin(a) * d * 1.3 + 'px) scale(0) rotate(180deg)', opacity: 0 }
      ], { dur: 800 + Math.random() * 400, delay: i * 60 }).then((function (e) { return function () { e.remove(); }; })(el));
    }
  }

  /* دخان: نفخة صغيرة أو كبيرة من المدخنة (ملوّنة في الاحتفال) */
  function puff(big) {
    if (UI.reduced()) return;
    var g = st.G, loco = st.cars[0];
    var s = (big ? 26 : 15) * g.cs;
    var x = g.trainLeft + 24 * g.cs, y = g.yTrack - g.locoH + 6 * g.cs;
    var cols = ['#FFD34E', '#F2658E', '#8E5CF0', '#5CC8FF', '#7AE582'];
    var el = h('span', { class: 'puff', style: { left: x - s / 2 + 'px', top: y - s / 2 + 'px', width: s + 'px', height: s + 'px', background: big ? cols[Math.floor(Math.random() * cols.length)] : '' } });
    st.el.smoke.appendChild(el);
    UI.anim(el, [
      { transform: 'translate(0,0) scale(.5)', opacity: 0.9 },
      { transform: 'translate(' + (big ? 50 : 34) * g.cs + 'px,' + (big ? -70 : -48) * g.cs + 'px) scale(' + (big ? 2.6 : 2) + ')', opacity: 0 }
    ], { dur: big ? 1800 : 1500, easing: 'ease-out', deco: true }).then(function () { el.remove(); });
  }

  /* اليد الكرتونية: تظهر حين يلزم أن تُظهَر طريقة الضغط */
  function showHand(instant) {
    if (st.el.hand) return;
    var g = st.G, btn = st.el.btn;
    var hs = g.D * 1.0 / 96;
    // الكفّ مقلوب: نقطة اللمس في الأسفل (٤٤،٩٤ من صندوقها) وتلمس أعلى الزر
    var bx = g.W / 2, tipY = btn.offsetTop + g.D * 0.3;
    var hand = h('div', {
      class: 'hand',
      style: { width: 88 * hs + 'px', height: 96 * hs + 'px', left: bx - 44 * hs + 'px', top: tipY - 94 * hs + 'px' }
    }, h('div', { class: 'hand-in', html: art.hand() }));
    st.el.overlay.appendChild(hand);
    st.el.hand = hand;
    if (!instant) UI.anim(hand, [{ opacity: 0, transform: 'translateY(-50px)' }, { opacity: 1, transform: 'translateY(0)' }], { dur: 500, easing: UI.SPRING, fill: 'backwards' });
    // نقرة متكررة هادئة على الزر
    hand.classList.add('tapping');
  }
  function hideHand() {
    var hd = st.el.hand;
    if (!hd) return;
    st.el.hand = null;
    UI.anim(hd, [{ opacity: 1 }, { opacity: 0, transform: 'translateY(-40px)' }], { dur: 450 }).then(function () { hd.remove(); });
  }

  /* ══════════ الرسم لكل إطار ══════════ */
  function render() {
    var g = st.G;
    if (!g) return;
    var wpx = st.pos * g.S;
    // الأعمدة
    st.rings.forEach(function (ring) {
      ring.poles.forEach(function (p) {
        if (!p.el) return;
        var x = p.q * g.S;
        if (x < -g.pw || x > g.W + g.pw) { p.el.style.visibility = 'hidden'; return; }
        p.el.style.visibility = 'visible';
        p.el.style.transform = 'translate3d(' + (x - g.pw / 2).toFixed(1) + 'px,0,0)';
      });
    });
    // المناظر
    st.layers.forEach(function (l) {
      var off = (wpx * l.factor) % l.tileW;
      l.el.style.transform = 'translate3d(' + (off - l.tileW).toFixed(1) + 'px,0,0)';
    });
    // العجلات: الدوران من المسافة المقطوعة، عكس عقارب الساعة لأن القطار يسير يساراً
    st.wheels.forEach(function (w) {
      w.el.style.transform = 'rotate(' + (-(wpx / w.r) * 57.2958).toFixed(1) + 'deg)';
    });
    // اهتزاز القطار الخفيف يتناسب مع السرعة
    var amp = 1.3 * (st.v / SPEED);
    st.cars.forEach(function (c) {
      c.el.style.transform = 'translateY(' + (Math.sin(st.t * 9 + c.phase) * amp).toFixed(2) + 'px)';
    });
  }

  /* ══════════ الجولة ══════════ */
  function startRound(level, index, demo) {
    var g = st.G;
    st.token++;
    var tok = st.token;
    var round = makeRound(level, g.K, st.lastTarget);
    st.lastTarget = round.targets[0];
    st.round = round;
    st.demo = !!demo;
    st.stops = 0; st.need = demo ? 1 : ROUND_STOPS;
    st.errors = 0; st.fails = st.missed = st.wrong = st.idle = 0;
    st.hint = false; st.armed = false;
    if (st.el.hand) { st.el.hand.remove(); st.el.hand = null; }
    st.phase = 'intro';
    st.rings.forEach(function (r) { r.wrap = false; });
    var ring = newRing(round, 0.4);
    st.rings.push(ring);
    st.active = ring;
    buildRingDom(ring);
    // لا يبدأ اللعب قبل أن تُعرض البطاقة وتنزل إلى مكانها (تنبؤ قبل الفعل)
    cardIntro(tok).then(function () {
      if (tok !== st.token) return;
      st.phase = 'play';
      if (st.demo) updateHelp();
    });
  }

  function runRound(level, index, demo) {
    return new Promise(function (resolve) {
      st.resolve = resolve;
      startRound(level, index, demo);
    });
  }

  /* ══════════ عقد اللعبة ══════════ */
  var game = {
    id: 'train',

    mount: function (ctx) {
      create(ctx);
      build();
      st.last = performance.now();
      st.raf = requestAnimationFrame(frame);
      st.onResize = function () {
        clearTimeout(st.resizeT);
        st.resizeT = setTimeout(function () { if (st && st.alive) build(); }, 160);
      };
      window.addEventListener('resize', st.onResize);
    },

    demo: function (ctx) {
      return runRound(1, -1, true).then(function () { st.demo = false; });
    },

    playRound: function (ctx, level, index) {
      return runRound(level, index, false);
    },

    pause: function () { if (st) st.paused = true; },
    resume: function () { if (st) { st.paused = false; st.last = performance.now(); } },

    cancelRound: function () {
      if (!st || !st.resolve) return;
      st.token++; // يُبطل كل المتتاليات غير المتزامنة الجارية
      var res = st.resolve; st.resolve = null;
      st.phase = 'idle';
      st.hint = false; st.armed = false;
      if (st.el.hand) { st.el.hand.remove(); st.el.hand = null; }
      st.el.overlay.querySelectorAll('.flyer').forEach(function (f) { f.remove(); });
      st.el.card.classList.remove('flying');
      st.el.card.getAnimations().forEach(function (a) { a.cancel(); });
      st.seated = [null, null, null];
      st.cars.forEach(function (c) { if (c.win) c.win.innerHTML = ''; });
      st.rings.forEach(function (r) { r.wrap = false; });
      st.active = null;
      setSpeed(SPEED, 1.0);
      res({ cancelled: true });
    },

    outro: async function (ctx) {
      setSpeed(0, 1.8);
      if (B.audio) B.audio.play('brake');
      setTimeout(function () { if (B.audio) B.audio.play('lullaby'); }, 1800 / UI.ts);
      UI.anim(st.el.dusk, [{ opacity: 0 }, { opacity: 1 }], { dur: 2000 });
      await ctx.sleep(2300);
    },

    /* الشاشة الختامية: القطار نائم في المساء وقد امتلأت عرباته، وناظر المحطة نائم */
    endArt: function (ctx) {
      var vp = UI.vp();
      var cs = Math.min(1.1, (vp.W - 24) / (130 + 5 * 93));
      var row = h('div', { class: 'end-train' });
      var loco = h('div', { class: 'car-static', style: { width: 130 * cs + 'px', height: 100 * cs + 'px' }, html: art.loco() });
      row.appendChild(loco);
      var names = st.firstAnimals.slice();
      for (var i = 0; i < 5; i++) {
        var w = h('div', { class: 'car-static', style: { width: 90 * cs + 'px', height: 110 * cs + 'px', marginInlineStart: 3 * cs + 'px' }, html: art.wagon(i) });
        var win = h('div', { class: 'win', style: { left: 14 * cs + 'px', top: 34 * cs + 'px', width: 62 * cs + 'px', height: 46 * cs + 'px' } });
        for (var k = 0; k < 2; k++) {
          var nm = names[i * 2 + k] || art.ANIMAL_NAMES[(i + k) % 6];
          win.appendChild(h('div', { class: 'seat', style: { width: 30 * cs + 'px', height: 30 * cs + 'px' }, html: art.animal(nm, { sleep: true }) }));
        }
        w.appendChild(win);
        row.appendChild(w);
      }
      var sleepy = h('div', { class: 'end-owl', style: { width: 110 * Math.min(1.3, cs * 1.2) + 'px' } },
        h('div', { html: art.owl({ sleep: true }) }),
        h('span', { class: 'end-z', html: art.zzz() }));
      var stars = h('div', { class: 'end-stars' });
      for (var si = 0; si < 26; si++) {
        stars.appendChild(h('span', { class: 'end-star', style: { left: Math.random() * 100 + '%', top: Math.random() * 55 + '%', width: 6 + Math.random() * 10 + 'px', animationDelay: (Math.random() * 3) + 's' }, html: art.sparkle('#FFF7C2') }));
      }
      var fire = h('div', { class: 'end-fire' });
      for (var fi = 0; fi < 10; fi++) {
        fire.appendChild(h('span', { class: 'firefly', style: { left: Math.random() * 100 + '%', top: 60 + Math.random() * 35 + '%', animationDelay: (Math.random() * 4) + 's', animationDuration: 4 + Math.random() * 3 + 's' } }));
      }
      return h('div', { class: 'end-train-wrap' },
        stars, fire,
        h('div', { class: 'end-hills', html: art.sceneTile('far', vp.W, Math.round(vp.H * 0.3)) }),
        h('div', { class: 'end-moon', html: art.moon() }),
        sleepy, row);
    },

    destroy: function () {
      if (!st) return;
      st.alive = false;
      cancelAnimationFrame(st.raf);
      window.removeEventListener('resize', st.onResize);
      clearTimeout(st.resizeT);
      st = null;
    },

    // للاختبارات الآلية فقط
    _makeRound: makeRound,
    _isValid: isValid,
    _probe: function () {
      if (!st || !st.active || !st.G) return { ready: false };
      var g = st.G, best = null, bd = 9;
      st.active.poles.forEach(function (p) {
        var d = Math.abs(p.q - g.markQ);
        if (d < bd) { bd = d; best = p; }
      });
      return {
        ready: true, phase: st.phase, v: st.v, demo: st.demo, level: st.round.level, inverted: st.round.inverted,
        stops: st.stops, errors: st.errors, hint: st.hint, armed: st.armed,
        nearValid: !!(best && best.valid && !best.consumed && bd < 0.3),
        nearAny: !!best && bd < 0.3,
        nearBlankOrBad: !!(best && !best.valid && bd < 0.3)
      };
    }
  };

  B.games.train = game;
})();

</script>
<script>
/* لعبة «مرآة الأشكال» — التماثل والتفكير المكاني. عالم أقمشة وفراشات.
   شبكة بخط منتصف يشبه ثنية قماش. نصفها ملوّن، وعلى الطفل أن تبني النصف المطابق انعكاساً.
   تختار لوناً من الأسفل بنقرة ثم تنقر الخانة (أو تسحبه إليها).
   المستويات: ١) نصف صغير ولونان مع وميض الخانة التالية  ٢) أكبر بلا وميض  ٣) ثلاثة ألوان
              ٤) محور أفقي  ٥) أكبر مع أشكال في الخانات.
   حجم الخانة لا ينزل عن حدّ اللمس: نختار أبعاد النصف التي تناسب الشاشة. */
(function () {
  'use strict';
  var B = (window.Bustan = window.Bustan || {});
  var UI = B.UI, h = UI.h, art = B.art, kit = B.kit;

  var FABRIC = ['#F2658E', '#3D8BFD', '#FFC83D', '#2DBE7E', '#8E5CF0', '#FF8A3D'];
  var CFG = {
    /* سهّلناها لابن الرابعة: المستويات ١–٣ «انسخي مثلها» (كل بقعة في مكانها نفسه، بلا انعكاس)،
       وظلّ اللون الباهت يدلّ على المطلوب في ١ و٢ و٤. الانعكاس الحقيقي (الفراشة) في ٤ و٥ فقط. */
    1: { n: 4, fill: 2, colors: 2, axis: 'v', guided: true, copy: true },
    2: { n: 4, fill: 3, colors: 2, axis: 'v', guided: true, copy: true },
    3: { n: 6, fill: 4, colors: 3, axis: 'v', copy: true },
    4: { n: 4, fill: 3, colors: 2, axis: 'v', guided: true },
    5: { n: 6, fill: 4, colors: 3, axis: 'v' }
  };

  /* يختار أبعاد النصف (أعمدة×صفوف) التي تعطي أكبر خانة */
  function fit(n, axis, Wa, Ha) {
    var best = null;
    for (var c = 1; c <= n; c++) {
      if (n % c) continue;
      var r = n / c;
      var size = axis === 'v' ? Math.min(Wa / (2 * c + 0.42), Ha / r) : Math.min(Wa / c, Ha / (2 * r + 0.42)); // 0.42: جسم الفراشة
      if (c === 1 && axis === 'v' && n > 3) continue; // عمود واحد لا يُظهر الانعكاس جيداً
      if (r === 1 && axis === 'h' && n > 8) continue;
      if (!best || size > best.size) best = { c: c, r: r, size: size };
    }
    return best;
  }

  /* يبني جولة: الرموز (ألوان/أشكال) وخريطة النصف المصدر */
  function makeRound(level, Wa, Ha, tap) {
    var cfg = CFG[level], n = cfg.n;
    var f = fit(n, cfg.axis, Wa, Ha);
    if (f.size < tap && n > 8) { n = 8; f = fit(n, cfg.axis, Wa, Ha); } // شاشة صغيرة: نصغّر الشبكة لا الخانة
    if (f.size < tap && n > 6) { n = 6; f = fit(n, cfg.axis, Wa, Ha); }
    var cols = kit.shuffle(FABRIC).slice(0, cfg.colors);
    var shapes = kit.shuffle(['triangle', 'circle', 'square']);
    var tokens = cols.map(function (c, i) { return { color: c, shape: cfg.shapes ? shapes[i] : null }; });
    var cells = [], i;
    for (i = 0; i < n; i++) cells.push(-1);
    var fillN = Math.min(n - 1, Math.round(cfg.fill * n / cfg.n));
    kit.shuffle(cells.map(function (_, k) { return k; })).slice(0, fillN).forEach(function (k, j) { cells[k] = j % tokens.length; });
    return { level: level, axis: cfg.axis, copy: !!cfg.copy, guided: !!cfg.guided, c: f.c, r: f.r, size: Math.floor(Math.min(f.size, UI.vp().tablet ? 130 : 110)), tokens: tokens, cells: cells };
  }

  function tokenHtml(t) {
    if (!t.shape) return '<span class="mr-fill" style="background:' + t.color + '"></span>';
    var d = t.shape === 'triangle' ? '<polygon points="50,14 88,84 12,84"/>' : t.shape === 'circle' ? '<circle cx="50" cy="50" r="36"/>' : '<rect x="16" y="16" width="68" height="68" rx="12"/>';
    return '<svg viewBox="0 0 100 100" class="mr-shape" fill="' + t.color + '" stroke="' + t.color + '" stroke-width="6" stroke-linejoin="round">' + d + '</svg>';
  }

  function butterfly(c1, c2) {
    var wing = '<path d="M50 50C46 20 20 8 12 24C6 38 22 50 50 52Z" fill="' + c1 + '"/><path d="M50 54C28 56 14 72 22 84C30 94 46 82 50 56Z" fill="' + c2 + '"/><circle cx="28" cy="30" r="6" fill="#FAFCFF" opacity=".8"/><circle cx="30" cy="74" r="4.5" fill="#FAFCFF" opacity=".8"/>';
    return art.svg('0 0 100 100',
      '<g class="bf-wing l">' + wing + '</g><g class="bf-wing r"><g transform="translate(100 0) scale(-1 1)">' + wing + '</g></g>' +
      '<rect x="46" y="28" width="8" height="46" rx="4" fill="#1F2A5A"/><path d="M48 28Q42 14 34 12M52 28Q58 14 66 12" stroke="#1F2A5A" stroke-width="3" fill="none" stroke-linecap="round"/>', 'bf-svg');
  }

  var st = null, runner = kit.roundRunner();

  function build(ctx) {
    var stage = ctx.stage;
    stage.classList.add('g-stage', 'mirror-stage');
    for (var i = 0; i < 4; i++) stage.appendChild(h('div', { class: 'mr-deco d' + i, html: butterfly(FABRIC[i], FABRIC[(i + 2) % 6]) }));
    st.board = h('div', { class: 'mr-board' });
    st.tray = h('div', { class: 'g-tray' });
    stage.appendChild(h('div', { class: 'g-main' }, st.board));
    stage.appendChild(st.tray);
  }

  function area(ctx) {
    var vp = UI.vp(), cs = getComputedStyle(ctx.stage);
    var short = vp.H < 500; // جوال أفقي: الألوان إلى الجانب لا في الأسفل
    var Wa = ctx.stage.clientWidth - 70 - (short ? vp.tap + 70 : 0);
    var Ha = ctx.stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - (short ? 0 : vp.tap + 44) - 70;
    return { Wa: Wa, Ha: Ha, tap: vp.tap };
  }

  async function round(ctx, level, demo, alive) {
    var a = area(ctx), R = makeRound(level, a.Wa, a.Ha, a.tap);
    var errors = 0, fails = 0, selected = -1, busy = false, filled = {}, done, finished = new Promise(function (res) { done = res; });
    st.board.innerHTML = ''; st.tray.innerHTML = '';
    var vert = R.axis === 'v';
    // فراشة: جناح مصدر عليه بقع ملوّنة، وجناح مقابل فيه دوائر متقطعة تنتظر التلوين، وبينهما جسم الفراشة
    var body = Math.round(R.size * 0.42), S = R.size + 'px';
    var grid = h('div', { class: 'mr-grid ' + (vert ? 'v' : 'hz') + (R.copy ? ' copy' : ''), style: vert
      ? { gridTemplateColumns: 'repeat(' + R.c + ',' + S + ') ' + body + 'px repeat(' + R.c + ',' + S + ')', gridAutoRows: S }
      : { gridTemplateColumns: 'repeat(' + R.c + ',' + S + ')', gridTemplateRows: 'repeat(' + R.r + ',' + S + ') ' + body + 'px repeat(' + R.r + ',' + S + ')' } });
    var targets = {}; // فهرس الخانة في النصف -> زر الهدف (للخانات الملوّنة في المصدر فقط)
    var totalC = vert ? 2 * R.c : R.c, totalR = vert ? R.r : 2 * R.r;
    function at(el, col, row, cs, rs) { el.style.gridColumn = col + (cs ? ' / span ' + cs : ''); el.style.gridRow = row + (rs ? ' / span ' + rs : ''); return el; }
    // الجناحان (خلف الخانات)، المصدر أوضح لوناً
    if (vert) {
      grid.appendChild(at(h('div', { class: 'mr-wing tgtw' }), 1, 1, R.c, R.r));
      grid.appendChild(at(h('div', { class: 'mr-wing srcw' }), R.c + 2, 1, R.c, R.r));
      grid.appendChild(at(h('div', { class: 'mr-body v' }), R.c + 1, 1, 1, R.r));
    } else {
      grid.appendChild(at(h('div', { class: 'mr-wing srcw' }), 1, 1, R.c, R.r));
      grid.appendChild(at(h('div', { class: 'mr-wing tgtw' }), 1, R.r + 2, R.c, R.r));
      grid.appendChild(at(h('div', { class: 'mr-body hz' }), 1, R.r + 1, R.c, 1));
    }
    for (var y = 0; y < totalR; y++) {
      for (var x = 0; x < totalC; x++) {
        var src, i, j;
        if (vert) { src = x >= R.c; i = src ? x - R.c : (R.copy ? x : R.c - 1 - x); j = y; } // النسخ: المكان نفسه؛ المرآة: معكوس
        else { src = y < R.r; i = x; j = src ? R.r - 1 - y : y - R.r; }
        var k = j * R.c + i, tok = R.cells[k];
        var col = vert ? (x < R.c ? x + 1 : x + 2) : x + 1;
        var row = vert ? y + 1 : (y < R.r ? y + 1 : y + 2);
        var cell;
        if (src) {
          cell = h('div', { class: 'mr-cell src', html: tok >= 0 ? tokenHtml(R.tokens[tok]) : '' });
        } else if (tok >= 0) {
          // دائرة متقطعة تنتظر لونها؛ في المستوى ١ تحمل ظلاً باهتاً من اللون المطلوب
          cell = h('button', { class: 'mr-cell tgt', type: 'button', 'data-k': k });
          if (R.guided) cell.style.setProperty('--ghost', R.tokens[tok].color);
          (function (kk, bb) { UI.bindPress(bb, function () { tapCell(kk); }); })(k, cell);
          targets[k] = cell;
        } else {
          cell = h('div', { class: 'mr-cell none' });
        }
        grid.appendChild(at(cell, col, row));
      }
    }
    st.board.appendChild(grid);
    UI.anim(grid, [{ opacity: 0, transform: 'scale(.85)' }, { opacity: 1, transform: 'none' }], { dur: 480, easing: UI.SPRING, fill: 'backwards' });

    var swatches = R.tokens.map(function (t, ti) {
      var b = h('button', { class: 'g-choice swatch', type: 'button', html: tokenHtml(t) });
      UI.bindPress(b, function () { select(ti); });
      // سحب: إفلات الإصبع فوق خانة يضع اللون فيها
      b.addEventListener('pointerdown', function (e) { st.drag = { ti: ti, x: e.clientX, y: e.clientY }; });
      st.tray.appendChild(b);
      UI.anim(b, [{ opacity: 0, transform: 'translateY(30px)' }, { opacity: 1, transform: 'none' }], { dur: 380, delay: 200 + ti * 90, easing: UI.SPRING, fill: 'backwards' });
      return b;
    });
    st.onUp = function (e) {
      var d = st.drag; st.drag = null;
      if (!d || Math.abs(e.clientX - d.x) + Math.abs(e.clientY - d.y) < 30) return;
      var el = document.elementFromPoint(e.clientX, e.clientY);
      var cell = el && el.closest ? el.closest('.mr-cell.tgt') : null;
      if (cell) { select(d.ti); tapCell(+cell.getAttribute('data-k')); }
    };
    document.addEventListener('pointerup', st.onUp);

    function remaining() { return R.cells.map(function (t, k) { return t >= 0 && !filled[k] ? k : -1; }).filter(function (k) { return k >= 0; }); }
    function clearHints() { Object.keys(targets).forEach(function (k) { targets[k].classList.remove('pulse-hint', 'next'); }); swatches.forEach(function (s) { s.classList.remove('pulse-hint'); }); }
    function guide() { // المستوى ١: تومض الخانة التالية
      if (!R.guided) return;
      var rem = remaining();
      if (rem.length) targets[rem[0]].classList.add('next');
    }
    function select(ti) {
      if (busy || demo) return;
      selected = ti;
      swatches.forEach(function (s, i) { s.classList.toggle('selected', i === ti); });
      if (B.audio) B.audio.play('pick');
    }
    function fill(k) {
      filled[k] = true;
      targets[k].innerHTML = tokenHtml(R.tokens[R.cells[k]]);
      targets[k].classList.add('done');
      clearHints();
      if (B.audio) B.audio.play('place');
      UI.anim(targets[k], [{ transform: 'scale(.5)' }, { transform: 'scale(1.12)' }, { transform: 'scale(1)' }], { dur: 400, easing: UI.SPRING, fill: 'none' });
      fails = 0;
      if (!remaining().length) done(true); else guide();
    }
    async function solveOne() { // اليد تُظهر الحل: اللون ثم الخانة
      busy = true;
      var k = remaining()[0];
      if (k == null) { busy = false; return; }
      var ti = R.cells[k];
      var c1 = kit.center(swatches[ti], ctx.stage), hd = kit.hand(ctx.stage, c1.x, c1.y + c1.h * 0.15);
      await ctx.sleep(600); if (!alive()) return;
      await hd.tap();
      swatches.forEach(function (s, i) { s.classList.toggle('selected', i === ti); });
      selected = ti;
      var c2 = kit.center(targets[k], ctx.stage);
      await hd.moveTo(c2.x, c2.y + c2.h * 0.15); if (!alive()) return;
      await hd.tap();
      hd.remove();
      busy = false;
      fill(k);
    }
    function tapCell(k) {
      if (busy || demo || filled[k]) return;
      if (selected < 0) { swatches.forEach(function (s) { UI.anim(s, [{ transform: 'scale(1)' }, { transform: 'scale(1.15)' }, { transform: 'scale(1)' }], { dur: 400, fill: 'none' }); }); return; }
      if (R.cells[k] === selected) { fill(k); return; }
      errors++; fails++;
      kit.wrong(targets[k]);
      if (fails === 2) { var nk = remaining()[0]; targets[nk].classList.add('pulse-hint'); swatches[R.cells[nk]].classList.add('pulse-hint'); }
      if (fails >= 3) solveOne();
    }
    st.cancel = function () { done(false); };
    st.solve = function () {
      var k = remaining()[0];
      if (k == null || busy) return false;
      swatches[R.cells[k]].click(); targets[k].click();
      return true;
    };

    await ctx.sleep(700);
    if (!alive()) return cleanup();
    guide();
    if (demo) {
      while (remaining().length && alive()) { await solveOne(); if (!alive()) return cleanup(); await ctx.sleep(250); }
    }
    var ok = await finished;
    cleanup();
    if (!alive() || !ok) return;

    // الاحتفال: ينطبق القماش كصفحتي كتاب ثم تنفتح فراشة بجناحين متماثلين وتطير
    await ctx.sleep(350); if (!alive()) return;
    if (B.audio) B.audio.play('whoosh');
    await ctx.anim(grid, [{ transform: 'scale(1,1)' }, { transform: vert ? 'scale(.04,1)' : 'scale(1,.04)' }], { dur: 520, easing: 'cubic-bezier(.6,0,.4,1)' });
    if (!alive()) return;
    var bf = h('div', { class: 'mr-butterfly', html: butterfly(R.tokens[0].color, R.tokens[1].color) });
    st.board.appendChild(bf);
    grid.style.visibility = 'hidden';
    if (B.audio) { B.audio.play('flutter'); B.audio.play('cheer'); }
    var c = kit.center(st.board, ctx.stage);
    UI.burst(ctx.stage, c.x, c.y, { n: 22, spread: 150, dur: 1500 });
    await ctx.anim(bf, [{ transform: 'scale(.1)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { dur: 600, easing: UI.SPRING });
    if (!alive()) return;
    await ctx.sleep(900); if (!alive()) return;
    await ctx.anim(bf, [{ transform: 'translate(0,0) scale(1) rotate(0)', opacity: 1 }, { transform: 'translate(-40px,-30vh) scale(.8) rotate(-14deg)', opacity: 1, offset: 0.6 }, { transform: 'translate(40px,-70vh) scale(.5) rotate(10deg)', opacity: 0 }], { dur: 1500, easing: 'ease-in' });
    if (!alive()) return;
    st.board.innerHTML = ''; st.tray.innerHTML = '';
    return { errors: demo ? 0 : errors };

    function cleanup() { document.removeEventListener('pointerup', st.onUp); st.cancel = null; st.solve = null; }
  }

  B.games.mirror = {
    id: 'mirror',
    mount: function (ctx) { st = { ctx: ctx }; build(ctx); },
    demo: function (ctx) { return runner.run(function (alive) { return round(ctx, 1, true, alive); }); },
    playRound: function (ctx, level) { return runner.run(function (alive) { return round(ctx, level, false, alive); }); },
    cancelRound: function () {
      runner.cancel();
      if (st) { if (st.cancel) st.cancel(); st.board.innerHTML = ''; st.tray.innerHTML = ''; st.ctx.stage.querySelectorAll('.kit-hand').forEach(function (x) { x.remove(); }); }
    },
    outro: function (ctx) { return kit.dusk(ctx); },
    endArt: function () { return kit.endScene('lamb', h('div', { class: 'end-bf', html: butterfly('#F2658E', '#8E5CF0') })); },
    destroy: function () { runner.stop(); if (st && st.onUp) document.removeEventListener('pointerup', st.onUp); st = null; },
    _makeRound: makeRound,
    _solveStep: function () { return !!(st && st.solve && st.solve()); }
  };
})();

</script>
<script>
/* لعبة «صانعة الأنماط» — عالم حفلة وفوانيس.
   سلسلة عناصر متكررة فيها خانة أو خانتان ناقصتان، والاختيار من ٣ في الأسفل.
   المستويات: ١) تناوب عنصرين  ٢) اثنان وواحد  ٣) ثلاثة عناصر  ٤) مركّب (شكل ولون)  ٥) متنامٍ وخانتان. */
(function () {
  'use strict';
  var B = (window.Bustan = window.Bustan || {});
  var UI = B.UI, h = UI.h, art = B.art, kit = B.kit;
  var SHAPES = art.SHAPES, COLORS = art.COLOR_KEYS;

  function same(a, b) { return a.shape === b.shape && a.color === b.color; }
  function distinct(n) { // n رموز مختلفة شكلاً ولوناً
    var sh = kit.shuffle(SHAPES), co = kit.shuffle(COLORS), out = [];
    for (var i = 0; i < n; i++) out.push({ shape: sh[i], color: co[i] });
    return out;
  }

  /* يبني نمطاً: seq العناصر، gaps مواضع الخانات الناقصة، pool عناصر الاختيار */
  /* سهّلناها لابن الرابعة: تناوب بسيط، والخانة الناقصة هي الأخيرة دائماً (ما التالي؟).
     ١) أ ب أ ب أ ؟ بخيارين  ٢) نفسه بثلاثة خيارات  ٣) سلسلة أطول والخانة قبل الأخيرة
     ٤) أ أ ب أ أ ؟ / أ ب ب أ ب ؟  ٥) ثلاثة عناصر أ ب ج أ ب ؟ */
  function makePattern(level) {
    var u = distinct(4), seq = [], i, n, unit, gaps, choices = 3;
    if (level <= 2) { unit = [0, 1]; n = 6; gaps = [5]; choices = level === 1 ? 2 : 3; }
    else if (level === 3) { unit = [0, 1]; n = 8; gaps = [6 + kit.rand(2)]; }
    else if (level === 4) { unit = Math.random() < 0.5 ? [0, 0, 1] : [0, 1, 1]; n = 6; gaps = [5]; }
    else { unit = [0, 1, 2]; n = 6; gaps = [5]; }
    for (i = 0; i < n; i++) seq.push(u[unit[i % unit.length]]);
    var used = unit.filter(function (x, k, a) { return a.indexOf(x) === k; }).map(function (x) { return u[x]; });
    var pool = used.concat(u.filter(function (x) { return used.indexOf(x) < 0; }));
    return { seq: seq, gaps: gaps, pool: pool, choices: choices };
  }
  function optionsFor(pat, gapIdx) {
    var ok = pat.seq[gapIdx], opts = [ok];
    pat.pool.forEach(function (s) { if (opts.length < (pat.choices || 3) && !opts.some(function (o) { return same(o, s); })) opts.push(s); });
    while (opts.length < (pat.choices || 3)) { var s = { shape: kit.pick(SHAPES), color: kit.pick(COLORS) }; if (!opts.some(function (o) { return same(o, s); })) opts.push(s); }
    opts = kit.shuffle(opts);
    return { opts: opts, correct: opts.findIndex(function (o) { return same(o, ok); }) };
  }

  var st = null, runner = kit.roundRunner();

  function build(ctx) {
    var stage = ctx.stage;
    stage.classList.add('g-stage', 'pattern-stage');
    var lights = h('div', { class: 'pt-lights' });
    for (var i = 0; i < 9; i++) lights.appendChild(h('span', { class: 'pt-light', style: { animationDelay: i * 0.3 + 's', background: ['#FFD34E', '#F2658E', '#5CC8FF', '#7AE582', '#B79BFF'][i % 5] } }));
    st.row = h('div', { class: 'pt-row' });
    st.tray = h('div', { class: 'g-tray' });
    st.crowd = h('div', { class: 'pt-crowd' }, ['cat', 'rabbit', 'duck'].map(function (n) { return h('span', { class: 'pt-dancer', html: art.animal(n) }); }));
    stage.appendChild(lights);
    stage.appendChild(h('div', { class: 'g-main' }, st.row));
    stage.appendChild(st.crowd);
    stage.appendChild(st.tray);
  }

  function item(s) { return h('div', { class: 'pt-item' }, h('span', { class: 'pt-cap' }), h('span', { class: 'pt-body', html: s ? art.symbol(s) : '' }), h('span', { class: 'pt-glow' })); }

  async function round(ctx, level, demo, alive, setCur) {
    var pat = makePattern(level), errors = 0;
    st.pat = pat;
    st.row.innerHTML = ''; st.tray.innerHTML = '';
    st.row.classList.toggle('long', pat.seq.length > 6);
    var els = pat.seq.map(function (s, i) {
      var gap = pat.gaps.indexOf(i) >= 0;
      var el = item(gap ? null : s);
      if (gap) el.classList.add('gap');
      st.row.appendChild(el);
      UI.anim(el, [{ opacity: 0, transform: 'translateY(-30px) scale(.7)' }, { opacity: 1, transform: 'none' }], { dur: 450, delay: i * 70, easing: UI.SPRING, fill: 'backwards' });
      return el;
    });
    await ctx.sleep(500 + pat.seq.length * 70);
    if (!alive()) return;
    // «قراءة» النمط: كل عنصر ينبض بدوره من اليمين إلى اليسار، ثم تنبض الخانة الناقصة
    for (var q = 0; q < els.length; q++) {
      UI.anim(els[q], [{ transform: 'scale(1)' }, { transform: 'scale(1.22)' }, { transform: 'scale(1)' }], { dur: 300, fill: 'none' });
      if (B.audio && pat.gaps.indexOf(q) < 0) B.audio.play('pick');
      await ctx.sleep(260);
      if (!alive()) return;
    }

    for (var g = 0; g < pat.gaps.length; g++) {
      var gi = pat.gaps[g], o = optionsFor(pat, gi);
      els[gi].classList.add('current');
      st.tray.innerHTML = '';
      var btns = o.opts.map(function (s, i) {
        var b = h('button', { class: 'g-choice', type: 'button', html: art.symbol(s) });
        st.tray.appendChild(b);
        UI.anim(b, [{ opacity: 0, transform: 'translateY(30px)' }, { opacity: 1, transform: 'none' }], { dur: 380, delay: i * 80, easing: UI.SPRING, fill: 'backwards' });
        return b;
      });
      st.answer = btns[o.correct];
      var ch = kit.choice(ctx, ctx.stage, btns, o.correct, { demo: demo });
      setCur(ch);
      var res = await ch.promise;
      if (!alive() || res.cancelled) return;
      errors += res.errors;
      st.answer = null;
      // العنصر الصحيح يستقر في خانته
      els[gi].classList.remove('gap', 'current');
      els[gi].querySelector('.pt-body').innerHTML = art.symbol(pat.seq[gi]);
      if (B.audio) B.audio.play('place');
      UI.anim(els[gi], [{ transform: 'scale(.4)' }, { transform: 'scale(1.15)' }, { transform: 'scale(1)' }], { dur: 450, easing: UI.SPRING, fill: 'none' });
      await ctx.sleep(450);
      if (!alive()) return;
    }

    // الاحتفال: الفوانيس تُضاء بالتتابع والشخصيات تتمايل
    st.tray.innerHTML = '';
    els.forEach(function (el, i) {
      setTimeout(function () { el.classList.add('lit'); if (B.audio) B.audio.play('lantern', i); }, (i * 130) / UI.ts);
    });
    st.crowd.classList.add('dance');
    var r = st.row.getBoundingClientRect(), sr = ctx.stage.getBoundingClientRect();
    UI.burst(ctx.stage, r.left + r.width / 2 - sr.left, r.top - sr.top, { n: 20, spread: 140, dur: 1400 });
    await ctx.sleep(els.length * 130 + 500);
    if (!alive()) return;
    if (B.audio) B.audio.play('cheer');
    await ctx.sleep(1100);
    if (!alive()) return;
    st.crowd.classList.remove('dance');
    await ctx.anim(st.row, [{ opacity: 1 }, { opacity: 0 }], { dur: 350, fill: 'none' });
    st.row.innerHTML = '';
    return { errors: demo ? 0 : errors };
  }

  B.games.pattern = {
    id: 'pattern',
    mount: function (ctx) { st = { ctx: ctx }; build(ctx); },
    demo: function (ctx) { return runner.run(function (alive, setCur) { return round(ctx, 1, true, alive, setCur); }); },
    playRound: function (ctx, level) { return runner.run(function (alive, setCur) { return round(ctx, level, false, alive, setCur); }); },
    cancelRound: function () { runner.cancel(); if (st) { st.row.innerHTML = ''; st.tray.innerHTML = ''; } },
    outro: function (ctx) { return kit.dusk(ctx); },
    endArt: function () { return kit.endScene('cat'); },
    destroy: function () { runner.stop(); st = null; },
    _makePattern: makePattern,
    _solveStep: function () { if (st && st.answer) { st.answer.click(); return true; } return false; }
  };
})();

<script>
/* لعبة «أول صوت» — الوعي الصوتي. عالم حديقة ومكتبة. تُلعب مع أحد الوالدين.
   يقول الوالد الكلمة بصوته، وتختار الطفل الحرف الذي تبدأ به من ٣ بطاقات.
   مبدآن: لا تُختبر ولا تُصحَّح بأي نطق، والحروف المؤجلة (ث ذ ظ ض ق) في المستوى ٤ فقط.
   المستوى ٥: القافية — ثلاث صور تتشابه كلمتان منها في آخرهما فتختار الزوج. */
(function () {
  'use strict';
  var B = (window.Bustan = window.Bustan || {});
  var UI = B.UI, h = UI.h, art = B.art, kit = B.kit;

  /* بنك الكلمات: [مفتاح الصورة، الكلمة بلا «ال»] — الحرف هو أول الكلمة */
  var WORDS = [
    ['duck', 'بطة'], ['door', 'باب'], ['house', 'بيت'], ['balloon', 'بالون'], ['owl', 'بومة'],
    ['banana', 'موز'], ['triangle', 'مثلث'], ['square', 'مربع'], ['key', 'مفتاح'],
    ['fish', 'سمكة'], ['clock', 'ساعة'], ['car', 'سيارة'],
    ['butterfly', 'فراشة'], ['lantern', 'فانوس'], ['strawberry', 'فراولة'],
    ['lemon', 'ليمون'], ['milk', 'لبن'],
    ['apple', 'تفاحة'], ['crown', 'تاج'],
    ['camel', 'جمل'], ['carrot', 'جزرة'], ['mountain', 'جبل'],
    ['horse', 'حصان'], ['whale', 'حوت'],
    ['tent', 'خيمة'], ['lamb', 'خروف'],
    ['hen', 'دجاجة'], ['bear', 'دب'], ['circle', 'دائرة'],
    ['pomegranate', 'رمان'], ['feather', 'ريشة'],
    ['flower', 'زهرة'], ['button', 'زر'],
    ['sun', 'شمس'], ['tree', 'شجرة'],
    ['rocket', 'صاروخ'], ['box', 'صندوق'],
    ['plane', 'طائرة'], ['windmill', 'طاحونة'],
    ['grapes', 'عنب'], ['eye', 'عين'],
    ['cloud', 'غيمة'], ['branch', 'غصن'],
    ['book', 'كتاب'], ['ball', 'كرة'],
    ['star', 'نجمة'], ['bee', 'نحلة'],
    ['pyramid', 'هرم'], ['crescent', 'هلال'],
    ['rose', 'وردة'], ['leaf', 'ورقة'],
    ['hand', 'يد'], ['pumpkin', 'يقطين'],
    // الحروف المؤجلة (المستوى ٤ فقط)
    ['fox', 'ثعلب'], ['snow', 'ثلج'], ['corn', 'ذرة'], ['envelope', 'ظرف'], ['frog', 'ضفدع'],
    ['moon', 'قمر'], ['cat', 'قطة'], ['heart', 'قلب'], ['train', 'قطار']
  ];
  var L1 = 'بمسفل', DEFERRED = 'ثذظضق';
  var EASY = 'بمسفلتجحخدرزشصطعغكنهوي';
  /* مجموعات متقاربة الشكل (المستوى ٣) */
  var LOOK = ['بتني', 'جحخ', 'رزو', 'سشص', 'عغف'];
  /* مشتتات الحروف المؤجلة: ما يشبهها شكلاً */
  var DEF_NEAR = { 'ث': 'تبن', 'ذ': 'دزر', 'ظ': 'طصع', 'ض': 'صطس', 'ق': 'فكغ' };
  /* أزواج القافية: كلمتان تتشابهان في آخرهما */
  var RHYMES = [['duck', 'cat'], ['door', 'book'], ['tent', 'cloud'], ['ball', 'corn'], ['butterfly', 'feather'], ['plane', 'circle'], ['mountain', 'camel']];

  function wordOf(key) { for (var i = 0; i < WORDS.length; i++) if (WORDS[i][0] === key) return WORDS[i][1]; return ''; }
  function byLetters(set) { return WORDS.filter(function (w) { return set.indexOf(w[1][0]) >= 0; }); }
  function others(pool, not, n) {
    var out = [];
    kit.shuffle(pool.split('')).forEach(function (c) { if (out.length < n && not.indexOf(c) < 0 && out.indexOf(c) < 0) out.push(c); });
    return out;
  }

  /* يبني جولة حرف: الكلمة و٣ حروف */
  function makeLetterRound(level, used) {
    var pool = level === 1 ? byLetters(L1) : level === 4 ? byLetters(DEFERRED) : byLetters(EASY);
    if (level === 3) pool = pool.filter(function (w) { return LOOK.some(function (g) { return g.indexOf(w[1][0]) >= 0; }); });
    var fresh = pool.filter(function (w) { return used.indexOf(w[0]) < 0; });
    var w = kit.pick(fresh.length ? fresh : pool), L = w[1][0], dis;
    if (level === 1) dis = others(L1, L, 2);
    else if (level === 3) { var g = LOOK.filter(function (x) { return x.indexOf(L) >= 0; })[0]; dis = others(g, L, 2); }
    else if (level === 4) dis = others(DEF_NEAR[L], L, 2);
    else dis = others(EASY, L, 2);
    while (dis.length < 2) dis = dis.concat(others(EASY, L + dis.join(''), 2 - dis.length));
    var letters = kit.shuffle([L].concat(dis));
    return { key: w[0], word: w[1], letters: letters, correct: letters.indexOf(L) };
  }
  function makeRhymeRound(used) {
    var fresh = RHYMES.filter(function (p) { return used.indexOf(p[0]) < 0; });
    var pair = kit.pick(fresh.length ? fresh : RHYMES), odd;
    do { odd = kit.pick(WORDS)[0]; } while (RHYMES.some(function (p) { return p.indexOf(odd) >= 0; }) || pair.indexOf(odd) >= 0);
    var keys = kit.shuffle([pair[0], pair[1], odd]);
    return { keys: keys, pair: pair, odd: odd };
  }

  var st = null, runner = kit.roundRunner();

  function build(ctx) {
    var stage = ctx.stage;
    stage.classList.add('g-stage', 'fs-stage');
    stage.appendChild(h('div', { class: 'fs-sun', html: art.sun() }));
    stage.appendChild(h('div', { class: 'fs-grass', html: art.sceneTile('fore', Math.max(600, UI.vp().W), 120) }));
    st.guide = h('div', { class: 'g-guide' });
    stage.appendChild(st.guide);
    st.card = h('div', { class: 'fs-card' });
    st.word = h('div', { class: 'fs-word' });
    st.tray = h('div', { class: 'g-tray' });
    stage.appendChild(h('div', { class: 'g-main' }, st.card, st.word));
    stage.appendChild(st.tray);
  }

  function celebrate(ctx, el) {
    var c = kit.center(el, ctx.stage);
    UI.burst(ctx.stage, c.x, c.y, { n: 18, spread: 130, dur: 1300 });
    if (B.audio) B.audio.play('cheer');
    return UI.anim(el, [{ transform: 'scale(1) rotate(0)' }, { transform: 'scale(1.1) rotate(-4deg)' }, { transform: 'scale(1.1) rotate(4deg)' }, { transform: 'scale(1) rotate(0)' }], { dur: 800, fill: 'none' });
  }

  async function letterRound(ctx, level, demo, alive, setCur) {
    var r = makeLetterRound(level, st.used);
    st.used.push(r.key);
    st.card.innerHTML = ''; st.tray.innerHTML = '';
    st.card.className = 'fs-card';
    var pic = h('div', { class: 'fs-pic', html: B.pics.draw(r.key) });
    st.card.appendChild(pic);
    st.word.textContent = r.word; // بخط صغير رمادي للوالد
    st.guide.textContent = B.S.guides.fsLetter;
    UI.anim(pic, [{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'none' }], { dur: 500, easing: UI.SPRING, fill: 'backwards' });
    if (B.audio) B.audio.play('card');
    await ctx.sleep(700);
    if (!alive()) return;
    var btns = r.letters.map(function (L, i) {
      var b = h('button', { class: 'g-choice letter', type: 'button' }, h('span', { text: L }));
      st.tray.appendChild(b);
      UI.anim(b, [{ opacity: 0, transform: 'translateY(30px)' }, { opacity: 1, transform: 'none' }], { dur: 380, delay: i * 90, easing: UI.SPRING, fill: 'backwards' });
      return b;
    });
    st.answers = [btns[r.correct]];
    var ch = kit.choice(ctx, ctx.stage, btns, r.correct, { demo: demo });
    setCur(ch);
    var res = await ch.promise;
    if (!alive() || res.cancelled) return;
    st.answers = [];
    // الحرف يُختم على البطاقة
    st.card.appendChild(h('div', { class: 'fs-stamp', text: r.letters[r.correct] }));
    UI.anim(st.card.lastChild, [{ transform: 'scale(2.4) rotate(-20deg)', opacity: 0 }, { transform: 'scale(1) rotate(-8deg)', opacity: 1 }], { dur: 420, easing: UI.SPRING });
    await celebrate(ctx, pic);
    await ctx.sleep(600);
    if (!alive()) return;
    return { errors: demo ? 0 : res.errors };
  }

  async function rhymeRound(ctx, alive) {
    var r = makeRhymeRound(st.used), errors = 0, fails = 0;
    st.used.push(r.pair[0]);
    st.card.innerHTML = ''; st.tray.innerHTML = '';
    st.card.className = 'fs-card rhyme';
    st.word.textContent = r.keys.map(wordOf).join(' · ');
    st.guide.textContent = B.S.guides.fsRhyme;
    var sel = [], done = false, resolve, busy = false;
    var p = new Promise(function (res) { resolve = res; });
    var btns = r.keys.map(function (k, i) {
      var b = h('button', { class: 'g-choice pic', type: 'button', html: B.pics.draw(k) });
      st.card.appendChild(b);
      UI.anim(b, [{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'none' }], { dur: 450, delay: i * 110, easing: UI.SPRING, fill: 'backwards' });
      UI.bindPress(b, function () { tapPic(i); });
      return b;
    });
    var okIdx = r.keys.map(function (k, i) { return r.pair.indexOf(k) >= 0 ? i : -1; }).filter(function (i) { return i >= 0; });
    st.answers = okIdx.map(function (i) { return btns[i]; });
    function finish() { done = true; btns.forEach(function (b) { b.classList.remove('pulse-hint'); }); resolve(true); }
    async function tapPic(i) {
      if (done || busy) return;
      var at = sel.indexOf(i);
      if (at >= 0) { sel.splice(at, 1); btns[i].classList.remove('selected'); return; }
      sel.push(i); btns[i].classList.add('selected');
      if (B.audio) B.audio.play('pick');
      if (sel.length < 2) return;
      if (sel.every(function (x) { return okIdx.indexOf(x) >= 0; })) { kit.right(btns[sel[0]]); kit.right(btns[sel[1]]); finish(); return; }
      errors++; fails++; busy = true;
      kit.wrong(btns[sel[0]]); kit.wrong(btns[sel[1]]);
      await ctx.sleep(500);
      sel.forEach(function (x) { btns[x].classList.remove('selected'); }); sel = []; busy = false;
      if (fails === 2) okIdx.forEach(function (x) { btns[x].classList.add('pulse-hint'); });
      if (fails >= 3) { // اليد تُظهر الزوج
        busy = true;
        for (var k = 0; k < 2; k++) {
          var c = kit.center(btns[okIdx[k]], ctx.stage), hd = kit.hand(ctx.stage, c.x, c.y + c.h * 0.2);
          await ctx.sleep(600); await hd.tap(); btns[okIdx[k]].classList.add('selected'); hd.remove();
        }
        kit.right(btns[okIdx[0]]); finish();
      }
    }
    st.cancelRhyme = function () { done = true; resolve(false); };
    var okDone = await p;
    if (!alive() || !okDone) return;
    st.answers = [];
    await celebrate(ctx, st.card);
    await ctx.sleep(600);
    if (!alive()) return;
    return { errors: errors };
  }

  B.games.firstsound = {
    id: 'firstsound',
    mount: function (ctx) { st = { ctx: ctx, used: [], answers: [] }; build(ctx); },
    demo: function (ctx) { return runner.run(function (alive, setCur) { return letterRound(ctx, 1, true, alive, setCur); }); },
    playRound: function (ctx, level) {
      return runner.run(function (alive, setCur) { return level >= 5 ? rhymeRound(ctx, alive) : letterRound(ctx, level, false, alive, setCur); });
    },
    cancelRound: function () { runner.cancel(); if (st) { if (st.cancelRhyme) st.cancelRhyme(); st.card.innerHTML = ''; st.tray.innerHTML = ''; st.word.textContent = ''; } },
    outro: function (ctx) { return kit.dusk(ctx); },
    endArt: function () { return kit.endScene('owl'); },
    destroy: function () { runner.stop(); st = null; },
    WORDS: WORDS,
    _makeLetterRound: makeLetterRound,
    _makeRhymeRound: makeRhymeRound,
    _solveStep: function () {
      if (!st || !st.answers.length) return false;
      var b = st.answers.filter(function (x) { return !x.classList.contains('selected'); })[0];
      if (b) { b.click(); return true; }
      return false;
    }
  };
})();

<script>
/* لعبة «جسر الروابط» — الجملة المركّبة والفصحى. عالم حكايات وجسور. تُلعب مع أحد الوالدين.
   يقرأ الوالد جملة تنتهي برابط (لكن / لأن / لذلك / بينما)، وتختار الطفل من ٣ صور ما يُتمّ المعنى.
   عند اختيار غير مناسب: تُعرض صورتها مع استفهام لطيف، ثم تتلاشى الخيارات ما عدا الصحيحة التي تنبض. */
(function () {
  'use strict';

  var CONNECTORS = ['لكنْ', 'لأنّ', 'لذلك', 'لكنَّ'];

    moon: 'القمر منير', fish: 'السمكة تسبح', star: 'النجمة تلمع', flower: 'الزهرة جميلة', key: 'المفتاح صغير',
    banana: 'الموز أصفر', balloon: 'البالون يطير', clock: 'الساعة تدقّ', tree: 'الشجرة خضراء', crown: 'التاج لامع',
    lemon: 'الليمون أصفر', rocket: 'الصاروخ سريع', grapes: 'العنب لذيذ', house: 'البيت جميل', lantern: 'الفانوس ملوّن',
    feather: 'الريشة خفيفة', box: 'الصندوق مغلق', pumpkin: 'اليقطينة كبيرة', leaf: 'الورقة خضراء', strawberry: 'الفراولة حلوة'

  /* بنك الجمل: [رقم الرابط، الجملة وفيها {c} موضع الرابط، صورة الإتمام، نص الإتمام، مشتت، مشتت، صور المشهد]
     المشهد صورة أو صورتان تُظهران الموقف للطفل (من هو؟ وما حاله؟) فتفهم المطلوب بالنظر.
     ٨ جمل لكل رابط. ترتيب السهولة: «لذلك» (ماذا يحتاج؟) ثم «لأنّ» (ما السبب؟) ثم «لكنْ» (ما المانع؟) ثم «بينما» (المقابلة). */
  var BANK = [
    [2, 'نزل المطر، {c} دخلت القطة إلى…', 'house', 'البيت', 'ball', 'crown', ['cat', 'rain']],
