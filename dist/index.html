:root {
  /* الألوان الستة المسماة */
  --night: #1F2A5A;   /* ليلي */
  --dawn: #CFEBFF;    /* فجر */
  --meadow: #19B394;  /* مرج */
  --rose: #F2658E;    /* ورد */
  --sun: #FFD34E;     /* شمس */
  --cloud: #FAFCFF;   /* غيم */
  /* ظلال مشتقة (الظل دائماً بلون أغمق من العنصر نفسه، لا رمادي) */
  --night-soft: #3A4789;
  --meadow-deep: #0B8269;
  --rose-deep: #C23C69;
  --sun-deep: #E2A21B;
  --violet: #8E5CF0;
  --sky: #8FD3F4;
  --lilac-deep: #9FB3E0;

  --font: 'Tajawal', 'Segoe UI', Tahoma, 'Noto Naskh Arabic', 'Geeza Pro', sans-serif;
  --tap: 72px; /* أصغر مساحة لمس: ٧٢ على الجوال */
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
}
@media (min-width: 700px) and (min-height: 700px) {
  :root { --tap: 96px; } /* ٩٦ على الآيباد */
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: var(--dawn);
  color: var(--night);
  font-family: var(--font);
  font-weight: 700;
  overscroll-behavior: none;
  touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
}

#app { position: fixed; inset: 0; overflow: hidden; }
.screen { position: absolute; inset: 0; overflow: hidden; }

button { font: inherit; color: inherit; border: 0; background: none; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; }
button:focus { outline: none; }
button:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
svg { display: block; }
h1, h2, h3 { margin: 0; }

textarea, input { -webkit-user-select: text; user-select: text; }

/* تنفّس الشخصيات وهي ساكنة */
.breathe { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 3.4s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.03); } }

.scrollable { touch-action: pan-y; }

@media (prefers-reduced-motion: reduce) {
  .breathe, .home-cloud, .home-sun, .bracket::after, .balloon, .home-balloon, .bird, .home-bird, .wing-l, .wing-r, .sails, .end-star, .firefly, .end-moon, .sleepy-z, .end-z { animation: none !important; }
}

</style>
<style>
/* مكوّنات الواجهة المشتركة: الأزرار، المصابيح، الشاشة الرئيسية، ركن الوالدين، الشاشة الختامية */

/* ───────── أزرار الزوايا الثابتة (الرئيسية / إعادة العرض) ───────── */
.hud {
  position: absolute; left: 0; right: 0; top: 0; z-index: 30;
  display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between;
  padding: calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) 0 calc(12px + var(--safe-l));
  pointer-events: none; transition: opacity .6s;
}
.hud > * { pointer-events: auto; }
.hud.is-hidden { opacity: 0; pointer-events: none; }
.hud.is-hidden > * { pointer-events: none; }

.hud-btn {
  width: var(--tap); height: var(--tap); border-radius: 50%;
  display: grid; place-items: center; color: var(--night); flex: none;
  background: radial-gradient(circle at 35% 26%, #fff 0%, #F1F6FF 55%, #D9E5FB 100%);
  box-shadow: 0 6px 0 var(--lilac-deep), 0 12px 18px rgba(31, 42, 90, .2);
  transition: transform .1s, box-shadow .1s;
  position: relative;
}
.hud-btn svg { width: 54%; height: 54%; }
.hud-btn.pressed, .hud-btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--lilac-deep), 0 3px 8px rgba(31, 42, 90, .2); }
.hud-btn:disabled { opacity: .35; pointer-events: none; }
@media (max-width: 560px) { .hud .pause-btn { order: 2; } }
/* الإيقاف المؤقت: يتجمّد المسرح وتظهر طبقة بزر متابعة كبير */
.is-paused .stage, .is-paused .stage * { animation-play-state: paused !important; }
.pause-layer { position: absolute; inset: 0; z-index: 90; display: grid; place-items: center; background: rgba(31, 42, 90, .45); }
.resume-btn { width: calc(var(--tap) * 1.9); height: calc(var(--tap) * 1.9);
  background: radial-gradient(circle at 35% 26%, #FFF4B8 0%, var(--sun) 60%, #F5BC2A 100%); box-shadow: 0 10px 0 var(--sun-deep), 0 20px 30px rgba(0, 0, 0, .3); }
.resume-btn svg { width: 46%; height: 46%; margin-inline-start: 6%; }
.resume-btn.pressed, .resume-btn:active { transform: translateY(8px); box-shadow: 0 2px 0 var(--sun-deep), 0 6px 12px rgba(0, 0, 0, .3); }

/* ───────── مصابيح الجلسة ───────── */
.bulbs {
  --b: min(30px, calc((100vw - 2 * var(--tap) - 48px) / (var(--n, 10) * 1.3)));
  position: relative; flex: 1 1 0; min-width: 0;
  display: flex; justify-content: center; align-items: flex-start; gap: calc(var(--b) * .3);
  padding-top: 6px;
}
.bulbs .wire {
  position: absolute; left: 12%; right: 12%; top: 9px; height: 3px; border-radius: 3px;
  background: var(--night-soft); opacity: .55;
}
.bulb { position: relative; width: var(--b); height: calc(var(--b) * 1.38); transform-origin: 50% 0; }
.bulb svg { width: 100%; height: 100%; overflow: visible; }
.bulb .glass { fill: #B9C6EE; stroke: #8FA0D8; stroke-width: 1; transition: fill .4s; }
.bulb .shine { fill: #fff; opacity: .55; }
.bulb .glow { fill: var(--sun); opacity: 0; transition: opacity .5s; }
.bulb.lit .glass { fill: var(--sun); stroke: var(--sun-deep); }
.bulb.lit .glow { opacity: .55; }
@media (max-width: 560px) {
  /* على الجوال العمودي: المصابيح في صف مستقل تحت الأزرار */
  .bulbs { order: 3; flex-basis: 100%; margin-top: 4px; --b: min(30px, calc((100vw - 40px) / (var(--n, 10) * 1.3))); }
  .bulbs .wire { top: 9px; }
}

/* ───────── ستارة الانتقال والجسيمات ───────── */
.curtain { position: fixed; inset: 0; z-index: 200; overflow: hidden; }
.curtain-disc { position: absolute; border-radius: 50%; will-change: transform; }
.confetti { position: absolute; pointer-events: none; will-change: transform, opacity; z-index: 25; }

/* ───────── الشاشة الختامية الهادئة ───────── */
.end-screen {
  position: absolute; inset: 0; z-index: 40; overflow: hidden;
  background: linear-gradient(180deg, #232C6B 0%, #4A3FA6 58%, #B35FA8 100%);
  display: flex; align-items: center; justify-content: center;
}
.end-art { width: 100%; display: grid; place-items: center; padding-bottom: calc(var(--tap) * 1.6); }
.end-home {
  position: absolute; bottom: calc(26px + var(--safe-b)); left: 0; right: 0; margin: 0 auto;
  width: calc(var(--tap) * 1.3); height: calc(var(--tap) * 1.3);
  background: radial-gradient(circle at 35% 26%, #FFF4B8 0%, var(--sun) 60%, #F5BC2A 100%);
  box-shadow: 0 8px 0 var(--sun-deep), 0 16px 24px rgba(0, 0, 0, .3);
}
.end-home.pressed, .end-home:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--sun-deep), 0 4px 10px rgba(0, 0, 0, .3); }

/* ───────── الشاشة الرئيسية ───────── */
.home { background: linear-gradient(180deg, #8FD3F4 0%, #CFEBFF 50%, #EAF7FF 100%); }
.home-sky { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.home-sun { position: absolute; left: 3%; top: 2%; width: clamp(90px, 16vmin, 150px); animation: sunBreath 7s ease-in-out infinite; }
@keyframes sunBreath { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.home-cloud { position: absolute; left: 0; width: clamp(110px, 20vmin, 190px); animation: drift 70s linear infinite; }

/* ═════════ صيد الحروف: بركة وأسماك ═════════ */

  box-shadow: 0 7px 0 #2468D1, 0 14px 18px rgba(36, 104, 209, .3); font-size: clamp(56px, 12vmin, 100px); font-weight: 800; color: var(--night); line-height: 1; }

@media (orientation: landscape) and (max-height: 600px) {

/* ═════════ الرئيسية: «وحدي» فيها خمس ألعاب ═════════ */
@media (orientation: portrait) {
  /* «وحدي» بعرض كامل في صفين (٣ + ٢)، و«معك» و«إبداع» جنباً إلى جنب تحتها */

/* ═════════ ورشة الأشكال: ابنِ الصورة ═════════ */
.ws-stage { background: linear-gradient(180deg, #FFF3C9 0%, #FFE0EC 100%); padding-top: var(--hud-h); }

  background: radial-gradient(circle at 35% 25%, #fff 0%, #F4F8FF 60%, #E3ECFC 100%); box-shadow: 0 6px 0 #E2A21B, 0 10px 14px rgba(31, 42, 90, .18); transition: transform .1s, opacity .2s; }
.ws-piece-art { display: block; } .ws-piece-art svg { width: 100%; height: 100%; display: block; overflow: visible; }

@media (orientation: landscape) and (max-height: 600px) {

}

/* ═════════ بطاقات الذاكرة ═════════ */
.mm-stage { background: radial-gradient(120% 90% at 50% 0%, #6B5BD6 0%, #3A3F9E 55%, #24296E 100%); --deep: #151A4A; }

.mm-back { background: linear-gradient(145deg, #F2658E, #8E5CF0); box-shadow: 0 6px 0 #151A4A, inset 0 0 0 5px rgba(255, 255, 255, .35); }

/* ═════════ الرئيسية: «وحدي» فيها ست ألعاب (صفّان من ثلاث) ═════════ */

.mr-grid.copy .mr-body.v::before, .mr-grid.copy .mr-body.v::after { content: ''; position: absolute; left: 12%; width: 76%; height: 7px; top: 44%; border: 0; border-radius: 4px; background: #1F2A5A; transform: none; aspect-ratio: auto; }
.mr-grid.copy .mr-body.v::after { top: 56%; }

/* ═════════ شرح وليّ الأمر ═════════ */

.g-guide { position: relative; z-index: 3; flex: none; max-width: 100%; padding: 4px 14px; border-radius: 999px; background: rgba(255, 255, 255, .7); font-size: clamp(14px, 2.8vmin, 18px); font-weight: 700; color: #5A6699; text-align: center; margin-bottom: 4px; }

.mg-stage { --deep: #6B3CC9; }

/* ═════════ الرئيسية: «وحدي» فيها تسع ألعاب ═════════ */

/* ═════════ الرسم الحر ═════════ */
.dr-stage { background: linear-gradient(180deg, #E4F6FF 0%, #FFE9F4 100%); --deep: #6B3CC9; padding-top: var(--hud-h); }
.dr-main { padding: 2px 0; }
.dr-wrap { width: 100%; height: 100%; border-radius: 26px; overflow: hidden; background: #fff; box-shadow: inset 0 0 0 5px #8E5CF0, 0 8px 0 #6B3CC9; }

/* ═════════ بستاني ═════════ */

/* ═════════ ورشة: وضع النموذج ═════════ */
.ws-board.model .ws-ghost { opacity: 0; }
.ws-model { position: absolute; top: 3%; inset-inline-start: 3%; width: 34%; aspect-ratio: 1; padding: 6%; border-radius: 18px; background: rgba(255, 255, 255, .9); box-shadow: 0 4px 0 #E2A21B; z-index: 3; pointer-events: none; }

/* ═════════ ارسم الطريق ═════════ */
.tr-stage { background: linear-gradient(180deg, #FFF3C9 0%, #D9F7D6 100%); --deep: #0B8269; }
.tr-card { flex: none; min-width: clamp(80px, 16vmin, 130px); height: clamp(80px, 16vmin, 130px); border-radius: 26px; background: #FAFCFF; display: grid; place-items: center; padding: 8px 14px; box-shadow: 0 7px 0 #0B8269, 0 14px 18px rgba(11, 130, 105, .25); z-index: 3; }

/* أدوات الرسم: صفّان واضحان بلا تمرير جانبي */

.or-slot { width: calc(var(--sz) * .7); min-height: calc(var(--sz) * .7); height: calc(var(--sz) * .7); }

.or-item.placed { width: 100%; height: 100%; }

.or-slot { width: calc(var(--sz) * .6); min-height: calc(var(--sz) * .6); height: calc(var(--sz) * .6); } .or-podium { gap: 5px; flex-wrap: nowrap; max-width: 100%; }

.ms-fly { position: absolute; z-index: 40; width: 80px; pointer-events: none; transform-origin: 0 0; } .ms-fly svg { width: 100%; height: auto; }

/* ═════════ ساعد الأرنب ═════════ */

.mz-board { position: relative; width: min(92vw, 58vh, 470px); aspect-ratio: 1; display: grid; grid-template-columns: repeat(var(--n), 1fr); direction: ltr; border-radius: 16px; overflow: hidden; background: #BFEAA8; touch-action: none; box-shadow: 0 8px 0 #1C8F5C, 0 18px 24px rgba(28, 143, 92, .25); }

@media (max-height: 500px) { .mz-board { width: min(76vh, 60vw); } }
/* ═════════ إبداعاتي + علامة الحفظ ═════════ */
.saved-mark { position: absolute; z-index: 80; left: 50%; top: 40%; width: 120px; margin: -60px 0 0 -60px; pointer-events: none; } .saved-mark svg { width: 100%; height: auto; filter: drop-shadow(0 8px 10px rgba(0, 0, 0, .25)); }

.surprise-btn { min-width: 120px; } .surprise-btn small { white-space: normal; line-height: 1.15; text-align: center; max-width: 100px; }
/* خلفيات متنوعة */

.od-stage { background: radial-gradient(circle at 20% 20%, #fff 0 2px, transparent 3px) 0 0 / 70px 70px, linear-gradient(180deg, #1D2A6B 0%, #3A5BD9 100%); --deep: #6B3CC9; }

<script>
/* التخزين: localStorage داخل try/catch، مع إصدار للمخطط ودوال ترحيل.
   إن لم يتوفر التخزين يعمل التطبيق من الذاكرة. */
(function () {
  'use strict';
  var B = (window.Bustan = window.Bustan || {});

  var KEY = 'bustan.progress';
  var SCHEMA = 3;
  var GAME_IDS = ['train', 'mirror', 'pattern', 'fruits', 'letters', 'memory', 'shadows', 'more', 'odd', 'tracing', 'feed', 'hide', 'vanish', 'order', 'habitat', 'missing', 'water', 'maze', 'firstsound', 'bridge'];
  var MAX_DAYS = 60;

  var data = null;
  var persistent = false; // هل التخزين الفعلي متاح؟

  function newGame() {
    return { level: 1, smooth: 0, rough: 0, sessions: 0, rounds: 0, last: '' };
  }

  function defaults() {
    var games = {};
    GAME_IDS.forEach(function (id) { games[id] = newGame(); });
    return {
      schemaVersion: SCHEMA,
      created: Date.now(),
      settings: { soundOn: true, soloLimit: 2, soloLimitOn: false, weeklyConnector: 0, night: false },
      games: games,
      days: {},          // 'YYYY-MM-DD' -> { sessions:{id:n}, rounds:{id:n} }
      lock: { soloOpenDate: '' }, // تاريخ اليوم الذي فتح فيه الوالد «وحدي» رغم الحد
      demoSeen: {},      // id -> true
      garden: [],        // أنواع ما زُرع في «بستاني»
      gallery: [],       // صور «إبداعاتي» (روابط data)
      last: '',          // آخر لعبة لُعبت (لبطاقة «أكمل»)
      welcomed: false    // هل عُرضت شاشة الترحيب
    };
  }

  /* جدول الترحيل: المفتاح هو الإصدار القديم، والدالة تُرقّي بمقدار واحد.
     عند رفع SCHEMA أضف دالة هنا ولا تغيّر القديمة. */
  var MIGRATIONS = {
    0: function (d) { d.schemaVersion = 1; return d; },
    // ١ → ٢: كان الصوت مطفأً افتراضياً، وصار مفعّلاً؛ نفعّله لمن حُفظ عنده الافتراضي القديم
    1: function (d) { if (d.settings) d.settings.soundOn = true; d.schemaVersion = 2; return d; },
    // ٢ → ٣: البستان وشاشة الترحيب
    2: function (d) { d.garden = d.garden || []; d.schemaVersion = 3; return d; }
  };

  function isObj(x) { return x && typeof x === 'object' && !Array.isArray(x); }

  // دمج عميق للقيم الناقصة من الافتراضات
  function fill(target, def) {
    Object.keys(def).forEach(function (k) {
      if (isObj(def[k])) {
        if (!isObj(target[k])) target[k] = {};
        fill(target[k], def[k]);
      } else if (target[k] === undefined || typeof target[k] !== typeof def[k]) {
        target[k] = def[k];
      }
    });
    return target;
  }

  function migrate(d) {
    if (!isObj(d)) return defaults();
    var v = typeof d.schemaVersion === 'number' ? d.schemaVersion : 0;
    while (v < SCHEMA) {
      var fn = MIGRATIONS[v];
      if (!fn) break;
      d = fn(d);
      v = d.schemaVersion;
    }
    d.schemaVersion = SCHEMA;
    fill(d, defaults());
    // قيود سلامة
    GAME_IDS.forEach(function (id) {
      var g = d.games[id];
      g.level = Math.max(1, Math.min(5, g.level | 0));
    });
    d.settings.soloLimit = Math.max(1, Math.min(9, d.settings.soloLimit | 0));
    return d;
  }

  function probe() {
    try {
      var k = KEY + '.probe';
      window.localStorage.setItem(k, '1');
      window.localStorage.removeItem(k);
      return true;
    } catch (e) { return false; }
  }

  function load() {
    persistent = probe();
    var raw = null;
    if (persistent) {
      try { raw = window.localStorage.getItem(KEY); } catch (e) { raw = null; }
    }
    if (raw) {
      try { data = migrate(JSON.parse(raw)); } catch (e) { data = defaults(); }
    } else {
      data = defaults();
    }
  }

  function save() {
    if (!persistent) return false;
    try {
      window.localStorage.setItem(KEY, JSON.stringify(data));
      return true;
    } catch (e) {
      persistent = false;
      return false;
    }
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function dateKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayKey() { return dateKey(new Date()); }

  function day(key) {
    key = key || todayKey();
    if (!data.days[key]) data.days[key] = { sessions: {}, rounds: {} };
    return data.days[key];
  }

  function prune() {
    var keys = Object.keys(data.days).sort();
    while (keys.length > MAX_DAYS) delete data.days[keys.shift()];
  }

  function zoneOf(id) {
    var c = B.catalog || [];
    for (var i = 0; i < c.length; i++) if (c[i].id === id) return c[i].zone;
    return 'solo';
  }

  var S = {
    SCHEMA: SCHEMA,
    GAME_IDS: GAME_IDS,
    init: function () { load(); },
    data: function () { return data; },
    save: save,
    isPersistent: function () { return persistent; },
    todayKey: todayKey,
    dateKey: dateKey,
    migrate: migrate,
    defaults: defaults,

    game: function (id) { return data.games[id]; },

    recordRound: function (id) {
      var g = data.games[id];
      data.last = id;
      g.rounds++;
      g.last = todayKey();
      var d = day();
      d.rounds[id] = (d.rounds[id] || 0) + 1;
      prune();
      save();
    },

    recordSession: function (id) {
      data.games[id].sessions++;
      var d = day();
      d.sessions[id] = (d.sessions[id] || 0) + 1;
      save();
    },

    /* عدد جلسات منطقة «وحدي» المكتملة اليوم */
    soloSessionsToday: function () {
      var d = data.days[todayKey()];
      if (!d) return 0;
      var n = 0;
      Object.keys(d.sessions).forEach(function (id) {
        if (zoneOf(id) === 'solo') n += d.sessions[id];
      });
      return n;
    },

    /* هل قسم «وحدي» مقفل اليوم؟ */
    soloLocked: function () {
      if (!data.settings.soloLimitOn) return false;   // الحد اليومي اختياري يفعّله الوالد
      if (data.lock.soloOpenDate === todayKey()) return false;
      return S.soloSessionsToday() >= data.settings.soloLimit;
    },

    openSoloToday: function () { data.lock.soloOpenDate = todayKey(); save(); },

    markDemoSeen: function (id) { data.demoSeen[id] = true; save(); },
    demoSeen: function (id) { return !!data.demoSeen[id]; },

    /* آخر ٧ أيام (الأقدم أولاً): [{key, date, sessions, rounds}] */
    lastDays: function (n) {
      n = n || 7;
      var out = [];
      var now = new Date();
      for (var i = n - 1; i >= 0; i--) {
        var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
        var k = dateKey(d);
        var rec = data.days[k];
        var s = 0, r = 0;
        if (rec) {
          Object.keys(rec.sessions).forEach(function (x) { s += rec.sessions[x]; });
          Object.keys(rec.rounds).forEach(function (x) { r += rec.rounds[x]; });
        }
        out.push({ key: k, date: d, sessions: s, rounds: r });
      }
      return out;
    },

    resetGame: function (id) {
      data.games[id] = newGame();
      delete data.demoSeen[id];
      save();
    },

    exportJSON: function () { return JSON.stringify(data); },

    /* استعادة: تُرجع true عند النجاح. لا تمسّ البيانات الحالية إن فشلت. */
    importJSON: function (text) {
      try {
        var parsed = JSON.parse(text);
        if (!isObj(parsed) || !isObj(parsed.games)) return false;
        if (typeof parsed.schemaVersion === 'number' && parsed.schemaVersion > SCHEMA) return false;
        data = migrate(parsed);
        save();
        return true;
      } catch (e) { return false; }
    }
  };

  B.storage = S;
})();

</script>
<script>
/* محرك التكيّف الصامت: ٥ مستويات لكل لعبة.
   يصعد بعد ٣ جولات سلسة متتالية (≤ خطأ واحد)،
   ويهبط بعد جولتين متتاليتين فيهما ٣ أخطاء فأكثر.
   جولة فيها خطآن لا تُعدّ سلسة ولا صعبة، فتقطع السلسلتين.
   لا يظهر للطفل أي أثر لهذا. */
(function () {
  'use strict';
  var B = (window.Bustan = window.Bustan || {});

  var MAX = 5, UP_AFTER = 3, DOWN_AFTER = 2;

  /* دالة نقية: تأخذ الحالة {level, smooth, rough} وعدد أخطاء الجولة،
     وتُرجع حالة جديدة مع حقل change: 'up' | 'down' | null */
  function step(state, errors) {
    var level = state.level, smooth = state.smooth, rough = state.rough, change = null;
    if (errors <= 1) { smooth++; rough = 0; }
    else if (errors >= 3) { rough++; smooth = 0; }
    else { smooth = 0; rough = 0; }

    if (smooth >= UP_AFTER) {
      if (level < MAX) { level++; change = 'up'; }
      smooth = 0; rough = 0;
    } else if (rough >= DOWN_AFTER) {
      if (level > 1) { level--; change = 'down'; }
      smooth = 0; rough = 0;
    }
    return { level: level, smooth: smooth, rough: rough, change: change };
  }

  B.adaptive = {
    MAX: MAX,
    step: step,
    level: function (gameId) { return B.storage.game(gameId).level; },
    report: function (gameId, errors) {
      var g = B.storage.game(gameId);
      var r = step(g, errors);
      g.level = r.level; g.smooth = r.smooth; g.rough = r.rough;
      B.storage.save();
      return r;
    }
  };
})();

<script>
/* الصوت: مؤثرات ناعمة مولَّدة بـ WebAudio (لا ملفات صوت)، بلا موسيقى خلفية ولا نطق آلي.
   كل الأصوات قصيرة وهادئة، تمرّ عبر ضاغط يمنع أي ذروة عالية (الطفل حساسة للأصوات العالية).
   لا يوجد أي صوت «خطأ» أو «خسارة». مفتاح عام في ركن الوالدين.
   يُفعَّل السياق بعد أول لمسة (قيد iOS). */
(function () {
  'use strict';
  var B = (window.Bustan = window.Bustan || {});

  }

      master.gain.value = 4.2; // شدة واضحة مسموعة، والضاغط يمنع الذروات
      var comp = ctx.createDynamicsCompressor(); // يحدّ الذروات

  // نغمة: تردد، بداية، مدة، شدة، نوع الموجة، تردد نهائي اختياري (انزلاق)

    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);

    o.start(at); o.stop(at + dur + 0.03);

    g.gain.exponentialRampToValueAtTime(vol, at + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);

     (بطلب صاحب المشروع: الابتعاد عن أي شبه بالموسيقى). */
  function rnd(a, b) { return a + Math.random() * (b - a); }

  var SOUNDS = {

<script>
/* إحصاءات مجهولة لصاحب المشروع: عدّادات في قاعدة Firebase Realtime Database مجانية (رابطها في B.S.statsDb).
   لا يُرسل أي اسم أو بيانات شخصية: فقط زيادة عدّاد. يبقى معطّلاً إن كان statsDb فارغاً.
   العدّادات تحت stats/:  open (فتحات) · devices/new (أجهزة زارت) · devices/player (أجهزة لعبت)
                           play/<لعبة> (مرات البدء) · done/<لعبة> (جلسات مكتملة)
   كل جهاز يُعدّ مرة واحدة في new وفي player (عبر علامة في localStorage). */
(function () {
  'use strict';
  var B = (window.Bustan = window.Bustan || {});

  function base() {
    var u = B.S && B.S.statsDb;
    var local = /localhost|127\.0\.0\.1/;
    // لا نحسب فتح الملف محلياً ولا التجارب على جهازك (إلا إن كانت القاعدة نفسها محلية للاختبار)
    if (!u || window.location.protocol === 'file:' || (local.test(window.location.hostname) && !local.test(u))) return '';
    return u.replace(/\/+$/, '');
  }
  function once(flag) {
    try {
      if (window.localStorage.getItem(flag)) return false;
      window.localStorage.setItem(flag, '1');
      return true;
    } catch (e) { return false; }
  }
  /* زيادة عدّاد: PATCH بقيمة الخادم increment (ذرّية، لا تضيع الأرقام مع التزامن) */
  function bump(group, key) {
    var b = base();
    if (!b || !window.fetch) return;
    var body = {}; body[key] = { '.sv': { increment: 1 } };
    try { window.fetch(b + '/stats/' + group + '.json', { method: 'PATCH', body: JSON.stringify(body), keepalive: true }).catch(function () {}); } catch (e) {}
  }

  B.stats = {
    enabled: function () { return !!(B.S && B.S.statsDb); },
    open: function () { bump('events', 'open'); if (once('bustan.dev.new')) bump('devices', 'new'); },
    play: function (id) { bump('play', id); if (once('bustan.dev.player')) bump('devices', 'player'); },
    done: function (id) { bump('done', id); },
    /* قراءة كل العدّادات (للوحة الإدارة) */
    read: function () {
      var u = B.S.statsDb;
      if (!u) return Promise.reject(new Error('no db'));
      return window.fetch(u.replace(/\/+$/, '') + '/stats.json').then(function (r) { return r.json(); });
    }
  };
})();

/* «بستاني»: بستان دائم يكبر مع كل جلسة تكتمل (شجرة، زهرة، حيوان…).
   لا نقاط ولا نجوم ولا سلاسل أيام: المكافأة أن يحيا ما أنجزه. يُحفظ في التخزين (garden). */
(function () {
  'use strict';
  var B = (window.Bustan = window.Bustan || {});
  var KINDS = ['tree', 'flower', 'rabbit', 'rose', 'duck', 'balloon', 'bear', 'windmill', 'butterfly', 'lamb', 'bee', 'cat',
    'pumpkin', 'frog', 'bird', 'turtle', 'house', 'strawberry', 'owl', 'grapes'];
  /* معرض «إبداعاتي»: صور صغيرة محفوظة على الجهاز (آخر ٢٤) */
  B.gallery = {
    MAX: 24,
    list: function () { return B.storage.data().gallery; },
    add: function (src) {
      var g = B.storage.data().gallery;
      g.push(src);
      while (g.length > B.gallery.MAX) g.shift();
      try { B.storage.save(); } catch (e) {}
      if (!B.storage.isPersistent() && g.length > 6) g.shift();
      return g.length;
    },
    remove: function (i) { var g = B.storage.data().gallery; if (i >= 0 && i < g.length) { g.splice(i, 1); B.storage.save(); } },
    clear: function () { B.storage.data().gallery = []; B.storage.save(); }
  };

  B.garden = {
    KINDS: KINDS,
    items: function () { return B.storage.data().garden; },
    /* يضيف عنصراً محدداً (مثلاً زهرة نمت في لعبة «اسقِ الزهرة») */
    add: function (k) { var g = B.storage.data().garden; g.push(k); if (g.length > 120) g.shift(); B.storage.save(); },
    /* يزرع عنصراً جديداً بالتتابع ويُرجع نوعه */
    plant: function () {
      var g = B.storage.data().garden, k = KINDS[g.length % KINDS.length];
      g.push(k);
      if (g.length > 120) g.shift();
      B.storage.save();
      return k;
    }
  };
})();

    snow: function () { var s = ''; for (var i = 0; i < 3; i++) s += '<g transform="rotate(' + i * 60 + ' 50 50)">' + p('M50 8V92M50 22l-10-9M50 22l10-9M50 78l-10 9M50 78l10 9', '', st('#5CC8FF', 5)) + '</g>'; return s + c(50, 50, 6, '#FAFCFF', st('#5CC8FF', 3)); },

    /* صور خاصة بجمل «جسر الروابط» */
    brokenbridge: function () { return p('M0 78Q50 66 100 78V100H0Z', '#6FD1F4') + p('M4 62Q22 38 40 34', '', st('#8E5CF0', 11)) + p('M60 34Q78 38 96 62', '', st('#8E5CF0', 11)) + r(6, 58, 9, 28, 4, '#3A4789') + r(85, 58, 9, 28, 4, '#3A4789') + p('M42 30l5 8l-6 6l6 8M58 30l-5 8l6 6l-6 8', '', st(K, 3)) + p('M46 70l-4 10M54 68l4 12', '', st('#8E5CF0', 5)); },
    rain: function () { return '<g transform="translate(4 4) scale(.58)">' + inner(art.cloud()).replace(/#FFFFFF/g, '#B9C6EE') + '</g>' + p('M28 56l-6 14M44 56l-6 14M60 56l-6 14M76 56l-6 14M36 76l-6 14M52 76l-6 14M68 76l-6 14', '', st('#3D8BFD', 5)); },

    bird: function () { return e(48, 56, 28, 24, '#3D8BFD') + c(72, 40, 15, '#3D8BFD') + p('M86 40l10 3l-10 4Z', '#FFA63D') + eye(76, 37, 2.8) + p('M40 52Q22 30 10 40Q24 46 34 62Z', '#2468D1') + p('M22 62L6 72L22 72Z', '#2468D1') + p('M44 80v10M56 80v10', '', st('#FFA63D', 4)); },
    turtle: function () { return e(70, 76, 9, 7, '#7AC98B') + e(34, 76, 9, 7, '#7AC98B') + p('M14 66A36 30 0 0 1 86 66Z', '#2DBE7E', st('#1C8F5C', 3)) + p('M32 46l10 18M50 38v26M68 46l-10 18M22 60h56', '', st('#1C8F5C', 2.5)) + e(90, 60, 10, 8, '#7AC98B') + eye(93, 57, 2.2) + p('M14 66l-8 4', '', st('#7AC98B', 5)); }
