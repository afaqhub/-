    [2, 'أشرقت الشمس، {c} تفتّحت…', 'flower', 'الزهرة', 'box', 'rocket', ['sun']],
    [2, 'أرادت النحلة الرحيق، {c} طارت إلى…', 'flower', 'الزهرة', 'box', 'rocket', ['bee']],
    [2, 'عطش الجمل، {c} شرب…', 'rain', 'الماء', 'book', 'crown', ['camel']],
    [2, 'جاع الدب، {c} أكل…', 'apple', 'التفاحة', 'key', 'clock', ['bear']],

    [1, 'هرب العصفور {c}…', 'cat', 'القطة اقتربت', 'lemon', 'house', ['bird']],
    [1, 'فرحت النحلة {c}…', 'flower', 'الزهرة تفتّحت', 'rocket', 'box', ['bee']],
    [1, 'شرب الجمل ماءً كثيراً {c}…', 'sun', 'الشمس حارّة', 'book', 'crown', ['camel']],
    [1, 'بقيت القطة خارج البيت {c}…', 'door', 'الباب مغلق', 'grapes', 'feather', ['cat', 'house']],
    [1, 'ذاب الثلج {c}…', 'sun', 'الشمس أشرقت', 'key', 'balloon', ['snow']],
    [1, 'ارتجف الخروف {c}…', 'snow', 'الثلج يتساقط', 'flower', 'key', ['lamb']],
    [1, 'نام الدب {c}…', 'moon', 'الليل حلّ', 'apple', 'ball', ['sleepbear']],
    [1, 'ابتلّت البطة {c}…', 'rain', 'المطر ينزل', 'star', 'banana', ['duck']],

    [0, 'أراد الأرنب أن يعبر النهر، {c}…', 'brokenbridge', 'الجسر مكسور', 'sun', 'carrot', ['rabbit']],
    [0, 'أرادت البطة أن تسبح في البركة، {c}…', 'snow', 'الماء تجمّد', 'book', 'apple', ['duck']],
    [0, 'أراد الدب أن يأكل العسل، {c}…', 'bee', 'النحلة تحرسه', 'ball', 'moon', ['bear']],
    [0, 'أرادت القطة أن تدخل البيت، {c}…', 'door', 'الباب مغلق', 'fish', 'star', ['cat', 'house']],
    [0, 'أراد الخروف أن يقطف التفاحة، {c}…', 'tree', 'الشجرة عالية', 'key', 'balloon', ['lamb', 'apple']],
    [0, 'أرادت البطة أن تلعب في الحديقة، {c}…', 'rain', 'المطر ينزل', 'crown', 'banana', ['duck']],
    [0, 'أراد الأرنب أن يلعب خارجاً، {c}…', 'moon', 'الظلام حلّ', 'carrot', 'ball', ['rabbit']],
    [0, 'أرادت البومة أن تنام، {c}…', 'sun', 'الشمس أشرقت', 'lemon', 'box', ['owl']],

    [3, 'الأرنب سريع، {c}…', 'turtle', 'السلحفاة بطيئة', 'apple', 'star', ['rabbit']],
    [3, 'الشمس تظهر في النهار، {c}…', 'moon', 'القمر يظهر في الليل', 'carrot', 'ball', ['sun']],
    [3, 'السمكة تسبح في الماء، {c}…', 'bird', 'العصفور يطير في السماء', 'key', 'crown', ['fish']],
    [3, 'الدب كبير، {c}…', 'bee', 'النحلة صغيرة', 'house', 'tree', ['bear']],
    [3, 'الثلج بارد، {c}…', 'sun', 'الشمس حارّة', 'book', 'balloon', ['snow']],
    [3, 'الليمون حامض، {c}…', 'banana', 'الموز حلو', 'clock', 'feather', ['lemon']],
    [3, 'الطائرة تطير في السماء، {c}…', 'train', 'القطار يسير على الأرض', 'flower', 'lantern', ['plane']],
    [3, 'الجمل يعيش في الصحراء، {c}…', 'fish', 'السمكة تعيش في البحر', 'rocket', 'strawberry', ['camel']]
  ];
  /* ترتيب الروابط حسب المستوى: من الأسهل إلى الأصعب */
  var LEVEL_CONN = [2, 1, 0, 3];

  var st = null, runner = kit.roundRunner();

  function connectorFor(level) {
    var wk = B.storage.data().settings.weeklyConnector | 0; // رابط الأسبوع من ركن الوالدين
    if (wk >= 1 && wk <= 4) return wk - 1;
    return level >= 5 ? kit.rand(4) : LEVEL_CONN[level - 1];
  }
  function nextSentence(ci) {
    if (!st.queues[ci] || !st.queues[ci].length) st.queues[ci] = kit.shuffle(BANK.filter(function (s) { return s[0] === ci; }));
    return st.queues[ci].pop();
  }

  function build(ctx) {
    var stage = ctx.stage;
    stage.classList.add('g-stage', 'br-stage');
    st.strip = h('div', { class: 'br-strip' });
    st.sceneArt = h('div', { class: 'br-situ' });
    stage.appendChild(h('div', { class: 'g-guide', text: B.S.guides.brRead }));
    st.tray = h('div', { class: 'br-options' });
    // مشهد الأسفل: نهر وجسر تُضاف إليه لوحة في كل جولة ويتقدم الأرنب
    st.planks = h('div', { class: 'br-planks' });
    for (var i = 0; i < ctx.total; i++) st.planks.appendChild(h('span', { class: 'br-plank' }));
    st.rabbit = h('div', { class: 'br-rabbit', html: art.animal('rabbit') });
    st.scene = h('div', { class: 'br-scene' }, h('div', { class: 'br-bank l' }), h('div', { class: 'br-bank r' }), st.planks, st.rabbit);
    stage.appendChild(st.strip);
    stage.appendChild(h('div', { class: 'g-main' }, st.sceneArt, st.tray));
    stage.appendChild(st.scene);
    placeRabbit(false);
  }
  function placeRabbit(animate) {
    // الأرنب يسير من اليمين إلى اليسار فوق اللوحات المنجزة
    var pct = 88 - (st.built / st.ctx.total) * 76;
    if (animate) {
      UI.anim(st.rabbit, [{ transform: 'translateY(0)' }, { transform: 'translateY(-26px)' }, { transform: 'translateY(0)' }], { dur: 520, fill: 'none' });
    }
    st.rabbit.style.left = pct + '%';
  }

  async function round(ctx, level, demo, alive, setCur) {
    var ci = demo ? 2 : connectorFor(level), s = nextSentence(ci);
    st.strip.innerHTML = ''; st.tray.innerHTML = '';
    // الجملة: الرابط ملوّن ومكبّر في موضعه
    var parts = s[1].split('{c}');
    st.strip.appendChild(h('span', { class: 'br-text', text: parts[0] }));
    st.strip.appendChild(h('span', { class: 'br-conn c' + ci, text: CONNECTORS[ci] }));
    st.strip.appendChild(h('span', { class: 'br-text br-tail', text: parts[1] }));
    // المشهد: من هو؟ وما حاله؟
    st.sceneArt.innerHTML = '';
    (s[6] || []).forEach(function (k, i) {
      var pc = h('span', { class: 'br-situ-pic', html: B.pics.draw(k) });
      st.sceneArt.appendChild(pc);
      UI.anim(pc, [{ opacity: 0, transform: 'scale(.5)' }, { opacity: 1, transform: 'none' }], { dur: 450, delay: i * 150, easing: UI.SPRING, fill: 'backwards' });
    });
    UI.anim(st.strip, [{ opacity: 0, transform: 'translateY(-16px)' }, { opacity: 1, transform: 'none' }], { dur: 450, fill: 'backwards' });
    if (B.audio) B.audio.play('card');
    await ctx.sleep(600);
    if (!alive()) return;
    var opts = kit.shuffle([{ k: s[2], t: s[3], ok: true }, { k: s[4], t: PHRASE[s[4]] || '' }, { k: s[5], t: PHRASE[s[5]] || '' }]);
    var correct = opts.findIndex(function (o) { return o.ok; });
    var btns = opts.map(function (o, i) {
      var b = h('button', { class: 'g-choice pic br-opt', type: 'button' }, h('span', { class: 'br-pic', html: B.pics.draw(o.k) }), h('span', { class: 'br-cap', text: o.t }));
      st.tray.appendChild(b);
      UI.anim(b, [{ opacity: 0, transform: 'translateY(30px) scale(.8)' }, { opacity: 1, transform: 'none' }], { dur: 420, delay: i * 110, easing: UI.SPRING, fill: 'backwards' });
      return b;
    });
    st.answer = btns[correct];
    var ch = kit.choice(ctx, ctx.stage, btns, correct, {
      demo: demo,
      onWrong: function (b) {
        // استفهام لطيف فوق اختيارها، ثم تتلاشى غير الصحيحة وتنبض الصحيحة
        var q = h('span', { class: 'br-q', html: art.bubbleQ() });
        b.appendChild(q);
        UI.anim(q, [{ transform: 'scale(.2)', opacity: 0 }, { transform: 'scale(1)', opacity: 1, offset: 0.3 }, { transform: 'scale(1)', opacity: 1, offset: 0.8 }, { transform: 'scale(.8)', opacity: 0 }], { dur: 1300 }).then(function () { q.remove(); });
        setTimeout(function () {
          btns.forEach(function (x, i) { if (i !== correct) x.classList.add('faded'); });
          btns[correct].classList.add('pulse-hint');
        }, 900 / UI.ts);
      }
    });
    setCur(ch);
    var res = await ch.promise;
    if (!alive() || res.cancelled) return;
    st.answer = null;
    btns.forEach(function (x, i) { if (i !== correct) x.classList.add('faded'); });
    // الجملة تكتمل أمام الوالد
    st.strip.lastChild.textContent = parts[1].replace('…', '') + ' ' + s[3] + '.';
    await ctx.sleep(500);
    if (!alive()) return;
    if (!demo) {
      // لوحة جديدة في الجسر، والأرنب يقفز إليها
      var pl = st.planks.children[st.built];
      if (pl) { pl.classList.add('on'); UI.anim(pl, [{ transform: 'translateY(-40px) scale(.5)', opacity: 0 }, { transform: 'none', opacity: 1 }], { dur: 450, easing: UI.SPRING, fill: 'none' }); }
      st.built++;
      if (B.audio) B.audio.play('place');
      placeRabbit(true);
    }
    var c = kit.center(btns[correct], ctx.stage);
    UI.burst(ctx.stage, c.x, c.y, { n: 18, spread: 130, dur: 1300 });
    if (B.audio) B.audio.play('cheer');
    await ctx.sleep(1500);
    if (!alive()) return;
    return { errors: demo ? 0 : res.errors };
  }

  B.games.bridge = {
    id: 'bridge',
    mount: function (ctx) { st = { ctx: ctx, queues: {}, built: 0 }; build(ctx); },
    demo: function (ctx) { return runner.run(function (alive, setCur) { return round(ctx, 1, true, alive, setCur); }); },
    playRound: function (ctx, level) { return runner.run(function (alive, setCur) { return round(ctx, level, false, alive, setCur); }); },
    cancelRound: function () { runner.cancel(); if (st) { st.strip.innerHTML = ''; st.tray.innerHTML = ''; st.sceneArt.innerHTML = ''; } },
    outro: function (ctx) { return kit.dusk(ctx); },
    endArt: function () { return kit.endScene('rabbit'); },
    destroy: function () { runner.stop(); st = null; },
    BANK: BANK, CONNECTORS: CONNECTORS, PHRASE: PHRASE,
    _solveStep: function () { if (st && st.answer) { st.answer.click(); return true; } return false; }
  };
})();

</script>
<script>
/* لعبة «سلة الفواكه» — العدّ لغرض وقراءة الأرقام. عالم بستان وشجرة.
   نمطان:
   • «أعطِني»: الدب يحمل بطاقة رقم، فتقطف الطفل من الشجرة فاكهة فاكهة وتسقط في السلة،
     ويظهر فوق السلة العدد الجاري (١، ٢، ٣…) حتى تبلغ الرقم المطلوب.
   • «كم؟»: في السلة فواكه مرتبة صفوفاً من خمس، فتختار رقمها من ثلاث بطاقات،
     ثم تُعدّ الفواكه أمامها واحدة واحدة.
   المستويات: ١) أعطني ١–٥  ٢) حتى ١٠ ويدخل «كم؟» حتى ٥  ٣) «كم؟» حتى ١٠
              ٤) أعطني حتى ١٥  ٥) حتى ٢٠ في النمطين. */
(function () {
  'use strict';
  var B = (window.Bustan = window.Bustan || {});
  var UI = B.UI, h = UI.h, art = B.art, kit = B.kit;

  var FRUITS = ['apple', 'strawberry', 'lemon', 'pomegranate', 'grapes', 'banana'];

  function between(a, b) { return a + kit.rand(b - a + 1); }
  function config(level, i) {
    var odd = i % 2 === 1;
    if (level === 1) return { mode: 'give', n: between(1, 5) };
    if (level === 2) return odd ? { mode: 'count', n: between(1, 5) } : { mode: 'give', n: between(3, 10) };
    if (level === 3) return odd ? { mode: 'count', n: between(3, 10) } : { mode: 'give', n: between(4, 10) };
    if (level === 4) return odd ? { mode: 'count', n: between(5, 12) } : { mode: 'give', n: between(8, 15) };
    return odd ? { mode: 'count', n: between(8, 20) } : { mode: 'give', n: between(10, 20) };
  }

  /* أبعاد شبكة الشجرة: أكبر حجم يتسع لـ total ثمرة، دون النزول عن حدّ اللمس */
  function fitGrid(total, W, H, min) {
    var best = null;
    for (var c = 1; c <= total; c++) {
      var r = Math.ceil(total / c), s = Math.min(W / c, H / r);
      if (!best || s > best.s) best = { c: c, r: r, s: s };
    }
    if (best.s < min) { // نقلّل الثمار الزائدة ونحافظ على حجم اللمس
      var c2 = Math.max(1, Math.floor(W / min)), r2 = Math.max(1, Math.floor(H / min));
      best = { c: c2, r: r2, s: min, cap: c2 * r2 };
    }
    best.s = Math.min(best.s, UI.vp().tablet ? 130 : 104);
    return best;
  }

  function basketSvg() {
    return art.svg('0 0 120 80',
      '<path d="M10 30H110L98 74Q96 78 90 78H30Q24 78 22 74Z" fill="#DDA86C" stroke="#8A5A33" stroke-width="4" stroke-linejoin="round"/>' +
      '<path d="M16 44H104M20 58H100M40 30L44 78M60 30V78M80 30L76 78" stroke="#B67B4D" stroke-width="3"/>' +
      '<rect x="4" y="22" width="112" height="12" rx="6" fill="#C9925A" stroke="#8A5A33" stroke-width="4"/>', 'basket-svg');
  }

  var st = null, runner = kit.roundRunner();

  function build(ctx) {
    var stage = ctx.stage;
    stage.classList.add('g-stage', 'fr-stage');
    st.card = h('div', { class: 'fr-card' });
    st.ask = h('div', { class: 'fr-ask' }, h('div', { class: 'fr-bear', html: art.animal('bear') }), st.card);
    st.tree = h('div', { class: 'fr-tree' }, h('div', { class: 'fr-canopy' }), h('div', { class: 'fr-trunk' }));
    st.grid = h('div', { class: 'fr-grid' });
    st.tree.appendChild(st.grid);
    st.count = h('div', { class: 'fr-count' });
    st.basket = h('div', { class: 'fr-basket' }, st.count, h('div', { class: 'fr-basket-art', html: basketSvg() }));
    st.tray = h('div', { class: 'g-tray fr-tray' });
    stage.appendChild(st.ask);
    stage.appendChild(h('div', { class: 'g-main fr-main' }, st.tree));
    stage.appendChild(st.basket);
    stage.appendChild(st.tray);
  }

  function showCard(text, isQ) {
    st.card.innerHTML = '';
    st.card.classList.toggle('q', !!isQ);
    if (isQ) st.card.innerHTML = art.bubbleQ();
    else st.card.appendChild(h('span', { text: text }));
    UI.anim(st.card, [{ transform: 'scale(.3) rotate(-10deg)', opacity: 0 }, { transform: 'none', opacity: 1 }], { dur: 480, easing: UI.SPRING, fill: 'backwards' });
    if (B.audio) B.audio.play('card');
  }

  function bumpCount(n) {
    st.count.textContent = UI.num(n);
    st.count.classList.add('on');
    UI.anim(st.count, [{ transform: 'scale(.5)' }, { transform: 'scale(1.25)' }, { transform: 'scale(1)' }], { dur: 340, easing: UI.SPRING, fill: 'none' });
    if (B.audio) B.audio.play('lantern', n - 1);
  }

  async function celebrate(ctx) {
    if (B.audio) B.audio.play('cheer');
    var c = kit.center(st.basket, ctx.stage);
    UI.burst(ctx.stage, c.x, c.y - 20, { n: 22, spread: 150, dur: 1400 });
    UI.anim(st.ask.firstChild, [{ transform: 'translateY(0)' }, { transform: 'translateY(-22px) rotate(-6deg)' }, { transform: 'translateY(0)' }, { transform: 'translateY(-12px) rotate(6deg)' }, { transform: 'translateY(0)' }], { dur: 900, fill: 'none' });
    await ctx.sleep(1400);
  }

  /* نمط «أعطِني» */
  async function giveRound(ctx, n, demo, alive) {
    var fruit = kit.pick(FRUITS), count = 0, done, finished = new Promise(function (r) { done = r; });
    st.tree.style.display = ''; st.basket.style.display = ''; st.tray.innerHTML = ''; st.tray.style.display = 'none';
    st.count.textContent = ''; st.count.classList.remove('on');
    st.basket.querySelectorAll('.fr-in').forEach(function (x) { x.remove(); });
    showCard(UI.num(n));
    var vp = UI.vp(), want = Math.min(24, n + 2 + kit.rand(3));
    var g = fitGrid(want, st.grid.clientWidth || st.tree.clientWidth * 0.86, st.tree.clientHeight * 0.8, vp.tap);
    var total = Math.max(n, Math.min(want, g.cap || want));
    st.grid.innerHTML = '';
    st.grid.style.gridTemplateColumns = 'repeat(' + g.c + ',' + g.s + 'px)';
    st.grid.style.gridAutoRows = g.s + 'px';
    var btns = [];
    for (var i = 0; i < total; i++) {
      var b = h('button', { class: 'fr-fruit', type: 'button', html: B.pics.draw(fruit) });
      (function (bb) { UI.bindPress(bb, function () { pickFruit(bb); }); })(b);
      st.grid.appendChild(b);
      UI.anim(b, [{ transform: 'scale(0)' }, { transform: 'scale(1)' }], { dur: 380, delay: 150 + i * 40, easing: UI.SPRING, fill: 'backwards' });
      btns.push(b);
    }
    function pickFruit(b) {
      if (count >= n || b.classList.contains('taken') || (demo && !b.__auto) || ctx.paused) return;
      b.classList.add('taken');
      b.disabled = true;
      count++;
      // الثمرة تطير إلى السلة
      var from = kit.center(b, ctx.stage), to = kit.center(st.basket, ctx.stage);
      var fly = h('div', { class: 'fr-fly', style: { left: from.x - from.w / 2 + 'px', top: from.y - from.h / 2 + 'px', width: from.w + 'px', height: from.h + 'px' }, html: B.pics.draw(fruit) });
      ctx.stage.appendChild(fly);
      var dx = to.x - from.x, dy = to.y - from.y + 10;
      UI.anim(fly, [
        { transform: 'translate(0,0) scale(1)' },
        { transform: 'translate(' + dx * 0.5 + 'px,' + (Math.min(dy, 0) - 60) + 'px) scale(.9)', offset: 0.45 },
        { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.55)' }
      ], { dur: 520, easing: 'ease-in-out' }).then(function () {
        fly.remove();
        var inB = h('span', { class: 'fr-in', html: B.pics.draw(fruit), style: { left: 18 + Math.random() * 54 + '%' } });
        st.basket.appendChild(inB);
      });
      bumpCount(count);
      if (count === n) setTimeout(function () { done(true); }, 560 / UI.ts);
    }
    st.solve = function () { var b = btns.filter(function (x) { return !x.classList.contains('taken'); })[0]; if (b && count < n) { b.click(); return true; } return false; };
    st.cancel = function () { done(false); };
    if (demo) {
      await ctx.sleep(900);
      for (var k = 0; k < n && alive(); k++) {
        var c = kit.center(btns[k], ctx.stage), hd = kit.hand(ctx.stage, c.x, c.y + c.h * 0.1);
        await ctx.sleep(450); if (!alive()) return;
        await hd.tap(); btns[k].__auto = true; pickFruit(btns[k]); hd.el.remove();
        await ctx.sleep(250);
      }
    }
    var ok = await finished;
    st.solve = null;
    if (!alive() || !ok) return;
    btns.forEach(function (b) { if (!b.classList.contains('taken')) b.classList.add('rest'); });
    await celebrate(ctx);
    if (!alive()) return;
    return { errors: 0 };
  }

  /* نمط «كم؟» */
  async function countRound(ctx, n, demo, alive, setCur) {
    var fruit = kit.pick(FRUITS);
    st.tree.style.display = ''; st.basket.style.display = 'none'; st.tray.style.display = '';
    showCard('', true);
    // الفواكه في صفوف من خمس (مثل إطار العشرة) فيسهل العدّ
    st.grid.innerHTML = '';
    var cols = n > 5 ? 5 : n, rows = Math.ceil(n / 5);
    var s = Math.min((st.tree.clientWidth * 0.86) / cols, (st.tree.clientHeight * 0.78) / rows, UI.vp().tablet ? 120 : 92);
    st.grid.style.gridTemplateColumns = 'repeat(' + cols + ',' + s + 'px)';
    st.grid.style.gridAutoRows = s + 'px';
    var items = [];
    for (var i = 0; i < n; i++) {
      var it = h('span', { class: 'fr-fruit show', html: B.pics.draw(fruit) });
      st.grid.appendChild(it); items.push(it);
      UI.anim(it, [{ transform: 'scale(0)' }, { transform: 'scale(1)' }], { dur: 380, delay: 120 + i * 45, easing: UI.SPRING, fill: 'backwards' });
    }
    await ctx.sleep(500 + n * 45);
    if (!alive()) return;
    var maxN = Math.max(5, n + 2), opts = [n];
    while (opts.length < 3) {
      var d = n + (kit.rand(2) ? 1 : -1) * (1 + kit.rand(2));
      if (d >= 1 && d <= Math.max(maxN, 20) && opts.indexOf(d) < 0) opts.push(d);
    }
    opts = kit.shuffle(opts);
    st.tray.innerHTML = '';
    var btns = opts.map(function (v, i) {
      var b = h('button', { class: 'g-choice letter num', type: 'button' }, h('span', { text: UI.num(v) }));
      st.tray.appendChild(b);
      UI.anim(b, [{ opacity: 0, transform: 'translateY(30px)' }, { opacity: 1, transform: 'none' }], { dur: 380, delay: i * 90, easing: UI.SPRING, fill: 'backwards' });
      return b;
    });
    st.answer = btns[opts.indexOf(n)];
    var ch = kit.choice(ctx, ctx.stage, btns, opts.indexOf(n), { demo: demo });
    setCur(ch);
    var res = await ch.promise;
    st.answer = null;
    if (!alive() || res.cancelled) return;
    showCard(UI.num(n));
    // نعدّ الفواكه أمامها واحدة واحدة
    for (var k = 0; k < items.length; k++) {
      items[k].classList.add('counted');
      items[k].setAttribute('data-n', UI.num(k + 1));
      if (B.audio) B.audio.play('lantern', k);
      UI.anim(items[k], [{ transform: 'scale(1)' }, { transform: 'scale(1.2)' }, { transform: 'scale(1)' }], { dur: 300, easing: UI.SPRING, fill: 'none' });
      await ctx.sleep(Math.max(120, 260 - n * 6));
      if (!alive()) return;
    }
    await celebrate(ctx);
    if (!alive()) return;
    return { errors: demo ? 0 : res.errors };
  }

  B.games.fruits = {
    id: 'fruits',
    mount: function (ctx) { st = { ctx: ctx }; build(ctx); },
    demo: function (ctx) { return runner.run(function (alive) { return giveRound(ctx, 3, true, alive); }); },
    playRound: function (ctx, level, i) {
      var c = config(level, i);
      return runner.run(function (alive, setCur) { return c.mode === 'give' ? giveRound(ctx, c.n, false, alive) : countRound(ctx, c.n, false, alive, setCur); });
    },
    cancelRound: function () {
      runner.cancel();
      if (st) { if (st.cancel) st.cancel(); st.grid.innerHTML = ''; st.tray.innerHTML = ''; st.ctx.stage.querySelectorAll('.kit-hand,.fr-fly').forEach(function (x) { x.remove(); }); }
    },
    outro: function (ctx) { return kit.dusk(ctx); },
    endArt: function () { return kit.endScene('bear', h('div', { class: 'end-basket', html: basketSvg() })); },
    destroy: function () { runner.stop(); st = null; },
    _config: config,
    _solveStep: function () {
      if (!st) return false;
      if (st.solve && st.solve()) return true;
      if (st.answer) { st.answer.click(); return true; }
      return false;
    }
  };
})();

</script>
<script>
/* لعبة «صيد الحروف» — تمييز أشكال الحروف. عالم بركة وأسماك.
   الضفدع يحمل بطاقة حرف، والأسماك تسبح ببطء وعلى كل منها حرف.
   تلمس الطفل السمكة التي تحمل الحرف نفسه فتقفز إلى الدلو. ثلاث سمكات تُكمل الجولة.
   المستويات: ١) حرف واحد مختلف تماماً  ٢) حرفان مختلفان  ٣) حروف متشابهة الشكل (ب ت ث…)
              ٤) أسماك أكثر وأسرع قليلاً  ٥) أشكال الحرف في أول الكلمة (بـ تـ جـ) والبطاقة بالحرف المفرد.
   لا تُختبر بالنطق: المطلوب مطابقة الشكل فقط. */
(function () {
  'use strict';
  var B = (window.Bustan = window.Bustan || {});
  var UI = B.UI, h = UI.h, art = B.art, kit = B.kit;

  var ALL = 'ابتثجحخدذرزسشصضطظعغفقكلمنهوي';
  var EASY = 'ابجدرسصطعفكلمنهي'; // بلا «و» لأنها تشبه الرقم ٩ في هذا الخط                    // أشكال متباعدة
  var LOOK = ['بتثني', 'جحخ', 'دذ', 'رز', 'سش', 'صض', 'طظ', 'عغ', 'فق'];
  var JOIN = 'بتثجحخسشصضطظعغفقكلمنهي';              // تتصل بما بعدها (لها شكل أول الكلمة)
  var FISH_COLS = [['#FF8A3D', '#FFB27A'], ['#3D8BFD', '#8BB8FF'], ['#F2658E', '#FF9DB8'], ['#8E5CF0', '#B79BFF'], ['#2DBE7E', '#7FE0B0'], ['#FFC83D', '#FFE08A']];
  var CFG = {
    1: { dis: 1, lanes: 3, dur: 15 },
    2: { dis: 2, lanes: 3, dur: 14 },
    3: { dis: 2, lanes: 3, dur: 14, similar: true },
    4: { dis: 3, lanes: 4, dur: 12, similar: true },
    5: { dis: 3, lanes: 4, dur: 13, forms: true }
  };

  /* يبني جولة: الحرف المطلوب والمشتتات */
  function makeRound(level, prev) {
    var c = CFG[level], T, pool;
    if (c.forms) {
      do { T = kit.pick(JOIN.split('')); } while (T === prev);
      pool = JOIN.replace(T, '');
    } else if (c.similar) {
      var groups = LOOK.filter(function (g) { return g.length >= 2; });
      var grp = kit.pick(groups);
      do { T = kit.pick(grp.split('')); } while (T === prev && grp.length > 1);
      pool = grp.replace(T, '');
      if (pool.length < c.dis) pool += kit.shuffle(EASY.replace(T, '').split('')).join('').slice(0, c.dis - pool.length + 1);
    } else {
      do { T = kit.pick(EASY.split('')); } while (T === prev);
      // في المستوى ١ والثاني: مشتتات بعيدة الشكل عن الهدف
      pool = EASY.split('').filter(function (x) { return x !== T && !LOOK.some(function (g) { return g.indexOf(x) >= 0 && g.indexOf(T) >= 0; }); }).join('');
    }
    var dis = kit.shuffle(pool.split('')).filter(function (x, i, a) { return a.indexOf(x) === i && x !== T; }).slice(0, c.dis);
    return { level: level, target: T, dis: dis, forms: !!c.forms };
  }
  function glyph(L, forms) { return forms ? L + 'ـ' : L; } // شكل أول الكلمة بالتطويل

  function fishSvg(col) {
    return art.svg('0 0 140 90',
      '<path d="M120 45L140 18V72Z" fill="' + col[0] + '" stroke="' + col[0] + '" stroke-width="6" stroke-linejoin="round"/>' +
      '<path d="M68 14Q78 0 96 8L90 18Z" fill="' + col[0] + '"/>' +
      '<ellipse cx="72" cy="45" rx="58" ry="38" fill="' + col[0] + '"/>' +
      '<ellipse cx="76" cy="47" rx="34" ry="30" fill="#FAFCFF" opacity=".95"/>' +
      '<circle cx="26" cy="36" r="7" fill="#fff"/><circle cx="24" cy="36" r="4" fill="#2B2340"/>' +
      '<path d="M16 54q5 4 10 1" stroke="#2B2340" stroke-width="2.6" fill="none" stroke-linecap="round"/>' +
      '<path d="M96 70Q104 84 116 80" stroke="' + col[1] + '" stroke-width="6" fill="none" stroke-linecap="round"/>', 'fish-svg');
  }
  function bucketSvg() {
    return art.svg('0 0 100 90', '<path d="M8 20H92L82 84Q81 88 76 88H24Q19 88 18 84Z" fill="#5CC8FF" stroke="#2468D1" stroke-width="4" stroke-linejoin="round"/>' +
      '<ellipse cx="50" cy="20" rx="42" ry="9" fill="#9FE0FF" stroke="#2468D1" stroke-width="4"/><path d="M10 20Q50 -18 90 20" fill="none" stroke="#3A4789" stroke-width="4"/>', 'bucket-svg');
  }

  var st = null, runner = kit.roundRunner();

  function build(ctx) {
    var stage = ctx.stage;
    stage.classList.add('g-stage', 'lt-stage');
    st.card = h('div', { class: 'lt-card' });
    st.top = h('div', { class: 'lt-top' }, h('div', { class: 'lt-frog', html: art.animal('frog') }), st.card);
    st.pond = h('div', { class: 'lt-pond' });
    for (var b = 0; b < 7; b++) st.pond.appendChild(h('span', { class: 'lt-bubble', style: { left: 8 + b * 13 + '%', animationDelay: b * 0.9 + 's' } }));
    st.slots = h('div', { class: 'lt-slots' });
    st.bucket = h('div', { class: 'lt-bucket' }, h('div', { class: 'lt-bucket-art', html: bucketSvg() }), st.slots);
    stage.appendChild(st.top);
    stage.appendChild(st.pond);
    stage.appendChild(st.bucket);
  }

  function assign(f) {
    var R = st.R;
    // نضمن وجود سمكة هدف واحدة على الأقل في البركة
    var others = st.fish.filter(function (x) { return x !== f && x.L === R.target && !x.caught; }).length;
    var isT = others === 0 || Math.random() < 0.38;
    f.L = isT ? R.target : kit.pick(R.dis);
    f.letter.textContent = glyph(f.L, R.forms);
    f.caught = false;
    f.el.classList.remove('caught', 'pulse-hint');
    if (st.hintOn && f.L === R.target) f.el.classList.add('pulse-hint');
  }

  function buildFish(level) {
    var c = CFG[level], vp = UI.vp(), pond = st.pond;
    st.pond.querySelectorAll('.lt-fish').forEach(function (x) { x.remove(); });
    st.fish = [];
    var W = pond.clientWidth, H = pond.clientHeight;
    var F = Math.min(vp.tablet ? 170 : 128, Math.max(vp.tap * 1.35, H / (c.lanes * 0.95)));
    var lanes = Math.max(2, Math.min(c.lanes, Math.floor(H / (F * 0.72))));
    var laneH = H / lanes;
    for (var i = 0; i < lanes; i++) {
      for (var j = 0; j < 2; j++) {
        var col = FISH_COLS[(i * 2 + j) % FISH_COLS.length];
        var letter = h('span', { class: 'lt-letter', style: { fontSize: F * 0.34 + 'px' } });
        var inner = h('div', { class: 'lt-inner' }, h('div', { class: 'lt-body', html: fishSvg(col) }), letter);
        var el = h('div', {
          class: 'lt-fish', style: {
            width: F + 'px', height: F * 90 / 140 + 'px', top: i * laneH + (laneH - F * 0.64) / 2 + 'px',
            animationDuration: c.dur + (i % 2) * 1.5 + 's', animationDelay: -((j / 2) + i * 0.27) * (c.dur + (i % 2) * 1.5) + 's'
          }
        }, inner);
        el.style.setProperty('--from', W + 10 + 'px');
        el.style.setProperty('--to', -F - 10 + 'px');
        var f = { el: el, inner: inner, letter: letter, L: '', caught: false };
        (function (ff) {
          el.addEventListener('pointerdown', function (e) { e.preventDefault(); tapFish(ff); });
          el.addEventListener('animationiteration', function () { assign(ff); });
        })(f);
        st.fish.push(f);
        pond.appendChild(el);
      }
    }
    st.fish.forEach(assign);
  }

  function visibleTargets() {
    var pr = st.pond.getBoundingClientRect();
    return st.fish.filter(function (f) {
      if (f.L !== st.R.target || f.caught) return false;
      var r = f.el.getBoundingClientRect();
      return r.left > pr.left + 4 && r.right < pr.right - 4;
    });
  }

  function tapFish(f) {
    var ctx = st.ctx;
    if (!st.active || st.busy || f.caught || ctx.paused || (st.demo && !f.__auto)) return;
    if (f.L === st.R.target) { catchFish(f); return; }
    st.errors++; st.fails++;
    kit.wrong(f.inner);
    if (st.fails === 2) { st.hintOn = true; st.fish.forEach(function (x) { if (x.L === st.R.target) x.el.classList.add('pulse-hint'); }); }
    if (st.fails >= 3) helpCatch();
  }

  async function helpCatch() {
    var ctx = st.ctx, tok = st.tok;
    st.busy = true;
    var t = visibleTargets()[0];
    while (!t) { await ctx.sleep(300); if (tok !== st.tok) return; t = visibleTargets()[0]; }
    t.el.style.animationPlayState = 'paused';
    var c = kit.center(t.el, ctx.stage), hd = kit.hand(ctx.stage, c.x, c.y);
    await ctx.sleep(600); if (tok !== st.tok) return;
    await hd.tap(); hd.el.remove();
    t.el.style.animationPlayState = '';
    st.busy = false;
    t.__auto = true;
    catchFish(t);
    t.__auto = false;
  }

  function catchFish(f) {
    var ctx = st.ctx;
    f.caught = true;
    st.fails = 0; st.hintOn = false;
    st.fish.forEach(function (x) { x.el.classList.remove('pulse-hint'); });
    var from = kit.center(f.el, ctx.stage), to = kit.center(st.bucket, ctx.stage);
    // رشّة ماء ثم قفزة إلى الدلو
    var ring = h('span', { class: 'lt-splash', style: { left: from.x + 'px', top: from.y + 'px' } });
    ctx.stage.appendChild(ring);
    UI.anim(ring, [{ transform: 'translate(-50%,-50%) scale(.2)', opacity: 1 }, { transform: 'translate(-50%,-50%) scale(1.6)', opacity: 0 }], { dur: 600 }).then(function () { ring.remove(); });
    var fly = h('div', { class: 'lt-fly', style: { left: from.x - from.w / 2 + 'px', top: from.y - from.h / 2 + 'px', width: from.w + 'px', height: from.h + 'px' } });
    fly.innerHTML = f.inner.outerHTML;
    ctx.stage.appendChild(fly);
    f.el.classList.add('caught');
    if (B.audio) { B.audio.play('right'); B.audio.play('splash'); }
    var dx = to.x - from.x, dy = to.y - from.y;
    UI.anim(fly, [
      { transform: 'translate(0,0) scale(1) rotate(0)' },
      { transform: 'translate(' + dx * 0.5 + 'px,' + (Math.min(0, dy) - 90) + 'px) scale(.85) rotate(-30deg)', offset: 0.5 },
      { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.3) rotate(-80deg)' }
    ], { dur: 650, easing: 'ease-in-out' }).then(function () {
      fly.remove();
      var slot = st.slots.children[st.caught - 1];
      if (slot) { slot.classList.add('on'); UI.anim(slot, [{ transform: 'scale(.3)' }, { transform: 'scale(1.3)' }, { transform: 'scale(1)' }], { dur: 380, easing: UI.SPRING, fill: 'none' }); }
      if (B.audio) B.audio.play('place');
    });
    st.caught++;
    if (st.caught >= st.need) {
      st.active = false;
      st.card.innerHTML = B.art.check();
      UI.anim(st.card, [{ transform: 'scale(.4) rotate(-15deg)' }, { transform: 'scale(1.15)' }, { transform: 'none' }], { dur: 450, easing: UI.SPRING, fill: 'none' });
      st.pond.classList.add('finished');
      setTimeout(function () { if (st && st.done) st.done(true); }, 750 / UI.ts); }
  }

  async function round(ctx, level, demo, alive) {
    var R = makeRound(level, st.prev);
    st.prev = R.target; st.R = R;
    st.errors = 0; st.fails = 0; st.caught = 0; st.need = demo ? 1 : 3; st.hintOn = false; st.busy = false; st.demo = demo;
    st.tok = (st.tok || 0) + 1;
    var finished = new Promise(function (r) { st.done = r; });
    // البطاقة: الحرف المفرد كبيراً
    st.card.innerHTML = '';
    st.card.appendChild(h('span', { text: R.target }));
    UI.anim(st.card, [{ transform: 'scale(.3) rotate(-12deg)', opacity: 0 }, { transform: 'none', opacity: 1 }], { dur: 480, easing: UI.SPRING, fill: 'backwards' });
    if (B.audio) B.audio.play('card');
    st.slots.innerHTML = '';
    for (var i = 0; i < st.need; i++) st.slots.appendChild(h('span', { class: 'lt-slot', html: fishSvg(FISH_COLS[i]) }));
    buildFish(level);
    st.pond.classList.remove('calm', 'finished');
    await ctx.sleep(700);
    if (!alive()) return;
    st.active = true;
    st.solve = function () { var t = visibleTargets()[0]; if (!t || st.busy || !st.active) return false; tapFish(t); return true; };
    if (demo) { await ctx.sleep(900); if (!alive()) return; st.fails = 2; helpCatch(); }
    var ok = await finished;
    st.solve = null;
    if (!alive() || !ok) return;
    // الاحتفال: الأسماك تقفز فرحاً
    st.pond.classList.add('calm');
    if (B.audio) B.audio.play('cheer');
    var c = kit.center(st.bucket, ctx.stage);
    UI.burst(ctx.stage, c.x, c.y - 20, { n: 22, spread: 150, dur: 1400 });
    st.fish.forEach(function (f, k) { UI.anim(f.inner, [{ transform: 'translateY(0)' }, { transform: 'translateY(-26px) rotate(-12deg)' }, { transform: 'translateY(0)' }], { dur: 600, delay: k * 70, fill: 'none', deco: true }); });
    await ctx.sleep(1500);
    if (!alive()) return;
    return { errors: demo ? 0 : st.errors };
  }

  B.games.letters = {
    id: 'letters',
    mount: function (ctx) { st = { ctx: ctx }; build(ctx); },
    demo: function (ctx) { return runner.run(function (alive) { return round(ctx, 1, true, alive); }); },
    playRound: function (ctx, level) { return runner.run(function (alive) { return round(ctx, level, false, alive); }); },
    cancelRound: function () {
      runner.cancel();
      if (st) { st.tok++; st.active = false; if (st.done) st.done(false); st.ctx.stage.querySelectorAll('.kit-hand,.lt-fly').forEach(function (x) { x.remove(); }); }
    },
    outro: function (ctx) { return kit.dusk(ctx); },
    endArt: function () { return kit.endScene('frog', h('div', { class: 'end-basket', html: bucketSvg() })); },
    destroy: function () { runner.stop(); if (st) st.tok++; st = null; },
    _makeRound: makeRound,
    _glyph: glyph,
    _solveStep: function () { return !!(st && st.solve && st.solve()); }
  };
})();

</script>
<script>
/* لعبة «بطاقات الذاكرة» — الذاكرة البصرية. عالم حديقة ليلية وبطاقات لامعة.
   تُعرض البطاقات مكشوفة لحظة (تنبؤ قبل الفعل) ثم تُقلب، فتقلبها الطفل اثنتين اثنتين لتجد الأزواج.
   الزوجان غير المتطابقين يعودان بهدوء (ليس خطأ في الذاكرة)، والزوج المتطابق يبقى مكشوفاً ويلمع.
   المستويات: ١) زوجان  ٢) ثلاثة  ٣) أربعة  ٤) ستة  ٥) ثمانية. ويقصر زمن المعاينة مع المستوى.
   الأخطاء (للتكيّف الصامت) = المحاولات الزائدة عن عدد الأزواج.
   سلّم المساعدة: إن طال البحث تُكشف البطاقات لحظة، ثم يدلّ الكفّ على زوج. */
(function () {
  'use strict';
  var B = (window.Bustan = window.Bustan || {});
  var UI = B.UI, h = UI.h, kit = B.kit;

  var FACES = ['duck', 'bear', 'cat', 'rabbit', 'frog', 'lamb', 'owl', 'apple', 'strawberry', 'grapes', 'fish', 'butterfly',
    'sun', 'balloon', 'car', 'flower', 'house', 'rocket', 'ball', 'tree', 'whale', 'bee', 'crown', 'train'];
  var CFG = { 1: { pairs: 2, peek: 2600 }, 2: { pairs: 3, peek: 2600 }, 3: { pairs: 4, peek: 2400 }, 4: { pairs: 6, peek: 2200 }, 5: { pairs: 8, peek: 2000 } };

  /* أبعاد الشبكة لعدد البطاقات: أكبر بطاقة تتسع */
  function fit(n, W, H) {
    var best = null;
    for (var c = 1; c <= n; c++) {
      if (n % c) continue;
      var r = n / c, s = Math.min(W / c, (H / r) / 1.15);
      if (!best || s > best.s) best = { c: c, r: r, s: s };
    }
    best.s = Math.floor(Math.min(best.s - 10, UI.vp().tablet ? 190 : 140));
    return best;
  }

  var st = null, runner = kit.roundRunner();

  function build(ctx) {
    ctx.stage.classList.add('g-stage', 'mm-stage');
    for (var i = 0; i < 18; i++) {
      ctx.stage.appendChild(h('span', { class: 'mm-star', style: { left: Math.random() * 100 + '%', top: Math.random() * 100 + '%', animationDelay: Math.random() * 3 + 's' } }));
    }
    st.grid = h('div', { class: 'mm-grid' });
    ctx.stage.appendChild(h('div', { class: 'g-main' }, st.grid));
  }

  function card(face) {
    var front = h('div', { class: 'mm-face mm-front', html: B.pics.draw(face) });
    var back = h('div', { class: 'mm-face mm-back' }, h('span', { class: 'mm-back-art', html: B.art.sparkle('#FFF7C2') }));
    var el = h('button', { class: 'mm-card', type: 'button' }, h('div', { class: 'mm-flip' }, back, front));
    return el;
  }

  async function round(ctx, level, demo, alive) {
    var c = CFG[level], pairs = demo ? 2 : c.pairs, n = pairs * 2;
    var faces = kit.shuffle(FACES).slice(0, pairs);
    var deck = kit.shuffle(faces.concat(faces));
    var g = fit(n, st.grid.parentNode.clientWidth - 10, st.grid.parentNode.clientHeight - 10);
    st.grid.innerHTML = '';
    st.grid.style.gridTemplateColumns = 'repeat(' + g.c + ',' + g.s + 'px)';
    st.grid.style.gridAutoRows = Math.round(g.s * 1.15) + 'px';
    var cards = deck.map(function (f, i) {
      var el = card(f);
      el.__face = f; el.__i = i;
      st.grid.appendChild(el);
      UI.anim(el, [{ transform: 'scale(0) rotate(-20deg)' }, { transform: 'none' }], { dur: 420, delay: i * 60, easing: UI.SPRING, fill: 'backwards' });
      return el;
    });
    var open = [], matched = 0, tries = 0, busy = true, done, finished = new Promise(function (r) { done = r; });
    var helped = false;

    function flip(el, up) { el.classList.toggle('up', up); }
    function pick(el) {
      if (busy || el.classList.contains('up') || ctx.paused || (demo && !el.__auto)) return;
      flip(el, true);
      if (B.audio) B.audio.play('pick');
      open.push(el);
      if (open.length < 2) return;
      tries++;
      busy = true;
      var a = open[0], b = open[1];
      open = [];
      if (a.__face === b.__face) {
        setTimeout(function () {
          a.classList.add('matched'); b.classList.add('matched');
          if (B.audio) { B.audio.play('right'); B.audio.play('sparkle'); }
          [a, b].forEach(function (x) { var p = kit.center(x, ctx.stage); UI.burst(ctx.stage, p.x, p.y, { n: 8, spread: 60, dur: 800 }); });
          matched++;
          busy = false;
          if (matched === pairs) done(true);
        }, 350 / UI.ts);
      } else {
        // لا يتطابقان: يعودان بهدوء
        ctx.sleep(1000).then(function () {
          flip(a, false); flip(b, false);
          if (B.audio) B.audio.play('soft');
          busy = false;
          help();
        });
      }
    }
    cards.forEach(function (el) { UI.bindPress(el, function () { pick(el); }); });

    /* سلّم المساعدة: بعد محاولات كثيرة تُكشف البطاقات لحظة، ثم يدلّ الكفّ على زوج */
    async function help() {
      var extra = tries - pairs;
      if (extra === pairs + 2 && !helped) {
        helped = true; busy = true;
        cards.forEach(function (x) { if (!x.classList.contains('matched')) flip(x, true); });
        await ctx.sleep(1300); if (!alive()) return;
        cards.forEach(function (x) { if (!x.classList.contains('matched')) flip(x, false); });
        await ctx.sleep(500);
        busy = false;
      } else if (extra >= pairs * 2 + 4) {
        await showPair();
      }
    }
    async function showPair() {
      busy = true;
      var left = cards.filter(function (x) { return !x.classList.contains('matched'); });
      var a = left[0], b = left.filter(function (x) { return x !== a && x.__face === a.__face; })[0];
      if (!a || !b) { busy = false; return; }
      for (var k = 0; k < 2; k++) {
        var el = k ? b : a, p = kit.center(el, ctx.stage), hd = kit.hand(ctx.stage, p.x, p.y + p.h * 0.1);
        await ctx.sleep(550); if (!alive()) return;
        await hd.tap(); hd.el.remove();
        busy = false; el.__auto = true; pick(el); el.__auto = false; busy = true;
        if (k === 0) busy = false;
        await ctx.sleep(300); if (!alive()) return;
      }
    }

    // معاينة: البطاقات مكشوفة لحظة ثم تُقلب
    await ctx.sleep(350 + n * 60); if (!alive()) return;
    cards.forEach(function (x) { flip(x, true); });
    if (B.audio) B.audio.play('whoosh');
    await ctx.sleep(demo ? 2600 : c.peek); if (!alive()) return;
    cards.forEach(function (x) { flip(x, false); });
    await ctx.sleep(600); if (!alive()) return;
    busy = false;

    st.solve = function () {
      if (busy) return false;
      var left = cards.filter(function (x) { return !x.classList.contains('matched') && !x.classList.contains('up'); });
      var up = cards.filter(function (x) { return x.classList.contains('up') && !x.classList.contains('matched'); })[0];
      var t = up ? left.filter(function (x) { return x.__face === up.__face; })[0] : left[0];
      if (!t) return false;
      pick(t); return true;
    };
    st.cancel = function () { done(false); };
    if (demo) { // العرض التوضيحي: الكفّ يكشف الأزواج كلها زوجاً زوجاً
      (async function () {
        while (alive() && matched < pairs) {
          await ctx.sleep(500); if (!alive()) return;
          await showPair();
          await ctx.sleep(500);
        }
      })();
    }

    var ok = await finished;
    st.solve = null;
    if (!alive() || !ok) return;
    await ctx.sleep(400); if (!alive()) return;
    if (B.audio) B.audio.play('cheer');
    var p = kit.center(st.grid, ctx.stage);
    UI.burst(ctx.stage, p.x, p.y, { n: 26, spread: 170, dur: 1500 });
    cards.forEach(function (x, i) {
      UI.anim(x, [{ transform: 'translateY(0) rotate(0)' }, { transform: 'translateY(-18px) rotate(' + (i % 2 ? 8 : -8) + 'deg)' }, { transform: 'translateY(0) rotate(0)' }], { dur: 600, delay: i * 50, fill: 'none', deco: true });
    });
    await ctx.sleep(1500); if (!alive()) return;
    return { errors: demo ? 0 : Math.max(0, tries - pairs - Math.ceil(pairs / 2)) };
  }

  B.games.memory = {
    id: 'memory',
    mount: function (ctx) { st = { ctx: ctx }; build(ctx); },
    demo: function (ctx) { return runner.run(function (alive) { return round(ctx, 1, true, alive); }); },
    playRound: function (ctx, level) { return runner.run(function (alive) { return round(ctx, level, false, alive); }); },
    cancelRound: function () { runner.cancel(); if (st) { if (st.cancel) st.cancel(); st.grid.innerHTML = ''; st.ctx.stage.querySelectorAll('.kit-hand').forEach(function (x) { x.remove(); }); } },
    outro: function (ctx) { return kit.dusk(ctx); },
    endArt: function () { return kit.endScene('owl'); },
    destroy: function () { runner.stop(); st = null; },
    _fit: fit,
    _solveStep: function () { return !!(st && st.solve && st.solve()); }
  };
})();

</script>
<script>
/* ثلاث ألعاب بسيطة جداً لابن الرابعة، كلها «انظري واختاري» بلا قراءة ولا شرح:
   • «لعبة الظلال»: ظلّ أسود لشيء، وتختار صاحب الظل من الصور الملوّنة.
   • «أين الأكثر؟»: طبقان من الفاكهة، وتختار الطبق الذي فيه أكثر (تحكم بالنظر: كثير/قليل).
   • «أين المختلف؟»: أربع صور، ثلاث متشابهة وواحدة مختلفة، وتختار المختلفة.
   كلها تستعمل جولة الاختيار المشتركة (kit.choice) بسلّم المساعدة نفسه. */
(function () {
  'use strict';
  var B = (window.Bustan = window.Bustan || {});
  var UI = B.UI, h = UI.h, art = B.art, kit = B.kit;

  var GROUPS = {
    animals: ['duck', 'bear', 'cat', 'rabbit', 'frog', 'lamb', 'owl', 'bird', 'turtle', 'whale', 'fish', 'bee', 'butterfly'],
    fruits: ['apple', 'strawberry', 'lemon', 'banana', 'grapes', 'pomegranate', 'carrot', 'pumpkin'],
    things: ['house', 'car', 'rocket', 'plane', 'key', 'clock', 'ball', 'balloon', 'tree', 'flower', 'crown', 'book', 'tent', 'train', 'lantern', 'umbrella']
  };
  var GNAMES = Object.keys(GROUPS);
  function fromOther(g) { var o = kit.pick(GNAMES.filter(function (x) { return x !== g; })); return kit.pick(GROUPS[o]); }

  /* مصنع لعبة صغيرة: opts.round(ctx, st, level, demo, alive, setCur) → {errors} */
  function mini(id, cls, sleeper, roundFn) {
    var st = null, runner = kit.roundRunner();
    function clear() { if (st) { st.top.innerHTML = ''; st.tray.innerHTML = ''; st.answer = null; st.ctx.stage.querySelectorAll('.kit-hand').forEach(function (x) { x.remove(); }); } }
    B.games[id] = {
      id: id,
      mount: function (ctx) {
        st = { ctx: ctx, answer: null, last: '' };
        ctx.stage.classList.add('g-stage', 'mg-stage', cls);
        st.top = h('div', { class: 'mg-top' });
        st.tray = h('div', { class: 'g-tray mg-tray' });
        ctx.stage.appendChild(h('div', { class: 'g-main' }, st.top));
        ctx.stage.appendChild(st.tray);
      },
      demo: function (ctx) { return runner.run(function (alive, setCur) { return roundFn(ctx, st, 1, true, alive, setCur); }); },
      playRound: function (ctx, level) { return runner.run(function (alive, setCur) { return roundFn(ctx, st, level, false, alive, setCur); }); },
      cancelRound: function () { runner.cancel(); clear(); },
      outro: function (ctx) { return kit.dusk(ctx); },
      endArt: function () { return kit.endScene(sleeper); },
      destroy: function () { runner.stop(); st = null; },
      _solveStep: function () { if (st && st.answer) { st.answer.click(); return true; } return false; }
    };
  }

  function addBtns(st, htmls, cls) {
    st.tray.innerHTML = '';
    return htmls.map(function (html, i) {
      var b = h('button', { class: 'g-choice ' + (cls || 'pic'), type: 'button', html: html });
      st.tray.appendChild(b);
      UI.anim(b, [{ opacity: 0, transform: 'translateY(30px) scale(.8)' }, { opacity: 1, transform: 'none' }], { dur: 400, delay: i * 90, easing: UI.SPRING, fill: 'backwards' });
      return b;
    });
  }
  async function ask(ctx, st, btns, correct, demo, alive, setCur) {
    st.answer = btns[correct];
    var ch = kit.choice(ctx, ctx.stage, btns, correct, { demo: demo });
    setCur(ch);
    var res = await ch.promise;
    st.answer = null;
    if (!alive() || res.cancelled) return null;
    btns.forEach(function (b, i) { if (i !== correct) b.classList.add('faded'); });
    return res;
  }
  async function cheer(ctx, el) {
    var c = kit.center(el, ctx.stage);
    UI.burst(ctx.stage, c.x, c.y, { n: 20, spread: 140, dur: 1300 });
    if (B.audio) B.audio.play('cheer');
    await ctx.sleep(1400);
  }

  /* ═════════ لعبة الظلال ═════════ */
  mini('shadows', 'sh-stage', 'cat', async function (ctx, st, level, demo, alive, setCur) {
    var n = level === 1 ? 2 : level <= 3 ? 3 : 4, same = level >= 3;
    var g = kit.pick(GNAMES), target;
    do { target = kit.pick(GROUPS[g]); } while (target === st.last);
    st.last = target;
    var opts = [target];
    while (opts.length < n) { var d = same ? kit.pick(GROUPS[g]) : fromOther(g); if (opts.indexOf(d) < 0) opts.push(d); }
    opts = kit.shuffle(opts);
    st.top.innerHTML = '';
    var sh = h('div', { class: 'sh-card' }, h('div', { class: 'sh-pic is-shadow', html: B.pics.draw(target) }));
    st.top.appendChild(sh);
    UI.anim(sh, [{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'none' }], { dur: 480, easing: UI.SPRING, fill: 'backwards' });
    if (B.audio) B.audio.play('card');
    await ctx.sleep(600); if (!alive()) return;
    var btns = addBtns(st, opts.map(function (k) { return B.pics.draw(k); }));
    var res = await ask(ctx, st, btns, opts.indexOf(target), demo, alive, setCur);
    if (!res) return;
    // الظل يكشف عن صاحبه
    sh.firstChild.classList.remove('is-shadow');
    UI.anim(sh, [{ transform: 'scale(1)' }, { transform: 'scale(1.12)' }, { transform: 'scale(1)' }], { dur: 500, easing: UI.SPRING, fill: 'none' });
    await cheer(ctx, sh); if (!alive()) return;
    return { errors: demo ? 0 : res.errors };
  });

  /* ═════════ أين الأكثر؟ ═════════ */
  function morePair(level) {
    var a, b;
    if (level === 1) { a = 1 + kit.rand(2); b = 5 + kit.rand(3); }
    else if (level === 2) { a = 1 + kit.rand(4); b = a + 3 + kit.rand(2); }
    else if (level === 3) { a = 2 + kit.rand(5); b = a + 2; }
    else if (level === 4) { a = 3 + kit.rand(5); b = a + 1 + kit.rand(2); }
    else { a = 4 + kit.rand(6); b = a + 1; }
    return [a, Math.min(b, 12)];
  }
  function plate(fruit, n) {
    var cols = n <= 4 ? 2 : n <= 9 ? 3 : 4, out = '<span class="mo-plate" style="--c:' + cols + '">';
    for (var i = 0; i < n; i++) out += '<span class="mo-item">' + B.pics.draw(fruit) + '</span>';
    return out + '</span>';
  }
  mini('more', 'mo-stage', 'bear', async function (ctx, st, level, demo, alive, setCur) {
    var p = morePair(level), fruit = kit.pick(GROUPS.fruits.slice(0, 6));
    var bigFirst = Math.random() < 0.5, counts = bigFirst ? [p[1], p[0]] : [p[0], p[1]];
    st.top.innerHTML = '';
    // الدب الجائع يريد الطبق الأكثر
    var bear = h('div', { class: 'mo-bear', html: art.animal('bear') });
    st.top.appendChild(bear);
    UI.anim(bear, [{ transform: 'translateY(20px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { dur: 400, fill: 'backwards' });
    await ctx.sleep(350); if (!alive()) return;
    var btns = addBtns(st, counts.map(function (n) { return plate(fruit, n); }), 'mo-btn');
    var res = await ask(ctx, st, btns, bigFirst ? 0 : 1, demo, alive, setCur);
    if (!res) return;
    UI.anim(bear, [{ transform: 'translateY(0)' }, { transform: 'translateY(-20px) rotate(-6deg)' }, { transform: 'translateY(0)' }, { transform: 'translateY(-12px) rotate(6deg)' }, { transform: 'translateY(0)' }], { dur: 900, fill: 'none' });
    await cheer(ctx, btns[bigFirst ? 0 : 1]); if (!alive()) return;
    return { errors: demo ? 0 : res.errors };
  });

  /* ═════════ أين المختلف؟ ═════════ */
  function symHtml(shape, color) { return art.symbol({ shape: shape, color: color }); }
  mini('odd', 'od-stage', 'owl', async function (ctx, st, level, demo, alive, setCur) {
    var htmls, same, diff, g = kit.pick(GNAMES);
    if (level <= 2) {                                   // ثلاث صور متطابقة وواحدة مختلفة
      same = kit.pick(GROUPS[g]);
      do { diff = level === 1 ? fromOther(g) : kit.pick(GROUPS[g]); } while (diff === same);
      htmls = [B.pics.draw(same), B.pics.draw(same), B.pics.draw(same), B.pics.draw(diff)];
    } else if (level <= 4) {                            // رموز: يختلف اللون ثم يختلف الشكل
      var sh = kit.shuffle(art.SHAPES), co = kit.shuffle(art.COLOR_KEYS);
      var a = symHtml(sh[0], co[0]), d = level === 3 ? symHtml(sh[0], co[1]) : symHtml(sh[1], co[0]);
      htmls = [a, a, a, d];
    } else {                                            // فئات: ثلاثة من نوع وواحد من نوع آخر
      var three = kit.shuffle(GROUPS[g]).slice(0, 3);
      htmls = three.map(function (k) { return B.pics.draw(k); }).concat([B.pics.draw(fromOther(g))]);
    }
    var order = kit.shuffle([0, 1, 2, 3]);
    st.top.innerHTML = '';
    st.tray.classList.add('od-grid');
    var btns = addBtns(st, order.map(function (i) { return htmls[i]; }));
    if (B.audio) B.audio.play('card');
    var correct = order.indexOf(3);
    var res = await ask(ctx, st, btns, correct, demo, alive, setCur);
    if (!res) return;
    await cheer(ctx, btns[correct]); if (!alive()) return;
    return { errors: demo ? 0 : res.errors };
  });

  B.games.more._pair = morePair;
})();

</script>
<script>
/* لعبة «ارسم الطريق» — تتبّع الخطوط بالإصبع (تمهيد للكتابة وتقوية لليد).
   حيوان صغير يقف في بداية طريق منقّط، وعلى الطفل أن يمرّر إصبعه فوق الطريق فيسير الحيوان معه حتى هدفه.
   المستويات: ١) خطوط مستقيمة  ٢) منحنيات وموجة  ٣) زوايا (زجزاج، مثلث، مربع)  ٤) دائرة وحلزون ومنحنى S
              ٥) أشكال بعض الحروف (ا ل ر د ب) — مجرد أشكال بلا نطق.
   لا فشل: الخروج عن الطريق لا يوقف شيئاً، يكفي أن يعود الإصبع قرب آخر نقطة وصل إليها.
   سلّم المساعدة: بعد ٣ خروج أو ٩ ثوانٍ بلا تقدّم ينبض الطريق، ثم يُظهر الكفّ الطريق ويُكمله. */
(function () {
  'use strict';
  var B = (window.Bustan = window.Bustan || {});
  var UI = B.UI, h = UI.h, art = B.art, kit = B.kit;
  var NS = 'http://www.w3.org/2000/svg';

  /* الطرق في لوحة ٣٠٠×٣٠٠. الحرف إن وُجد يظهر في البطاقة. */
  var PATHS = {
    1: [{ d: 'M40 150H260' }, { d: 'M150 40V260' }, { d: 'M50 250L250 50' }, { d: 'M260 150H40' }, { d: 'M50 50L250 250' }],
    2: [{ d: 'M40 220Q150 20 260 220' }, { d: 'M30 150Q75 70 120 150T210 150T290 150' }, { d: 'M40 80Q150 260 260 80' }, { d: 'M50 230C50 100 250 100 250 230' }],
    3: [{ d: 'M40 220L100 80L160 220L220 80L270 220' }, { d: 'M150 50L260 250H40Z' }, { d: 'M60 60H240V240H60Z' }, { d: 'M50 200L120 120L180 200L250 100' }],
    4: [{ d: 'M150 40A110 110 0 1 1 149.9 40' }, { d: 'M60 80C260 20 260 160 150 150C40 140 40 250 240 230' }, { d: 'M150 150C150 110 200 110 200 150C200 210 100 210 100 140C100 70 210 60 230 150' }, { d: 'M70 70C250 70 250 150 150 150C50 150 50 230 230 230' }],
    5: [{ d: 'M150 40V260', letter: 'ا' }, { d: 'M115 40V195Q115 255 180 255Q235 255 248 205', letter: 'ل' }, { d: 'M205 80Q215 190 105 245', letter: 'ر' }, { d: 'M75 100H190Q228 100 222 150Q214 205 148 242', letter: 'د' }, { d: 'M60 120Q60 235 150 235Q240 235 240 120', letter: 'ب' }]
  };
  var PAIRS = [['bee', 'flower'], ['rabbit', 'carrot'], ['bear', 'apple'], ['cat', 'fish'], ['lamb', 'tree'], ['duck', 'whale'], ['frog', 'leaf'], ['bird', 'house']];
  var STEP = 3;      // المسافة بين نقاط العيّنة بوحدات اللوحة

  function makeRound(level, prev) {
    var list = PATHS[level] || PATHS[1], p;
    do { p = kit.pick(list); } while (list.length > 1 && p.d === prev);
    return { d: p.d, letter: p.letter || '', pair: kit.pick(PAIRS), level: level };
  }

  /* عيّنة نقاط على المسار (تحتاج DOM) */
  function sample(d) {
    var path = document.createElementNS(NS, 'path');
    path.setAttribute('d', d);
    var L = path.getTotalLength(), pts = [];
    for (var s = 0; s <= L; s += STEP) { var q = path.getPointAtLength(s); pts.push([q.x, q.y]); }
    var e = path.getPointAtLength(L); pts.push([e.x, e.y]);
    return { pts: pts, len: L };
  }

  var st = null, runner = kit.roundRunner();

  function build(ctx) {
    ctx.stage.classList.add('g-stage', 'tr-stage');
    st.card = h('div', { class: 'tr-card' });
    st.board = h('div', { class: 'tr-board' });
    ctx.stage.appendChild(h('div', { class: 'g-main' }, st.card, st.board));
  }

  function put(el, p) { el.style.left = p[0] / 3 + '%'; el.style.top = p[1] / 3 + '%'; }

  async function round(ctx, level, demo, alive) {
    var R = makeRound(level, st.prev); st.prev = R.d;
    var sm = sample(R.d), pts = sm.pts, N = pts.length;
    var prog = 0, errors = 0, straying = false, down = false, busy = false, finished = false, idle = 0, done;
    var fin = new Promise(function (r) { done = r; });
    st.board.innerHTML = ''; st.card.innerHTML = '';
    // البطاقة: الحرف في المستوى ٥، وإلا الحيوان وهدفه
    if (R.letter) st.card.appendChild(h('span', { class: 'tr-letter', text: R.letter }));
    else st.card.innerHTML = '<span class="tr-pair">' + B.pics.draw(R.pair[0]) + '<i></i>' + B.pics.draw(R.pair[1]) + '</span>';
    UI.anim(st.card, [{ opacity: 0, transform: 'scale(.5)' }, { opacity: 1, transform: 'none' }], { dur: 420, easing: UI.SPRING, fill: 'backwards' });

    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 300 300'); svg.setAttribute('class', 'tr-svg');
    function p(cls, w) { var e = document.createElementNS(NS, 'path'); e.setAttribute('d', R.d); e.setAttribute('class', cls); e.setAttribute('fill', 'none'); e.setAttribute('stroke-width', w); e.setAttribute('stroke-linecap', 'round'); e.setAttribute('stroke-linejoin', 'round'); svg.appendChild(e); return e; }
    p('tr-lane', 40); var guide = p('tr-guide', 8); var fill = p('tr-fill', 22);
    fill.style.strokeDasharray = '0 99999';
    st.board.appendChild(svg);
    var goal = h('div', { class: 'tr-goal', html: B.pics.draw(R.pair[1]) }); put(goal, pts[N - 1]);
    var av = h('div', { class: 'tr-avatar', html: B.pics.draw(R.pair[0]) }); put(av, pts[0]);
    var start = h('div', { class: 'tr-start' }); put(start, pts[0]);
    st.board.appendChild(start); st.board.appendChild(goal); st.board.appendChild(av);
    UI.anim(av, [{ transform: 'translate(-50%,-50%) scale(0)' }, { transform: 'translate(-50%,-50%) scale(1)' }], { dur: 420, easing: UI.SPRING, fill: 'backwards' });
    if (B.audio) B.audio.play('card');

    function setProg(i) {
      prog = Math.max(prog, Math.min(N - 1, i));
      fill.style.strokeDasharray = Math.max(0.01, prog * STEP) + ' 99999';
      put(av, pts[prog]);
      idle = 0;
      if (prog >= N - 4 && !finished) { finished = true; done(true); }
    }
    function toSvg(e) {
      var r = svg.getBoundingClientRect();
      return [(e.clientX - r.left) / r.width * 300, (e.clientY - r.top) / r.height * 300];
    }
    function tol() { var r = svg.getBoundingClientRect(); return Math.max(30, 40 * 300 / r.width); }
    function move(e) {
      if (!down || busy || finished || ctx.paused) return;
      var q = toSvg(e), T = tol(), best = -1, hi = Math.min(N - 1, prog + 70);
      for (var i = prog; i <= hi; i++) {
        var dx = pts[i][0] - q[0], dy = pts[i][1] - q[1];
        if (dx * dx + dy * dy <= T * T) best = i;
      }
      if (best >= 0) {
        if (straying) straying = false;
        if (best > prog) { setProg(best); if (B.audio && best % 20 === 0) B.audio.play('soft'); }
      } else if (!straying) { straying = true; errors++; if (errors === 2) guide.classList.add('pulse'); if (errors >= 3 && !demo) autoTrace(); }
    }
    svg.addEventListener('pointerdown', function (e) {
      if (busy || finished || ctx.paused) return;
      var q = toSvg(e), T = tol() * 1.7, a = pts[prog];
      if ((a[0] - q[0]) * (a[0] - q[0]) + (a[1] - q[1]) * (a[1] - q[1]) > T * T) return; // يبدأ قرب الحيوان
      down = true; straying = false;
      try { svg.setPointerCapture(e.pointerId); } catch (x) {}
      e.preventDefault();
    });
    svg.addEventListener('pointermove', move);
    ['pointerup', 'pointercancel'].forEach(function (ev) { svg.addEventListener(ev, function () { down = false; }); });

    /* الكفّ يرسم الطريق ويُكمله (العرض التوضيحي، أو بعد تعثّر) */
    async function autoTrace() {
      if (busy || finished) return;
      busy = true; down = false;
      var sz = st.board.clientWidth * 0.26;
      var paw = h('div', { class: 'tr-paw', style: { width: sz + 'px', height: sz * 96 / 88 + 'px' }, html: art.hand() });
      st.board.appendChild(paw);
      function at(i) { paw.style.left = pts[i][0] / 3 + '%'; paw.style.top = pts[i][1] / 3 + '%'; }
      at(prog);
      UI.anim(paw, [{ opacity: 0 }, { opacity: 1 }], { dur: 300, fill: 'backwards' });
      await ctx.sleep(600); if (!alive()) return;
      for (var i = prog; i < N && alive(); i += 2) { at(i); setProg(i); await ctx.sleep(22); }
      setProg(N - 1);
      paw.remove(); busy = false;
    }
    st.solve = function () { if (finished) return false; setProg(N - 1); return true; };
    st.cancel = function () { finished = true; done(false); };

    // خمول طويل: ينبض الطريق ثم يُكمله الكفّ
    (async function watch() {
      while (alive() && !finished) {
        await ctx.sleep(1000);
        if (ctx.paused || busy) continue;
        idle++;
        if (idle === 5) guide.classList.add('pulse');
        if (idle >= 9 && !demo) autoTrace();
      }
    })();

    await ctx.sleep(demo ? 900 : 300); if (!alive()) return;
    if (demo) autoTrace();
    var ok = await fin;
    st.solve = null;
    if (!alive() || !ok) return;
    // الاحتفال: يقفز الحيوان إلى هدفه ويفرح
    guide.classList.remove('pulse');
    put(av, pts[N - 1]);
    UI.anim(av, [{ transform: 'translate(-50%,-50%) scale(1)' }, { transform: 'translate(-50%,-120%) scale(1.3)' }, { transform: 'translate(-50%,-50%) scale(1)' }], { dur: 600, easing: UI.SPRING, fill: 'none' });
    UI.anim(goal, [{ transform: 'translate(-50%,-50%) scale(1)' }, { transform: 'translate(-50%,-50%) scale(1.4)' }, { transform: 'translate(-50%,-50%) scale(1)' }], { dur: 600, easing: UI.SPRING, fill: 'none' });

    await ctx.sleep(1500); if (!alive()) return;
    return { errors: demo ? 0 : Math.min(errors, 5) };
  }

  B.games.tracing = {
    id: 'tracing',
    mount: function (ctx) { st = { ctx: ctx }; build(ctx); },
    demo: function (ctx) { return runner.run(function (alive) { return round(ctx, 1, true, alive); }); },
    playRound: function (ctx, level) { return runner.run(function (alive) { return round(ctx, level, false, alive); }); },
    cancelRound: function () { runner.cancel(); if (st) { if (st.cancel) st.cancel(); st.board.innerHTML = ''; } },
    outro: function (ctx) { return kit.dusk(ctx); },
    endArt: function () { return kit.endScene('bear'); },
    destroy: function () { runner.stop(); st = null; },
    _makeRound: makeRound,
    _paths: PATHS,
    _solveStep: function () { return !!(st && st.solve && st.solve()); }
  };
})();

<script>
/* خمس ألعاب جديدة تضيف مهارات مختلفة (كلها بلا قراءة، وبلا فشل، مع سلّم المساعدة نفسه):
   • «أطعم الحيوان»: ربط الحيوان بطعامه (الربط والتصنيف).
   • «أين يختبئ الحيوان؟»: ملاحظة بصرية — حيوان يطلّ من خلف شجيرة أو صخرة.
   • «من اختفى؟»: ذاكرة قصيرة المدى — صور تظهر ثم تختفي إحداها.
   • «رتّب الأحجام»: التسلسل — من الأصغر إلى الأكبر.
   • «من يعيش هنا؟»: تصنيف الحيوان حسب بيئته (بحر، غابة، مزرعة، سماء، صحراء). */
(function () {
  'use strict';
  var B = (window.Bustan = window.Bustan || {});
  var UI = B.UI, h = UI.h, art = B.art, kit = B.kit;
  function pic(k) { return B.pics.draw(k); }

  /* مصنع لعبة جلسات صغيرة (نفس عقد minis.js) */
  function mini(id, cls, sleeper, roundFn) {
    var st = null, runner = kit.roundRunner();
    B.games[id] = {
      id: id,
      mount: function (ctx) {
        st = { ctx: ctx, answer: null, last: '' };

        st.top = h('div', { class: 'mg-top' });

        ctx.stage.appendChild(st.tray);
      },
      demo: function (ctx) { return runner.run(function (alive, setCur) { return roundFn(ctx, st, 1, true, alive, setCur); }); },
      playRound: function (ctx, level) { return runner.run(function (alive, setCur) { return roundFn(ctx, st, level, false, alive, setCur); }); },
      cancelRound: function () { runner.cancel(); if (st) { st.top.innerHTML = ''; st.tray.innerHTML = ''; st.answer = null; st.ctx.stage.querySelectorAll('.kit-hand').forEach(function (x) { x.remove(); }); } },
      outro: function (ctx) { return kit.dusk(ctx); },
      endArt: function () { return kit.endScene(sleeper); },
      destroy: function () { runner.stop(); st = null; },
      _solveStep: function () { if (st && st.solve && st.solve()) return true; if (st && st.answer) { st.answer.click(); return true; } return false; }
    };
    return B.games[id];
  }
  function addBtns(st, htmls, cls) {
    st.tray.innerHTML = '';
    return htmls.map(function (html, i) {
      var b = h('button', { class: 'g-choice ' + (cls || 'pic'), type: 'button', html: html });
      st.tray.appendChild(b);
      UI.anim(b, [{ opacity: 0, transform: 'translateY(30px) scale(.8)' }, { opacity: 1, transform: 'none' }], { dur: 400, delay: i * 90, easing: UI.SPRING, fill: 'backwards' });

    });
  }
  async function ask(ctx, st, btns, correct, demo, alive, setCur, opts) {

    var o = { demo: demo }; for (var k in (opts || {})) o[k] = opts[k];
    var ch = kit.choice(ctx, ctx.stage, btns, correct, o);

  async function cheer(ctx, el) {

  /* ═════════ أطعم الحيوان ═════════ */
  var FEED = [['rabbit', 'carrot'], ['cat', 'fish'], ['lamb', 'leaf'], ['bear', 'apple'], ['bee', 'flower'], ['bird', 'grapes'], ['frog', 'bee']];

  mini('feed', 'fd-stage', 'rabbit', async function (ctx, st, level, demo, alive, setCur) {

    var foods = [pair[1]];
    var pool = level >= 3 ? FEED.map(function (p) { return p[1]; }).concat(NOTFOOD) : NOTFOOD.concat(['banana', 'lemon']);
    kit.shuffle(pool).forEach(function (f) { if (foods.length < n && foods.indexOf(f) < 0 && f !== pair[1]) foods.push(f); });

    if (B.audio) B.audio.play('card');
    await ctx.sleep(600); if (!alive()) return;
    var btns = addBtns(st, foods.map(pic));
    var res = await ask(ctx, st, btns, foods.indexOf(pair[1]), demo, alive, setCur);
    if (!res) return;
    // الطعام يطير إلى الحيوان، وهو يأكله بسعادة
    var from = kit.center(btns[foods.indexOf(pair[1])], ctx.stage), to = kit.center(an, ctx.stage);

    await cheer(ctx, an); if (!alive()) return;
    return { errors: demo ? 0 : res.errors };
  });

  /* ═════════ أين يختبئ الحيوان؟ ═════════ */
  var SPOTS = {
    bush: '<circle cx="30" cy="62" r="24" fill="#2DBE7E"/><circle cx="56" cy="52" r="28" fill="#3DD08A"/><circle cx="76" cy="66" r="22" fill="#2DBE7E"/><rect x="8" y="76" width="86" height="14" rx="7" fill="#1C8F5C"/>',

  };
  var HIDERS = ['rabbit', 'cat', 'duck', 'bear', 'lamb', 'frog'];
  function spotSvg(kind) { return art.svg('0 0 100 100', SPOTS[kind], 'hd-spot'); }
  mini('hide', 'hd-stage', 'cat', async function (ctx, st, level, demo, alive, setCur) {
    var n = level <= 1 ? 3 : level <= 3 ? 4 : level === 4 ? 5 : 6;
    var peek = level <= 2 ? 0.5 : level <= 4 ? 0.3 : 0.18;
    var who; do { who = kit.pick(HIDERS); } while (who === st.last); st.last = who;
    var kinds = []; for (var i = 0; i < n; i++) kinds.push(['bush', 'rock', 'tree', 'log'][i % 4]);

    st.top.appendChild(card);
    UI.anim(card, [{ opacity: 0, transform: 'scale(.5)' }, { opacity: 1, transform: 'none' }], { dur: 450, easing: UI.SPRING, fill: 'backwards' });

    await ctx.sleep(600); if (!alive()) return;
    st.tray.classList.add('hd-grid');
    var btns = addBtns(st, kinds.map(function (k, i) {
      return '<span class="hd-wrap">' + (i === target ? '<span class="hd-animal" style="top:' + (-peek * 70 + 8) + '%">' + pic(who) + '</span>' : '') + spotSvg(k) + '</span>';

      onWrong: function (b) { UI.anim(b, [{ transform: 'translateY(0)' }, { transform: 'translateY(-14px)' }, { transform: 'translateY(0)' }], { dur: 400, fill: 'none' }); }
    });

    UI.anim(btns[target].querySelector('.hd-animal'), [{ transform: 'translateY(0) scale(1)' }, { transform: 'translateY(-55%) scale(1.35)' }, { transform: 'translateY(-30%) scale(1.2)' }], { dur: 600, easing: UI.SPRING });

  /* ═════════ من اختفى؟ ═════════ */
  var THINGS = ['apple', 'car', 'cat', 'ball', 'flower', 'duck', 'house', 'banana', 'rocket', 'star', 'bear', 'fish', 'tree', 'balloon', 'strawberry'];
  mini('vanish', 'vn-stage', 'owl', async function (ctx, st, level, demo, alive, setCur) {
    var n = level <= 1 ? 3 : level <= 3 ? 4 : level === 4 ? 5 : 6;
    var set = kit.shuffle(THINGS).slice(0, n), missing = kit.rand(n);
    var others = THINGS.filter(function (t) { return set.indexOf(t) < 0; });
    var opts = kit.shuffle([set[missing]].concat(kit.shuffle(others).slice(0, 2)));
    st.top.innerHTML = ''; st.tray.innerHTML = '';
    var row = h('div', { class: 'vn-row' });

    });

    items[missing].classList.remove('gone');

    await cheer(ctx, items[missing]); if (!alive()) return;

  });

  /* ═════════ رتّب الأحجام ═════════ */
  mini('order', 'od2-stage', 'bear', async function (ctx, st, level, demo, alive, setCur) {
    var n = level <= 1 ? 3 : level <= 3 ? 4 : 5;
    var kind = kit.pick(['ball', 'fish', 'flower', 'apple', 'balloon', 'duck', 'tree']);
    var sizes = []; for (var i = 0; i < n; i++) sizes.push(i);          // ٠ الأصغر

    var pool = h('div', { class: 'or-pool' });

    st.top.appendChild(podium);

    });

      if (busy || ctx.paused || b.__sz === undefined) return;

      var slot = podium.children[next], r1 = b.getBoundingClientRect();
      slot.appendChild(b); b.classList.add('placed');
      var r2 = b.getBoundingClientRect();
      UI.anim(b, [{ transform: 'translate(' + (r1.left - r2.left) + 'px,' + (r1.top - r2.top) + 'px) scale(1.1)' }, { transform: 'none' }], { dur: 500, easing: UI.SPRING, fill: 'none' });
      b.disabled = true; b.__sz = undefined;
      if (B.audio) B.audio.play('place');
      next++;
      if (next >= n) done(true);
    }
    async function auto() {
      busy = true;
      var t = btns.filter(function (x) { return x.__sz === next; })[0];
      var c = kit.center(t, ctx.stage), hd = kit.hand(ctx.stage, c.x, c.y + c.h * 0.1);
      await ctx.sleep(600); if (!alive()) return;
      await hd.tap(); hd.el.remove(); busy = false; fails = 0; take(t);
    }
    btns.forEach(function (b) { UI.bindPress(b, function () { take(b); }); });
    st.solve = function () { var t = btns.filter(function (x) { return x.__sz === next; })[0]; if (!t || busy) return false; take(t); return true; };
    st.answer = null;
    await ctx.sleep(500); if (!alive()) return;
    if (demo) { (async function () { while (alive() && next < n) { await ctx.sleep(500); if (busy) continue; var t = btns.filter(function (x) { return x.__sz === next; })[0]; if (!t) return; var c = kit.center(t, ctx.stage), hd = kit.hand(ctx.stage, c.x, c.y + c.h * 0.1); await ctx.sleep(450); await hd.tap(); hd.el.remove(); take(t); } })(); }
    await fin; st.solve = null;
    if (!alive()) return;
    await cheer(ctx, podium); if (!alive()) return;
    return { errors: demo ? 0 : Math.min(errors, 6) };
  });

  /* ═════════ من يعيش هنا؟ ═════════ */
  var HAB = {

    forest: '<rect width="100" height="100" rx="14" fill="#BFEAD0"/><rect x="18" y="52" width="9" height="40" fill="#8A5A33"/><circle cx="22" cy="40" r="22" fill="#2DBE7E"/><rect x="66" y="46" width="9" height="46" fill="#8A5A33"/><circle cx="70" cy="34" r="26" fill="#1C8F5C"/><rect x="0" y="86" width="100" height="14" fill="#5ED38A"/>',
    farm: '<rect width="100" height="100" rx="14" fill="#FFF0B8"/><rect x="22" y="42" width="56" height="42" fill="#F0485A"/><polygon points="14,44 50,16 86,44" fill="#C22E40"/><rect x="42" y="58" width="16" height="26" fill="#FAFCFF"/><path d="M0 86H100" stroke="#5ED38A" stroke-width="14"/><path d="M6 78v14M18 78v14M30 78v14" stroke="#fff" stroke-width="4"/>',
    sky: '<rect width="100" height="100" rx="14" fill="#9FDDFF"/><circle cx="78" cy="24" r="12" fill="#FFD34E"/><path d="M14 66a12 12 0 0 1 22-4a10 10 0 0 1 20 4v6H14Z" fill="#fff"/><path d="M52 40a9 9 0 0 1 16-3a8 8 0 0 1 14 5v5H52Z" fill="#fff" opacity=".9"/>',
    desert: '<rect width="100" height="100" rx="14" fill="#FFE9B8"/><circle cx="76" cy="22" r="13" fill="#FFB52E"/><path d="M0 74Q30 50 60 74T100 66V100H0Z" fill="#F2C66F"/><path d="M0 88Q40 70 100 88V100H0Z" fill="#E8B050"/><rect x="22" y="48" width="8" height="26" rx="4" fill="#2DBE7E"/><rect x="14" y="56" width="6" height="12" rx="3" fill="#2DBE7E"/><rect x="32" y="52" width="6" height="12" rx="3" fill="#2DBE7E"/>'
  };
  var LIVES = { sea: ['fish', 'whale', 'turtle'], forest: ['bear', 'fox', 'owl'], farm: ['lamb', 'hen', 'cat'], sky: ['bird', 'butterfly', 'bee'], desert: ['camel'] };
  mini('habitat', 'hb-stage', 'frog', async function (ctx, st, level, demo, alive, setCur) {
    var n = level <= 2 ? 2 : 3, keys = Object.keys(LIVES);
    var home = kit.pick(keys), who, cand = LIVES[home].filter(function (x) { return x !== st.last; });
    who = kit.pick(cand.length ? cand : LIVES[home]); st.last = who; // (الصحراء فيها حيوان واحد: لا نكرّر الحلقة بلا نهاية)
    var opts = [home]; kit.shuffle(keys).forEach(function (k) { if (opts.length < n && opts.indexOf(k) < 0) opts.push(k); });

    var res = await ask(ctx, st, btns, opts.indexOf(home), demo, alive, setCur);

    await cheer(ctx, btns[opts.indexOf(home)]); if (!alive()) return;
    return { errors: demo ? 0 : res.errors };
  });

})();

<script>
/* ثلاث ألعاب جديدة:
   • «ماذا ينقص الصورة؟»: جزء وكل — صورة ينقصها جزء، وتختار الجزء الناقص فيلتصق وتحيا الصورة.
   • «اسقِ الزهرة»: سبب ونتيجة — بذرة ثم ماء (وشمس) ثم نبتة فزهرة تُزرع في «بستاني».
   • «ساعد الأرنب»: متاهة حديقة — تخطيط الطريق وجمع التفاحات قبل الوصول إلى الجزرة. */
(function () {
  'use strict';
  var B = (window.Bustan = window.Bustan || {});
  var UI = B.UI, h = UI.h, art = B.art, kit = B.kit;
  function pic(k) { return B.pics.draw(k); }
  function sv(inner, cls) { return art.svg('0 0 100 100', inner, cls || 'pic'); }

  function genMaze(n, braid) {

    }); });

      }
      items.forEach(function (k, i) {
        function rnd(n) { var s = Math.sin((i + 1) * 12.9898 + n * 78.233) * 43758.5453; return s - Math.floor(s); }
        var depth = rnd(1), x = 4 + rnd(2) * 84, y = 8 + depth * 78;
        var sz = 10 + depth * 9;
        var el = h('div', { class: 'gd-item', role: 'button', style: { left: x + '%', top: y + '%', width: sz + 'vmin', zIndex: Math.round(y) }, html: B.pics.draw(k) });
        field.appendChild(el);
        UI.anim(el, [{ transform: 'scale(0)' }, { transform: 'scale(1)' }], { dur: 420, delay: Math.min(1500, i * 25), easing: UI.SPRING, fill: 'backwards' });
        el.addEventListener('pointerdown', function () {
          if (B.audio) B.audio.play('pop');
          UI.anim(el, [{ transform: 'rotate(0) scale(1)' }, { transform: 'rotate(-10deg) scale(1.2)' }, { transform: 'rotate(10deg) scale(1.2)' }, { transform: 'rotate(0) scale(1)' }], { dur: 500, fill: 'none' });
        });
      });
    },
    destroy: function () {}
  };

  /* ═════════ إبداعاتي (المعرض) ═════════ */
  B.free.gallery = {
    open: function (ctx) {
      var stage = ctx.stage, list = B.gallery.list();
      stage.classList.add('g-stage', 'gl-stage');
      var grid = h('div', { class: 'gl-grid scrollable' });
      var big = h('div', { class: 'gl-big', style: { display: 'none' } });
      if (!list.length) {
        grid.classList.add('empty');
        grid.appendChild(h('div', { class: 'gl-empty' }, h('div', { class: 'gl-empty-ic', html: art.toolSave() }), h('div', { text: B.S.create.galleryEmpty })));
      }
      function render() { stage.innerHTML = ''; B.free.gallery.open(ctx); }
      list.slice().reverse().forEach(function (src, i) {
        var idx = list.length - 1 - i;
        var card = h('div', { class: 'gl-card', role: 'button', tabindex: '0' }, h('img', { src: src, alt: '' }));
        UI.anim(card, [{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'none' }], { dur: 400, delay: Math.min(1200, i * 50), easing: UI.SPRING, fill: 'backwards' });
        card.addEventListener('click', function () {
          big.innerHTML = '';
          var del = h('button', { class: 'gl-del', type: 'button', 'aria-label': B.S.create.del, html: art.trash() }, h('small', { text: B.S.create.del }));
          var ask = h('div', { class: 'gl-ask', style: { display: 'none' } }, h('b', { text: B.S.create.delAsk }),
            h('div', { class: 'gl-ask-row' }, h('button', { class: 'gl-yes', type: 'button', text: B.S.create.delYes }), h('button', { class: 'gl-no', type: 'button', text: B.S.create.delNo })));
          del.addEventListener('click', function (e) { e.stopPropagation(); del.style.display = 'none'; ask.style.display = ''; });
          ask.querySelector('.gl-no').addEventListener('click', function (e) { e.stopPropagation(); ask.style.display = 'none'; del.style.display = ''; });
          ask.querySelector('.gl-yes').addEventListener('click', function (e) { e.stopPropagation(); B.gallery.remove(idx); if (B.audio) B.audio.play('sweep'); render(); });
          big.appendChild(h('img', { src: src, alt: '' })); big.appendChild(del); big.appendChild(ask);
          big.style.display = ''; UI.anim(big, [{ opacity: 0, transform: 'scale(.8)' }, { opacity: 1, transform: 'none' }], { dur: 350, easing: UI.SPRING, fill: 'none' });
          if (B.audio) B.audio.play('pick');
        });
        grid.appendChild(card);
      });
      big.addEventListener('click', function () { big.style.display = 'none'; });
      stage.appendChild(grid); stage.appendChild(big);
    },
    destroy: function () {}
  };
})();

</script>
<script>
/* نقطة الإقلاع: التخزين، حمايات اللمس، الخدمة، ثم الشاشة الرئيسية. */
(function () {
  'use strict';
  var B = window.Bustan;

  B.storage.init();
  B.UI.installGuards();
  document.title = B.S.appName;
  document.documentElement.lang = 'ar';
  document.documentElement.dir = 'rtl';

  // Service Worker: فقط عبر http/https (لا يعمل من file://) — ويستمر التطبيق بدونه
  if ('serviceWorker' in navigator && /^https?:$/.test(window.location.protocol)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }

  B.stats.open();
  if (B.storage.data().settings.night) B.applyNight(true);

  // نبدأ بعد تحميل الخط كي لا يتبدل شكل النص أمام الطفلة
  function boot() { B.home.show(); }
  if (document.fonts && document.fonts.ready) {
    var done = false;
    var go = function () { if (!done) { done = true; boot(); } };
    document.fonts.ready.then(go);
    setTimeout(go, 1200); // لا ننتظر الخط أكثر من ذلك
  } else {
    boot();
  }
})();

</script>
