:root {
  /* الألوان الستة المسماة */
  --night: #1F2A5A;   /* ليلي */
  --dawn: #CFEBFF;    /* فجر */
  --meadow: #19B394;  /* مرج */
  --rose: #F2658E;    /* ورد */
  --sun: #FFD34E;     /* شمس */
  --cloud: #FAFCFF;   /* غيم */
  /* ظلال مشتقة (الظل دائماً بلون أغمق من العنصر نفسه، لا رمادي) */
  --night-soft: #3A4789;
  --meadow-deep: #0B8269;
  --rose-deep: #C23C69;
  --sun-deep: #E2A21B;
  --violet: #8E5CF0;
  --sky: #8FD3F4;
  --lilac-deep: #9FB3E0;

  --font: 'Tajawal', 'Segoe UI', Tahoma, 'Noto Naskh Arabic', 'Geeza Pro', sans-serif;
  --tap: 72px; /* أصغر مساحة لمس: ٧٢ على الجوال */
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
}
@media (min-width: 700px) and (min-height: 700px) {
  :root { --tap: 96px; } /* ٩٦ على الآيباد */
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: var(--dawn);
  color: var(--night);
  font-family: var(--font);
  font-weight: 700;
  overscroll-behavior: none;
  touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
}

#app { position: fixed; inset: 0; overflow: hidden; }
.screen { position: absolute; inset: 0; overflow: hidden; }

button { font: inherit; color: inherit; border: 0; background: none; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; }
button:focus { outline: none; }
button:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
svg { display: block; }
h1, h2, h3 { margin: 0; }

textarea, input { -webkit-user-select: text; user-select: text; }

/* تنفّس الشخصيات وهي ساكنة */
.breathe { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 3.4s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.03); } }

.scrollable { touch-action: pan-y; }

@media (prefers-reduced-motion: reduce) {
  .breathe, .home-cloud, .home-sun, .bracket::after, .balloon, .home-balloon, .bird, .home-bird, .wing-l, .wing-r, .sails, .end-star, .firefly, .end-moon, .sleepy-z, .end-z { animation: none !important; }
}

</style>
<style>
/* مكوّنات الواجهة المشتركة: الأزرار، المصابيح، الشاشة الرئيسية، ركن الوالدين، الشاشة الختامية */

/* ───────── أزرار الزوايا الثابتة (الرئيسية / إعادة العرض) ───────── */
.hud {
  position: absolute; left: 0; right: 0; top: 0; z-index: 30;
  display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between;
  padding: calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) 0 calc(12px + var(--safe-l));
  pointer-events: none; transition: opacity .6s;
}
.hud > * { pointer-events: auto; }
.hud.is-hidden { opacity: 0; pointer-events: none; }
.hud.is-hidden > * { pointer-events: none; }

.hud-btn {
  width: var(--tap); height: var(--tap); border-radius: 50%;
  display: grid; place-items: center; color: var(--night); flex: none;
  background: radial-gradient(circle at 35% 26%, #fff 0%, #F1F6FF 55%, #D9E5FB 100%);
  box-shadow: 0 6px 0 var(--lilac-deep), 0 12px 18px rgba(31, 42, 90, .2);
  transition: transform .1s, box-shadow .1s;
  position: relative;
}
.hud-btn svg { width: 54%; height: 54%; }
.hud-btn.pressed, .hud-btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--lilac-deep), 0 3px 8px rgba(31, 42, 90, .2); }
.hud-btn:disabled { opacity: .35; pointer-events: none; }
.is-demo .replay-btn { opacity: .35; pointer-events: none; }

/* ───────── مصابيح الجلسة ───────── */
.bulbs {
  --b: min(30px, calc((100vw - 2 * var(--tap) - 48px) / (var(--n, 10) * 1.3)));
  position: relative; flex: 1 1 0; min-width: 0;
  display: flex; justify-content: center; align-items: flex-start; gap: calc(var(--b) * .3);
  padding-top: 6px;
}
.bulbs .wire {
  position: absolute; left: 12%; right: 12%; top: 9px; height: 3px; border-radius: 3px;
  background: var(--night-soft); opacity: .55;
}
.bulb { position: relative; width: var(--b); height: calc(var(--b) * 1.38); transform-origin: 50% 0; }
.bulb svg { width: 100%; height: 100%; overflow: visible; }
.bulb .glass { fill: #B9C6EE; stroke: #8FA0D8; stroke-width: 1; transition: fill .4s; }
.bulb .shine { fill: #fff; opacity: .55; }
.bulb .glow { fill: var(--sun); opacity: 0; transition: opacity .5s; }
.bulb.lit .glass { fill: var(--sun); stroke: var(--sun-deep); }
.bulb.lit .glow { opacity: .55; }
@media (max-width: 560px) {
  /* على الجوال العمودي: المصابيح في صف مستقل تحت الأزرار */
  .bulbs { order: 3; flex-basis: 100%; margin-top: 4px; --b: min(30px, calc((100vw - 40px) / (var(--n, 10) * 1.3))); }
  .bulbs .wire { top: 9px; }
}

/* ───────── ستارة الانتقال والجسيمات ───────── */
.curtain { position: fixed; inset: 0; z-index: 200; overflow: hidden; }
.curtain-disc { position: absolute; border-radius: 50%; will-change: transform; }
.confetti { position: absolute; pointer-events: none; will-change: transform, opacity; z-index: 25; }

/* ───────── الشاشة الختامية الهادئة ───────── */
.end-screen {
  position: absolute; inset: 0; z-index: 40; overflow: hidden;
  background: linear-gradient(180deg, #232C6B 0%, #4A3FA6 58%, #B35FA8 100%);
  display: flex; align-items: center; justify-content: center;
}
.end-art { width: 100%; display: grid; place-items: center; padding-bottom: calc(var(--tap) * 1.6); }
.end-home {
  position: absolute; bottom: calc(26px + var(--safe-b)); left: 0; right: 0; margin: 0 auto;
  width: calc(var(--tap) * 1.3); height: calc(var(--tap) * 1.3);
  background: radial-gradient(circle at 35% 26%, #FFF4B8 0%, var(--sun) 60%, #F5BC2A 100%);
  box-shadow: 0 8px 0 var(--sun-deep), 0 16px 24px rgba(0, 0, 0, .3);
}
.end-home.pressed, .end-home:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--sun-deep), 0 4px 10px rgba(0, 0, 0, .3); }

/* ───────── الشاشة الرئيسية ───────── */
.home { background: linear-gradient(180deg, #8FD3F4 0%, #CFEBFF 50%, #EAF7FF 100%); }
.home-sky { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.home-sun { position: absolute; left: 3%; top: 2%; width: clamp(90px, 16vmin, 150px); animation: sunBreath 7s ease-in-out infinite; }
@keyframes sunBreath { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.home-cloud { position: absolute; left: 0; width: clamp(110px, 20vmin, 190px); animation: drift 70s linear infinite; }
.home-cloud.c1 { top: 12%; animation-duration: 90s; animation-delay: -30s; }
.home-cloud.c2 { top: 26%; width: clamp(80px, 14vmin, 140px); animation-duration: 120s; animation-delay: -80s; opacity: .85; }
.home-cloud.c3 { top: 6%; width: clamp(70px, 12vmin, 120px); animation-duration: 150s; animation-delay: -10s; opacity: .8; }
@keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }
.home-rainbow { position: absolute; left: 50%; bottom: 28%; width: min(90vw, 560px); margin-left: min(-45vw, -280px); opacity: .55; }
.home-rainbow svg { width: 100%; height: auto; }
.home-balloon { position: absolute; width: clamp(40px, 7vmin, 64px); animation: balloonFloat 8s ease-in-out infinite; }
.home-balloon.hb1 { left: 68%; top: 13%; }
.home-balloon.hb2 { left: 8%; top: 24%; width: clamp(30px, 5.5vmin, 50px); animation-duration: 11s; animation-delay: -5s; }
.home-balloon svg { width: 100%; height: auto; }

<script>
/* التخزين: localStorage داخل try/catch، مع إصدار للمخطط ودوال ترحيل.
   إن لم يتوفر التخزين يعمل التطبيق من الذاكرة. */
(function () {
  'use strict';
  var B = (window.Bustan = window.Bustan || {});

  var KEY = 'bustan.progress';
  var SCHEMA = 1;
  var GAME_IDS = ['train', 'mirror', 'pattern', 'firstsound', 'bridge'];
  var MAX_DAYS = 60;

  var data = null;
  var persistent = false; // هل التخزين الفعلي متاح؟

  function newGame() {
    return { level: 1, smooth: 0, rough: 0, sessions: 0, rounds: 0, last: '' };
  }

  function defaults() {
    var games = {};
    GAME_IDS.forEach(function (id) { games[id] = newGame(); });
    return {
      schemaVersion: SCHEMA,
      created: Date.now(),
      settings: { soundOn: true, soloLimit: 2, weeklyConnector: 0 },
      games: games,
      days: {},          // 'YYYY-MM-DD' -> { sessions:{id:n}, rounds:{id:n} }
      lock: { soloOpenDate: '' }, // تاريخ اليوم الذي فتح فيه الوالد «وحدي» رغم الحد
      demoSeen: {}       // id -> true
    };
  }

  /* جدول الترحيل: المفتاح هو الإصدار القديم، والدالة تُرقّي بمقدار واحد.
     عند رفع SCHEMA أضف دالة هنا ولا تغيّر القديمة. */
  var MIGRATIONS = {
    0: function (d) { d.schemaVersion = 1; return d; }
  };

  function isObj(x) { return x && typeof x === 'object' && !Array.isArray(x); }

  // دمج عميق للقيم الناقصة من الافتراضات
  function fill(target, def) {
    Object.keys(def).forEach(function (k) {
      if (isObj(def[k])) {
        if (!isObj(target[k])) target[k] = {};
        fill(target[k], def[k]);
      } else if (target[k] === undefined || typeof target[k] !== typeof def[k]) {
        target[k] = def[k];
      }
    });
    return target;
  }

  function migrate(d) {
    if (!isObj(d)) return defaults();
    var v = typeof d.schemaVersion === 'number' ? d.schemaVersion : 0;
    while (v < SCHEMA) {
      var fn = MIGRATIONS[v];
      if (!fn) break;
      d = fn(d);
      v = d.schemaVersion;
    }
    d.schemaVersion = SCHEMA;
    fill(d, defaults());
    // قيود سلامة
    GAME_IDS.forEach(function (id) {
      var g = d.games[id];
      g.level = Math.max(1, Math.min(5, g.level | 0));
    });
    d.settings.soloLimit = Math.max(1, Math.min(9, d.settings.soloLimit | 0));
    return d;
  }

  function probe() {
    try {
      var k = KEY + '.probe';
      window.localStorage.setItem(k, '1');
      window.localStorage.removeItem(k);
      return true;
    } catch (e) { return false; }
  }

  function load() {
    persistent = probe();
    var raw = null;
    if (persistent) {
      try { raw = window.localStorage.getItem(KEY); } catch (e) { raw = null; }
    }
    if (raw) {
      try { data = migrate(JSON.parse(raw)); } catch (e) { data = defaults(); }
    } else {
      data = defaults();
    }
  }

  function save() {
    if (!persistent) return false;
    try {
      window.localStorage.setItem(KEY, JSON.stringify(data));
      return true;
    } catch (e) {
      persistent = false;
      return false;
    }
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function dateKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayKey() { return dateKey(new Date()); }

  function day(key) {
    key = key || todayKey();
    if (!data.days[key]) data.days[key] = { sessions: {}, rounds: {} };
    return data.days[key];
  }

  function prune() {
    var keys = Object.keys(data.days).sort();
    while (keys.length > MAX_DAYS) delete data.days[keys.shift()];
  }

  function zoneOf(id) {
    var c = B.catalog || [];
    for (var i = 0; i < c.length; i++) if (c[i].id === id) return c[i].zone;
    return 'solo';
  }

  var S = {
    SCHEMA: SCHEMA,
    GAME_IDS: GAME_IDS,
    init: function () { load(); },
    data: function () { return data; },
    save: save,
    isPersistent: function () { return persistent; },
    todayKey: todayKey,
    dateKey: dateKey,
    migrate: migrate,
    defaults: defaults,

    game: function (id) { return data.games[id]; },

    recordRound: function (id) {
      var g = data.games[id];
      g.rounds++;
      g.last = todayKey();
      var d = day();
      d.rounds[id] = (d.rounds[id] || 0) + 1;
      prune();
      save();
    },

    recordSession: function (id) {
      data.games[id].sessions++;
      var d = day();
      d.sessions[id] = (d.sessions[id] || 0) + 1;
      save();
    },

    /* عدد جلسات منطقة «وحدي» المكتملة اليوم */
    soloSessionsToday: function () {
      var d = data.days[todayKey()];
      if (!d) return 0;
      var n = 0;
      Object.keys(d.sessions).forEach(function (id) {
        if (zoneOf(id) === 'solo') n += d.sessions[id];
      });
      return n;
    },

    /* هل قسم «وحدي» مقفل اليوم؟ */
    soloLocked: function () {
      if (data.lock.soloOpenDate === todayKey()) return false;
      return S.soloSessionsToday() >= data.settings.soloLimit;
    },

    openSoloToday: function () { data.lock.soloOpenDate = todayKey(); save(); },

    markDemoSeen: function (id) { data.demoSeen[id] = true; save(); },
    demoSeen: function (id) { return !!data.demoSeen[id]; },

    /* آخر ٧ أيام (الأقدم أولاً): [{key, date, sessions, rounds}] */
    lastDays: function (n) {
      n = n || 7;
      var out = [];
      var now = new Date();
      for (var i = n - 1; i >= 0; i--) {
        var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
        var k = dateKey(d);
        var rec = data.days[k];
        var s = 0, r = 0;
        if (rec) {
          Object.keys(rec.sessions).forEach(function (x) { s += rec.sessions[x]; });
          Object.keys(rec.rounds).forEach(function (x) { r += rec.rounds[x]; });
        }
        out.push({ key: k, date: d, sessions: s, rounds: r });
      }
      return out;
    },

    resetGame: function (id) {
      data.games[id] = newGame();
      delete data.demoSeen[id];
      save();
    },

    exportJSON: function () { return JSON.stringify(data); },

    /* استعادة: تُرجع true عند النجاح. لا تمسّ البيانات الحالية إن فشلت. */
    importJSON: function (text) {
      try {
        var parsed = JSON.parse(text);
        if (!isObj(parsed) || !isObj(parsed.games)) return false;
        if (typeof parsed.schemaVersion === 'number' && parsed.schemaVersion > SCHEMA) return false;
        data = migrate(parsed);
        save();
        return true;
      } catch (e) { return false; }
    }
  };

  B.storage = S;
})();

</script>
<script>
/* محرك التكيّف الصامت: ٥ مستويات لكل لعبة.
   يصعد بعد ٣ جولات سلسة متتالية (≤ خطأ واحد)،
   ويهبط بعد جولتين متتاليتين فيهما ٣ أخطاء فأكثر.
   جولة فيها خطآن لا تُعدّ سلسة ولا صعبة، فتقطع السلسلتين.
   لا يظهر للطفلة أي أثر لهذا. */
(function () {
  'use strict';
  var B = (window.Bustan = window.Bustan || {});

  var MAX = 5, UP_AFTER = 3, DOWN_AFTER = 2;

  /* دالة نقية: تأخذ الحالة {level, smooth, rough} وعدد أخطاء الجولة،
     وتُرجع حالة جديدة مع حقل change: 'up' | 'down' | null */
  function step(state, errors) {
    var level = state.level, smooth = state.smooth, rough = state.rough, change = null;
    if (errors <= 1) { smooth++; rough = 0; }
    else if (errors >= 3) { rough++; smooth = 0; }
    else { smooth = 0; rough = 0; }

    if (smooth >= UP_AFTER) {
      if (level < MAX) { level++; change = 'up'; }
      smooth = 0; rough = 0;
    } else if (rough >= DOWN_AFTER) {
      if (level > 1) { level--; change = 'down'; }
      smooth = 0; rough = 0;
    }
    return { level: level, smooth: smooth, rough: rough, change: change };
  }

  B.adaptive = {
    MAX: MAX,
    step: step,
    level: function (gameId) { return B.storage.game(gameId).level; },
    report: function (gameId, errors) {
      var g = B.storage.game(gameId);
      var r = step(g, errors);
      g.level = r.level; g.smooth = r.smooth; g.rough = r.rough;
      B.storage.save();
      return r;
    }
  };
})();

</script>
<script>
/* الصوت: مؤثرات ناعمة مولَّدة بـ WebAudio (لا ملفات صوت)، بلا موسيقى خلفية ولا نطق آلي.
   كل الأصوات قصيرة وهادئة، تمرّ عبر ضاغط يمنع أي ذروة عالية (الطفلة حساسة للأصوات العالية).
   لا يوجد أي صوت «خطأ» أو «خسارة». مفتاح عام في ركن الوالدين.
   يُفعَّل السياق بعد أول لمسة (قيد iOS). */
(function () {
  'use strict';
  var B = (window.Bustan = window.Bustan || {});

  var ctx = null, master = null, noiseBuf = null;

  function enabled() {
    return !!(B.storage && B.storage.data() && B.storage.data().settings.soundOn);
  }

  function ensure() {
    if (ctx) return ctx;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.55;
      var comp = ctx.createDynamicsCompressor(); // يحدّ الذروات
      comp.threshold.value = -24; comp.ratio.value = 8;
      master.connect(comp); comp.connect(ctx.destination);
      // ضجيج أبيض قصير يُستعمل لأصوات القطار
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.6, ctx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ctx = null; }
    return ctx;
  }

  // نغمة: تردد، بداية، مدة، شدة، نوع الموجة، تردد نهائي اختياري (انزلاق)
  function tone(c, f, at, dur, vol, type, f2) {
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, at);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, at + dur);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g); g.connect(master);
    o.start(at); o.stop(at + dur + 0.03);
  }

  // ضجيج مرشَّح: للتشو تشو والفرامل
  function noise(c, at, dur, vol, f1, f2, q) {
    var s = c.createBufferSource(), flt = c.createBiquadFilter(), g = c.createGain();
    s.buffer = noiseBuf;
    flt.type = 'bandpass'; flt.Q.value = q || 1.2;
    flt.frequency.setValueAtTime(f1, at);
    if (f2) flt.frequency.exponentialRampToValueAtTime(f2, at + dur);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    s.connect(flt); flt.connect(g); g.connect(master);
    s.start(at, Math.random() * 0.2); s.stop(at + dur + 0.03);
  }

  var N = { c5: 523.25, d5: 587.33, e5: 659.25, g5: 783.99, a5: 880, c6: 1046.5, e6: 1318.5 };
  var SCALE = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5, 1567.98, 1760]; // سلّم خماسي للمصابيح

  var SOUNDS = {
    // لمسة زر
    tap: function (c, t) { tone(c, 640, t, 0.05, 0.05); },
    // انتقال: همسة صاعدة
    whoosh: function (c, t) { noise(c, t, 0.45, 0.035, 500, 2400, 0.8); },
    // ظهور البطاقة
    card: function (c, t) { tone(c, 520, t, 0.1, 0.05, 'triangle'); tone(c, 780, t + 0.07, 0.14, 0.045, 'triangle'); },
    // صعود الراكب
    pop: function (c, t) { tone(c, 420, t, 0.09, 0.07, 'triangle', 760); },
    // استقرار الراكب في العربة: رنين صغير
    sparkle: function (c, t) {
      [N.g5, N.c6, N.e6].forEach(function (f, i) { tone(c, f, t + i * 0.06, 0.16, 0.035, 'sine'); });
    },
    // تشو تشو: نفخة بخار قصيرة ومنخفضة (تتكرر أثناء الحركة)
    chug: function (c, t, a) {
      noise(c, t, 0.12, 0.03 * (a == null ? 1 : a), 700, 300, 0.9);
      tone(c, 90, t, 0.08, 0.025 * (a == null ? 1 : a), 'sine', 60);
    },
    // الكبح: هسهسة هابطة لطيفة
    brake: function (c, t) { noise(c, t, 0.9, 0.04, 2600, 500, 0.7); },
    // صافرة قصيرة فرِحة
    toot: function (c, t) {
      tone(c, 523, t, 0.22, 0.045, 'triangle'); tone(c, 659, t, 0.22, 0.04, 'triangle');
      tone(c, 523, t + 0.28, 0.3, 0.045, 'triangle'); tone(c, 659, t + 0.28, 0.3, 0.04, 'triangle');
    },
    // تساؤل لطيف (النقر على غير الهدف): نغمة واحدة مرتفعة الطرف، ليست صوت خطأ
    hmm: function (c, t) { tone(c, 440, t, 0.14, 0.04, 'sine', 560); },
    // مصباح يُضاء: النغمة ترتفع مع كل مصباح
    chime: function (c, t, i) {
      var f = SCALE[(i || 0) % SCALE.length];
      tone(c, f, t, 0.3, 0.05, 'sine'); tone(c, f * 2, t, 0.18, 0.015, 'sine');
    },
    // فوز الجولة: ارتفاع فرِح قصير
    cheer: function (c, t) {
      [N.c5, N.e5, N.g5, N.c6].forEach(function (f, i) { tone(c, f, t + i * 0.1, 0.28, 0.05, 'triangle'); });
      tone(c, N.c6, t + 0.42, 0.5, 0.04, 'sine'); tone(c, N.e6, t + 0.42, 0.5, 0.03, 'sine');
    },
    // ختام الجلسة: تهويدة قصيرة هابطة
    lullaby: function (c, t) {
      [N.g5, N.e5, N.d5, N.c5].forEach(function (f, i) { tone(c, f, t + i * 0.42, 0.7, 0.04, 'sine'); });
    }
  };

  B.audio = {
    unlock: function () {
      var c = ensure();
      if (c && c.state === 'suspended') { try { c.resume(); } catch (e) {} }
    },
    play: function (name, arg) {
      if (!enabled()) return;
      var c = ensure();
      if (!c || c.state !== 'running') return;
      var fn = SOUNDS[name];
      if (fn) { try { fn(c, c.currentTime + 0.005, arg); } catch (e) {} }
    }
  };
})();

</script>

        '<path d="M' + (x - step * 0.2) + ' ' + (pk + h * 0.26) + 'L' + x + ' ' + pk + 'L' + (x + step * 0.2) + ' ' + (pk + h * 0.26) + 'q-' + (step * 0.07) + ' ' + (h * 0.06) + ' -' + (step * 0.13) + ' 0q-' + (step * 0.07) + ' ' + (h * 0.06) + ' -' + (step * 0.14) + ' 0z" fill="#FAFCFF"/>';

  B.art.balloon = balloon; B.art.bird = bird; B.art.rainbow = rainbow; B.art.windmill = windmill;
