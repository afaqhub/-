<script>
/* أدوات الواجهة المشتركة: بناء DOM، حركات، أزرار، انتقالات، جسيمات، مصابيح الجلسة. */
(function () {
  'use strict';
  var B = (window.Bustan = window.Bustan || {});

  /* معامل تسريع الزمن للاختبار الآلي فقط: ?ts=5 */
  var ts = 1;
  try {
    var m = /[?&]ts=([0-9.]+)/.exec(window.location.search);
    if (m) ts = Math.max(1, Math.min(20, parseFloat(m[1]) || 1));
  } catch (e) {}

  var reducedMq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  function reduced() { return !!(reducedMq && reducedMq.matches); }

  var EASE = 'cubic-bezier(.22,.8,.3,1)';
  var SPRING = 'cubic-bezier(.34,1.56,.64,1)'; // تجاوز بسيط يشبه الزنبرك

  /* ───── بناء العناصر ───── */
  function h(tag, props) {
    var el = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v == null || v === false) return;
      if (k === 'class') el.className = v;
      else if (k === 'style') { if (typeof v === 'string') el.style.cssText = v; else Object.assign(el.style, v); }
      else if (k === 'text') el.textContent = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k.indexOf('on') === 0) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    });
    for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
    return el;
  }
  function append(el, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) c.forEach(function (x) { append(el, x); });
    else if (typeof c === 'string') el.appendChild(document.createTextNode(c));
    else el.appendChild(c);
  }
  function fromSvg(str) {
    var t = document.createElement('template');
    t.innerHTML = str.trim();
    return t.content.firstChild;
  }
  var DIGITS = '٠١٢٣٤٥٦٧٨٩';
  function num(n) { return String(n).replace(/\d/g, function (d) { return DIGITS[+d]; }); }

  /* ───── الزمن والحركة ───── */
  function sleep(ms) {
    return new Promise(function (res) { window.setTimeout(res, ms / ts); });
  }
  /* حركة WAAPI. deco=true: زخرفية وتُلغى عند تفضيل تقليل الحركة. */
  function anim(el, kf, o) {
    o = o || {};
    if (o.deco && reduced()) return Promise.resolve();
    var a;
    try {
      a = el.animate(kf, {
        duration: Math.max(1, (o.dur || 400) / ts),
        delay: (o.delay || 0) / ts,
        easing: o.easing || EASE,
        fill: o.fill || 'both',
        iterations: o.iter || 1
      });
    } catch (e) { return Promise.resolve(); }
    var p = a.finished.then(function () { return a; }, function () { return a; });
    p.anim = a;
    return p;
  }

  /* ───── الأزرار ─────
     down=true: يعمل عند لمس الإصبع للشاشة (أسرع استجابة للعبة).
     غير ذلك: عند الرفع (click) كي لا تُفعَّل بنقرة عابرة أثناء السحب. */
  function bindPress(el, fn, o) {
    o = o || {};
    function on() { el.classList.add('pressed'); }
    function off() { el.classList.remove('pressed'); }
    el.addEventListener('pointerdown', function (e) {
      on();
      if (B.audio) B.audio.play('tap');
      if (o.down) { e.preventDefault(); fn(e); }
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) { el.addEventListener(ev, off); });
    if (!o.down) el.addEventListener('click', function (e) { fn(e); });
    else el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') fn(e); });
    return el;
  }

  function vp() {
    var W = window.innerWidth, H = window.innerHeight;
    var tablet = Math.min(W, H) >= 700;
    return { W: W, H: H, tablet: tablet, tap: tablet ? 96 : 72 };
  }

  /* ───── الشاشات ───── */
  var current = null;
  function root() { return document.getElementById('app'); }
  function go(el, o) {
    o = o || {};
    var old = current;
    root().appendChild(el);
    current = el;
    if (o.instant) { if (old && old !== el) old.remove(); return Promise.resolve(); }
    el.style.opacity = '0';
    return anim(el, [{ opacity: 0 }, { opacity: 1 }], { dur: 320, fill: 'none' }).then(function () {
      el.style.opacity = '';
      if (old && old !== el && old.parentNode) old.remove();
    });
  }

  /* ستارة دائرية تتسع من نقطة اللمس: تمهيد بصري قبل أي انتقال */
  function curtain(color, x, y) {
    var v = vp();
    x = x == null ? v.W / 2 : x; y = y == null ? v.H / 2 : y;
    var r = Math.sqrt(v.W * v.W + v.H * v.H) + 40;
    var disc = h('div', { class: 'curtain-disc', style: { background: color, width: r * 2 + 'px', height: r * 2 + 'px', left: x - r + 'px', top: y - r + 'px' } });
    var wrap = h('div', { class: 'curtain' }, disc);
    root().appendChild(wrap);
    var cover = anim(disc, [{ transform: 'scale(0.02)' }, { transform: 'scale(1)' }], { dur: 460, easing: 'cubic-bezier(.5,0,.3,1)' });
    return {
      cover: cover,
      reveal: function () {
        return anim(wrap, [{ opacity: 1 }, { opacity: 0 }], { dur: 380, fill: 'both' }).then(function () { wrap.remove(); });
      }
    };
  }

  /* ───── جسيمات الاحتفال (بتلات ودوائر وقلوب، بلا نجوم) ───── */
  var CONFETTI = ['#FFD34E', '#F2658E', '#3D8BFD', '#19B394', '#8E5CF0', '#FF8A3D'];
  function burst(parent, x, y, o) {
    if (reduced()) return;
    o = o || {};
    var n = o.n || 16, spread = o.spread || 110, dur = o.dur || 1100, cols = o.colors || CONFETTI;
    for (var i = 0; i < n; i++) {
      var s = 7 + Math.random() * 8;
      var shape = i % 3;
      var p = h('span', {
        class: 'confetti',
        style: {
          left: x + 'px', top: y + 'px', width: s + 'px', height: (shape === 1 ? s * 1.6 : s) + 'px',
          background: cols[i % cols.length], borderRadius: shape === 1 ? '50% 50% 50% 50% / 70% 70% 30% 30%' : '50%'
        }
      });
      parent.appendChild(p);
      var ang = (-Math.PI / 2) + (Math.random() - 0.5) * 2.4;
      var dist = spread * (0.5 + Math.random() * 0.7);
      var dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist;
      anim(p, [
        { transform: 'translate(0,0) scale(.3) rotate(0)', opacity: 1 },
        { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(1) rotate(' + (Math.random() * 240 - 120) + 'deg)', opacity: 1, offset: 0.55 },
        { transform: 'translate(' + dx * 1.15 + 'px,' + (dy + 70) + 'px) scale(.9) rotate(' + (Math.random() * 360 - 180) + 'deg)', opacity: 0 }
      ], { dur: dur, delay: i * 14, easing: 'cubic-bezier(.2,.7,.4,1)' }).then((function (el) {
        return function () { el.remove(); };
      })(p));
    }
  }

  /* ───── مصابيح الجلسة ───── */
  function bulbs(n) {
    var wrap = h('div', { class: 'bulbs', 'data-count': n });
    wrap.style.setProperty('--n', n);
    var list = [];
    wrap.appendChild(h('div', { class: 'wire' }));
    for (var i = 0; i < n; i++) {
      var b = h('div', { class: 'bulb', html: B.art.bulb() });
      list.push(b); wrap.appendChild(b);
    }
    return {
      el: wrap,
      light: function (i) {
        var b = list[i];
        if (!b) return Promise.resolve();
        b.classList.add('lit');
        if (B.audio) B.audio.play('chime', i);
        return anim(b, [{ transform: 'scale(1)' }, { transform: 'scale(1.55)' }, { transform: 'scale(1)' }], { dur: 560, easing: SPRING, fill: 'none' });
      },
      litCount: function () { return list.filter(function (x) { return x.classList.contains('lit'); }).length; }
    };
  }

  function iconButton(cls, svgStr, label, fn, o) {
    var b = h('button', { class: 'hud-btn ' + cls, type: 'button', 'aria-label': label, html: svgStr });
    bindPress(b, fn, o);
    return b;
  }

  /* حمايات اللمس: لا تكبير ولا تحديد ولا نقر مزدوج ولا تمرير */
  function installGuards() {
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (ev) {
      document.addEventListener(ev, function (e) { e.preventDefault(); });
    });
    document.addEventListener('touchstart', function (e) {
      if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });
    document.addEventListener('touchmove', function (e) {
      if (!e.target.closest || !e.target.closest('.scrollable, .parent-overlay')) e.preventDefault();
    }, { passive: false });
    document.addEventListener('dblclick', function (e) { e.preventDefault(); });
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    document.addEventListener('selectstart', function (e) {
      var t = e.target && e.target.closest ? e.target.closest('textarea,input') : null;
      if (!t) e.preventDefault();
    });
    ['pointerdown', 'touchend', 'click'].forEach(function (ev) {
      document.addEventListener(ev, function () { if (B.audio) B.audio.unlock(); }, true);
    });
  }

  B.UI = {
    ts: ts,
    EASE: EASE,
    SPRING: SPRING,
    reduced: reduced,
    h: h,
    fromSvg: fromSvg,
    num: num,
    sleep: sleep,
    anim: anim,
    bindPress: bindPress,
    vp: vp,
    go: go,
    root: root,
    current: function () { return current; },
    curtain: curtain,
    burst: burst,
    bulbs: bulbs,
    iconButton: iconButton,
    installGuards: installGuards
  };
})();

</script>
<script>
/* عُدّة مشتركة للألعاب: اليد الكرتونية، جولة الاختيار مع سلّم المساعدة، ردود الصواب والخطأ،
   والشاشة الختامية العامة. */
(function () {
  'use strict';
  var B = (window.Bustan = window.Bustan || {});
  var UI = B.UI, h = UI.h, art = B.art;

  function rand(n) { return Math.floor(Math.random() * n); }
  function pick(a) { return a[rand(a.length)]; }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = rand(i + 1), t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function center(el, rel) {
    var r = el.getBoundingClientRect(), s = rel.getBoundingClientRect();
    return { x: r.left + r.width / 2 - s.left, y: r.top + r.height / 2 - s.top, w: r.width, h: r.height };
  }

  /* يد تشير من الأسفل إلى نقطة (طرف الإصبع عند x,y) */
  function hand(layer, x, y) {
    var size = UI.vp().tablet ? 110 : 84, k = size / 96;
    var el = h('div', { class: 'kit-hand', style: { width: 88 * k + 'px', height: size + 'px', left: x - 44 * k + 'px', top: y - 2 * k + 'px' }, html: art.hand() });
    layer.appendChild(el);
    UI.anim(el, [{ opacity: 0, transform: 'translateY(60px)' }, { opacity: 1, transform: 'none' }], { dur: 450, easing: UI.SPRING, fill: 'none' });
    var cx = x, cy = y;
    return {
      el: el,
      moveTo: function (nx, ny) {
        var p = UI.anim(el, [{ transform: 'translate(0,0)' }, { transform: 'translate(' + (nx - cx) + 'px,' + (ny - cy) + 'px)' }], { dur: 600, fill: 'none' });
        return p.then(function () { cx = nx; cy = ny; el.style.left = nx - 44 * k + 'px'; el.style.top = ny - 2 * k + 'px'; });
      },
      tap: function () {
        return UI.anim(el, [{ transform: 'translateY(0) scale(1)' }, { transform: 'translateY(-10px) scale(.94)' }, { transform: 'translateY(0) scale(1)' }], { dur: 380, fill: 'none' });
      },
      remove: function () {
        return UI.anim(el, [{ opacity: 1 }, { opacity: 0, transform: 'translateY(40px)' }], { dur: 350 }).then(function () { el.remove(); });
      }
    };
  }

  /* رد الخطأ: اهتزاز لطيف وصوت خطأ (بلا لون أحمر ولا كلمات) */
  function wrong(el) {
    if (B.audio) B.audio.play('wrong');
    return UI.anim(el, [
      { transform: 'translateX(0)' }, { transform: 'translateX(-9px) rotate(-3deg)' }, { transform: 'translateX(9px) rotate(3deg)' },
      { transform: 'translateX(-6px)' }, { transform: 'translateX(0)' }
    ], { dur: 420, fill: 'none' });
  }
  /* رد الصواب: قفزة فرِحة وصوت صواب */
  function right(el) {
    if (B.audio) B.audio.play('right');
    return UI.anim(el, [{ transform: 'scale(1)' }, { transform: 'scale(1.18)' }, { transform: 'scale(1)' }], { dur: 420, easing: UI.SPRING, fill: 'none' });
  }

  /* جولة اختيار من أزرار: تُرجع {promise, cancel}.
     سلّم المساعدة: بعد إخفاقين ينبض الصحيح، وبعد الثالث تُظهر اليد الحل وتُكمل الجولة.
     o.demo: اليد تحلّ مباشرة (العرض التوضيحي). o.onWrong(el) اختياري. */
  function choice(ctx, layer, btns, correct, o) {
    o = o || {};
    var done = false, fails = 0, errors = 0, busy = false, hd = null, resolve;
    var promise = new Promise(function (res) { resolve = res; });
    function finish(el) {
      if (done) return;
      done = true;
      btns.forEach(function (b) { b.classList.remove('pulse-hint'); });
      right(el);
      resolve({ errors: errors, el: el });
    }
    async function showSolution() {
      busy = true;
      var c = center(btns[correct], layer);
      hd = hand(layer, c.x, c.y + c.h * 0.18);
      await ctx.sleep(650);
      if (done) return;
      await hd.tap();
      if (done) return;
      btns[correct].classList.add('pressed');
      setTimeout(function () { btns[correct].classList.remove('pressed'); }, 250);
      hd.remove(); hd = null;
      finish(btns[correct]);
    }
    btns.forEach(function (b, i) {
      b.__pick = function () {
        if (done || busy || o.demo) return;
        if (i === correct) { finish(b); return; }
        errors++; fails++;
        wrong(b);
        if (o.onWrong) o.onWrong(b, i);
        if (fails === 2) btns[correct].classList.add('pulse-hint');
        if (fails >= 3) showSolution();
      };
      UI.bindPress(b, function () { b.__pick(); });
    });
    if (o.demo) ctx.sleep(o.demoDelay || 900).then(function () { if (!done) showSolution(); });
    return {
      promise: promise,
      cancel: function () { done = true; if (hd) hd.el.remove(); resolve({ cancelled: true }); }
    };
  }

  /* شاشة ختامية عامة: قمر ونجوم وحيوان نائم */
  function endScene(animal, extra) {
    var stars = h('div', { class: 'end-stars' });
    for (var i = 0; i < 26; i++) {
      stars.appendChild(h('span', { class: 'end-star', style: { left: Math.random() * 100 + '%', top: Math.random() * 55 + '%', width: 6 + Math.random() * 10 + 'px', animationDelay: Math.random() * 3 + 's' }, html: art.sparkle('#FFF7C2') }));
    }
    var fire = h('div', { class: 'end-fire' });
    for (var f = 0; f < 10; f++) {
      fire.appendChild(h('span', { class: 'firefly', style: { left: Math.random() * 100 + '%', top: 60 + Math.random() * 35 + '%', animationDelay: Math.random() * 4 + 's', animationDuration: 4 + Math.random() * 3 + 's' } }));
    }
    var sleeper = animal === 'owl' ? art.owl({ sleep: true }) : art.animal(animal || 'bear', { sleep: true });
    return h('div', { class: 'end-train-wrap' }, stars, fire,
      h('div', { class: 'end-moon', html: art.moon() }),
      h('div', { class: 'end-owl end-sleeper' }, h('div', { html: sleeper }), h('span', { class: 'end-z', html: art.zzz() })),
      extra || null);
  }

  /* غروب هادئ فوق المسرح قبل الختام */
  function dusk(ctx) {
    var d = h('div', { class: 'kit-dusk' });
    ctx.stage.appendChild(d);
    if (B.audio) B.audio.play('lullaby');
    UI.anim(d, [{ opacity: 0 }, { opacity: 1 }], { dur: 1800 });
    return ctx.sleep(2000);
  }

  /* غلاف الجولات: يتكفل بالإلغاء (إعادة العرض) والرموز المميّزة للجولة */
  function roundRunner() {
    var token = 0, cancelFn = null, cur = null;
    return {
      run: function (fn) {
        var my = ++token;
        return new Promise(function (res) {
          cancelFn = function () { res({ cancelled: true }); };
          Promise.resolve(fn(function () { return my === token; }, function (c) { cur = c; })).then(function (r) { if (my === token && r) res(r); });
        });
      },
      cancel: function () { token++; if (cur && cur.cancel) cur.cancel(); cur = null; if (cancelFn) cancelFn(); cancelFn = null; },
      stop: function () { token++; }
    };
  }

  B.kit = { rand: rand, pick: pick, shuffle: shuffle, center: center, hand: hand, wrong: wrong, right: right, choice: choice, endScene: endScene, dusk: dusk, roundRunner: roundRunner };
})();

</script>
<script>
/* محرك الجلسات: يدير جولات اللعبة (١٠ في «وحدي» و٨ في «معك»)،
   ومصابيح التقدم، والتكيّف الصامت، والحفظ بعد كل جولة، والشاشة الختامية الهادئة.

   عقد اللعبة (B.games[id]):
     mount(ctx)                  يبني المشهد داخل ctx.stage
     demo(ctx)        → Promise  عرض توضيحي صامت (يد تنقر)
     playRound(ctx, level, i) → Promise<{errors}|{cancelled:true}>
     cancelRound()               يُنهي الجولة الحالية بـ cancelled
     outro(ctx)       → Promise  خروج هادئ من المشهد قبل الختام
     endArt(ctx)      → Element  رسمة الشاشة الختامية
     destroy()                   تنظيف (مؤقتات، rAF)
   ملاحظة: ctx.sleep وctx.anim لا ينتهيان إذا غادرت الطفل اللعبة (لا أخطاء متأخرة). */
(function () {
  'use strict';
  var B = (window.Bustan = window.Bustan || {});
  var UI = B.UI, h = UI.h;

  /* فهرس الألعاب: المنطقة وعدد الجولات */
  B.catalog = [
    // «وحدي» مجمّعة بمهارتها (cat): تظهر في الرئيسية تحت عناوين صغيرة
    { id: 'memory', zone: 'solo', rounds: 10, cat: 'watch' },
    { id: 'shadows', zone: 'solo', rounds: 10, cat: 'watch' },
    { id: 'odd', zone: 'solo', rounds: 10, cat: 'watch' },
    { id: 'hide', zone: 'solo', rounds: 10, cat: 'watch' },
    { id: 'vanish', zone: 'solo', rounds: 10, cat: 'watch' },
    { id: 'missing', zone: 'solo', rounds: 10, cat: 'watch' },
    { id: 'fruits', zone: 'solo', rounds: 10, cat: 'num' },
    { id: 'more', zone: 'solo', rounds: 10, cat: 'num' },
    { id: 'order', zone: 'solo', rounds: 10, cat: 'num' },
    { id: 'mirror', zone: 'solo', rounds: 10, cat: 'num' },
    { id: 'pattern', zone: 'solo', rounds: 10, cat: 'num' },
    { id: 'letters', zone: 'solo', rounds: 10, cat: 'move' },
    { id: 'tracing', zone: 'solo', rounds: 10, cat: 'move' },
    { id: 'train', zone: 'solo', rounds: 10, cat: 'move' },
    { id: 'feed', zone: 'solo', rounds: 10, cat: 'know' },
    { id: 'habitat', zone: 'solo', rounds: 10, cat: 'know' },
    { id: 'water', zone: 'solo', rounds: 10, cat: 'know' },
    { id: 'maze', zone: 'solo', rounds: 10, cat: 'move' },
    { id: 'firstsound', zone: 'together', rounds: 8 },
    { id: 'bridge', zone: 'together', rounds: 8 },
    // القسم الإبداعي: لعب حرّ بلا جولات ولا مصابيح
    { id: 'workshop', zone: 'create', free: true },
    { id: 'coloring', zone: 'create', free: true },
    { id: 'drawing', zone: 'create', free: true },
    { id: 'gallery', zone: 'create', free: true },
    { id: 'garden', zone: 'garden', free: true }
  ];
  B.free = B.free || {};
  B.games = B.games || {};

  var active = null;

  function item(id) {
    for (var i = 0; i < B.catalog.length; i++) if (B.catalog[i].id === id) return B.catalog[i];
    return null;
  }

  /* لعب حرّ: مسرح وزر الرئيسية فقط */
  function startFree(it, origin) {
    if (it.id === 'garden') { /* يستعمل المحرك نفسه */ }
    var mod = B.free[it.id];
    if (!mod || active) return;
    if (B.audio) B.audio.play('whoosh');
    B.stats.play(it.id);
    var cur = UI.curtain('#8E5CF0', origin.x, origin.y);
    cur.cover.then(function () {
      var stage = h('div', { class: 'stage' });
      var ctx = { gameId: it.id, zone: it.zone, stage: stage, alive: true, free: true };
      ctx.homeBtn = UI.iconButton('home-btn', B.art.house(), B.S.buttons.home, function () { exit(ctx, mod); });
      ctx.hud = h('div', { class: 'hud' }, ctx.homeBtn);
      ctx.root = h('div', { class: 'screen game-screen free-screen game-' + it.id, 'data-game': it.id }, stage, ctx.hud);
      active = ctx;
      UI.go(ctx.root, { instant: true });
      try { mod.open(ctx); } catch (e) { console.error(e); }
      cur.reveal();
    });
  }

  function start(id, origin) {
    var game = B.games[id], it = item(id);
    origin = origin || {};
    if (it && it.free) { startFree(it, origin); return; }
    if (!game || !it || active) return;
    var color = it.zone === 'solo' ? '#19B394' : '#F2658E';
    if (B.audio) B.audio.play('whoosh');
    B.stats.play(id);
    var cur = UI.curtain(color, origin.x, origin.y);
    cur.cover.then(function () {
      var ctx = build(it, game);
      active = ctx;
      UI.go(ctx.root, { instant: true });
      return cur.reveal().then(function () { loop(ctx, game); });
    });
  }

  function build(it, game) {
    var S = B.S;
    var stage = h('div', { class: 'stage' });
    var bulbs = UI.bulbs(it.rounds);
    var ctx = {
      gameId: it.id, zone: it.zone, total: it.rounds,
      stage: stage, bulbs: bulbs,
      alive: true, demoRunning: false, pendingDemo: false, ending: false,
      roundIndex: 0
    };
    ctx.homeBtn = UI.iconButton('home-btn', B.art.house(), S.buttons.home, function () { exit(ctx, game); });
    // شريط الأعلى: زر الرئيسية فقط والمصابيح (مساحة فارغة تعادل الزر لتبقى المصابيح في الوسط)
    // شريط الأعلى: الرئيسية (يمين) — المصابيح — إيقاف مؤقت (يسار)
    ctx.pauseBtn = UI.iconButton('pause-btn', B.art.pauseIcon(), S.buttons.pause, function () { pause(ctx, game); });
    ctx.hud = h('div', { class: 'hud' }, ctx.homeBtn, bulbs.el, ctx.pauseBtn);
    ctx.root = h('div', { class: 'screen game-screen game-' + it.id, 'data-game': it.id, 'data-zone': it.zone }, stage, ctx.hud);

    // انتظار وحركة آمنان: لا يكملان بعد الخروج من اللعبة
    function guard(v) { return ctx.alive ? v : new Promise(function () {}); }
    /* انتظار يتجمّد مع الإيقاف المؤقت: يُحسب الوقت المتبقي ويُستأنف بعد المتابعة */
    ctx.timers = [];
    ctx.paused = false;
    ctx.sleep = function (ms) {
      return new Promise(function (res) {
        var t = { rem: ms / UI.ts, id: 0, t0: 0, on: false };
        t.start = function () { t.on = true; t.t0 = performance.now(); t.id = setTimeout(t.done, Math.max(0, t.rem)); };
        t.stop = function () { if (!t.on) return; t.on = false; clearTimeout(t.id); t.rem -= performance.now() - t.t0; };
        t.done = function () { ctx.timers = ctx.timers.filter(function (x) { return x !== t; }); if (ctx.alive) res(); };
        ctx.timers.push(t);
        if (!ctx.paused) t.start();
      });
    };
    ctx.anim = function (el, kf, o) { return UI.anim(el, kf, o).then(guard); };
    return ctx;
  }

  async function runDemo(ctx, game) {
    ctx.demoRunning = true;
    ctx.root.classList.add('is-demo');
    await game.demo(ctx);
    ctx.demoRunning = false;
    ctx.root.classList.remove('is-demo');
  }

  async function loop(ctx, game) {
    var id = ctx.gameId;
    try {
      game.mount(ctx);
      await ctx.sleep(500);
      if (B.S.guides[id]) await showGuide(ctx, B.S.guides[id]);
      if (!B.storage.demoSeen(id)) {
        await runDemo(ctx, game);
        B.storage.markDemoSeen(id);
        await ctx.sleep(900);
      }
      var i = 0;
      while (i < ctx.total) {
        if (ctx.pendingDemo) {
          ctx.pendingDemo = false;
          await runDemo(ctx, game);
          await ctx.sleep(900);
        }
        ctx.roundIndex = i;
        var level = B.adaptive.level(id);
        var res = await game.playRound(ctx, level, i);
        if (res && res.cancelled) { ctx.pendingDemo = true; continue; } // نكرر الجولة نفسها بعد العرض
        B.adaptive.report(id, (res && res.errors) | 0);
        B.storage.recordRound(id);
        ctx.bulbs.light(i);
        i++;
        if (i < ctx.total) await ctx.sleep(1000);
      }
      B.storage.recordSession(id);
      B.stats.done(id);
      ctx.ending = true;
      await ctx.sleep(500);
      await game.outro(ctx);
      showEnd(ctx, game);
    } catch (e) {
      console.error(e);
    }
  }

  /* بطاقة شرح لوليّ الأمر (ألعاب «معك»): خطوات قصيرة وزر بدء */
  function showGuide(ctx, g) {
    return new Promise(function (res) {
      var go = h('button', { class: 'guide-go', type: 'button', text: B.S.guides.go });
      var card = h('div', { class: 'guide-card' },
        h('h2', { text: g.title }),
        h('ol', { class: 'guide-steps' }, g.steps.map(function (t, i) { return h('li', {}, h('b', { text: UI.num(i + 1) }), h('span', { text: t })); })),
        go);
      var layer = h('div', { class: 'guide-layer' }, card);
      ctx.root.appendChild(layer);
      UI.anim(card, [{ opacity: 0, transform: 'translateY(20px) scale(.95)' }, { opacity: 1, transform: 'none' }], { dur: 400, easing: UI.SPRING, fill: 'none' });
      go.addEventListener('click', function () {
        if (B.audio) B.audio.play('tap');
        UI.anim(layer, [{ opacity: 1 }, { opacity: 0 }], { dur: 250 }).then(function () { layer.remove(); if (ctx.alive) res(); });
      });
    });
  }

  function requestDemo(ctx, game) {
    if (ctx.demoRunning || ctx.ending || !ctx.alive) return;
    ctx.pendingDemo = true;
    if (game.cancelRound) game.cancelRound();
  }

  /* الشاشة الختامية: شخصية هادئة وزر واحد للعودة. لا جولة تلقائية ولا «العب مرة أخرى». */
  function showEnd(ctx, game) {
    var S = B.S;
    var art = game.endArt ? game.endArt(ctx) : null;
    var btn = UI.iconButton('home-btn end-home', B.art.house(), S.buttons.home, function () { exit(ctx, game); });
    var end = h('div', { class: 'end-screen' }, h('div', { class: 'end-art' }, art), btn);
    ctx.hud.classList.add('is-hidden');
    var plant = B.garden.plant();
    end.appendChild(h('div', { class: 'end-plant', html: B.pics.draw(plant) }));
    ctx.root.appendChild(end);
    var ep = end.lastChild;
    UI.anim(ep, [{ opacity: 0, transform: 'translateY(30px) scale(.2)' }, { opacity: 1, transform: 'translateY(0) scale(1.15)', offset: 0.6 }, { opacity: 1, transform: 'none' }], { dur: 900, delay: 1400, easing: UI.SPRING, fill: 'backwards' });
    if (B.audio) setTimeout(function () { B.audio.play('pop'); }, 1400 / UI.ts);
    UI.anim(end, [{ opacity: 0 }, { opacity: 1 }], { dur: 1000, fill: 'both' });
    if (art) UI.anim(art, [{ opacity: 0, transform: 'translateY(16px)' }, { opacity: 1, transform: 'none' }], { dur: 900, delay: 300, easing: UI.SPRING });
  }

  /* الإيقاف المؤقت: يتجمّد كل شيء (الحركة والمؤقتات والقطار) وتظهر طبقة بزر متابعة كبير */
  function pause(ctx, game) {
    if (ctx.paused || !ctx.alive || ctx.ending) return;
    ctx.paused = true;
    ctx.timers.forEach(function (t) { t.stop(); });
    ctx.frozen = ctx.stage.getAnimations({ subtree: true }).filter(function (a) { return a.playState === 'running'; });
    ctx.frozen.forEach(function (a) { try { a.pause(); } catch (e) {} });
    ctx.root.classList.add('is-paused');
    if (game.pause) game.pause();
    var resume = UI.iconButton('resume-btn', B.art.playIcon(), B.S.buttons.resume, function () { unpause(ctx, game); });
    ctx.pauseLayer = h('div', { class: 'pause-layer' }, resume);
    ctx.root.appendChild(ctx.pauseLayer);
    UI.anim(ctx.pauseLayer, [{ opacity: 0 }, { opacity: 1 }], { dur: 250, fill: 'none' });
    UI.anim(resume, [{ transform: 'scale(.4)' }, { transform: 'scale(1)' }], { dur: 380, easing: UI.SPRING, fill: 'none' });
  }
  function unpause(ctx, game) {
    if (!ctx.paused) return;
    var layer = ctx.pauseLayer;
    ctx.pauseLayer = null;
    UI.anim(layer, [{ opacity: 1 }, { opacity: 0 }], { dur: 220 }).then(function () { layer.remove(); });
    ctx.paused = false;
    ctx.root.classList.remove('is-paused');
    (ctx.frozen || []).forEach(function (a) { try { if (a.playState === 'paused') a.play(); } catch (e) {} });
    ctx.frozen = null;
    if (game.resume) game.resume();
    ctx.timers.slice().forEach(function (t) { t.start(); });
  }

  function exit(ctx, game) {
    if (!ctx.alive) return;
    ctx.alive = false;
    try { game.destroy && game.destroy(); } catch (e) { console.error(e); }
    active = null;
    B.storage.save(); // يُحفظ التقدم بنقرة واحدة
    B.home.show();
  }

  B.session = {
    start: start,
    active: function () { return active; },
    item: item
  };
})();

</script>
<script>
/* الشاشة الرئيسية: منطقتان بلونين وأيقونات (وحدي / معك).
   الألعاب غير المنجزة أيقونات نائمة. الضغطة المطولة ٣ ثوانٍ على زاوية الشعار تفتح ركن الوالدين. */
(function () {
  'use strict';
  var B = (window.Bustan = window.Bustan || {});
  var UI = B.UI, h = UI.h, art = B.art;

  function sleepyWobble(el) {
    UI.anim(el, [
      { transform: 'rotate(0)' }, { transform: 'rotate(-4deg)' }, { transform: 'rotate(4deg)' },
      { transform: 'rotate(-3deg)' }, { transform: 'rotate(0)' }
    ], { dur: 700, fill: 'none', deco: true });
    // نفَس نائم صغير يطفو
    var z = h('div', { class: 'zzz-float', html: art.zzz() });
    el.appendChild(z);
    UI.anim(z, [
      { transform: 'translateY(6px) scale(.6)', opacity: 0 },
      { transform: 'translateY(-18px) scale(1)', opacity: 1, offset: 0.4 },
      { transform: 'translateY(-44px) scale(1.1)', opacity: 0 }
    ], { dur: 1400, fill: 'both' }).then(function () { z.remove(); });
  }

  function tile(it, locked) {
    var S = B.S;
    var built = !!(B.games[it.id] || B.free[it.id]);
    var sleeping = !built || locked;
    var el = h('button', {
      class: 'tile' + (sleeping ? ' is-sleeping' : ''), type: 'button', 'data-game': it.id,
      'aria-label': S.games[it.id]
    },
      h('span', { class: 'tile-art', html: art.gameIcon(it.id, !built) }),
      h('span', { class: 'tile-name', text: S.games[it.id] }),
      !built ? h('span', { class: 'tile-zzz', html: art.zzz() }) : null,
      (built && !it.free && B.storage.game(it.id) && B.storage.game(it.id).sessions > 0) ? h('span', { class: 'tile-done' }, h('span', { html: art.check() }), h('b', { text: S.home.done })) : null
    );
    UI.bindPress(el, function (e) {
      if (!built || locked) { sleepyWobble(el); return; }
      var r = el.getBoundingClientRect();
      UI.anim(el, [{ transform: 'scale(1)' }, { transform: 'scale(1.12)' }, { transform: 'scale(1)' }], { dur: 300, fill: 'none', easing: UI.SPRING });
      B.session.start(it.id, { x: r.left + r.width / 2, y: r.top + r.height / 2 });
    });
    return el;
  }

  function zone(zoneId, locked) {
    var S = B.S;
    var items = B.catalog.filter(function (c) { return c.zone === zoneId; });
    var z = h('section', { class: 'zone zone-' + zoneId + (locked ? ' is-locked' : ''), 'data-zone': zoneId },
      h('header', { class: 'zone-head' },
        h('span', { class: 'zone-badge', html: art.zoneBadge(zoneId) }),
        h('h2', { class: 'zone-name', text: S.zones[zoneId] })
      ),
      zoneId === 'solo'
        ? h('div', { class: 'groups' }, ['watch', 'num', 'move', 'know'].map(function (cat) {
            return h('div', { class: 'group g-' + cat },
              h('div', { class: 'group-label', text: S.cats[cat] }),
              h('div', { class: 'tiles' }, items.filter(function (c) { return c.cat === cat; }).map(function (it) { return tile(it, locked); })));
          }))
        : h('div', { class: 'tiles' }, items.map(function (it) { return tile(it, locked && zoneId === 'solo'); }))
    );
    if (locked && zoneId === 'solo') {
      // شخصية نائمة تغطي المنطقة حتى الغد
      z.appendChild(h('div', { class: 'sleepy' },
        h('span', { class: 'sleepy-art', html: art.animal('bear', { sleep: true }) }),
        h('span', { class: 'sleepy-z', html: art.zzz() })
      ));
    }
    return z;
  }

  /* بطاقة «بستاني» المستقلة: معاينة مما زُرع + عدده. وبجانبها «فاجئني» تختار لعبة عشوائية. */
  function gardenRow(locked) {
    var H = B.S.home, items = B.garden.items(), recent = items.slice(-4).reverse();
    var preview = h('span', { class: 'gb-prev' }, recent.length
      ? recent.map(function (k) { return h('span', { class: 'gb-item', html: B.pics.draw(k) }); })
      : [h('span', { class: 'gb-item gb-seed', html: B.pics.draw('leaf') })]);
    var gb = h('button', { class: 'gd-banner', type: 'button', 'data-game': 'garden', 'aria-label': H.garden },
      h('span', { class: 'gb-title' }, h('b', { text: H.garden }), h('small', { text: H.gardenNote })),
      preview,
      h('span', { class: 'gb-count', text: UI.num(items.length) }));
    UI.bindPress(gb, function () { var r = gb.getBoundingClientRect(); B.session.start('garden', { x: r.left + r.width / 2, y: r.top + r.height / 2 }); });
    var sb = h('button', { class: 'surprise-btn', type: 'button', 'aria-label': H.surprise, html: art.dice() }, h('small', { text: H.surprise }));
    UI.bindPress(sb, function () {
      var pool = B.catalog.filter(function (c) { return !c.free && B.games[c.id] && !(locked && c.zone === 'solo'); });
      var it = kit_pick(pool); if (!it) return;
      var r = sb.getBoundingClientRect(); B.session.start(it.id, { x: r.left + r.width / 2, y: r.top + r.height / 2 });
    });
    return h('div', { class: 'gd-row' }, gb, sb);
  }
  /* شريط «أكمل لعبتك» و«تحدي اليوم» */
  function dayNum() { var d = new Date(); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000); }
  function dailyPool(locked) { return B.catalog.filter(function (c) { return !c.free && B.games[c.id] && c.zone !== 'garden' && !(locked && c.zone === 'solo'); }); }
  function chipsRow(locked) {
    var H = B.S.home, data = B.storage.data(), row = h('div', { class: 'chips-row' });
    function chip(cls, label, id, done) {
      var it = B.catalog.filter(function (c) { return c.id === id; })[0]; if (!it) return;
      var b = h('button', { class: 'home-chip ' + cls + (done ? ' done' : ''), type: 'button', 'data-chip': cls, 'data-game': id },
        h('span', { class: 'hc-ic', html: art.gameIcon ? art.gameIcon(id) : '' }),
        h('span', { class: 'hc-tx' }, h('small', { text: label }), h('b', { text: B.S.games[id] })));
      UI.bindPress(b, function () { var r = b.getBoundingClientRect(); B.session.start(id, { x: r.left + r.width / 2, y: r.top + r.height / 2 }); });
      row.appendChild(b);
    }
    var last = data.last; if (last && B.games[last] && !(locked && (B.catalog.filter(function (c) { return c.id === last; })[0] || {}).zone === 'solo')) chip('cont', H.cont, last, false);
    var pool = dailyPool(locked);
    if (pool.length) {
      var d = dayNum(), pick = pool[(d * 7 + 3) % pool.length].id;
      var dd = new Date(), today = dd.getFullYear() + '-' + ('0' + (dd.getMonth() + 1)).slice(-2) + '-' + ('0' + dd.getDate()).slice(-2), g = data.games && data.games[pick];
      chip('daily', H.daily, pick, !!(g && g.last === today));
    }
    row.__mascotSlot = true;
    return row;
  }
  function mascot(zonesEl) {
    var m = h('button', { class: 'mascot', type: 'button', 'aria-label': B.S.home.mascotHi, html: B.pics.draw('rabbit') });
    m.addEventListener('click', function () {
      if (B.audio) B.audio.play('pop');
      UI.anim(m, [{ transform: 'translateY(0)' }, { transform: 'translateY(-26px) rotate(-8deg)', offset: 0.4 }, { transform: 'translateY(0)' }, { transform: 'translateY(-10px)', offset: 0.75 }, { transform: 'translateY(0)' }], { dur: 700 });
    });
    return m;
  }
  function kit_pick(a) { return a.length ? a[Math.floor(Math.random() * a.length)] : null; }

  /* أدوات الصفحة: ملء الشاشة، والوضع الليلي/النهاري (للكبار؛ ليست أزرار لعب) */
  function applyNight(on) { document.documentElement.classList.toggle('night', !!on); }
  B.applyNight = applyNight;
  function tools() {
    var H = B.S.home, set = B.storage.data().settings;
    var box = h('div', { class: 'hdr-tools' });
    var night = h('div', { class: 'hdr-tool', role: 'button', tabindex: '0' });
    function paintNight() { night.innerHTML = set.night ? art.sunBtn() : art.moonBtn(); night.setAttribute('aria-label', set.night ? H.day : H.night); }
    night.addEventListener('click', function () { set.night = !set.night; B.storage.save(); applyNight(set.night); paintNight(); if (B.audio) B.audio.play('pick'); });
    paintNight(); box.appendChild(night);
    var de = document.documentElement;
    if (de.requestFullscreen || de.webkitRequestFullscreen) {
      var fs = h('div', { class: 'hdr-tool', role: 'button', tabindex: '0', 'aria-label': H.full, html: art.full() });
      fs.addEventListener('click', function () {
        var on = document.fullscreenElement || document.webkitFullscreenElement;
        try { if (on) (document.exitFullscreen || document.webkitExitFullscreen).call(document); else (de.requestFullscreen || de.webkitRequestFullscreen).call(de); } catch (e) {}
      });
      box.appendChild(fs);
    }
    return box;
  }

  var HOLD_MS = 1200; // ضغطة مطوّلة قصيرة: لا يفتحها الطفل بالخطأ، ولا يطول انتظار الكبير
  /* زر «الوالدان» الظاهر: ضغط مطوّل ثانية وبعض الثانية؛ والنقرة السريعة تذكّر بالضغط المستمر */
  function parentBtn(cls) {
    var H = B.S.home;
    var b = h('div', { class: 'parent-btn ' + cls, role: 'button', tabindex: '0', 'aria-label': H.parent },
      h('span', { class: 'pb-ic', html: art.gear() }), h('b', { class: 'pb-tx', text: H.parent }), h('i', { class: 'pb-fill' }));
    var timer = null, sx = 0, sy = 0, lbl = b.querySelector('.pb-tx'), t0 = 0;
    function cancel() { if (timer) { clearTimeout(timer); timer = null; } b.classList.remove('holding'); }
    b.addEventListener('pointerdown', function (e) {
      sx = e.clientX; sy = e.clientY; cancel(); t0 = Date.now(); b.classList.add('holding');
      timer = setTimeout(function () { timer = null; b.classList.remove('holding'); B.parent.open(); }, HOLD_MS);
    });
    b.addEventListener('pointermove', function (e) { if (Math.abs(e.clientX - sx) > 30 || Math.abs(e.clientY - sy) > 30) cancel(); });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) { b.addEventListener(ev, function () {
      var early = timer && (Date.now() - t0 < HOLD_MS - 50); cancel();
      if (early && ev === 'pointerup') { lbl.textContent = H.parentHold; setTimeout(function () { lbl.textContent = H.parent; }, 1600); }
    }); });
    b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    return b;
  }
  function attachLongPress(btn) {
    var timer = null, sx = 0, sy = 0;
    function cancel() { if (timer) { clearTimeout(timer); timer = null; } }
    btn.addEventListener('pointerdown', function (e) {
      sx = e.clientX; sy = e.clientY;
      cancel();
      timer = setTimeout(function () { timer = null; B.parent.open(); }, HOLD_MS);
    });
    btn.addEventListener('pointermove', function (e) {
      if (Math.abs(e.clientX - sx) > 24 || Math.abs(e.clientY - sy) > 24) cancel();
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) { btn.addEventListener(ev, cancel); });
  }

  var tabNow = 'all';
  function build() {
    var locked = B.storage.soloLocked();
    var logo = h('button', { class: 'logo-corner', type: 'button', 'aria-label': B.S.appName },
      h('span', { class: 'logo-mark', html: art.logo() }),
      h('span', { class: 'logo-name', text: B.S.appName })
    );
    attachLongPress(logo);

    var vp = UI.vp();
    var sky = h('div', { class: 'home-sky' },
      h('div', { class: 'home-sun', html: art.sun() }),
      h('div', { class: 'home-cloud c1', html: art.cloud() }),
      h('div', { class: 'home-cloud c2', html: art.cloud() }),
      h('div', { class: 'home-cloud c3', html: art.cloud() }),
      h('div', { class: 'home-cloud c4', html: art.cloud() }),
      h('div', { class: 'home-balloon hb1', html: art.balloon('#F2658E', '#FFD34E') }),
      h('div', { class: 'home-balloon hb2', html: art.balloon('#8E5CF0', '#5CC8FF') }),
      h('div', { class: 'home-bird', html: art.bird('#FF8A3D') }),
      h('div', { class: 'home-bird b2', html: art.bird('#8E5CF0') }),
      h('div', { class: 'home-hills far', html: art.sceneTile('gfar', vp.W, Math.round(vp.H * 0.4)) }),
      h('div', { class: 'sc-windmill', html: B.pics.draw('windmill') }),
      h('div', { class: 'home-hills mid', html: art.sceneTile('gmid', vp.W, Math.round(vp.H * 0.3)) }),
      h('div', { class: 'sc-house', html: B.pics.draw('house') }),
      h('div', { class: 'sc-bunny', html: B.pics.draw('rabbit') }),
      h('div', { class: 'home-hills fore', html: art.sceneTile('fore', vp.W, Math.round(vp.H * 0.14)) }),
      h('div', { class: 'sc-fly bf1', html: B.pics.draw('butterfly') }),
      h('div', { class: 'sc-fly bf2', html: B.pics.draw('butterfly') }),
      h('div', { class: 'sc-fly bee', html: B.pics.draw('bee') })
    );

    var chips = chipsRow(locked);
    var zones = h('main', { class: 'zones scrollable', 'data-tab': tabNow }, h('div', { class: 'home-top' }, gardenRow(locked), chips), zone('solo', locked), zone('together', false), zone('create', false));
    var tabbar = h('nav', { class: 'tabbar', role: 'tablist' }, parentBtn('in-tabbar'), ['all', 'solo', 'together', 'create'].map(function (id) {
      var b = h('button', { class: 'tab-btn tab-' + id + (id === tabNow ? ' on' : ''), type: 'button', role: 'tab', 'data-tab': id, 'aria-label': B.S.zones[id] },
        h('span', { class: 'tab-ic', html: art.zoneBadge(id) }), h('b', { text: B.S.zones[id] }));
      b.addEventListener('click', function () { setTab(id); });
      return b;
    }));
    function setTab(id) {
      tabNow = id; zones.setAttribute('data-tab', id);
      tabbar.querySelectorAll('.tab-btn').forEach(function (x) { x.classList.toggle('on', x.getAttribute('data-tab') === id); });
      zones.scrollTop = 0;
      if (B.audio) B.audio.play('pick');
    }
    B.home._setTab = setTab;
    var fbPill = h('div', { class: 'fb-pill', role: 'button', tabindex: '0', text: B.S.feedback.pill });
    fbPill.addEventListener('click', function () { B.feedback.open(); });
    var dot = h('div', { class: 'adm-dot', role: 'button', tabindex: '0', 'aria-label': B.S.admin.dot, text: '·' });
    dot.addEventListener('click', function () { B.admin.open(); });
    var mas = mascot(); if (chips) chips.appendChild(mas);
    var el = h('div', { class: 'screen home' }, sky, zones, tabbar, logo, tools(), parentBtn('in-header'));
    zones.appendChild(fbPill); zones.appendChild(dot);
    // الأرنب يقفز وحده أحياناً ويلفت النظر إلى «فاجئني»
    var idle = setInterval(function () {
      if (!document.body.contains(el)) { clearInterval(idle); return; }
      var sbtn = el.querySelector('.surprise-btn');
      UI.anim(mas, [{ transform: 'translateY(0)' }, { transform: 'translateY(-22px)', offset: 0.4 }, { transform: 'translateY(0)' }], { dur: 600 });
      if (sbtn) UI.anim(sbtn, [{ transform: 'scale(1)' }, { transform: 'scale(1.08)', offset: 0.5 }, { transform: 'scale(1)' }], { dur: 700 });
    }, 14000);

    // ظهور متتابع بحركة زنبركية (بعد الإدراج في الصفحة)
    requestAnimationFrame(function () {
      var tiles = el.querySelectorAll('.tile');
      for (var i = 0; i < tiles.length; i++) {
        UI.anim(tiles[i], [
          { opacity: 0, transform: 'translateY(26px) scale(.86)' },
          { opacity: 1, transform: 'none' }
        ], { dur: 520, delay: 120 + i * 80, easing: UI.SPRING });
      }
      UI.anim(el.querySelectorAll('.zone-head')[0], [{ opacity: 0, transform: 'translateY(-10px)' }, { opacity: 1, transform: 'none' }], { dur: 420 });
      UI.anim(el.querySelectorAll('.zone-head')[1], [{ opacity: 0, transform: 'translateY(-10px)' }, { opacity: 1, transform: 'none' }], { dur: 420, delay: 200 });
      UI.anim(el.querySelectorAll('.zone-head')[2], [{ opacity: 0, transform: 'translateY(-10px)' }, { opacity: 1, transform: 'none' }], { dur: 420, delay: 400 });
    });
    // شاشة ترحيب للوالدين مرة واحدة
    if (!B.storage.data().welcomed) {
      var W = B.S.welcome, go = h('button', { class: 'guide-go', type: 'button', text: W.go });
      var card = h('div', { class: 'guide-card' }, h('h2', { text: W.title }),
        h('ul', { class: 'guide-steps' }, W.lines.map(function (t) { return h('li', {}, h('b', { text: '•' }), h('span', { text: t })); })), go);
      var layer = h('div', { class: 'guide-layer', style: { zIndex: 50 } }, card);
      el.appendChild(layer);
      requestAnimationFrame(function () { UI.anim(card, [{ opacity: 0, transform: 'translateY(20px) scale(.95)' }, { opacity: 1, transform: 'none' }], { dur: 450, easing: UI.SPRING, fill: 'none' }); });
      go.addEventListener('click', function () {
        B.storage.data().welcomed = true; B.storage.save();
        UI.anim(layer, [{ opacity: 1 }, { opacity: 0 }], { dur: 250 }).then(function () { layer.remove(); });
      });
    }
    return el;
  }

  B.home = {
    show: function () { return UI.go(build()); },
    tab: function (id) { if (B.home._setTab) B.home._setTab(id); },
    build: build
  };
})();

</script>
<script>
/* ركن الوالدين (مبسّط في المرحلة ١): إحصاءات، حدّ «وحدي»، الصوت، النسخ الاحتياطي، إعادة الضبط.
   لا يظهر له أثر للطفل: لا زر ولا إشارة؛ يُفتح بضغطة مطولة ٣ ثوانٍ على زاوية الشعار.
   النصوص كلها عربية؛ ولا يُعرض نص JSON أبداً (النسخ عبر الحافظة أو ملف). */
(function () {
  'use strict';
  var B = (window.Bustan = window.Bustan || {});
  var UI = B.UI, h = UI.h;

  var overlay = null;

  function copyText(text) {
    function fallback() {
      // نسخ احتياطي بحقل مخفي (لا يظهر نص لاتيني)
      var ta = h('textarea', { style: { position: 'fixed', left: '-9999px', top: '0', opacity: '0' }, 'aria-hidden': 'true' });
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      ta.remove();
      return ok;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return fallback(); });
    }
    return Promise.resolve(fallback());
  }

  function build() {
    var S = B.S, P = S.parent, st = B.storage;
    var msg = h('div', { class: 'p-msg', role: 'status' });
    function say(t) {
      msg.textContent = t;
      UI.anim(msg, [{ opacity: 0, transform: 'translateY(4px)' }, { opacity: 1, transform: 'none' }], { dur: 300, fill: 'both' });
    }

    /* الإحصاءات */
    var played = B.catalog.filter(function (c) { return !c.free; }).map(function (c) { return { id: c.id, g: st.game(c.id) }; });
    var fav = played.slice().sort(function (a, b) { return b.g.rounds - a.g.rounds; })[0];
    var sug = played.filter(function (x) { return !B.games[x.id] ? false : true; }).sort(function (a, b) { return a.g.rounds - b.g.rounds; })[0];
    var SM = S.summary, totalS = played.reduce(function (s, x) { return s + x.g.sessions; }, 0);
    var summary = h('section', { class: 'p-sec' }, h('h3', { text: SM.title }),
      h('div', { class: 'p-line', text: SM.sessionsAll + ': ' + UI.num(totalS) + ' — ' + SM.planted + ': ' + UI.num(st.data().garden.length) }),
      h('div', { class: 'p-line', text: SM.favorite + ': ' + (fav && fav.g.rounds ? S.games[fav.id] : SM.none) }),
      h('div', { class: 'p-line', text: SM.suggest + ': ' + (sug ? S.games[sug.id] : SM.none) }));
    var rows = B.catalog.filter(function (c) { return !c.free; }).map(function (c) {
      var g = st.game(c.id), built = !!B.games[c.id];
      return h('div', { class: 'p-row' },
        h('div', { class: 'p-game', text: S.games[c.id] }),
        built
          ? h('div', { class: 'p-nums' },
              h('span', { text: P.sessions + ': ' + UI.num(g.sessions) }),
              h('span', { text: P.rounds + ': ' + UI.num(g.rounds) }),
              h('span', { text: P.level + ': ' + UI.num(g.level) }))
          : h('div', { class: 'p-nums muted', text: P.notBuilt })
      );
    });

    /* آخر ٧ أيام */
    var days = st.lastDays(7);
    var maxR = Math.max.apply(null, days.map(function (d) { return d.rounds; }).concat([1]));
    var chart = h('div', { class: 'p-chart' }, days.map(function (d) {
      var hgt = d.rounds ? Math.max(8, Math.round((d.rounds / maxR) * 72)) : 3;
      return h('div', { class: 'p-day' },
        h('div', { class: 'p-day-n', text: d.rounds ? UI.num(d.rounds) : '' }),
        h('div', { class: 'p-bar', style: { height: hgt + 'px' } }),
        h('div', { class: 'p-day-l', text: P.daysShort[d.date.getDay()] })
      );
    }));

    /* حدّ «وحدي» */
    var limitVal = h('span', { class: 'p-limit-n', text: UI.num(st.data().settings.soloLimit) });
    function setLimit(d) {
      var s = st.data().settings;
      s.soloLimit = Math.max(1, Math.min(9, s.soloLimit + d));
      limitVal.textContent = UI.num(s.soloLimit);
      st.save();
    }
    var minus = h('button', { class: 'p-btn p-step', type: 'button', text: '−', 'aria-label': '−' });
    var plus = h('button', { class: 'p-btn p-step', type: 'button', text: '+', 'aria-label': '+' });
    minus.addEventListener('click', function () { setLimit(-1); });
    plus.addEventListener('click', function () { setLimit(1); });

    var limBtn = h('button', { class: 'p-btn', type: 'button', 'data-act': 'limit-toggle' });
    function refreshLim() { limBtn.textContent = st.data().settings.soloLimitOn ? P.limitOffBtn : P.limitOnBtn; }
    limBtn.addEventListener('click', function () { var s = st.data().settings; s.soloLimitOn = !s.soloLimitOn; st.save(); refreshLim(); });
    refreshLim();
    var openBtn = h('button', { class: 'p-btn', type: 'button', 'data-act': 'open-solo' });
    function refreshOpen() {
      var opened = st.data().lock.soloOpenDate === st.todayKey();
      openBtn.textContent = opened ? P.soloOpened : P.openSolo;
      openBtn.disabled = opened;
    }
    openBtn.addEventListener('click', function () { st.openSoloToday(); refreshOpen(); });
    refreshOpen();

    /* رابط الأسبوع (جسر الروابط): ٠ = حسب المستوى */
    var weekBtns = [P.weeklyAuto].concat(P.connectors).map(function (label, i) {
      var b = h('button', { class: 'p-btn p-week', type: 'button', 'data-week': i, text: label });
      b.addEventListener('click', function () { st.data().settings.weeklyConnector = i; st.save(); refreshWeek(); });
      return b;
    });
    function refreshWeek() {
      var w = st.data().settings.weeklyConnector | 0;
      weekBtns.forEach(function (b, i) { b.classList.toggle('off', i !== w); });
    }
    refreshWeek();

    /* الصوت */
    var soundBtn = h('button', { class: 'p-btn', type: 'button', 'data-act': 'sound' });
    function refreshSound() {
      var on = st.data().settings.soundOn;
      soundBtn.textContent = on ? P.soundOn : P.soundOff;
      soundBtn.classList.toggle('on', on);
    }
    soundBtn.addEventListener('click', function () {
      var s = st.data().settings; s.soundOn = !s.soundOn; st.save(); refreshSound();
      if (s.soundOn) { B.audio.unlock(); B.audio.play('chime'); }
    });
    refreshSound();

    /* النسخ الاحتياطي */
    var copyBtn = h('button', { class: 'p-btn', type: 'button', text: P.copy, 'data-act': 'copy' });
    copyBtn.addEventListener('click', function () {
      copyText(st.exportJSON()).then(function (ok) { say(ok ? P.copied : P.restoreFail); });
    });
    var fileBtn = h('button', { class: 'p-btn', type: 'button', text: P.saveFile, 'data-act': 'save-file' });
    fileBtn.addEventListener('click', function () {
      try {
        var blob = new Blob([st.exportJSON()], { type: 'application/json' });
        var a = h('a', { href: URL.createObjectURL(blob), download: 'bustan-progress.json' });
        document.body.appendChild(a); a.click(); a.remove();
        say(P.copied);
      } catch (e) { say(P.restoreFail); }
    });
    var ta = h('textarea', { class: 'p-ta', placeholder: P.restorePlaceholder, rows: 2, dir: 'ltr' });
    var restoreBtn = h('button', { class: 'p-btn', type: 'button', text: P.restore, 'data-act': 'restore' });
    function afterRestore(ok) {
      say(ok ? P.restored : P.restoreFail);
      if (ok) { ta.value = ''; close(); B.home.show(); }
    }
    restoreBtn.addEventListener('click', function () { afterRestore(st.importJSON(ta.value)); });
    var picker = h('input', { type: 'file', accept: '.json,application/json', style: { display: 'none' } });
    picker.addEventListener('change', function () {
      var f = picker.files && picker.files[0];
      if (!f) return;
      var rd = new FileReader();
      rd.onload = function () { afterRestore(st.importJSON(String(rd.result))); };
      rd.onerror = function () { say(P.restoreFail); };
      rd.readAsText(f);
    });
    var restoreFileBtn = h('button', { class: 'p-btn', type: 'button', text: P.restoreFile });
    restoreFileBtn.addEventListener('click', function () { picker.click(); });

    /* إعادة ضبط لعبة (ضغطتان للتأكيد) */
    var resetBtns = B.catalog.filter(function (c) { return !!B.games[c.id]; }).map(function (c) {
      var armed = false, t = null;
      var b = h('button', { class: 'p-btn warn', type: 'button', 'data-reset': c.id, text: P.resetGame + ' — ' + S.games[c.id] });
      b.addEventListener('click', function () {
        if (!armed) {
          armed = true; b.textContent = P.resetConfirm;
          t = setTimeout(function () { armed = false; b.textContent = P.resetGame + ' — ' + S.games[c.id]; }, 4000);
        } else {
          clearTimeout(t); armed = false;
          st.resetGame(c.id);
          b.textContent = P.resetGame + ' — ' + S.games[c.id];
          say(P.resetDone);
        }
      });
      return b;
    });

    var galBtn = h('button', { class: 'p-btn warn', type: 'button', text: S.parent.clearGallery, 'data-act': 'clear-gallery' });
    var galArmed = false;
    galBtn.addEventListener('click', function () {
      if (!galArmed) { galArmed = true; galBtn.textContent = P.resetConfirm; setTimeout(function () { galArmed = false; galBtn.textContent = P.clearGallery; }, 4000); }
      else { B.gallery.clear(); galArmed = false; galBtn.textContent = P.clearGallery; say(P.resetDone); }
    });
    var demoBtn = h('button', { class: 'p-btn', type: 'button', text: P.replayDemo, 'data-act': 'replay-demo' });
    demoBtn.addEventListener('click', function () {
      st.data().demoSeen = {}; st.save(); say(P.replayDemoDone);
    });

    var closeBtn = h('button', { class: 'p-close', type: 'button', 'aria-label': S.buttons.close, text: '✕' });
    closeBtn.addEventListener('click', function () { close(); B.home.show(); });

    var body = h('div', { class: 'p-body scrollable' },
      !st.isPersistent() ? h('div', { class: 'p-warn', text: P.storageWarn }) : null,
      summary,
      h('section', { class: 'p-sec' }, rows),
      h('section', { class: 'p-sec' }, h('h3', { text: P.lastDays }), chart),
      h('section', { class: 'p-sec' },
        h('h3', { text: P.dailyLimit }),
        limBtn,
        h('div', { class: 'p-limit' }, minus, limitVal, plus),
        h('div', { class: 'p-line', text: P.todaySessions + ': ' + UI.num(st.soloSessionsToday()) }),
        openBtn
      ),
      h('section', { class: 'p-sec' }, h('h3', { text: P.weekly }), h('div', { class: 'p-wrap' }, weekBtns)),
      h('section', { class: 'p-sec' }, h('h3', { text: P.sound }), soundBtn, h('div', { class: 'p-line muted', text: P.soundNote })),
      h('section', { class: 'p-sec' },
        h('h3', { text: P.backup }),
        h('div', { class: 'p-wrap' }, copyBtn, fileBtn),
        ta, h('div', { class: 'p-wrap' }, restoreBtn, restoreFileBtn), picker
      ),
      h('section', { class: 'p-sec' }, demoBtn, galBtn, resetBtns),
      msg
    );

    return h('div', { class: 'parent-overlay', role: 'dialog' },
      h('div', { class: 'p-card' },
        h('header', { class: 'p-head' }, h('h2', { text: P.title }), closeBtn),
        body
      )
    );
  }

  function open() {
    if (overlay) return;
    overlay = build();
    document.body.appendChild(overlay);
    UI.anim(overlay, [{ opacity: 0 }, { opacity: 1 }], { dur: 260 });
  }
  function close() {
    if (!overlay) return;
    overlay.remove();
    overlay = null;
    B.storage.save();
  }

  /* نافذة الاقتراحات (من الرئيسية): نص + وسيلة تواصل اختيارية، والإرسال عبر mailto إلى بريد صاحب المشروع */
  var fbOverlay = null;
  function openFeedback() {
    if (fbOverlay) return;
    var F = B.S.feedback;
    var ta = h('textarea', { class: 'p-ta', rows: 5, placeholder: F.text });
    var ct = h('input', { class: 'p-ta', type: 'text', placeholder: F.contact, style: { minHeight: '48px' } });
    var send = h('button', { class: 'p-btn', type: 'button', text: F.send });
    var close = h('button', { class: 'p-close', type: 'button', text: '✕', 'aria-label': B.S.buttons.close });
    function shut() { fbOverlay.remove(); fbOverlay = null; }
    close.addEventListener('click', shut);
    send.addEventListener('click', function () {
      if (!ta.value.trim()) { ta.focus(); return; }
      var to = ''; try { to = atob(B.S.feedbackMail); } catch (e) {}
      window.location.href = 'mailto:' + to + '?subject=' + encodeURIComponent(F.subject) +
        '&body=' + encodeURIComponent(ta.value + (ct.value.trim() ? '\n\n' + ct.value.trim() : ''));
    });
    fbOverlay = h('div', { class: 'parent-overlay', role: 'dialog' },
      h('div', { class: 'p-card' },
        h('header', { class: 'p-head' }, h('h2', { text: F.title }), close),
        h('div', { class: 'p-body scrollable' }, h('div', { class: 'p-line', text: F.note }), ta, ct, send)));
    document.body.appendChild(fbOverlay);
  }
  B.feedback = { open: openFeedback };

  /* لوحة الإدارة: كلمة سر (للتنظيم فقط، لا سرّ فيها) ثم أرقام الاستعمال */
  var adOverlay = null;
  function sha(s) { // تجزئة بسيطة كي لا تظهر كلمة السر نصاً في الكود
    return window.crypto && crypto.subtle ? crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function (b) {
      return Array.prototype.map.call(new Uint8Array(b), function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
    }) : Promise.resolve(s);
  }
  var ADMIN_HASH = 'bd2b80301c06f0463c086066d5d67f1633331da53416d15db5d847c033350fe3';
  function openAdmin() {
    if (adOverlay) return;
    var A = B.S.admin, S = B.S;
    var body = h('div', { class: 'p-body scrollable' });
    var close = h('button', { class: 'p-close', type: 'button', text: '✕', 'aria-label': S.buttons.close });
    close.addEventListener('click', function () { adOverlay.remove(); adOverlay = null; });
    adOverlay = h('div', { class: 'parent-overlay', role: 'dialog' }, h('div', { class: 'p-card' }, h('header', { class: 'p-head' }, h('h2', { text: A.title }), close), body));
    document.body.appendChild(adOverlay);
    var pw = h('input', { class: 'p-ta', type: 'password', placeholder: A.pass, style: { minHeight: '48px' }, inputmode: 'numeric' });
    var go = h('button', { class: 'p-btn', type: 'button', text: A.enter });
    var msg = h('div', { class: 'p-msg' });
    body.appendChild(pw); body.appendChild(go); body.appendChild(msg);
    function stat(label, n) { return h('div', { class: 'p-row' }, h('div', { class: 'p-game', text: label }), h('div', { class: 'p-nums', text: UI.num(n || 0) })); }
    function show() {
      body.innerHTML = '';
      if (!B.stats.enabled()) { body.appendChild(h('div', { class: 'p-warn', text: A.off })); return; }
      var out = h('div', { class: 'p-sec' }), rf = h('button', { class: 'p-btn', type: 'button', text: A.refresh });
      function load() {
        out.innerHTML = '';
        B.stats.read().then(function (d) {
          d = d || {};
          var dev = d.devices || {}, ev = d.events || {}, pl = d.play || {}, dn = d.done || {};
          out.appendChild(stat(A.visitors, dev['new'])); out.appendChild(stat(A.players, dev.player)); out.appendChild(stat(A.opens, ev.open));
          out.appendChild(h('h3', { text: A.games }));
          B.catalog.forEach(function (c) {
            out.appendChild(h('div', { class: 'p-row' }, h('div', { class: 'p-game', text: S.games[c.id] }),
              h('div', { class: 'p-nums' }, h('span', { text: A.started + ': ' + UI.num(pl[c.id] || 0) }), c.free ? null : h('span', { text: A.finished + ': ' + UI.num(dn[c.id] || 0) }))));
          });
        }).catch(function () { out.appendChild(h('div', { class: 'p-warn', text: A.fail })); });
      }
      rf.addEventListener('click', load);
      body.appendChild(rf); body.appendChild(out); load();
    }
    go.addEventListener('click', function () {
      sha(pw.value).then(function (x) { if (x === ADMIN_HASH) show(); else msg.textContent = A.bad; });
    });
  }
  B.admin = { open: openAdmin };

  B.parent = { open: open, close: close, isOpen: function () { return !!overlay; } };
})();
