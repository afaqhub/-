<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>كُنّاشة الفوائد</title>
<meta name="theme-color" content="#14323f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="كُنّاشة">
<meta name="description" content="كُنّاشة رقمية للفوائد العلمية">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700&family=Reem+Kufi:wght@400;600&family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f1e6; --paper2:#fffdf8; --ink:#1d2b36; --muted:#6b7b85;
  --navy:#14323f; --navy2:#1d4455; --gold:#b08d57; --gold-soft:#e8dcc4;
  --line:#e3dac7; --ok:#2e7d58; --warn:#9a6b1f; --danger:#9b3b32;
  --shadow:0 1px 2px rgba(20,50,63,.06),0 8px 24px rgba(20,50,63,.07);
  --r:16px; --fs:16px;
}
html[data-theme="dark"]{
  --paper:#11191e; --paper2:#18232a; --ink:#e9e3d6; --muted:#9aa9b2;
  --navy:#9fd0cf; --navy2:#cfe5e4; --gold:#d8b87c; --gold-soft:#2b3a42;
  --line:#2a3942; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Cairo",system-ui,"Segoe UI",sans-serif;
  background:var(--paper); color:var(--ink); font-size:var(--fs);
  line-height:1.8; -webkit-text-size-adjust:100%;
  background-image:radial-gradient(rgba(176,141,87,.07) 1px,transparent 1px);
  background-size:22px 22px;
  padding-bottom:96px;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--navy)}
.wrap{max-width:900px;margin:0 auto;padding:0 14px}

/* ===== Header ===== */
header{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%);
  color:#f6f1e6;box-shadow:var(--shadow)
}
html[data-theme="dark"] header{background:linear-gradient(180deg,#0e171c,#152027);color:var(--ink)}
.hd{display:flex;align-items:center;gap:10px;padding:10px 0}
.brand{font-family:"Amiri",serif;font-size:1.45rem;font-weight:700;letter-spacing:.5px;white-space:nowrap}
.brand span{color:var(--gold)}
.hd .sp{flex:1}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:rgba(255,255,255,.1);color:inherit;font-size:1.05rem}
html[data-theme="dark"] .iconbtn{background:rgba(255,255,255,.06)}
.iconbtn:active{transform:scale(.94)}
.modepill{font-size:.72rem;padding:3px 9px;border-radius:999px;background:var(--gold);color:#1d2b36;font-weight:700}
.modepill.guest{background:rgba(255,255,255,.18);color:inherit}

.searchrow{display:flex;gap:8px;padding:0 0 10px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--paper2);
  border-radius:12px;padding:8px 12px;color:var(--ink)}
.search input{flex:1;border:none;outline:none;background:transparent;min-width:0}

/* ===== Tabs ===== */
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:6px 14px;border-radius:999px;font-size:.86rem;
  background:var(--paper2);border:1px solid var(--line);color:var(--muted)}
.tab.on{background:var(--navy);color:#f6f1e6;border-color:var(--navy);font-weight:600}
html[data-theme="dark"] .tab.on{background:var(--gold);color:#11191e}

/* ===== Filters ===== */
.filters{margin-top:10px;background:var(--paper2);border:1px solid var(--line);
  border-radius:var(--r);padding:10px 12px;display:none}
.filters.open{display:block}
.frow{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.frow:last-child{margin-bottom:0}
.flabel{font-size:.78rem;color:var(--muted);min-width:52px}
.chip{font-size:.8rem;padding:4px 11px;border-radius:999px;border:1px solid var(--line);
  background:transparent;color:var(--muted)}
.chip.on{background:var(--gold-soft);border-color:var(--gold);color:var(--ink);font-weight:600}
html[data-theme="dark"] .chip.on{color:var(--gold)}
.countline{font-size:.8rem;color:var(--muted);padding:12px 2px 6px;display:flex;gap:10px;align-items:center}

/* ===== Cards ===== */
.cards{display:grid;gap:12px}
.card{background:var(--paper2);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--gold);opacity:.55}
.card.private::before{background:var(--navy)}
.card.draft::before{background:var(--warn)}
.ctop{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.badge{font-size:.7rem;padding:2px 9px;border-radius:999px;background:var(--gold-soft);color:var(--ink)}
html[data-theme="dark"] .badge{color:var(--gold)}
.badge.priv{background:transparent;border:1px solid var(--navy);color:var(--navy)}
.badge.draft{background:transparent;border:1px dashed var(--warn);color:var(--warn)}
.star{margin-inline-start:auto;color:var(--gold);font-size:1.05rem;opacity:.3}
.star.on{opacity:1}
.ctitle{font-weight:700;font-size:.98rem;margin:0 0 4px}
.ctext{font-family:"Amiri",serif;font-size:1.22rem;line-height:2;margin:0;
  display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.card.full .ctext{-webkit-line-clamp:unset;display:block}
.cite{margin-top:10px;font-size:.84rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.cite b{color:var(--ink);font-weight:600}
.tags{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.74rem;color:var(--muted);background:transparent;border:1px solid var(--line);
  padding:1px 8px;border-radius:999px}
.cacts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.sbtn{font-size:.78rem;padding:5px 11px;border-radius:10px;border:1px solid var(--line);color:var(--muted)}
.sbtn:hover{border-color:var(--gold);color:var(--ink)}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .big{font-size:2.4rem;opacity:.35}

/* ===== FAB ===== */
.fab{position:fixed;inset-inline-end:18px;bottom:22px;z-index:50;
  background:var(--navy);color:#f6f1e6;border-radius:999px;padding:14px 20px;
  font-weight:700;box-shadow:0 10px 26px rgba(20,50,63,.3);display:flex;gap:8px;align-items:center}
html[data-theme="dark"] .fab{background:var(--gold);color:#11191e}
.fab:active{transform:scale(.96)}

/* ===== Sheet / modal ===== */
.scrim{position:fixed;inset:0;background:rgba(10,20,26,.5);z-index:60;display:none;
  align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.scrim.open{display:flex}
.sheet{background:var(--paper);width:100%;max-width:760px;max-height:92vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:16px 16px 28px;animation:up .22s ease}
@media(min-width:760px){.scrim{align-items:center}.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.shhd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.shhd h3{margin:0;font-size:1.05rem}
.shhd .sp{flex:1}
label.fld{display:block;margin-bottom:10px}
label.fld span{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}
input.t,select.t,textarea.t{width:100%;padding:11px 12px;border:1px solid var(--line);
  border-radius:12px;background:var(--paper2);outline:none}
input.t:focus,textarea.t:focus,select.t:focus{border-color:var(--gold)}
textarea.main{font-family:"Amiri",serif;font-size:1.25rem;line-height:2;min-height:150px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
details.more{border:1px dashed var(--line);border-radius:12px;padding:8px 12px;margin:10px 0}
details.more summary{cursor:pointer;font-size:.88rem;color:var(--muted);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{margin-bottom:10px;color:var(--ink);font-weight:600}
.btn{padding:12px 18px;border-radius:12px;font-weight:700;background:var(--navy);color:#f6f1e6;width:100%}
html[data-theme="dark"] .btn{background:var(--gold);color:#11191e}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:600}
.btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.row2{display:flex;gap:8px}
.hint{font-size:.76rem;color:var(--muted);line-height:1.7}
.hint code{background:var(--gold-soft);padding:1px 5px;border-radius:5px;font-family:inherit}
html[data-theme="dark"] .hint code{color:var(--gold)}

/* detail */
.dtext{font-family:"Amiri",serif;font-size:1.35rem;line-height:2.2;white-space:pre-wrap}
.meta{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;font-size:.9rem}
.meta div{margin-bottom:5px}
.meta b{color:var(--muted);font-weight:600;margin-inline-end:6px}
.quote{background:var(--gold-soft);border-radius:12px;padding:12px;margin-top:12px;
  font-size:.86rem;white-space:pre-wrap;font-family:"Amiri",serif}
html[data-theme="dark"] .quote{background:#20303a}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--paper2);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:center}
.stat .n{font-size:1.7rem;font-weight:700;color:var(--navy);font-family:"Amiri",serif}
html[data-theme="dark"] .stat .n{color:var(--gold)}
.stat .l{font-size:.78rem;color:var(--muted)}
.bars{background:var(--paper2);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.bars h4{margin:0 0 10px;font-size:.92rem}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:.84rem}
.bar .nm{width:35%;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{flex:1;height:9px;background:var(--gold-soft);border-radius:999px;overflow:hidden}
.bar .fl{height:100%;background:var(--gold);border-radius:999px}
.bar .vl{width:28px;text-align:center;color:var(--muted)}

/* toast */
.toast{position:fixed;inset-inline:0;bottom:92px;z-index:70;display:flex;justify-content:center;pointer-events:none}
.toast div{background:var(--navy);color:#f6f1e6;padding:10px 16px;border-radius:999px;
  box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;font-size:.88rem;pointer-events:auto;
  animation:up .2s ease}
html[data-theme="dark"] .toast div{background:var(--gold);color:#11191e}
.toast button{font-weight:700;text-decoration:underline;color:inherit}
.loading{position:fixed;inset:0;background:rgba(246,241,230,.75);z-index:90;display:none;
  place-items:center;font-weight:600;backdrop-filter:blur(2px)}
html[data-theme="dark"] .loading{background:rgba(17,25,30,.8)}
.loading.on{display:grid}
.banner{display:flex;align-items:center;gap:8px;background:var(--gold-soft);border:1px solid var(--gold);
  border-radius:12px;padding:8px 12px;margin-top:10px;font-size:.84rem}
html[data-theme="dark"] .banner{color:var(--gold)}
.banner .sp{flex:1}
.banner button{font-size:.78rem;padding:3px 10px;border-radius:9px;border:1px solid var(--gold);color:inherit}
.card.pending{opacity:.75}
.card.pending::before{background:var(--muted)}
.badge.wait{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.demo{font-size:.76rem;text-align:center;color:var(--muted);padding:14px 10px 0}
.listsec{font-family:"Amiri",serif;font-size:1.05rem;color:var(--navy);margin:16px 2px 2px;font-weight:700}
html[data-theme="dark"] .listsec{color:var(--gold)}
.pbtn{display:block;width:100%;text-align:right;background:var(--paper2);border:1px solid var(--line);
  border-radius:12px;padding:11px 14px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.pbtn small{color:var(--muted);margin-inline-start:auto}

/* ===== إضافات الإصدار 2 ===== */
.hd .brand{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.hd .modepill{flex:none}
.iconbtn{flex:none}
.search{min-width:0}
.search span{flex:none}
.search input{width:100%}
.iconbtn{position:relative}
.iconbtn i{position:absolute;top:5px;inset-inline-end:5px;width:9px;height:9px;border-radius:50%;background:var(--gold);display:none}
.iconbtn i.on{display:block}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px}
.seg .chip{padding:5px 14px}
.sgw{position:relative}
.sg{position:absolute;inset-inline:0;top:100%;z-index:8;background:var(--paper2);border:1px solid var(--gold);
  border-radius:12px;max-height:210px;overflow:auto;display:none;box-shadow:var(--shadow);margin-top:3px}
.sg button{display:block;width:100%;text-align:right;padding:9px 12px;border-bottom:1px solid var(--line)}
.sg button:last-child{border-bottom:none}
.sg small{color:var(--muted);margin-inline-start:8px}
.badge.verify{background:transparent;border:1px dashed var(--danger);color:var(--danger)}
.badge.med{background:transparent;border:1px solid var(--gold);color:var(--ink)}
html[data-theme="dark"] .badge.med{color:var(--gold)}
.card.selmode{cursor:pointer}
.card.picked{outline:2px solid var(--gold)}
.pick{position:absolute;top:10px;inset-inline-end:12px;width:24px;height:24px;border-radius:7px;border:2px solid var(--gold);
  display:grid;place-items:center;font-size:.9rem;background:var(--paper2);color:var(--ink)}
.card.picked .pick{background:var(--gold);color:#1d2b36}
.selbar{position:fixed;inset-inline:0;bottom:0;z-index:55;background:var(--navy);color:#f6f1e6;padding:10px 14px;
  display:none;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:0 -6px 20px rgba(0,0,0,.2)}
html[data-theme="dark"] .selbar{background:#0e171c;color:var(--ink)}
.selbar.on{display:flex}
.selbar button{padding:6px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.35);color:inherit;font-size:.82rem}
.selbar .sp{flex:1}
.menu{display:grid;gap:8px}
.menu .pbtn{margin:0}
.menu .pbtn b{font-weight:600}
.menu .pbtn .ic{width:26px;text-align:center}
.menu h4{margin:10px 2px 0;font-size:.8rem;color:var(--muted);font-weight:600}
.pv{background:#00000010;border-radius:14px;padding:8px;display:grid;place-items:center;margin-bottom:10px}
.pv canvas{max-width:100%;max-height:52vh;width:auto;height:auto;border-radius:8px;box-shadow:var(--shadow)}
.row2 .btn{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.tabs2{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.pre{background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.84rem;
  white-space:pre-wrap;line-height:1.8;max-height:220px;overflow:auto;direction:rtl}
.mini{font-size:.78rem;color:var(--muted)}
.okc{color:var(--ok)} .warnc{color:var(--warn)} .badc{color:var(--danger)}
.msg{background:var(--paper2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.msg.new{border-color:var(--gold)}
.msg .mh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px;font-size:.8rem;color:var(--muted)}
.msg p{margin:4px 0;white-space:pre-wrap}
.tgl{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:.9rem}
.tgl input{width:20px;height:20px;accent-color:var(--gold)}
.sectitle{font-family:"Amiri",serif;font-size:1.05rem;color:var(--navy);margin:14px 0 6px;font-weight:700}
html[data-theme="dark"] .sectitle{color:var(--gold)}
.credit{text-align:center;color:var(--muted);font-size:.78rem;padding:18px 10px 0;line-height:2}
.credit button{text-decoration:underline;color:inherit}
.hp{position:absolute;inset-inline-start:-9999px;width:1px;height:1px;overflow:hidden}
.colmap{width:100%;border-collapse:collapse;font-size:.82rem;margin-bottom:10px}
.colmap td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.colmap select{padding:4px;border-radius:8px;border:1px solid var(--line);background:var(--paper2);width:100%}
.prog{height:8px;border-radius:99px;background:var(--gold-soft);overflow:hidden;margin:10px 0}
.prog span{display:block;height:100%;background:var(--gold);width:0;transition:width .2s}
input[type=range]{width:100%;accent-color:var(--gold)}
.guide{outline:2px dashed var(--gold);outline-offset:-2px}
/* ===== مدخل المنصة والبطاقات ===== */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:22px 20px 16px;margin-bottom:6px;color:#f6f1e6;text-align:center;
  background:radial-gradient(circle at 12% 0%,rgba(216,184,124,.25),transparent 55%),linear-gradient(160deg,var(--navy2),var(--navy))}
html[data-theme="dark"] .hero{background:radial-gradient(circle at 12% 0%,rgba(216,184,124,.16),transparent 55%),linear-gradient(160deg,#16262d,#0e171c);color:var(--ink)}
.hero::after{content:"";position:absolute;inset:0;opacity:.07;pointer-events:none;
  background-image:repeating-linear-gradient(45deg,#fff 0 1px,transparent 1px 22px),repeating-linear-gradient(-45deg,#fff 0 1px,transparent 1px 22px)}
.hero .hk{color:var(--gold);font-size:1.2rem;line-height:1}
.hero h2{font-family:"Amiri",serif;font-size:1.75rem;margin:2px 0 4px;line-height:1.5}
.hero p{margin:0 auto 10px;opacity:.85;font-size:.9rem;max-width:34em;line-height:1.8}
.hs{display:flex;justify-content:center;gap:18px;font-size:.8rem;opacity:.9;margin-bottom:10px}
.hs b{font-family:"Amiri",serif;font-size:1.2rem;color:var(--gold);margin-inline-end:3px}
.hc{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;position:relative;z-index:1}
.hc button{font-size:.78rem;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.12);color:inherit;border:1px solid rgba(255,255,255,.18)}
.hc button:active{background:rgba(255,255,255,.25)}
.gain{margin-top:8px;font-size:.88rem;color:var(--muted);border-inline-start:3px solid var(--gold);padding-inline-start:10px;line-height:1.9}
.gain b{color:var(--ink);font-weight:600}
.card.feat{border-color:var(--gold);background:linear-gradient(180deg,var(--paper2),var(--gold-soft))}
.card.feat::after{content:"”";position:absolute;inset-inline-end:14px;top:-18px;font:700 6rem/1 "Amiri",serif;color:var(--gold);opacity:.18;pointer-events:none}
.card.feat .ctext{font-size:1.4rem}
/* ===== معرض القوالب ===== */
.tg{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x proximity;scrollbar-width:thin}
.tcell{flex:none;width:118px;border-radius:14px;border:2px solid var(--line);padding:4px;background:var(--paper2);scroll-snap-align:start;display:flex;flex-direction:column;gap:4px;align-items:center;transition:border-color .15s,transform .15s}
.tcell canvas{width:100%;height:auto;border-radius:9px;background:var(--gold-soft);aspect-ratio:4/5}
.tcell span{font-size:.72rem;color:var(--muted);line-height:1.4;text-align:center}
.tcell.on{border-color:var(--gold);transform:translateY(-2px)}
.tcell.on span{color:var(--ink);font-weight:700}
/* ===== لمسات الإصدار 2.1 ===== */
.card{transition:box-shadow .15s ease, transform .15s ease}
.card:active{transform:scale(.995)}
.sbtn{transition:border-color .12s, background .12s}
.sbtn:active{background:var(--gold-soft)}
.btn{transition:opacity .12s, transform .08s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5}
.chip{transition:background .12s,border-color .12s}
.ctext{color:var(--ink)}
.cite{line-height:1.9}
.fab{bottom:calc(18px + env(safe-area-inset-bottom))}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="hd">
      <div class="brand" id="brand">كُنّاشة <span>الفوائد</span></div>
      <span class="modepill guest" id="modePill">زائر</span>
      <div class="sp"></div>

<script>
/* ============================================================
   كُنّاشة الفوائد — الإصدار 2
   طبقة البيانات db.*  منفصلة عن الواجهة، وكل ما يخص شخصًا أو منصةً بعينها
   يُضبط من «الإعدادات» لا من الكود، فالملف نفسه يصلح لأي صاحب منصة.
   ============================================================ */

/* ---------- 1) الاتصال بخادم Google Apps Script ---------- */
/* ================================================================
   ⚙️ الإعداد الوحيد المطلوب — ضع رابط السكربت هنا:

   انقر نقرتين متتاليتين على العبارة العربية في السطر التالي
   (الصق_رابط_السكربت_هنا) لتتحدد كلها، ثم اضغط Ctrl+V
   فيحلّ رابطك (المنتهي بـ /exec) محلّ العبارة. ثم احفظ وارفع الملف.
   ================================================================ */

const SERVER_URL = 'الصق_رابط_السكربت_هنا';

const SRV='k_server', TOK='k_token';
const SERVER_RE=/^https:\/\/script\.google\.com\/.+\/exec$/;
/** الرابط المضمَّن في الملف، وإن بقيت العبارة العربية أو كان غير صالح عُدّ غير مضمَّن. */
const EMBEDDED_URL=SERVER_RE.test((SERVER_URL||'').trim())?SERVER_URL.trim():'';
function srv(){ return EMBEDDED_URL || (localStorage.getItem(SRV)||'').trim(); }
function setSrv(u){ try{localStorage.setItem(SRV,u.trim())}catch(e){} }
function tok(){ try{return localStorage.getItem(TOK)||''}catch(e){return ''} }
function setTok(t){ try{ t?localStorage.setItem(TOK,t):localStorage.removeItem(TOK) }catch(e){} }

/** يرسل طلبًا. إن أُعطي رابطًا آخر (استقبال الطلبات) لا يُرسَل معه رمز الجلسة أبدًا. */
async function api(fn,args,otherUrl){
  const url=otherUrl||srv();
  if(!url) throw new Error('لم يُضبط رابط الخادم بعد');
  let res;
  try{
    res = await fetch(url,{ method:'POST', redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},          // لا application/json: يمنع طلب الإذن المسبق
      body: JSON.stringify({token:otherUrl?'':tok(), fn:fn, args:args||{}}) });
  }catch(e){ throw new Error('تعذّر الاتصال بالخادم — تحقّق من الإنترنت ومن رابط الخادم'); }
  const txt = await res.text();
  let j; try{ j=JSON.parse(txt) }catch(e){
    throw new Error('رد غير متوقّع من الخادم — غالبًا رابط النشر خاطئ أو الوصول ليس «أي شخص»');
  }
  if(!j.ok){
    if(j.auth){ setTok(''); st.owner=false; }
    const err=new Error(j.error||'خطأ في الخادم');
    if(j.mustChange){ err.mustChange=true; st.mustChange=true; }
    throw err;
  }
  return j.data;
}

const db = {
  async boot(ver,owner){ return await api('boot',{ver:ver||'',owner:!!owner}); },
  async settings(){ return await api(st.owner?'settingsOwner':'settings'); },
  async meta(){ return await api(st.owner?'meta':'metaPublic'); },
  async list(owner){ return await api(owner?'list':'listPublic'); },
  async trash(){ return await api('trash'); },
  async get(id,owner){ return await api(owner?'get':'getPublic',{id}); },
  async save(obj){ const r = await api('save',{item:obj}); return r.id; },
  async setField(id,field,value){ return await api('setField',{id,field,value}); },
  async remove(id){ return await api('remove',{id}); },
  async restore(id){ return await api('restore',{id}); },
  async purge(id){ return await api('purge',{id}); },
  async addMeta(kind,value){ return await api('addMeta',{kind,value}); },
  async metaCounts(){ return await api('metaCounts'); },
  async due(){ return await api('due'); },
  async review(id,grade){ return await api('review',{id,grade}); },
  async reading(){ return await api('reading'); },
  async renameMeta(kind,from,to){ return await api('renameMeta',{kind,from,to}); },
  async mergeMeta(kind,from,to){ return await api('mergeMeta',{kind,from,to}); },
  async deleteMeta(kind,value){ return await api('deleteMeta',{kind,value}); },
  async saveSettings(settings){ return await api('saveSettings',{settings}); },
  async emptyTrash(){ return await api('emptyTrash'); },
  async changePassword(oldPw,newPw){ return await api('changePassword',{old:oldPw,neu:newPw}); },
  async exportAll(){ return await api('exportAll'); },
  async people(){ return await api('people'); },
  async savePerson(name,data){ return await api('savePerson',{name,data}); },
  async importBatch(items,options){ return await api('importBatch',{items,options}); },
  async importMeta(payload){ return await api('importMeta',payload); },
  async trashAll(){ return await api('trashAll'); },
  async messages(){ return await api('messages'); },
  async setMessageStatus(id,status){ return await api('setMessageStatus',{id,status}); },
  async deleteMessage(id){ return await api('deleteMessage',{id}); },
  async templates(){ return await api('templates'); },
  async templateImage(id){ return await api('templateImage',{id}); },
  async saveTemplate(o){ return await api('saveTemplate',o); },
  async deleteTemplate(id){ return await api('deleteTemplate',{id}); },
  async contact(o){
    const ext=((st.cfg||{})['رابط استقبال الطلبات']||'').trim();
    return await api('contact',o, SERVER_RE.test(ext)?ext:undefined);
  },
  async login(password){
    const r = await api('login',{password});
    if(r && r.ok && r.token){ setTok(r.token); return r; }
    return null;
  },
  async checkToken(){
    if(!tok()) return false;
    try{ return (await api('checkToken'))||{ok:true}; }
    catch(e){ return e.mustChange?{ok:true,mustChange:true}:false; }
  },
  async logout(){ try{ await api('logout'); }catch(e){} setTok(''); }
};

/* ---------- 2) أدوات ---------- */
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function norm(s){ return (s||'')
  .replace(/[ً-ْٰـ]/g,'')
  .replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/[ىئ]/g,'ي').replace(/ؤ/g,'و')
  .replace(/\s+/g,' ').trim().toLowerCase(); }
function dupKey(t){ return norm(t).replace(/[^ء-غف-يa-z0-9 ]/g,'').replace(/\s+/g,' ').trim().slice(0,70); }
function hijri(iso){
  if(!iso) return '';
  try{ return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'}).format(new Date(iso)); }
  catch(e){ return ''; }
}
function greg(iso){ if(!iso) return ''; try{return new Intl.DateTimeFormat('ar',{day:'numeric',month:'long',year:'numeric'}).format(new Date(iso))}catch(e){return ''} }
function toast(msg,actionLabel,action){
  const t=$('#toast'); t.innerHTML='';
  const b=el('div',null,esc(msg));
  if(actionLabel){const a=el('button',null,esc(actionLabel));a.onclick=()=>{t.innerHTML='';action&&action()};b.appendChild(a);}
  t.appendChild(b); clearTimeout(toast._t); toast._t=setTimeout(()=>t.innerHTML='',5000);
}
function busy(on,msg){ const l=$('#loading'); if(msg) l.textContent=msg; l.classList.toggle('on',!!on); }
const AR_DIG='٠١٢٣٤٥٦٧٨٩';
function arDigits(s){ return String(s==null?'':s).replace(/[0-9]/g,d=>AR_DIG[d]); }
function latDigits(s){ return String(s==null?'':s).replace(/[٠-٩]/g,d=>AR_DIG.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)); }
function safeUrl(u){ u=String(u||'').trim(); return /^https?:\/\/[^\s]+$/i.test(u)?u:''; }
function cfg(k,d){ const v=(st.cfg||{})[k]; return (v===undefined||v==='')?(d===undefined?'':d):v; }
function yes(k,d){ return cfg(k,d||'لا')==='نعم'; }
function download(name,blobOrText,type){
  const b=blobOrText instanceof Blob?blobOrText:new Blob([blobOrText],{type:type||'text/plain;charset=utf-8'});
  const u=URL.createObjectURL(b), a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}
const MEDIA_ICON={سماع:'🎧',مشاهدة:'🎬',مجلس:'👥',قراءة:'📖',إنترنت:'🌐'};
const ALL_MEDIUMS=['قراءة','سماع','مشاهدة','مجلس','إنترنت'];

/** «32:15» أو «1:02:03» أو «د 32» (دقيقة) ← ثوانٍ */
function parseTime(s){
  s=latDigits(s||'').replace(/[دم]\.?\s*/,'').trim();
  let m=s.match(/^(\d{1,2}):(\d{2}):(\d{2})$/); if(m) return +m[1]*3600+ +m[2]*60+ +m[3];
  m=s.match(/^(\d{1,3}):(\d{2})$/); if(m) return +m[1]*60+ +m[2];
  m=s.match(/^(\d{1,3})$/); if(m) return +m[1]*60;
  return null;
}
/** رابط الفائدة؛ وإن كان يوتيوب مع دقيقة فرابطٌ يقفز إلى الثانية نفسها. */
function mediaLink(i){
  const u=safeUrl(i.link); if(!u) return '';
  if(i.medium==='سماع'||i.medium==='مشاهدة'){
    const t=parseTime(i.locus);
    if(t!=null){
      let m=u.match(/^https?:\/\/(?:www\.|m\.)?youtube\.com\/watch\?([^#]*)/i);
      if(m){ const q=m[1].replace(/(^|&)(t|start)=[^&]*/g,'').replace(/^&/,''); return u.split('?')[0]+'?'+q+(q?'&':'')+'t='+t+'s'; }
      m=u.match(/^https?:\/\/youtu\.be\/([\w-]+)/i);
      if(m) return 'https://youtu.be/'+m[1]+'?t='+t;
    }
  }
  return u;
}
function locusText(i){
  if(!i.locus) return '';
  if((i.medium==='سماع'||i.medium==='مشاهدة') && parseTime(i.locus)!=null) return 'الدقيقة '+i.locus;
  return i.locus;
}

/* ---------- 3) الحالة ---------- */
const st={ owner:false, mustChange:false, tab:'all', q:'', f:{cat:'',speaker:'',ref:'',type:'',tag:'',medium:''},
           limit:20, sort:'', meta:null, items:[], cfg:{}, session:null, queue:[], sel:null, mediums:ALL_MEDIUMS.slice() };
const ADMIN_TABS={reading:'سجل القراءة',stats:'إحصاءات',admin:'لوحة التحكم',trash:'سلة المحذوفات',inbox:'الرسائل'};
const NOFILTER={cat:'',speaker:'',ref:'',type:'',tag:'',medium:''};

/* ---------- 4) الإقلاع السريع ----------
   طلب واحد يجلب كل شيء، والنسخة المحفوظة في الجهاز تُعرض فورًا، وإن لم يتغيّر شيء في الخادم
   (رقم النسخة نفسه) لا يُقرأ الجدول أصلًا. */
const IDB={ db:null,
  open(){ return new Promise(res=>{ try{ const r=indexedDB.open('kunnasha',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); }catch(e){ res(null); } }); },
  async tx(mode,fn){ const d=this.db||(this.db=await this.open()); if(!d) return null;
    return new Promise(res=>{ try{ const t=d.transaction('kv',mode), q=fn(t.objectStore('kv')); q.onsuccess=()=>res(q.result===undefined?null:q.result); q.onerror=()=>res(null); }catch(e){ res(null); } }); },
  get(k){ return this.tx('readonly',s=>s.get(k)); },
  set(k,v){ return this.tx('readwrite',s=>s.put(v,k)); },
  del(k){ return this.tx('readwrite',s=>s.delete(k)); }
};
const cacheKey=role=>srv()+'|'+role;
const cacheGet=role=>IDB.get(cacheKey(role));
function cacheSet(role,d){ return IDB.set(cacheKey(role),{ver:d.ver,settings:d.settings,meta:d.meta,items:d.items,at:Date.now()}); }

function applyData(d){
  st.cfg=d.settings||st.cfg; st.meta=d.meta; st.items=d.items; st.ver=d.ver;
  st.mediums=[...new Set(ALL_MEDIUMS.concat(d.meta.mediums||[]))];
  applySettings();
}
/** يُطبّق ردّ الخادم. يعيد 'must' إن لزم تغيير كلمة المرور، و'same' إن لم يتغيّر شيء، و'fresh' إن وصلت بيانات جديدة. */
function handleBoot(r,presumedOwner){
  st.owner=!!r.owner; st.mustChange=!!r.mustChange;
  if(presumedOwner && !r.owner){ IDB.del(cacheKey('o')); setTok(''); }        // انتهت صلاحية الرمز: ارجع زائرًا
  if(r.mustChange){ renderChrome0(); forceChangeSheet(); return 'must'; }
  if(r.same){ st.ver=r.ver; renderChrome(); render(); return 'same'; }
  applyData(r); cacheSet(r.owner?'o':'g',r); renderChrome(); render(); return 'fresh';
}
/** أول فتح: اعرض ما في الجهاز فورًا ثم حدّثه من الخادم. */
async function bootLoad(){
  const presumed=!!tok();
  const cached=await cacheGet(presumed?'o':'g');
  st.fromCache=false;
  if(cached){ st.owner=presumed; applyData(cached); st.fromCache=true; renderChrome(); render(); }
  else busy(true,'جارٍ الاتصال بالخادم…');
  try{ const r=await db.boot(cached&&cached.ver,presumed); busy(false); return handleBoot(r,presumed); }
  catch(e){ busy(false); if(cached && isNetworkError(e)){ toast('لا اتصال — تعرض آخر نسخة محفوظة في جهازك'); return 'offline'; } throw e; }
}

/** رابط جاهز يربط جهازًا آخر بخادمك: يُفتح فيُسأل مرة واحدة ثم يُحفظ. لا يُقبل إن كان للجهاز خادم مضبوط أصلًا. */
function linkAnother(){ return location.origin+location.pathname+'#srv='+encodeURIComponent(srv()); }
function adoptHashServer(){
  const m=(location.hash||'').match(/(?:^#|&)srv=([^&]+)/); if(!m) return;
  let u=''; try{ u=decodeURIComponent(m[1]); }catch(e){}
  const keep=location.hash.slice(1).split('&').filter(x=>x&&!x.startsWith('srv='));
  try{ history.replaceState(null,'',location.pathname+location.search+(keep.length?'#'+keep.join('&'):'')); }catch(e){}
  if(srv()||!SERVER_RE.test(u)) return;      // مضبوط مسبقًا: نتجاهل الرابط حمايةً من التوجيه إلى خادم غريب
  const tail=u.replace(/^https:\/\/script\.google\.com\/macros\/s\//,'').slice(0,14)+'…'+u.slice(-12);
  if(confirm('هذا الرابط يربط الكُنّاشة بالخادم:\n'+tail+'\n\nاضغط «موافق» فقط إن كان خادمك أنت (أرسلتَه لنفسك).')) setSrv(u);
}

/** ملف server.txt بجانب الصفحة (فيه رابط الخادم وحده): يعمل لكل الأجهزة والزوار دون تعديل أي كود. */
async function fileServer(){
  try{
    const c=new AbortController(), t=setTimeout(()=>c.abort(),4000);
    const r=await fetch('server.txt?_='+Date.now(),{cache:'no-store',signal:c.signal}); clearTimeout(t);
    if(!r.ok) return '';
    const u=(await r.text()).trim().split(/\s+/)[0];
    return SERVER_RE.test(u)?u:'';
  }catch(e){ return ''; }
}

(async function(){
  adoptHashServer();
  document.documentElement.dataset.theme = localStorage.getItem('k_theme')||'light';
  document.documentElement.style.setProperty('--fs',(localStorage.getItem('k_fs')||16)+'px');
  loadSession(); loadQueue();
  bindChrome();
  if(!EMBEDDED_URL){
    if(!srv()){ const f=await fileServer(); if(f){ setSrv(f); st.srvFromFile=true; } }
    else fileServer().then(f=>{ if(!f) return; if(f!==srv()){ setSrv(f); location.reload(); } else st.srvFromFile=true; });   // الملف يغلب المحفوظ
  }
  if(!srv()){ serverSheet(); return; }          // أول فتح: اطلب رابط الخادم
  try{
    const res=await bootLoad();
    if(res==='must') return;
    flushQueue(false);
    handleHash();
    restoreDraftNotice();
    maybeWelcome();
  }catch(e){ busy(false); fatal(e.message); }
})();

/** شاشة إدخال رابط الخادم (تظهر مرة واحدة في كل جهاز) */
function serverSheet(){
  openSheet(`<div class="shhd"><h3>ربط الكُنّاشة بخادمك</h3></div>
    <p class="hint">الصق رابط تطبيق الويب الذي نسخته من Apps Script (ينتهي بـ <code>/exec</code>). يُحفظ في هذا الجهاز فقط، ويُطلب مرة واحدة في كل جهاز.</p>
    <p class="hint">💡 <b>لا تريد لصقه في كل جهاز؟</b> بعد أن تتصل مرة، افتح <b>☰ ← لوحة التحكم ← ربط الأجهزة والزوار</b>: تنشئ ملفًا صغيرًا اسمه <code>server.txt</code> على GitHub فتعمل الصفحة على كل الأجهزة ولدى الزوار دون سؤال.</p>
    <p class="hint">إن كنتَ زائرًا فهذه الصفحة لم تُضبط بعد، فاطلب الرابط الصحيح من صاحبها.</p>
    <label class="fld"><span>رابط الخادم</span>
      <input class="t" id="srvin" dir="ltr" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(srv())}"></label>
    <button class="btn" id="srvgo">اتصال</button>
    <p class="hint" id="srvmsg" style="margin-top:10px"></p>`, true);
  $('#srvin').focus();
  const go=async()=>{
    const u=$('#srvin').value.trim();
    if(!SERVER_RE.test(u)){
      $('#srvmsg').innerHTML='<span style="color:var(--danger)">الرابط غير صحيح — يبدأ بـ https://script.google.com ‏وينتهي بـ /exec</span>'; return;
    }
    setSrv(u); busy(true,'جارٍ التحقّق…');
    try{
      const res=await bootLoad();
      busy(false); closeSheet(true);
      if(res==='must') return;
      toast('تم الاتصال بخادمك بنجاح');
      maybeWelcome();
    }catch(e){ busy(false); setSrv(''); $('#srvmsg').innerHTML='<span style="color:var(--danger)">'+esc(e.message)+'</span>'; }
  };
  $('#srvgo').onclick=go; $('#srvin').onkeydown=e=>{if(e.key==='Enter')go()};
}

function fatal(msg){
  $('#view').innerHTML='';
  const b=el('div','empty','<div class="big">⚠</div><p>'+esc(msg)+'</p>');
  const r=el('button','btn ghost','إعادة المحاولة'); r.onclick=()=>location.reload();
  const c=el('button','btn ghost','تغيير رابط الخادم'); c.style.marginTop='8px'; c.onclick=()=>{setSrv('');serverSheet()};
  b.append(r,c); $('#view').appendChild(b);
}

/** إعادة تحميل كل شيء بطلب واحد (بعد أي تعديل). */
async function refresh(){
  busy(true,'جارٍ التحميل…');
  try{
    const r=await db.boot('',st.owner);        // بلا رقم نسخة: نريد البيانات كاملة
    busy(false); handleBoot(r,st.owner);
  }catch(e){
    busy(false);
    if(!st.meta) st.meta={categories:[],speakers:[],refs:[],tags:[],types:[],mediums:st.mediums,people:[]};
    renderChrome();
    // انقطاع الاتصال وعندنا بيانات محمَّلة: أبقِ ما هو معروض ولا تُفرغ الشاشة
    if(isNetworkError(e) && (st.items.length || st.queue.length)){ render(); toast('لا اتصال — تعرض آخر نسخة محمَّلة'); }
    else fatal(e.message);
  }
}

function seriesNames(){ return [...new Set(st.items.map(i=>i.series).filter(Boolean))]; }

/* ---------- 5) الواجهة العامة ---------- */
function bindChrome(){
  $('#q').addEventListener('input',e=>{st.q=e.target.value;st.limit=perPage();$('#qclear').style.display=e.target.value?'block':'none';render()});
  $('#qclear').onclick=()=>{$('#q').value='';st.q='';$('#qclear').style.display='none';render()};
  $('#btnFilters').onclick=()=>$('#filters').classList.toggle('open');
  $('#btnTheme').onclick=()=>{const d=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=d?'light':'dark';localStorage.setItem('k_theme',d?'light':'dark')};
  $('#btnMenu').onclick=()=>menuSheet();

/* ---------- 6) التصفية والبحث ---------- */
function filtered(){
  let a=(st.owner?queuedAsItems():[]).concat(st.items);
  if(st.tab==='star') a=a.filter(i=>i.starred);
  if(st.tab==='draft') a=a.filter(i=>i.status==='مسودة'||i.verify);
  if(st.tab==='private') a=a.filter(i=>i.visibility==='خاصة');
  const f=st.f;
  if(f.cat) a=a.filter(i=>i.cat===f.cat);
  if(f.speaker) a=a.filter(i=>i.speaker===f.speaker||i.via===f.speaker);
  if(f.ref) a=a.filter(i=>i.ref===f.ref);
  if(f.type) a=a.filter(i=>i.type===f.type);
  if(f.medium) a=a.filter(i=>(i.medium||'قراءة')===f.medium);
  if(f.tag) a=a.filter(i=>(i.tags||[]).includes(f.tag));
  if(st.sort==='old') a=a.slice().reverse(); else if(st.sort==='star') a=a.slice().sort((x,y)=>(y.starred?1:0)-(x.starred?1:0));
  const q=norm(st.q);
  if(q){ const w=q.split(' ').filter(Boolean);
    a=a.filter(i=>{ const hay=norm([i.title,i.text,i.speaker,i.via,i.ref,i.locus,i.cat,i.series,i.anchor,i.note,(i.tags||[]).join(' ')].join(' '));
      return w.every(x=>hay.includes(x)); }); }
  return a;
}

/* ---------- 7) العرض ---------- */
function render(){
  const v=$('#view'); v.innerHTML='';
  $('#countline').innerHTML='';
  if(!st.meta) return;
  if(st.tab==='stats') return renderStats(v);
  if(st.tab==='trash') return renderTrash(v);
  if(st.tab==='admin') return renderAdmin(v);
  if(st.tab==='inbox') return renderInbox(v);
  if(st.tab==='due') return renderDue(v);
  if(st.tab==='series') return renderSeries(v);
  if(st.tab==='reading') return renderReading(v);
  if(st.tab==='speakers') return renderIndex(v,'speaker','القائلون');
  if(st.tab==='refs') return renderIndex(v,'ref','المراجع');

  const a=filtered();
  const act=Object.keys(st.f).filter(k=>st.f[k]);
  if(act.length||st.q){
    const bar=el('div','chips'); bar.style.margin='0 0 8px';
    act.forEach(k=>{ const b=el('button','chip on','✕ '+esc(st.f[k])); b.onclick=()=>{st.f[k]='';renderChrome();render()}; bar.appendChild(b); });
    const c=el('button','chip','مسح كل التصفية'); c.onclick=()=>{ st.f=Object.assign({},NOFILTER); st.q=''; $('#q').value=''; $('#qclear').style.display='none'; renderChrome(); render(); }; bar.appendChild(c);
    v.appendChild(bar);
  }
  $('#countline').innerHTML = `<span>النتائج: <b>${a.length}</b></span>` +
    (st.owner?`<span>· خاصة: ${a.filter(i=>i.visibility==='خاصة').length}</span><span>· تحتاج استكمالًا: ${a.filter(i=>i.status==='مسودة'||i.verify).length}</span>`:'');
  if(!a.length){
    const hasFilter=st.q||Object.values(st.f).some(Boolean);
    v.appendChild(el('div','empty','<div class="big">✣</div><p>'+(hasFilter?'لا توجد فوائد مطابقة.':(st.owner?'لا فوائد بعد — اضغط «＋ فائدة» لتدوين أول فائدة.':'لا فوائد عامة بعد.'))+'</p>'));
    return;
  }

  if(!st.q && st.tab==='all' && !Object.values(st.f).some(Boolean) && a.length>3 && !st.sel){
    const pool=a.filter(i=>!i._pending), r=pool[Math.floor(Math.random()*pool.length)]||a[0];
    v.appendChild(heroBlock(a.length));
    v.appendChild(el('div','listsec','فائدة اليوم'));
    const fc=card(r,true); fc.classList.add('feat'); v.appendChild(fc);
    v.appendChild(el('div','listsec','كل الفوائد'));
  }
  const wrapEl=el('div','cards');
  a.slice(0,st.limit).forEach(i=>wrapEl.appendChild(card(i)));
  v.appendChild(wrapEl);
  if(a.length>st.limit){
    const b=el('button','btn ghost','عرض المزيد ('+(a.length-st.limit)+')');
    b.style.marginTop='14px'; b.onclick=()=>{st.limit+=perPage();render()}; v.appendChild(b);
  }
}

/** مدخل المنصة: اسمها ووصفها وأرقامها وتصنيفاتها — يستقبل الزائر والمالك معًا. */

function card(i,featured){
  const picked=st.sel&&st.sel.has(i.id);
  const c=el('div','card'+(i.visibility==='خاصة'?' private':'')+(i.status==='مسودة'?' draft':'')+(i._pending?' pending':'')+(st.sel?' selmode':'')+(picked?' picked':''));
  if(st.sel && !i._pending){
    c.appendChild(el('span','pick',picked?'✓':''));
    c.onclick=()=>{ if(st.sel.has(i.id)) st.sel.delete(i.id); else st.sel.add(i.id); render(); renderSelbar(); };
  }
  const top=el('div','ctop');
  if(i.medium && i.medium!=='قراءة') top.appendChild(el('span','badge med',(MEDIA_ICON[i.medium]||'')+' '+esc(i.medium)));
  if(i.type) top.appendChild(el('span','badge',esc(i.type)));
  if(i.cat) top.appendChild(el('span','badge',esc(i.cat)));
  if(st.owner&&i.visibility==='خاصة') top.appendChild(el('span','badge priv','خاصة'));
  if(i.status==='مسودة') top.appendChild(el('span','badge draft','مسودة'));
  if(i.verify) top.appendChild(el('span','badge verify','⚠ تحتاج تحقق'));
  if(i._pending) top.appendChild(el('span','badge wait','⏳ بانتظار الإرسال'));
  if(i.series&&st.tab!=='series') top.appendChild(el('span','badge','⛓ '+esc(i.series)));
  if(!st.sel){
    const star=el('button','star'+(i.starred?' on':''),'★');
    star.onclick=async e=>{e.stopPropagation(); if(!st.owner)return; await db.setField(i.id,'starred',!i.starred); i.starred=!i.starred; render();};
    top.appendChild(star);
  }
  c.appendChild(top);
  if(i.title){ const tt=norm(i.title).replace('…','').trim(); if(tt!==norm(i.text).slice(0,tt.length)) c.appendChild(el('h3','ctitle',esc(i.title))); }
  c.appendChild(el('p','ctext',esc(i.text)));
  if(i.gain) c.appendChild(el('div','gain','<b>من فوائد هذا الكلام:</b> '+esc(i.gain)));
  const cite=citation(i);
  if(cite) c.appendChild(el('div','cite',cite));
  if((i.tags||[]).length){
    const t=el('div','tags'); i.tags.forEach(x=>{
      const b=el('button','tag','#'+esc(x));
      b.onclick=e=>{e.stopPropagation();if(st.sel)return;st.f.tag=x;st.limit=perPage();renderChrome();render();window.scrollTo({top:0,behavior:'smooth'})};
      t.appendChild(b)});
    c.appendChild(t);
  }
  if(st.sel){ if(featured) c.classList.add('full'); return c; }
  const acts=el('div','cacts');
  if(i._pending){
    const rm=el('button','sbtn','حذف من الانتظار');
    rm.onclick=()=>{ st.queue=st.queue.filter(q=>q.tmp!==i.id); persistQueue(); render(); toast('حُذفت من قائمة الانتظار'); };
    acts.appendChild(rm); c.appendChild(acts); return c;
  }
  const open=el('button','sbtn','عرض'); open.onclick=()=>detail(i.id); acts.appendChild(open);
  const im=el('button','sbtn','🖼 صورة'); im.onclick=()=>imageSheet([i]); acts.appendChild(im);
  if(st.owner){
    if(i.verify){
      const ok=el('button','sbtn','✓ تم التحقق'); ok.onclick=async()=>{await db.setField(i.id,'verify',false);await refresh();toast('أُزيلت علامة التحقق')};
      acts.appendChild(ok);
    }
    const ed=el('button','sbtn','تعديل'); ed.onclick=()=>editor(i); acts.appendChild(ed);
    const mo=el('button','sbtn','⋯'); mo.title='المزيد'; mo.onclick=()=>moreSheet(i); acts.appendChild(mo);
  } else {
    const cp=el('button','sbtn','نسخ موثّق'); cp.onclick=()=>copyCited(i); acts.appendChild(cp);
  }
  c.appendChild(acts);
  if(featured) c.classList.add('full');
  return c;
}

function moreSheet(i){
  openSheet(`${shhd('خيارات الفائدة')}<div class="menu" id="mn"></div>`);
  const A=[

function citation(i){
  const p=[]; if(i.speaker)p.push('<b>'+esc(i.speaker)+'</b>');
  if(i.ref)p.push(esc(i.ref)+(i.locus?' ('+esc(locusText(i))+')':''));
  else if(i.locus&&i.medium==='مجلس')p.push(esc(i.locus));
  if(i.via)p.push('نقلًا عن '+esc(i.via));
  const ml=(i.medium==='سماع'||i.medium==='مشاهدة')&&mediaLink(i);
  let s=p.length?'— '+p.join('، '):'';
  if(ml) s+=(s?' ':'')+`<a href="${esc(ml)}" target="_blank" rel="noopener">▶ استمع من الموضع</a>`;
  else if(i.medium==='إنترنت'&&safeUrl(i.link)) s+=(s?' ':'')+`<a href="${esc(safeUrl(i.link))}" target="_blank" rel="noopener">🔗 فتح المصدر</a>`;
  if(!s) return st.owner&&i.status==='مسودة'?'<span style="color:var(--warn)">بلا توثيق — تحتاج استكمال</span>':'';
  return s;
}
function citeText(i){
  const p=[]; if(i.speaker)p.push(i.speaker);
  if(i.ref)p.push(i.ref+(i.locus?' ('+locusText(i)+')':''));
  else if(i.locus&&i.medium==='مجلس')p.push(i.locus);
  if(i.via)p.push('نقلًا عن '+i.via);
  return '«'+i.text+'»'+(p.length?'\n— '+p.join('، '):'')+(i.gain?'\nمن فوائد هذا الكلام: '+i.gain:'');
}
function copyCited(i){
  const t=citeText(i);
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>toast('نُسخت الفائدة بتوثيقها'),()=>fallbackCopy(t));
  else fallbackCopy(t);
}
function fallbackCopy(t){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('نُسخ')}catch(e){toast('تعذّر النسخ')}a.remove();}
function copyText(t,msg){
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>toast(msg||'نُسخ'),()=>fallbackCopy(t));
  else fallbackCopy(t);
}

function renderIndex(v,field,label){
  const map={};
  st.items.forEach(i=>{ [i[field]].concat(field==='speaker'?[i.via]:[]).forEach(k=>{ if(k) map[k]=(map[k]||0)+1; }); });
  const keys=Object.keys(map).sort((a,b)=>map[b]-map[a]);
  if(!keys.length){v.appendChild(el('div','empty','<p>لا شيء بعد.</p>'));return}
  $('#countline').innerHTML=`<span>${esc(label)}: <b>${keys.length}</b></span>`;
  keys.forEach(k=>{
    const b=el('button','pbtn',`<span>${esc(k)}</span><small>${map[k]} فائدة</small>`);
    b.onclick=()=>{st.f[field]=k;st.tab='all';st.limit=perPage();renderChrome();render();window.scrollTo({top:0,behavior:'smooth'})};
    v.appendChild(b);
  });
}

/* ---------- التحديد المتعدد ---------- */
function startSelect(){ st.sel=new Set(); st.tab='all'; renderChrome(); render(); toast('اضغط على الفوائد لتحديدها'); }
function endSelect(){ st.sel=null; renderChrome(); render(); }
function renderSelbar(){
  const b=$('#selbar'); if(!b) return;
  b.classList.toggle('on',!!st.sel); b.innerHTML='';
  if(!st.sel) return;
  const add=(l,fn)=>{const x=el('button',null,l);x.onclick=fn;b.appendChild(x)};
  b.appendChild(el('span',null,'المحدّد: <b>'+st.sel.size+'</b>'));

  add('عامة',()=>bulkField('visibility','عامة'));
  add('خاصة',()=>bulkField('visibility','خاصة'));

}
async function bulkField(field,value){
  const ids=[...st.sel]; if(!ids.length) return toast('حدّد فائدة أولًا');
  busy(true,'جارٍ التنفيذ…');
  try{ for(const id of ids) await db.setField(id,field,value); busy(false); endSelect(); await refresh(); toast('تم تعديل '+ids.length+' فائدة'); }
  catch(e){ busy(false); toast(e.message); }
}

/** source(): مصفوفة نصوص أو {n:الاسم المعتمد, a:[بدائل]}. تكتب أول حرف فيظهر الاسم كاملًا. */
function attachSuggest(input, source, multi){
  const wrap=input.parentElement; wrap.classList.add('sgw');
  const box=el('div','sg'); wrap.appendChild(box);
  const show=()=>{
    let v=input.value; if(multi) v=v.split(/[،,]/).pop();
    const q=norm(v); box.innerHTML='';
    if(!q){ box.style.display='none'; return; }
    const sc=[];
    (source()||[]).forEach(o=>{
      o=typeof o==='string'?{n:o,a:[]}:o;
      if(norm(o.n)===q) return;
      let best=0, via='';
      [o.n].concat(o.a||[]).forEach((x,k)=>{
        const nx=norm(x); let s=0;
        if(nx.startsWith(q)) s=4; else if(nx.split(' ').some(w=>w.startsWith(q))) s=3; else if(nx.includes(q)) s=2;
        if(s>best||(s===best&&k===0)){ if(s>0){best=s; via=k>0?x:'';} }
      });
      if(best>0) sc.push([best,o,via]);
    });
    sc.sort((a,b)=>b[0]-a[0]||a[1].n.length-b[1].n.length);
    sc.slice(0,6).forEach(([,o,via])=>{
      const b=el('button',null,esc(o.n)+(via?`<small>(${esc(via)})</small>`:''));
      b.type='button';
      b.onpointerdown=e=>{
        e.preventDefault();
        if(multi){ const parts=input.value.split(/[،,]/); parts[parts.length-1]=' '+o.n; input.value=parts.map(s=>s.trim()).filter(Boolean).join('، ')+'، '; }
        else input.value=o.n;
        box.style.display='none'; input.dispatchEvent(new Event('change'));
        input.focus();
      };
      box.appendChild(b);
    });
    box.style.display=sc.length?'block':'none';
  };
  input.addEventListener('input',show);
  input.addEventListener('blur',()=>setTimeout(()=>{box.style.display='none'},180));
}
function peopleSource(){ const m=st.meta||{}; const people=m.people||[]; const known=new Set(people.map(p=>p.n));
  return people.map(p=>({n:p.n,a:p.a})).concat((m.speakers||[]).filter(s=>!known.has(s)).map(s=>({n:s,a:[]}))); }

function autoTitle(t){ const s=t.replace(/\s+/g,' ').trim(); return s.length<=40?s:s.slice(0,40)+'…'; }
function parseShortcuts(t){
  const out={tags:[],cat:'',speaker:'',ref:'',locus:'',via:'',star:false,medium:''};
  t=t.replace(/\[([^\]\[]+?)\s+([\d٠-٩]+\/[\d٠-٩]+|ص\s*[\d٠-٩]+|د\s*[\d:٠-٩]+)\]/g,(m,a,b)=>{
    out.ref=a.trim();
    if(/^د/.test(b)){ out.locus=b.replace(/^د\s*/,'').trim(); out.medium='سماع'; } else out.locus=b.trim();
    return ''; });
  t=t.replace(/\[([^\]\[]{2,60})\]/g,(m,a)=>{if(!out.ref)out.ref=a.trim();return ''});
  t=t.replace(/(^|\s)@([^\s@#~]+)/g,(m,s,a)=>{if(!out.speaker)out.speaker=a.replace(/_/g,' ');return s});
  t=t.replace(/(^|\s)~([^\s@#~]+)/g,(m,s,a)=>{if(!out.via)out.via=a.replace(/_/g,' ');return s});
  t=t.replace(/(^|\s)#([^\s#@~]+)/g,(m,s,a)=>{const v=a.replace(/_/g,' ');if(!out.cat)out.cat=v;else out.tags.push(v);return s});
  t=t.replace(/(^|\s)!(\s|$)/g,(m,s)=>{out.star=true;return s});
  out.text=t.replace(/\s+\n/g,'\n').replace(/[ \t]{2,}/g,' ').trim();
  return out;
}
function remember(o){ try{localStorage.setItem('k_last',JSON.stringify({speaker:o.speaker,ref:o.ref,cat:o.cat,medium:o.medium}))}catch(e){} }
function last(k){ try{return (JSON.parse(localStorage.getItem('k_last'))||{})[k]||''}catch(e){return ''} }

  let d=''; try{d=localStorage.getItem(DRAFT)||''}catch(e){}

}

  openSheet(`${shhd('تفاصيل: '+p.name)}
    <label class="fld"><span>الاسم المعتمد (الذي يظهر في كل مكان)</span><input class="t" id="pp_name" value="${esc(p.name)}"></label>
    <label class="fld"><span>أسماء بديلة (افصل بفاصلة) — إن كُتبت في فائدة تحوّلت إلى الاسم المعتمد</span>
      <input class="t" id="pp_al" value="${esc((p.aliases||[]).join('، '))}"></label>
    <div class="grid2">
      <label class="fld"><span>الدعاء في الصور</span><input class="t" id="pp_dua" list="dl_dua" value="${esc(p.dua||'')}" placeholder="رحمه الله">
        <datalist id="dl_dua"><option value="رحمه الله"><option value="حفظه الله"><option value="رضي الله عنه"><option value="رضي الله عنها"><option value="عليه الصلاة والسلام"></datalist></label>
      <label class="fld"><span>سنة الوفاة (اختياري)</span><input class="t" id="pp_death" value="${esc(p.death||'')}"></label>
    </div>
    <label class="fld"><span>ما يراه الزوار</span><select class="t" id="pp_hide">
      <option value="" ${!p.hide?'selected':''}>يظهر اسمه عاديًّا</option>
      <option value="الاسم" ${p.hide==='الاسم'?'selected':''}>يُحجب اسمه فقط (تبقى فوائده)</option>
      <option value="كل شيء" ${p.hide==='كل شيء'?'selected':''}>يُحجب كل ما يتعلق به (لا تظهر فوائده قائلًا ولا وسيطًا)</option></select></label>
    <label class="fld" id="pp_repw"><span>عبارة تظهر بدل اسمه (مثل: بعض أهل العلم) — اختياري</span><input class="t" id="pp_rep" value="${esc(p.rep||'')}"></label>
    <label class="fld"><span>نبذة (خاصة بك)</span><input class="t" id="pp_bio" value="${esc(p.bio||'')}"></label>
    <p class="hint">تنبيه: الحجب يشمل حقول القائل والوسيط، لكنه لا يعدّل اسمًا وُرد داخل نص الفائدة نفسه.</p>
    <button class="btn" id="pp_save">حفظ</button>`);
  const sync=()=>{ $('#pp_repw').style.display=$('#pp_hide').value==='الاسم'?'block':'none'; };
  $('#pp_hide').onchange=sync; sync();
  $('#pp_save').onclick=async()=>{
    busy(true,'جارٍ الحفظ…');
    try{
      await db.savePerson(isNew?'':p.name,{name:$('#pp_name').value.trim(),aliases:$('#pp_al').value,dua:$('#pp_dua').value.trim(),
        death:$('#pp_death').value.trim(),hide:$('#pp_hide').value,rep:$('#pp_rep').value.trim(),bio:$('#pp_bio').value.trim()});
      busy(false); closeSheet(); await refresh(); toast('حُفظت بيانات الشخص');
    }catch(e){ busy(false); toast(e.message); }
  };
}

/** نافذة إدخال نص واحد */
function promptSheet(title,label,value,cb){
  openSheet(`${shhd(title)}
    <label class="fld"><span>${esc(label)}</span><input class="t" id="pv" value="${esc(value||'')}"></label>
    <button class="btn" id="ok">حفظ</button><p class="hint" id="pm"></p>`);
  $('#pv').focus();
  const go=async()=>{ const val=$('#pv').value.trim(); if(!val){$('#pm').textContent='اكتب قيمة';return}
    busy(true,'جارٍ الحفظ…'); try{ await cb(val); busy(false); closeSheet(); }
    catch(e){ busy(false); $('#pm').innerHTML='<span style="color:var(--danger)">'+esc(e.message)+'</span>'; } };
  $('#ok').onclick=go; $('#pv').onkeydown=e=>{if(e.key==='Enter')go()};
}

/** نافذة اختيار من قائمة */
function pickSheet(title,options,cb){
  if(!options.length){ toast('لا يوجد عنصر آخر للدمج فيه'); return; }
  openSheet(`${shhd(title)}<div id="opts"></div>`);
  const box=$('#opts');
  options.forEach(o=>{ const b=el('button','pbtn',esc(o));
    b.onclick=async()=>{ busy(true,'جارٍ التنفيذ…'); try{ await cb(o); busy(false); closeSheet(); }
      catch(e){ busy(false); toast(e.message); } };
    box.appendChild(b); });
}

/* ---------- 12) الرسائل (الوارد) ---------- */
async function renderInbox(v){
  $('#countline').innerHTML='';
  v.innerHTML='<div class="empty">جارٍ التحميل…</div>';
  let a; try{ a=await db.messages(); }catch(e){ v.innerHTML=''; return fatal(e.message); }
  v.innerHTML='';
  if(st.meta) st.meta.inbox=a.filter(m=>m.status==='جديد').length; $('#menuDot').classList.toggle('on',!!(st.meta&&st.meta.inbox));
  if(!a.length){ v.appendChild(el('div','empty','<div class="big">✉</div><p>لا رسائل بعد.</p><p class="hint">تصلك هنا طلبات «أريد منصة مثلها» والأسئلة وملاحظات الزوار على الفوائد.</p>')); return; }
  $('#countline').innerHTML=`<span>الرسائل: <b>${a.length}</b></span><span>· جديدة: ${a.filter(m=>m.status==='جديد').length}</span>`;
  a.forEach(m=>{
    const c=el('div','msg'+(m.status==='جديد'?' new':''));
    c.innerHTML=`<div class="mh"><span class="badge">${esc(m.kind)}</span><span>${esc(hijri(m.at))}</span><span class="badge ${m.status==='جديد'?'':'priv'}">${esc(m.status)}</span>${m.auto?'<span class="badge">رد تلقائي أُرسل</span>':''}</div>
      <p><b>${esc(m.name||'بلا اسم')}</b>${m.showName?' <small class="mini">(يسمح بذكر اسمه)</small>':''}</p>
      ${m.contact?`<p dir="ltr" style="text-align:right">${contactLink(m.contact)}</p>`:'<p class="mini">لم يترك وسيلة تواصل</p>'}
      ${m.message?`<p>${esc(m.message)}</p>`:''}`;
    const acts=el('div','cacts');
    if(m.factId){ const f=el('button','sbtn','فتح الفائدة '+m.factId); f.onclick=()=>detail(m.factId); acts.appendChild(f); }
    const mk=(l,s)=>{const b=el('button','sbtn',l);b.onclick=async()=>{await db.setMessageStatus(m.id,s);renderInbox($('#view'))};return b};
    if(m.status!=='تم الرد') acts.appendChild(mk('✓ تم الرد','تم الرد'));
    if(m.status!=='مؤرشف') acts.appendChild(mk('أرشفة','مؤرشف'));
    if(m.status!=='جديد') acts.appendChild(mk('إعادة كجديدة','جديد'));
    const d=el('button','sbtn','حذف'); d.style.color='var(--danger)';
    d.onclick=async()=>{ if(!confirm('حذف الرسالة؟'))return; await db.deleteMessage(m.id); renderInbox($('#view')); };
    acts.appendChild(d); c.appendChild(acts); v.appendChild(c);
  });
}
function contactLink(c){
  const e=esc(c);
  if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c)) return `<a href="mailto:${e}">${e}</a>`;
  const ph=latDigits(c).replace(/[\s\-()]/g,'');
  if(/^\+?\d{7,15}$/.test(ph)) return `<a href="https://wa.me/${esc(ph.replace(/^\+/,'').replace(/^00/,''))}" target="_blank" rel="noopener">${e}</a>`;
  return e;
}

async function renderTrash(v){
  let a; try{ a=await db.trash(); }catch(e){ return fatal(e.message); }
  $('#countline').innerHTML=`<span>المحذوفة: <b>${a.length}</b></span>`;
  if(!a.length){v.appendChild(el('div','empty','<div class="big">🗑</div><p>السلة فارغة.</p>'));return}

function loadQueue(){ try{ st.queue=JSON.parse(localStorage.getItem(QKEY))||[] }catch(e){ st.queue=[] } }
function persistQueue(){ try{ localStorage.setItem(QKEY,JSON.stringify(st.queue)) }catch(e){} }
function isNetworkError(e){
  const m=String(e&&e.message||'');
  return m.indexOf('تعذّر الاتصال')>=0 || m.indexOf('رد غير متوقّع')>=0 || !navigator.onLine;
}
/** الحفظ الآمن: يحاول الإرسال، فإن تعذّر حفظ في الجهاز وأرسل تلقائيًّا عند عودة الاتصال. التعديل لا يُصفّ. */
async function saveItem(obj){
  try{
    const id=await db.save(obj);
    return {id, queued:false};
  }catch(e){
    if(!isNetworkError(e) || obj.id) throw e;
    const tmp='Q-'+Date.now()+'-'+Math.random().toString(36).slice(2,6);
    st.queue.push({tmp, obj, at:new Date().toISOString()});
    persistQueue();
    return {id:tmp, queued:true};
  }
}
let flushing=false;
async function flushQueue(loud){
  if(flushing || !st.queue.length) { if(loud&&!st.queue.length) toast('لا شيء في الانتظار'); return; }
  if(!srv() || !st.owner) return;
  flushing=true;
  let sent=0, stop=false;
  while(st.queue.length && !stop){
    const item=st.queue[0];
    try{ await db.save(item.obj); st.queue.shift(); persistQueue(); sent++; }
    catch(e){ stop=true; if(loud) toast(isNetworkError(e)?'ما زال الاتصال متعذّرًا':e.message); }
  }
  flushing=false;
  if(sent){ toast('أُرسلت '+sent+' فائدة كانت في الانتظار'); await refresh(); }
  else renderBanners();
}
function queuedAsItems(){
  return st.queue.map(q=>Object.assign({},q.obj,{
    id:q.tmp, createdAt:q.at, updatedAt:q.at, _pending:true, status:q.obj.status||'منشورة'
  }));
}

function normKey(s){ return norm(s).replace(/[\s_\-:.()\/\\*#"'`«»\[\]|]/g,''); }
const KEYMAP=(()=>{ const m={}; Object.keys(FIELD_ALIASES).forEach(f=>FIELD_ALIASES[f].forEach(a=>{ const k=normKey(a); if(k&&!m[k]) m[k]=f; })); return m; })();

function cleanText(s){
  return String(s==null?'':s).replace(/\r/g,'').replace(/\*\*|__/g,'')
    .replace(/^\s*(?:[-*•]|[\d٠-٩]+[.)\-–])\s+/,'')
    .replace(/^[\s«"“'‘]+|[\s»"”'’]+$/g,'')
    .replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
}
function truthy(v){ return v===true||v===1||/^(نعم|ايوه|أجل|yes|true|y|1|✓|✔|★|⭐)$/i.test(String(v==null?'':v).trim()); }
function normMedium(v){
  v=String(v||'').trim(); if(!v) return '';
  if(st.mediums.includes(v)) return v;
  if(/سماع|صوت|محاضر|درس|مسموع|audio|listen/i.test(v)) return 'سماع';
  if(/مشاهد|فيديو|يوتيوب|video|youtube|watch/i.test(v)) return 'مشاهدة';
  if(/مجلس|خطب|مجالس|majlis/i.test(v)) return 'مجلس';
  if(/قراء|كتاب|book|read/i.test(v)) return 'قراءة';
  return '';
}
function parseDateAny(v){
  if(!v) return ''; if(v instanceof Date) return isNaN(v)?'':v.toISOString();
  const s=latDigits(String(v)).trim(); if(!/\d{4}|\d{1,2}[\/\-.]\d{1,2}/.test(s)) return '';
  const d=new Date(s); return isNaN(d)?'':d.toISOString();
}
/** يحوّل كائنًا خامًّا (بمفاتيح الحقول) إلى فائدة نظيفة، أو null إن لم يكن فيه نص. */
function coerceItem(r){
  const S=v=>cleanText(v).replace(/\n+/g,' ').trim();
  const text=cleanText(r.text); if(!text) return null;
  const o={ text };
  const put=(k,v)=>{ if(v!==undefined&&v!=='') o[k]=v; };
  put('title',S(r.title).slice(0,200)); put('speaker',S(r.speaker)); put('ref',S(r.ref)); put('locus',S(r.locus));
  put('via',S(r.via).replace(/^(نقلا|نقلًا)\s*عن\s*/,'')); put('cat',S(r.cat)); put('type',S(r.type).slice(0,40));
  put('gain',S(r.gain).slice(0,600)); put('note',cleanText(r.note)); put('series',S(r.series)); put('anchor',S(r.anchor));
  const link=safeUrl(S(r.link)); if(link) o.link=link; else if(S(r.link)) o._badLink=true;
  let tags=r.tags; if(!Array.isArray(tags)) tags=String(tags==null?'':tags).split(/[،,;؛|\n]/);
  tags=tags.map(x=>S(x).replace(/^#/,'')).filter(Boolean); if(tags.length) o.tags=tags;
  const med=normMedium(r.medium); if(med) o.medium=med;
  const so=Number(latDigits(r.sorder)); if(so>0) o.sorder=so;
  const vis=String(r.visibility||'').trim(); if(/^(عامة|عام|public)$/i.test(vis)) o.visibility='عامة'; else if(/^(خاصة|خاص|private)$/i.test(vis)) o.visibility='خاصة';
  if(r.starred!==undefined&&r.starred!=='') o.starred=truthy(r.starred);
  if(r.verify!==undefined&&r.verify!=='') o.verify=truthy(r.verify);
  const stt=String(r.status||'').trim(); if(stt==='منشورة'||stt==='مسودة') o.status=stt;
  const cd=parseDateAny(r.createdAt); if(cd) o.createdAt=cd;
  const id=String(r.id||'').trim(); if(/^F-\d{4,}$/.test(id)) o.id=id;
  return o;
}

/* ---------- القارئات ---------- */
function stripFences(t){ return t.replace(/^\uFEFF/,'').replace(/^\s*```[\w-]*\s*\n?/,'').replace(/\n?\s*```\s*$/,'').trim(); }

function parseAny(raw){
  let t=stripFences(String(raw||'')); const out={kind:'',items:[],rawCount:0,meta:null,table:null,warnings:[]};
  if(!t) return out;
  // 1) JSON
  if(/^[\[{]/.test(t)){
    let j=null;
    try{ j=JSON.parse(t); }catch(e){ try{ j=JSON.parse(t.replace(/,\s*([\]}])/g,'$1')); }catch(e2){ j=null; } }
    if(j){
      let arr=null;
      if(Array.isArray(j)) arr=j;
      else if(j && Array.isArray(j.items)){ arr=j.items;
        if(j.format==='kunnasha'||j.people||j.refs||j.categories) out.meta={people:j.people||[],refs:j.refs||[],categories:j.categories||[],settings:j.settings||null}; }
      else if(j && typeof j==='object'){ const k=Object.keys(j).find(x=>Array.isArray(j[x])); if(k) arr=j[k]; }
      if(arr){
        out.kind='json'; out.rawCount=arr.length;
        arr.forEach((x,n)=>{
          const r=typeof x==='string'?{text:x}:remapKeys(x||{});
          const c=coerceItem(r); if(c) out.items.push(c); else out.warnings.push('العنصر '+(n+1)+' بلا نص — تُجوهل');
        });
        return out;
      }
    }
  }
  // 2) جدول Markdown
  const lines=t.replace(/\r/g,'').split('\n');
  const pipe=lines.filter(l=>/^\s*\|.*\|\s*$/.test(l));
  if(pipe.length>=3){
    const rows=pipe.filter(l=>!/^\s*\|?[\s:\-|]+\|?\s*$/.test(l)).map(l=>l.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));
    if(rows.length>=2) return fromTable(rows,out,'جدول');
  }
  // 3) TSV
  const tabLines=lines.filter(l=>l.includes('\t'));
  if(tabLines.length>=2 && tabLines.length>=lines.filter(l=>l.trim()).length*0.8) return fromTable(lines.filter(l=>l.trim()).map(l=>l.split('\t').map(c=>c.trim())),out,'جدول');
  // 4) كتل «مفتاح: قيمة»
  const blocks=parseBlocks(lines);
  if(blocks.length){
    out.kind='blocks'; out.rawCount=blocks.length;
    blocks.forEach((b,n)=>{ const c=coerceItem(b); if(c) out.items.push(c); else out.warnings.push('الكتلة '+(n+1)+' بلا نص — تُجوهلت'); });
    return out;
  }
  // 5) قائمة مرقّمة أو فقرات
  const loose=parseLoose(lines);
  out.kind='loose'; out.rawCount=loose.length;
  loose.forEach(x=>{
    const p=parseShortcuts(x);
    const c=coerceItem({text:p.text,cat:p.cat,speaker:p.speaker,ref:p.ref,locus:p.locus,via:p.via,tags:p.tags,starred:p.star,medium:p.medium});
    if(c) out.items.push(c);
  });
  return out;
}
function remapKeys(obj){
  const r={}; Object.keys(obj).forEach(k=>{ const f=KEYMAP[normKey(k)]; if(f && r[f]===undefined) r[f]=obj[k]; }); return r;
}
function parseBlocks(lines){
  const sepRe=/^\s*(?:[-=*_]{3,}|#{1,4}\s*(?:الفائدة|فائدة)?\s*[\d٠-٩]*\s*[:：.\-)]*|(?:\*\*)?(?:الفائدة|فائدة)\s*(?:رقم\s*)?[\d٠-٩]+\s*(?:\*\*)?\s*[:：.\-)]*)\s*$/;
  const keyRe=/^\s*(?:[-*•>]+\s*)?(?:\*\*|__)?\s*([^:：\n]{1,32}?)\s*(?:\*\*|__)?\s*[:：]\s*(?:\*\*|__)?\s*(.*)$/;
  const blocks=[]; let cur={}, lastKey=null, sawKey=false;
  const flush=()=>{ if(Object.keys(cur).length) blocks.push(cur); cur={}; lastKey=null; };
  lines.forEach(line=>{
    if(sepRe.test(line)){ flush(); return; }
    const m=keyRe.exec(line), f=m&&KEYMAP[normKey(m[1])];
    if(f){ sawKey=true; if(cur[f]!==undefined) flush(); cur[f]=m[2].trim(); lastKey=f; return; }
    if(!line.trim()){ if(lastKey==='text'&&cur.text) cur.text+='\n'; return; }
    if(lastKey) cur[lastKey]+=(cur[lastKey]?'\n':'')+line.trim();
    else if(sawKey||Object.keys(cur).length){ /* سطر شارد قبل أي مفتاح */ cur.text=(cur.text?cur.text+'\n':'')+line.trim(); lastKey='text'; }
  });
  flush();
  if(!sawKey) return [];
  return blocks.filter(b=>Object.keys(b).length);
}
function parseLoose(lines){
  const numRe=/^\s*(?:[\d٠-٩]+\s*[.)\-–—:]|[-*•])\s+(.*)$/;
  const nonEmpty=lines.filter(l=>l.trim());
  const numbered=nonEmpty.filter(l=>numRe.test(l)).length>=2;
  const items=[];
  if(numbered){
    let cur=null;
    lines.forEach(l=>{ const m=numRe.exec(l);
      if(m){ if(cur!==null) items.push(cur); cur=m[1].trim(); }
      else if(l.trim()&&cur!==null) cur+='\n'+l.trim(); });
    if(cur!==null) items.push(cur);
  } else {
    lines.join('\n').split(/\n\s*\n/).forEach(p=>{ if(p.trim()) items.push(p.trim()); });
  }
  return items;
}
/** جدول (مصفوفة صفوف): الصف الأول عناوين. يعيد معاينة قابلة لتعديل المطابقة. */
function fromTable(rows,out,label){
  rows=rows.filter(r=>r.some(c=>String(c==null?'':c).trim()!==''));
  const headers=rows[0].map(h=>String(h==null?'':h).trim());
  const data=rows.slice(1);
  const map=headers.map(h=>KEYMAP[normKey(h)]||'');
  // لا عمود نصّ؟ خذ أطول الأعمدة متوسطًا
  if(!map.includes('text')){
    let best=-1,bl=0; headers.forEach((h,c)=>{ const avg=data.reduce((s,r)=>s+String(r[c]==null?'':r[c]).length,0)/(data.length||1); if(avg>bl&&!map[c]){bl=avg;best=c;} });
    if(best>=0) map[best]='text';
  }
  out.kind='table'; out.table={headers,rows:data,map,label}; out.rawCount=data.length;
  out.items=tableItems(out.table,out.warnings);
  return out;
}
function tableItems(tb,warnings){
  const items=[];
  tb.rows.forEach((r,n)=>{
    const raw={}; tb.map.forEach((f,c)=>{ if(f && raw[f]===undefined && r[c]!==undefined && r[c]!=='') raw[f]=r[c]; });
    const c=coerceItem(raw); if(c) items.push(c); else if(warnings) warnings.push('الصف '+(n+2)+' بلا نص — تُجوهل');
  });
  return items;
}
function parseCSV(text){
  text=text.replace(/^\uFEFF/,'');
  const first=text.split('\n')[0]||''; const delim=[[',',(first.match(/,/g)||[]).length],[';',(first.match(/;/g)||[]).length],['\t',(first.match(/\t/g)||[]).length]].sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++} else q=false; } else cell+=ch; }
    else if(ch==='"') q=true;
    else if(ch===delim){ row.push(cell); cell=''; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cell); cell=''; rows.push(row); row=[]; }
    else cell+=ch;
  }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows;
}
function loadXlsx(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=()=>window.XLSX?res(window.XLSX):rej(new Error('تعذّر تحميل مكتبة Excel'));
    s.onerror=()=>rej(new Error('تعذّر تحميل مكتبة Excel — تحقّق من الإنترنت، أو احفظ الملف بصيغة CSV ثم استورده'));
    document.head.appendChild(s);
  });
}
async function readFileToParsed(file){
  const name=(file.name||'').toLowerCase();
  if(/\.(xlsx|xls|xlsm|ods)$/.test(name)){
    const X=await loadXlsx();
    const wb=X.read(await file.arrayBuffer(),{type:'array',cellDates:true});
    let pick=wb.SheetNames.find(n=>/الفوائد|فوائد|facts|items/i.test(n))||null, best=null, bestRows=-1;
    const tables=wb.SheetNames.map(n=>({n,rows:X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''})}));
    tables.forEach(t=>{ if(t.rows.length>bestRows){bestRows=t.rows.length;best=t;} });
    const chosen=(pick&&tables.find(t=>t.n===pick&&t.rows.length>1))||best;
    if(!chosen||chosen.rows.length<2) throw new Error('لم أجد صفوفًا في الملف');
    const out=fromTable(chosen.rows,{kind:'',items:[],rawCount:0,meta:null,table:null,warnings:[]},'Excel — ورقة «'+chosen.n+'»');
    return out;
  }
  const text=await file.text();
  if(/\.csv$/.test(name)){
    const rows=parseCSV(text);
    return fromTable(rows,{kind:'',items:[],rawCount:0,meta:null,table:null,warnings:[]},'CSV');
  }
  return parseAny(text);
}

function mappingUI(box,P){
  const tb=P.table; if(!tb) return;
  const opts=['<option value="">— تجاهل —</option>'].concat(Object.keys(FIELD_LABELS).map(f=>`<option value="${f}">${esc(FIELD_LABELS[f])}</option>`)).join('');
  box.innerHTML=`<details class="more" ${tb.map.includes('text')?'':'open'}><summary>مطابقة الأعمدة (${tb.headers.length}) — عدّلها إن أخطأت المنصة</summary>
    <table class="colmap">${tb.headers.map((h,c)=>`<tr><td>${esc(h||('عمود '+(c+1)))}</td><td><select data-c="${c}">${opts}</select></td></tr>`).join('')}</table>
    <button class="btn ghost" id="im_remap">تحديث المعاينة</button></details>`;
  box.querySelectorAll('select').forEach(s=>{ s.value=tb.map[+s.dataset.c]||''; });
  $('#im_remap').onclick=()=>{
    box.querySelectorAll('select').forEach(s=>{ tb.map[+s.dataset.c]=s.value; });
    P.warnings=[]; P.items=tableItems(tb,P.warnings); importPreview();
  };
}

async function runImport(){
  const P=IM.parsed; let items=P.items.slice();
  const dupOn=$('#im_dup').checked, mode=$('#im_mode').value, ver=$('#im_ver').checked, vis=$('#im_vis').value;
  if(dupOn) items=items.filter(i=>!i._dup);
  if(!items.length) return toast('لا فوائد جديدة للاستيراد');
  if(mode==='replace' && !confirm('ستُنقل فوائدك الحالية كلها إلى السلة ثم تُستورد هذه. يُنزَّل لك أولًا ملف نسخة احتياطية. متابعة؟')) return;
  const go=$('#im_go'), prog=$('#im_prog'), bar=prog.firstElementChild;
  go.disabled=true; prog.style.display='block';
  const say=m=>{$('#im_msg').innerHTML=m};
  let added=0, skipped=0, bad=0;
  try{
    if(mode==='replace'){
      say('جارٍ تجهيز نسخة احتياطية…');
      download('kunnasha-backup-before-replace-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(await db.exportAll(),null,2),'application/json');
      await db.trashAll();
    }
    if(P.meta && $('#im_meta') && $('#im_meta').checked){
      say('جارٍ استيراد القائلين والمراجع…');
      await db.importMeta({people:P.meta.people,refs:P.meta.refs,categories:P.meta.categories,
        settings:($('#im_set')&&$('#im_set').checked)?P.meta.settings:null});
    }
    const CH=100;
    for(let k=0;k<items.length;k+=CH){
      say('جارٍ الحفظ… '+Math.min(k+CH,items.length)+' من '+items.length);
      const chunk=items.slice(k,k+CH).map(i=>{ const c=Object.assign({},i); delete c._dup; delete c._doc; delete c._badLink; return c; });
      const r=await db.importBatch(chunk,{skipDup:dupOn,forceDraft:ver,markVerify:ver,visibility:vis});
      added+=r.added; skipped+=r.skipped; bad+=r.bad;
      bar.style.width=Math.round(Math.min(k+CH,items.length)/items.length*100)+'%';
    }
    say(`<span class="okc">تم: أُضيفت ${added} فائدة</span>${skipped?' · تُخطّيت '+skipped+' مكررة':''}${bad?' · تعذّر '+bad:''}`);
    await refresh(); toast('أُضيفت '+added+' فائدة');
    if(ver) setTimeout(()=>{ closeSheet(); st.tab='draft'; renderChrome(); render(); },1200);
  }catch(e){
    say('<span class="badc">'+esc(e.message)+'</span> — ما أُضيف قبل العطب محفوظ، ويمكنك إعادة الاستيراد وسيتخطى المكرر.');
  }finally{ go.disabled=false; }
}

/* ---------- نص الأمر للذكاء الاصطناعي ---------- */
function buildAiPrompt(o){
  const isAudio=o.kind==='audio';
  const src=(isAudio?'المحاضرة أو المقطع':'الكتاب')+(o.title?' «'+o.title+'»':'')+(o.author?' لـ'+o.author:'');
  const fieldHints={ 'فقه':'مسائل الخلاف والترجيح، وعلل الأحكام، والضوابط والقواعد، وما يُغفل عنه في التطبيق العملي.',
    'حديث':'فقه الحديث، وعلل الأحاديث ودرجاتها، وفوائد الإسناد، وما يُستنبط من ألفاظه.',
    'تفسير':'دقائق التفسير، وسبب الاختيار بين الأقوال، واللطائف البلاغية، والروابط بين الآيات.',
    'عقيدة':'تحرير المسائل، والفروق بين المصطلحات، والرد المختصر على الشبهات، ونقل الإجماع.',
    'تربية وسلوك':'الفوائد التربوية والسلوكية العملية، وأمراض القلوب وعلاجها، واللمحات الإيمانية.',
    'سيرة وتاريخ':'الدروس والعبر المستنبطة، وتحرير الوقائع، والفوائد الدعوية.',
    'لغة وأدب':'الفروق اللغوية، والشواهد، والنكت النحوية والبلاغية.',
    'عام':'أي فائدة نفيسة تنفع طالب العلم.' };
  const hint=fieldHints[o.field]||fieldHints['عام'];
  return `أنا طالب علم، وأريد منك استخراج «فوائد نفيسة» من ${src} الذي أرفقه لك.

العدد: ${o.count} فائدة على الأكثر، وأقل منها إن لم تجد ما يستحق. الجودة مقدَّمة على الكثرة.

ما الفائدة النفيسة؟
• وحدة موضوعية مكتملة تُفهم وحدها دون الرجوع إلى السياق.
• فيها ما هو دقيق أو غير بدهي: اختيار أو ترجيح، أو نقل إجماع أو خلاف، أو قاعدة أو ضابط، أو تنبيه على وهم شائع، أو علّة حكم، أو لطيفة في الاستنباط، أو فائدة تربوية، أو ربط بين مسألتين.
• في هذا الفن (${o.field}) ركّز على: ${hint}
• قصيرة: من سطر إلى ثلاثة أسطر (نحو 20 إلى 70 كلمة).

ما لا أريده: المعلومات البدهية المعروفة (مثل «الركوع ركن من أركان الصلاة»)، وتعريف الأبواب، وسرد العناوين، وتكرار الفكرة بصياغات مختلفة.

قواعد الدقة (مهمة جدًّا):
1. انقل كلام المؤلف أو لخّصه بأمانة، ولا تُضف من عندك. وإن كان نقلًا حرفيًّا فاجعل «النوع: نقل»، وإن كان تلخيصًا فاجعله «فائدة».
2. لا تخترع رقم صفحة ولا جزءًا${isAudio?' ولا دقيقة':''}. إن لم تكن متأكدًا فاترك «الموضع» فارغًا.
3. إن نقل المؤلف كلامًا عن غيره (قال ابن كثير ناقلًا عن ابن جرير) فاكتب صاحب الكلام الأصلي في «القائل»، والناقل في «الوسيط».
4. لا تنسب كلامًا إلى غير قائله، وإن شككت فاترك الحقل فارغًا.
${o.author?`5. اجعل «القائل» هو «${o.author}» ما لم يكن الكلام منسوبًا لغيره.\n`:''}
صيغة الإخراج (التزمها حرفيًّا): كل فائدة في كتلة مستقلة، تفصل بين الكتل بسطر فيه ثلاث شرطات ---، وكل حقل في سطر بصيغة «اسم الحقل: القيمة». لا تستعمل جداول ولا ترقيمًا، ولا تكتب أي شرح خارج الكتل.

---
الفائدة: (نص الفائدة)
القائل: ${o.author||''}
${isAudio?'المقطع':'الكتاب'}: ${o.title||''}
الموضع: (${isAudio?'الدقيقة مثل 32:15':'الجزء/الصفحة مثل 2/388'} — أو اتركه فارغًا)
الوسيط:
التصنيف: ${o.field==='عام'?'(فقه / عقيدة / تفسير / حديث / تربية / لغة …)':o.field}
الوسوم: (كلمات مفتاحية مفصولة بفاصلة)
النوع: (فائدة / تنبيه / قاعدة / تعقيب / لطيفة / نقل)
من فوائد هذا الكلام: (اختياري: سطر واحد يبيّن الفائدة المستنبطة)
---`;
}

/* ============================================================
   قوالب الصور الجديدة — لكل قالب تكوين وشخصية مستقلة (لا لون فقط):
   خلفية مرسومة برمجيًّا + زخرفة + طريقة عنوان + طريقة توثيق + محاذاة
   ============================================================ */
const RK='"Reem Kufi","Cairo","Noto Kufi Arabic",sans-serif', AR='"Aref Ruqaa",Amiri,serif';
function mkRng(seed){ let a=seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hexA(c,a){ const m=/^#?([\da-f]{2})([\da-f]{2})([\da-f]{2})$/i.exec(c||''); return m?`rgba(${parseInt(m[1],16)},${parseInt(m[2],16)},${parseInt(m[3],16)},${a})`:c; }
function vgrad(ctx,H,c0,c1){ const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,c0); g.addColorStop(1,c1); return g; }

/** بقع لونية ناعمة تشبه المائية */
function washes(ctx,W,H,cols,seed,n,amax){
  const r=mkRng(seed);
  for(let i=0;i<n;i++){
    const x=r()*W, y=r()*H, rad=(.28+r()*.42)*W, c=cols[i%cols.length];
    const g=ctx.createRadialGradient(x,y,0,x,y,rad); g.addColorStop(0,hexA(c,amax*(.55+r()*.45))); g.addColorStop(1,hexA(c,0));
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  }
}
/** حُبيبات ورق دقيقة */
function grain(ctx,W,H,seed,a){
  const r=mkRng(seed); ctx.save();
  for(let i=0;i<W*H/650;i++){ ctx.fillStyle=r()<.5?`rgba(0,0,0,${a*r()})`:`rgba(255,255,255,${a*r()})`; ctx.fillRect(r()*W,r()*H,1.7,1.7); }
  ctx.restore();
}
/** ضربة فرشاة غير منتظمة الحواف (للعنوان) */
function brushShape(ctx,cx,cy,w,h,col,seed){
  const r=mkRng(seed), x0=cx-w/2, x1=cx+w/2, n=16; ctx.save(); ctx.fillStyle=col; ctx.beginPath();
  ctx.moveTo(x0,cy-h*.36);
  for(let i=1;i<=n;i++){ ctx.lineTo(x0+(x1-x0)*i/n, cy-h/2+(r()-.5)*h*.16+(i%2?0:h*.03)); }
  ctx.lineTo(x1+h*.14,cy-h*.26); ctx.lineTo(x1-h*.03,cy-h*.04); ctx.lineTo(x1+h*.1,cy+h*.12); ctx.lineTo(x1-h*.02,cy+h*.3);
  for(let i=n;i>=0;i--){ ctx.lineTo(x0+(x1-x0)*i/n, cy+h/2+(r()-.5)*h*.16); }
  ctx.lineTo(x0-h*.12,cy+h*.26); ctx.lineTo(x0+h*.03,cy+h*.04); ctx.lineTo(x0-h*.1,cy-h*.14); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.16)'; ctx.lineWidth=Math.max(1.5,h*.025);
  for(let i=0;i<5;i++){ const yy=cy-h*.3+i*h*.15; ctx.beginPath(); ctx.moveTo(x0+w*(.03+r()*.12),yy); ctx.lineTo(x1-w*(.03+r()*.12),yy+(r()-.5)*5); ctx.stroke(); }
  ctx.restore();
}
function flower(ctx,x,y,R,c1,c2){
  ctx.save(); ctx.translate(x,y);
  for(let i=0;i<5;i++){ ctx.save(); ctx.rotate(i*Math.PI*2/5); ctx.fillStyle=c1; ctx.beginPath(); ctx.ellipse(0,-R*.62,R*.34,R*.62,0,0,6.3); ctx.fill(); ctx.restore(); }
  ctx.fillStyle=c2; ctx.beginPath(); ctx.arc(0,0,R*.26,0,6.3); ctx.fill(); ctx.restore();
}
/** غصن بأوراق وبراعم صغيرة */
function sprig(ctx,x,y,len,ang,c1,c2,k,n){
  branch(ctx,x,y,len,ang,c1,n||7,22*k);
  ctx.save(); ctx.translate(x,y); ctx.rotate(ang); ctx.fillStyle=c2;
  for(let i=1;i<=4;i++){ const t=i/5, px=len*t, py=-len*.1*Math.sin(t*Math.PI)*.9+(i%2?18:-18)*k; ctx.globalAlpha=.7; ctx.beginPath(); ctx.arc(px,py,5*k,0,6.3); ctx.fill(); }
  ctx.restore();
}
function archPath(ctx,x,y,w,h){
  ctx.beginPath(); ctx.moveTo(x,y+h); ctx.lineTo(x,y+h*.34);
  ctx.bezierCurveTo(x,y+h*.14,x+w*.34,y+h*.1,x+w/2,y);
  ctx.bezierCurveTo(x+w*.66,y+h*.1,x+w,y+h*.14,x+w,y+h*.34);
  ctx.lineTo(x+w,y+h); ctx.closePath();
}
/** «الخاتم» الهندسي: مربعان متداخلان — العلامة المركزية الصغيرة */
function khatam(ctx,cx,cy,R,col,k,fill){
  ctx.save(); ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=2.4*k; const s=R*1.42;
  [0,Math.PI/4].forEach(a=>{ ctx.save(); ctx.translate(cx,cy); ctx.rotate(a); ctx.strokeRect(-s/2,-s/2,s,s); ctx.restore(); });
  ctx.beginPath(); ctx.arc(cx,cy,R*.2,0,6.3); if(fill) ctx.fill(); else ctx.stroke(); ctx.restore();
}
/** شبكة نجوم ثمانية تتلاشى من زاوية */
function latticeFade(ctx,W,H,col,k,px,py,R,alpha,clip){
  const c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  x.strokeStyle=col; x.lineWidth=2.2*k; const s=104*k;
  for(let gy=-1;gy<H/(s*.86)+1;gy++) for(let gx=-1;gx<W/s+1;gx++){
    const cx=gx*s+(gy%2?s/2:0), cy=gy*s*.86; star8(x,cx,cy,s*.47,s*.24); x.stroke(); x.beginPath(); x.arc(cx,cy,s*.07,0,6.3); x.stroke();
  }
  x.globalCompositeOperation='destination-in';
  const g=x.createRadialGradient(px,py,0,px,py,R); g.addColorStop(0,'rgba(0,0,0,1)'); g.addColorStop(.55,'rgba(0,0,0,.55)'); g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g; x.fillRect(0,0,W,H);
  ctx.save(); if(clip){ ctx.beginPath(); ctx.rect(clip[0],clip[1],clip[2],clip[3]); ctx.clip(); } ctx.globalAlpha=alpha; ctx.drawImage(c,0,0); ctx.restore();
}
/** حافة ورق ممزّق */
function tornPath(ctx,x,y,w,h,seed,amp){
  const r=mkRng(seed); ctx.beginPath(); ctx.moveTo(x,y);
  const seg=(x0,y0,x1,y1,n)=>{ for(let i=1;i<=n;i++){ const t=i/n, nx=x0+(x1-x0)*t, ny=y0+(y1-y0)*t, j=(r()-.5)*amp; ctx.lineTo(nx+(x1===x0?j:0), ny+(y1===y0?j:0)); } };
  seg(x,y,x+w,y,28); seg(x+w,y,x+w,y+h,36); seg(x+w,y+h,x,y+h,28); seg(x,y+h,x,y,36); ctx.closePath();
}
