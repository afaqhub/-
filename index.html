/** يقترح القالب بحسب وسيلة التلقي والتصنيف والوسوم */
function autoTpl(i){
  if(i.type==='شعر'||/شعر|ديوان|نظم|قصيد/.test([i.cat,(i.tags||[]).join(' '),i.ref].join(' '))) return 'poem';
  if(i.medium==='سماع'||i.medium==='مشاهدة'||i.medium==='مجلس') return 'arch';
  const hay=[i.cat,i.anchor,i.ref,(i.tags||[]).join(' '),i.title].join(' ');
  if(/قرآن|القرآن|تفسير|آية|الآية|سورة|الآيات|تجويد/.test(hay)) return 'sage';
  if(/حديث|الحديث|صحيح|سنن|مسند|الأربعين|رياض الصالحين/.test(hay)) return 'ms';
  if(/عقيدة|توحيد/.test(hay)) return 'lux';
  if(/فقه|أصول/.test(hay)) return 'geo';
  if(/تربية|سلوك|رقائق|أخلاق/.test(hay)) return 'terra';
  return (i.text||'').length>260?'typo':'sage';
}
function autoHeader(i){
  return cfg('عنوان البطاقة') || ({سماع:'فوائد من السماع',مشاهدة:'فوائد من المشاهدة',مجلس:'فوائد من المجالس',إنترنت:'فوائد منتقاة'}[i.medium]||'فوائد من القراءة');
}

/* ---------- أدوات الرسم ---------- */
function rr(ctx,x,y,w,h,r){
  ctx.beginPath(); r=Math.min(r,w/2,h/2);
  if(ctx.roundRect){ ctx.roundRect(x,y,w,h,r); return; }
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function leafShape(ctx,l,w){ ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(l*.5,-w,l,0); ctx.quadraticCurveTo(l*.5,w,0,0); ctx.closePath(); ctx.fill(); }
function branch(ctx,x,y,len,ang,col,n,sz){
  ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
  ctx.strokeStyle=col; ctx.lineWidth=Math.max(2,sz*.16); ctx.lineCap='round'; ctx.globalAlpha=.75;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(len*.5,-len*.1,len,-len*.02); ctx.stroke();
  ctx.fillStyle=col;
  for(let i=1;i<=n;i++){
    const t=i/(n+1), px=len*t, py=-len*.1*Math.sin(t*Math.PI)*.9;
    [-1,1].forEach(s=>{ ctx.save(); ctx.translate(px,py); ctx.rotate(s*.78); ctx.globalAlpha=.5+.3*((i+(s>0?1:0))%2); leafShape(ctx,sz*(1.9-t*.6),sz*.56); ctx.restore(); });
  }
  ctx.save(); ctx.translate(len,-len*.02); ctx.globalAlpha=.8; leafShape(ctx,sz*1.5,sz*.5); ctx.restore();
  ctx.restore();
}
function diamond(ctx,cx,cy,r){ ctx.beginPath(); ctx.moveTo(cx,cy-r); ctx.lineTo(cx+r,cy); ctx.lineTo(cx,cy+r); ctx.lineTo(cx-r,cy); ctx.closePath(); }
function star8(ctx,cx,cy,R,r){ ctx.beginPath(); for(let i=0;i<16;i++){ const a=Math.PI*i/8-Math.PI/2, rad=i%2?r:R; ctx[i?'lineTo':'moveTo'](cx+rad*Math.cos(a),cy+rad*Math.sin(a)); } ctx.closePath(); }

function drawBackground(ctx,W,H,P,k){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,P.bg[0]); g.addColorStop(1,P.bg[1]);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  if(P.glow){ const r=ctx.createRadialGradient(W*.92,H*.38,10,W*.92,H*.38,W*.7); r.addColorStop(0,'rgba(255,255,255,.62)'); r.addColorStop(1,'rgba(255,255,255,0)'); ctx.fillStyle=r; ctx.fillRect(0,0,W,H); }
  ctx.fillStyle=P.accent; ctx.globalAlpha=.07;
  for(let a=24*k;a<W;a+=34*k) for(let b=24*k;b<H;b+=34*k){ ctx.beginPath(); ctx.arc(a,b,1.5*k,0,6.3); ctx.fill(); }
  ctx.globalAlpha=1;
}
function drawOrnaments(ctx,W,H,P,k){
  const col=P.accent;
  if(P.orn==='quotes'){
    ctx.save(); ctx.fillStyle=P.accent; ctx.globalAlpha=.16; ctx.font=`700 ${420*k}px ${AM}`; ctx.textBaseline='alphabetic';
    ctx.textAlign='right'; ctx.fillText('”',W-40*k,H*.36); ctx.textAlign='left'; ctx.fillText('“',40*k,H*.98); ctx.restore();
  } else if(P.orn==='leaf'){
    [[0,0],[1,1]].forEach(([fx,fy])=>{
      ctx.save(); if(fx){ ctx.translate(W,H); ctx.rotate(Math.PI); }
      branch(ctx,-.03*W,.06*H,.33*W,.5,col,7,24*k);
      branch(ctx,.05*W,-.015*H,.26*W,1.2,col,5,20*k);
      branch(ctx,-.02*W,.19*H,.17*W,-.12,col,4,18*k);
      ctx.restore();
    });
  } else if(P.orn==='geo'){
    ctx.strokeStyle=col; ctx.fillStyle=col;
    [[0,0],[1,0],[0,1],[1,1]].forEach(([fx,fy])=>{
      ctx.save(); ctx.translate(fx?W:0,fy?H:0); ctx.scale(fx?-1:1,fy?-1:1);
      ctx.globalAlpha=.9; ctx.lineWidth=3*k; star8(ctx,78*k,78*k,52*k,26*k); ctx.stroke();
      ctx.globalAlpha=.55; ctx.lineWidth=2*k; star8(ctx,78*k,78*k,34*k,16*k); ctx.stroke();
      ctx.globalAlpha=.4; ctx.beginPath(); ctx.moveTo(140*k,78*k); ctx.lineTo(300*k,78*k); ctx.moveTo(78*k,140*k); ctx.lineTo(78*k,300*k); ctx.stroke();
      ctx.restore();
    });
    ctx.globalAlpha=1;
  } else if(P.orn==='dots'){
    ctx.strokeStyle=col;
    [[0,0],[1,0],[0,1],[1,1]].forEach(([fx,fy])=>{
      ctx.save(); ctx.translate(fx?W:0,fy?H:0); ctx.scale(fx?-1:1,fy?-1:1);
      for(let i=0;i<4;i++){ ctx.globalAlpha=.55-i*.1; ctx.lineWidth=(3-i*.5)*k; ctx.beginPath(); ctx.arc(0,0,(120+i*34)*k,0,Math.PI/2); ctx.stroke(); }
      ctx.restore();
    });
    ctx.globalAlpha=1;
  } else if(P.orn==='lines'){
    ctx.strokeStyle=col; ctx.fillStyle=col; ctx.globalAlpha=.6; ctx.lineWidth=2*k;
    [W*.07,W*.93].forEach(x=>{ ctx.beginPath(); ctx.moveTo(x,H*.18); ctx.lineTo(x,H*.82); ctx.stroke(); diamond(ctx,x,H*.18,9*k); ctx.fill(); diamond(ctx,x,H*.82,9*k); ctx.fill(); });
    ctx.globalAlpha=1;
  } else if(P.orn==='waves'){
    ctx.strokeStyle=col; ctx.lineWidth=3*k;
    [[.045,1],[.955,-1]].forEach(([fy,dir])=>{
      for(let j=0;j<3;j++){ ctx.globalAlpha=.5-j*.14; ctx.beginPath();
        for(let x=0;x<=W;x+=8){ const y=H*fy+dir*(14*k*(j+1))+Math.sin(x/(70*k)+j)*10*k*(1+j*.4)*dir; ctx[x?'lineTo':'moveTo'](x,y); }
        ctx.stroke(); }
    });
    ctx.globalAlpha=1;
  }
  // الإطار
  ctx.strokeStyle=col; ctx.lineJoin='round';
  if(P.frame==='round'){ ctx.globalAlpha=.7; ctx.lineWidth=2.5*k; rr(ctx,.05*W,.032*H,.9*W,.936*H,70*k); ctx.stroke(); ctx.globalAlpha=1; }
  else if(P.frame==='double'){ ctx.globalAlpha=.9; ctx.lineWidth=3*k; ctx.strokeRect(40*k,40*k,W-80*k,H-80*k); ctx.globalAlpha=.4; ctx.lineWidth=1.2*k; ctx.strokeRect(56*k,56*k,W-112*k,H-112*k); ctx.globalAlpha=1; }
  else if(P.frame==='single'){ ctx.globalAlpha=.8; ctx.lineWidth=2*k; ctx.strokeRect(36*k,36*k,W-72*k,H-72*k); ctx.globalAlpha=1; }
  else if(P.frame==='thin'){ ctx.globalAlpha=.5; ctx.lineWidth=1.5*k; ctx.strokeRect(48*k,48*k,W-96*k,H-96*k); ctx.globalAlpha=1; }
}
function drawHeaderPill(ctx,cx,cy,text,P,k){
  ctx.font=`700 ${50*k}px ${AM}`; const tw=ctx.measureText(text).width, w=Math.max(tw+130*k,300*k), h=84*k;
  rr(ctx,cx-w/2,cy-h/2,w,h,h/2); ctx.fillStyle=P.fill; ctx.fill(); ctx.strokeStyle=P.accent; ctx.lineWidth=2.5*k; ctx.globalAlpha=.9; ctx.stroke();
  ctx.globalAlpha=.4; ctx.lineWidth=1.2*k; rr(ctx,cx-w/2+9*k,cy-h/2+9*k,w-18*k,h-18*k,(h-18*k)/2); ctx.stroke(); ctx.globalAlpha=1;
  ctx.fillStyle=P.accent; [-1,1].forEach(s=>{ diamond(ctx,cx+s*(w/2+34*k),cy,8*k); ctx.fill(); ctx.globalAlpha=.5; diamond(ctx,cx+s*(w/2+60*k),cy,5*k); ctx.fill(); ctx.globalAlpha=1; });
  ctx.fillStyle=P.ink; ctx.textBaseline='middle'; ctx.fillText(text,cx,cy+3*k);
}
function drawBadge(ctx,cx,cy,text,P,k){
  const s=104*k;
  ctx.fillStyle=P.fill; ctx.strokeStyle=P.accent; ctx.lineWidth=3*k;
  if(P.badge==='diamond'){ rr(ctx,cx-s*.5,cy-s*.5,s,s,22*k); ctx.save(); ctx.translate(cx,cy); ctx.rotate(Math.PI/4); ctx.translate(-cx,-cy); rr(ctx,cx-s*.46,cy-s*.46,s*.92,s*.92,18*k); ctx.fill(); ctx.stroke(); ctx.lineWidth=1.3*k; ctx.globalAlpha=.5; rr(ctx,cx-s*.38,cy-s*.38,s*.76,s*.76,14*k); ctx.stroke(); ctx.restore(); ctx.globalAlpha=1; }
  else if(P.badge==='octagon'){ ctx.beginPath(); for(let i=0;i<8;i++){ const a=Math.PI/8+i*Math.PI/4; ctx[i?'lineTo':'moveTo'](cx+s*.56*Math.cos(a),cy+s*.56*Math.sin(a)); } ctx.closePath(); ctx.fill(); ctx.stroke(); }
  else { ctx.beginPath(); ctx.arc(cx,cy,s*.5,0,6.3); ctx.fill(); ctx.stroke(); ctx.globalAlpha=.45; ctx.lineWidth=1.3*k; ctx.beginPath(); ctx.arc(cx,cy,s*.4,0,6.3); ctx.stroke(); ctx.globalAlpha=1; }
  ctx.fillStyle=P.ink; ctx.font=`700 ${52*k}px ${AM}`; ctx.textBaseline='middle'; ctx.fillText(text,cx,cy+4*k);
  ctx.strokeStyle=P.accent; ctx.lineWidth=2*k; ctx.globalAlpha=.6;
  [-1,1].forEach(sg=>{ ctx.beginPath(); ctx.moveTo(cx+sg*(s*.75),cy); ctx.lineTo(cx+sg*(s*.75+230*k),cy); ctx.stroke(); });
  ctx.globalAlpha=1; ctx.fillStyle=P.accent;
  [-1,1].forEach(sg=>{ ctx.save(); ctx.translate(cx+sg*(s*.62),cy); if(sg<0) ctx.scale(-1,1); ctx.rotate(-.2); ctx.globalAlpha=.8; leafShape(ctx,34*k,11*k); ctx.restore(); });
  ctx.globalAlpha=1;
}
function drawDivider(ctx,cx,cy,P,k){
  ctx.strokeStyle=P.accent; ctx.lineWidth=2*k; ctx.globalAlpha=.6;
  [-1,1].forEach(s=>{ ctx.beginPath(); ctx.moveTo(cx+s*46*k,cy); ctx.lineTo(cx+s*230*k,cy); ctx.stroke(); });
  ctx.globalAlpha=.9; ctx.fillStyle=P.accent; diamond(ctx,cx,cy,7*k); ctx.fill();
  [-1,1].forEach(s=>{ ctx.save(); ctx.translate(cx+s*14*k,cy); if(s<0) ctx.scale(-1,1); ctx.rotate(-.25); leafShape(ctx,26*k,8*k); ctx.restore(); });
  ctx.globalAlpha=1;
}
function wrapLines(ctx,text,maxW){
  const out=[];
  String(text||'').split('\n').forEach(para=>{
    const words=para.split(/\s+/).filter(Boolean); let line='';
    words.forEach(w=>{ const t=line?line+' '+w:w; if(ctx.measureText(t).width>maxW&&line){ out.push(line); line=w; } else line=t; });
    if(line) out.push(line); if(!words.length) out.push('');
  });
  return out;
}
/** أكبر خط يُدخل النص في المساحة، أو null إن لم يُدخله بأصغر خط. */
function fitBody(ctx,text,w,h,maxS,minS,k){
  for(let s=maxS;s>=minS;s-=2*k){
    ctx.font=`700 ${s}px ${AM}`; const lh=s*1.95, lines=wrapLines(ctx,text,w);
    if(lines.length*lh<=h) return {size:s,lh,lines};
  }
  return null;
}
function splitPages(text,n){
  if(n<=1) return [text];
  const sent=text.match(/[^.!؟?؛;\n]+[.!؟?؛;]*\s*/g)||[text]; const out=[]; let cur='', target=text.length/n;
  sent.forEach(s=>{ if(cur && (cur+s).length>target*1.15 && out.length<n-1){ out.push(cur.trim()); cur=''; } cur+=s; });
  if(cur.trim()) out.push(cur.trim());
  if(out.length<n){ // جمل قليلة: قسّم بالكلمات
    const w=text.split(/\s+/), per=Math.ceil(w.length/n); const o2=[]; for(let i=0;i<w.length;i+=per) o2.push(w.slice(i,i+per).join(' ')); return o2;
  }
  return out;
}

function palette(T,img,cfgC,W,H){
  if(!T.custom) return T;
  let light=cfgC.text==='light';
  if(cfgC.text==='auto'){
    try{
      const c=document.createElement('canvas'); c.width=24; c.height=24; const x=c.getContext('2d');
      const s=cfgC.safe; x.drawImage(img,0,0,img.width,img.height,0,0,24,24);
      const d=x.getImageData(Math.floor(24*s.x),Math.floor(24*s.y),Math.max(1,Math.floor(24*s.w)),Math.max(1,Math.floor(24*s.h))).data;
      let L=0,n=0; for(let i=0;i<d.length;i+=4){ L+=(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2])/255; n++; }
      light=(L/n)*(1-cfgC.overlay)<0.5;
    }catch(e){ light=false; }
  }
  return light?{ink:'#fffaf0',muted:'rgba(255,250,240,.82)',accent:'#e8cf96',fill:'rgba(0,0,0,.28)',badge:'circle',orn:'none',frame:'none'}
              :{ink:'#1d2b36',muted:'rgba(29,43,54,.75)',accent:'#8a6a35',fill:'rgba(255,255,255,.55)',badge:'circle',orn:'none',frame:'none'};
}

const tplImgCache={};
async function getTplImg(id){
  if(tplImgCache[id]) return tplImgCache[id];
  const b64=await db.templateImage(id);
  if(!b64) throw new Error('صورة القالب غير موجودة');

/* ---------- مساعدات تكوين البطاقة ---------- */
function poemVerses(text){
  return text.split('\n').map(s=>s.trim()).filter(Boolean).map(l=>{
    const sep=l.split(/\s*[*…]\s*|\s{3,}|\t|\s+[-–—]\s+/).filter(Boolean);
    if(sep.length>=2) return [sep[0],sep.slice(1).join(' ')];
    const w=l.split(/\s+/); if(w.length>=6){ const m=Math.ceil(w.length/2); return [w.slice(0,m).join(' '),w.slice(m).join(' ')]; }
    return [l];
  });
}
/** يُدخل الأبيات بشطريها في المساحة دون كسر البيت؛ null إن لم تتسع بحد أدنى مقروء. */
function fitPoem(ctx,text,w,h,maxS,minS,k){
  const V=poemVerses(text); if(!V.length) return null;
  for(let s=maxS;s>=minS;s-=2*k){
    ctx.font=`700 ${s}px ${AM}`; const lh=s*2.15, gapW=s*1.8; let m1=0,m2=0,single=0;
    V.forEach(v=>{ if(v.length>1){ m1=Math.max(m1,ctx.measureText(v[0]).width); m2=Math.max(m2,ctx.measureText(v[1]).width); } else single=Math.max(single,ctx.measureText(v[0]).width); });
    const total=m1+m2+(m1&&m2?gapW:0);
    if(total<=w && single<=w && V.length*lh<=h) return {size:s,lh,V,gapW,m1,m2};
  }
  return null;
}
function headDraw(ctx,style,hdr,cx,ax,y,box,P,k){

  ctx.textAlign='center';
  if(style==='brush'){
    ctx.font=`700 ${48*k}px ${AM}`; const tw=ctx.measureText(hdr).width;
    brushShape(ctx,cx,y+46*k,tw+190*k,90*k,P.brush||P.accent,7); ctx.fillStyle=P.onbrush||'#fff'; ctx.fillText(hdr,cx,y+49*k);
  } else if(style==='archhead'){
    ctx.font=`700 ${50*k}px ${AM}`; ctx.fillStyle=P.ink; ctx.fillText(hdr,cx,y+30*k); const tw=ctx.measureText(hdr).width;
    ctx.strokeStyle=P.accent; ctx.lineWidth=2*k; ctx.globalAlpha=.7; ctx.beginPath(); ctx.moveTo(cx-tw/2-24*k,y+68*k); ctx.lineTo(cx+tw/2+24*k,y+68*k); ctx.stroke(); ctx.globalAlpha=1;
  } else if(style==='plainK'){
    ctx.font=`400 ${35*k}px ${RK}`; const tw=ctx.measureText(hdr).width; ctx.fillStyle=P.accent; ctx.fillText(hdr,cx,y+42*k); lines2(tw,P.accent);
  } else if(style==='plainA'){
    ctx.font=`400 ${50*k}px ${AR}`; const tw=ctx.measureText(hdr).width; ctx.fillStyle=P.accent; ctx.fillText(hdr,cx,y+40*k); lines2(tw,P.accent);
  } else if(style==='plainR'){
    ctx.textAlign='right'; ctx.font=`400 ${34*k}px ${RK}`; const tw=ctx.measureText(hdr).width; ctx.fillStyle=P.accent; ctx.fillText(hdr,ax,y+42*k);
    ctx.fillRect(ax-tw-110*k,y+40*k,86*k,4*k);
  } else if(style==='cartouche'){
    ctx.font=`700 ${46*k}px ${AM}`; const tw=ctx.measureText(hdr).width, w=Math.max(tw+170*k,360*k), h=84*k, pt=34*k, x0=cx-w/2, x1=cx+w/2, ya=y+2*k, yb=y+2*k+h, py=(ya+yb)/2;
    const hex=(i)=>{ ctx.beginPath(); ctx.moveTo(x0+pt+i,ya+i); ctx.lineTo(x1-pt-i,ya+i); ctx.lineTo(x1-i*.4,py); ctx.lineTo(x1-pt-i,yb-i); ctx.lineTo(x0+pt+i,yb-i); ctx.lineTo(x0+i*.4,py); ctx.closePath(); };

function srcDraw(ctx,style,txt,cx,ax,by2,box,P,k,right){
  // by2 = أعلى موضع متاح؛ يُرسَم هنا النص ضمن ارتفاع 78k (أو 66k للخط)

  const tw=ctx.measureText(txt).width;
  if(style==='line'||style==='flourish'){
    const py=by2+40*k; ctx.strokeStyle=P.accent; ctx.lineWidth=2*k; ctx.globalAlpha=.7;
    if(style==='line'){ const L=Math.min(box.w*.5,300*k); ctx.beginPath(); right?(ctx.moveTo(ax,by2+4*k),ctx.lineTo(ax-L,by2+4*k)):(ctx.moveTo(cx-L/2,by2+4*k),ctx.lineTo(cx+L/2,by2+4*k)); ctx.stroke(); ctx.globalAlpha=1; ctx.fillStyle=P.ink; ctx.textAlign=right?'right':'center'; ctx.fillText(txt,right?ax:cx,py+4*k); }
    else { ctx.beginPath(); ctx.moveTo(cx-box.w*.34,by2+8*k); ctx.lineTo(cx-26*k,by2+8*k); ctx.moveTo(cx+26*k,by2+8*k); ctx.lineTo(cx+box.w*.34,by2+8*k); ctx.stroke(); ctx.globalAlpha=1; khatam(ctx,cx,by2+8*k,13*k,P.accent,k,true); ctx.fillStyle=P.ink; ctx.textAlign='center'; ctx.fillText(txt,cx,py+10*k); }
  } else if(style==='band'){
    const h=70*k, py=by2+h/2+4*k; ctx.fillStyle=hexA(P.accent,.1); rr(ctx,box.x-24*k,py-h/2,box.w+48*k,h,22*k); ctx.fill(); ctx.strokeStyle=hexA(P.accent,.55); ctx.lineWidth=1.4*k; ctx.beginPath(); ctx.moveTo(box.x-24*k,py-h/2); ctx.lineTo(box.x+box.w+24*k,py-h/2); ctx.stroke();
    ctx.fillStyle=P.ink; ctx.textAlign='center'; ctx.fillText(txt,cx,py+2*k);
  } else if(style==='ribbon'){
    const w=Math.min(box.w,tw+140*k), h=64*k, py=by2+h/2+6*k; rr(ctx,cx-w/2,py-h/2,w,h,h/2); ctx.fillStyle=P.fill; ctx.fill(); ctx.strokeStyle=P.accent; ctx.lineWidth=2*k; ctx.globalAlpha=.8; ctx.stroke(); ctx.globalAlpha=1;
    ctx.fillStyle=P.accent; [-1,1].forEach(sg=>{ diamond(ctx,cx+sg*(w/2+24*k),py,6*k); ctx.fill(); });
    ctx.fillStyle=P.ink; ctx.textAlign='center'; ctx.fillText(txt,cx,py+2*k);
  } else {
    const w=Math.min(box.w,tw+120*k), h=62*k, py=by2+h/2+8*k, x0=cx-w/2, x1=cx+w/2, ya=py-h/2, yb=py+h/2, pt=22*k;
    ctx.beginPath(); ctx.moveTo(x0+pt,ya); ctx.lineTo(x1-pt,ya); ctx.lineTo(x1,py); ctx.lineTo(x1-pt,yb); ctx.lineTo(x0+pt,yb); ctx.lineTo(x0,py); ctx.closePath();
    ctx.fillStyle=P.fill; ctx.fill(); ctx.strokeStyle=P.accent; ctx.lineWidth=2*k; ctx.globalAlpha=.85; ctx.stroke(); ctx.globalAlpha=1; ctx.fillStyle=P.ink; ctx.textAlign='center'; ctx.fillText(txt,cx,py+2*k);
  }

}
function divDraw(ctx,style,cx,ax,y,box,P,k,right){
  if(style==='bar'){ ctx.fillStyle=P.accent; const L=96*k; ctx.fillRect(right?ax-L:cx-L/2,y,L,5*k); }
  else if(style==='khatam'){ ctx.strokeStyle=P.accent; ctx.lineWidth=2*k; ctx.globalAlpha=.7; [-1,1].forEach(s=>{ ctx.beginPath(); ctx.moveTo(cx+s*34*k,y); ctx.lineTo(cx+s*(34+170)*k,y); ctx.stroke(); }); ctx.globalAlpha=1; khatam(ctx,cx,y,16*k,P.accent,k,true); }

/**
 * يرسم بطاقة واحدة. T: قالب مدمج (قديم أو جديد) أو {custom:true,cfg,img|id}.
 * o: {w,h,header,num,stamp,digits,page,pages,text,pal,over}
 */
async function drawCard(item,T,o){
  if(T.clone) return drawClone(item,T,o);
  await fontsReady();
  const custom=!!T.custom, cfgC=T.cfg||{}, NT=!!T.nw;
  const W=custom?cfgC.w:o.w, H=custom?cfgC.h:o.h, k=W/1080;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H; const ctx=cv.getContext('2d');
  let img=null; if(custom) img=T.img||await getTplImg(T.id);
  let P;
  if(custom) P=palette(T,img,cfgC,W,H);
  else if(NT){ P=Object.assign({},T.pals[Math.min(o.pal||0,T.pals.length-1)]); P.fill=P.fill||hexA(P.accent,.13); }
  else P=Object.assign({},T);
  if(!custom && o.over){ if(o.over.accent){ P.accent=o.over.accent; P.fill=hexA(o.over.accent,.13); } if(o.over.ink) P.ink=o.over.ink; }
  if(custom){
    const sc=Math.max(W/img.width,H/img.height), dw=img.width*sc, dh=img.height*sc; ctx.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh);
    if(cfgC.overlay>0){ ctx.fillStyle=(P.ink==='#fffaf0')?`rgba(0,0,0,${cfgC.overlay})`:`rgba(255,255,255,${cfgC.overlay})`; ctx.fillRect(0,0,W,H); }
  } else if(NT){ T.draw(ctx,W,H,P,k); }
  else { drawBackground(ctx,W,H,P,k); drawOrnaments(ctx,W,H,P,k); }

  const dg=s=>o.digits?arDigits(s):String(s==null?'':s);
  let box;
  if(custom) box={x:W*cfgC.safe.x,y:H*cfgC.safe.y,w:W*cfgC.safe.w,h:H*cfgC.safe.h};
  else { const b=T.box||{x:.11,y:.085,w:.78,h:.83}; box={x:W*b.x,y:H*b.y,w:W*b.w,h:H*b.h}; }
  const al=T.align||'center', right=al==='right';
  const cx=box.x+box.w/2, ax=right?box.x+box.w:cx, gap=26*k;
  ctx.direction='rtl'; ctx.textAlign=al; ctx.textBaseline='middle';

  const headStyle=custom?'pill':(T.head||P.head||'pill');
  const hdr=(custom&&cfgC.header===false)?'':o.header;
  const speaker=item.speaker?('قال '+item.speaker+((item.dua)?' -'+item.dua+'-':'')+':'):'';
  const src=item.ref?(item.ref+(item.locus?'   '+((item.medium==='سماع'||item.medium==='مشاهدة')&&parseTime(item.locus)!=null?'الدقيقة '+item.locus:item.locus):'')):(item.medium==='مجلس'&&item.locus?item.locus:'');
  const via=item.via?('نقلًا عن: '+item.via):'';
  const srcStyle=T.src||'hex', divStyle=T.div||'leaf';
  const foot=(o.stamp||o.pages>1);
  // «من فوائد هذا الكلام»
  const gain=(item.gain||'').trim(); let gLines=[];
  if(gain){ ctx.font=`400 ${35*k}px ${AM}`; gLines=wrapLines(ctx,gain,box.w-30*k).slice(0,3); }
  const gainH=gain?(gLines.length+1)*46*k+gap*.5:0;

  let topH=0, botH=0;
  if(hdr) topH+=(headStyle==='brush'?96*k:84*k)+gap; if(o.num) topH+=104*k+gap; if(speaker) topH+=60*k+gap*.6;
  botH+=30*k+gap*.7+gainH; if(via) botH+=46*k; if(src) botH+=(srcStyle==='line'?70*k:78*k)+gap*.5; if(foot) botH+=46*k+gap*.4;
  const bodyH=box.h-topH-botH;

  const L=o.text.length, big=P.big||T.big, maxS=(L<30?124:L<60?108:L<110?94:L<200?80:72)*(big?1.1:1)*k;
  let poem=null, fit=null;
  if(T.poem) poem=fitPoem(ctx,o.text,box.w,bodyH,(o.text.split('\n').length<=2?96:70)*k,34*k,k);
  if(!poem){ ctx.font=`700 ${maxS}px ${AM}`; fit=fitBody(ctx,o.text,box.w,bodyH,maxS,34*k,k); if(!fit) return {overflow:true}; }

  let y=box.y;
  if(hdr){ headDraw(ctx,headStyle,hdr,cx,ax,y,box,P,k); y+=(headStyle==='brush'?96*k:84*k)+gap; }
  if(o.num){ drawBadge(ctx,right?ax-52*k:cx,y+52*k,dg(o.num),P,k); y+=104*k+gap; }
  if(speaker){
    let s=42*k; ctx.font=`400 ${s}px ${AM}`; while(ctx.measureText(speaker).width>box.w&&s>22*k){ s-=2*k; ctx.font=`400 ${s}px ${AM}`; }
    ctx.fillStyle=P.muted; ctx.fillText(dg(speaker),ax,y+30*k); y+=60*k+gap*.6;
  }
  // النص في وسط مساحته
  ctx.fillStyle=P.ink;
  if(poem){
    ctx.font=`700 ${poem.size}px ${AM}`; const th=poem.V.length*poem.lh; let by=y+(bodyH-th)/2+poem.lh/2;
    const R=cx+(poem.m1+poem.m2+poem.gapW)/2, c1=R-poem.m1/2, c2=R-poem.m1-poem.gapW-poem.m2/2;
    poem.V.forEach(v=>{
      if(v.length>1){ ctx.textAlign='center'; ctx.fillText(dg(v[0]),c1,by); ctx.fillText(dg(v[1]),c2,by); ctx.fillStyle=P.accent; diamond(ctx,R-poem.m1-poem.gapW/2,by,5*k); ctx.fill(); ctx.fillStyle=P.ink; }
      else { ctx.textAlign='center'; ctx.fillText(dg(v[0]),cx,by); }
      by+=poem.lh;
    });
    ctx.textAlign=al;
  } else {
    ctx.font=`700 ${fit.size}px ${AM}`; const th=fit.lines.length*fit.lh; let by=y+(bodyH-th)/2+fit.lh/2;
    fit.lines.forEach(Ln=>{ ctx.fillText(dg(Ln),ax,by); by+=fit.lh; });
  }

  // الأسفل: يُرسم من الحافة السفلى صعودًا
  let by2=box.y+box.h;
  if(foot){ by2-=46*k; ctx.font=`600 ${27*k}px ${CA}`; ctx.fillStyle=P.muted;
    if(o.stamp){ ctx.textAlign='center'; ctx.direction=/[؀-ۿ]/.test(o.stamp)?'rtl':'ltr'; ctx.fillText(o.stamp,cx,by2+23*k); ctx.direction='rtl'; }
    if(o.pages>1){ ctx.font=`400 ${30*k}px ${AM}`; ctx.textAlign='right'; ctx.fillText(dg(o.page+' / '+o.pages),box.x+box.w,by2+23*k); }
    ctx.textAlign=al; by2-=gap*.4; }
  if(src){ by2-=(srcStyle==='line'?70*k:78*k); srcDraw(ctx,srcStyle,dg(src),cx,ax,by2,box,P,k,right); by2-=gap*.5; }
  if(via){ by2-=46*k; ctx.font=`400 ${33*k}px ${AM}`; ctx.fillStyle=P.muted; ctx.fillText(dg(via),ax,by2+23*k); }
  if(gain){
    by2-=gainH; let gy=by2+gap*.25+23*k;
    ctx.font=`700 ${29*k}px ${AM}`; ctx.fillStyle=P.accent; ctx.fillText('من فوائد هذا الكلام:',ax,gy); gy+=46*k;
    ctx.font=`400 ${35*k}px ${AM}`; ctx.fillStyle=P.ink; gLines.forEach(g=>{ ctx.fillText(dg(g),ax,gy); gy+=46*k; });
  }
  by2-=30*k+gap*.7; divDraw(ctx,divStyle,cx,ax,by2+15*k,box,P,k,right);
  return {canvas:cv};
}

/** يبني صفحات الفائدة (أكثر من صفحة إن طالت). */
async function buildPages(item,T,o){
  const man=item.text.split(/\n\s*-{3,}\s*\n/).map(x=>x.trim()).filter(Boolean);
  if(man.length>1){ const res=[]; for(let p=0;p<man.length;p++){ const q=await drawCard(item,T,Object.assign({},o,{text:man[p],page:p+1,pages:man.length})); if(q.overflow) throw new Error('جزء من النص أطول من أن يتسع في صورة'); res.push(q.canvas); } return res; }
  let r=await drawCard(item,T,Object.assign({},o,{text:item.text,page:1,pages:1}));
  if(!r.overflow) return [r.canvas];
  for(let n=2;n<=8;n++){
    const parts=splitPages(item.text,n); const res=[];
    for(let p=0;p<parts.length;p++){
      const q=await drawCard(item,T,Object.assign({},o,{text:parts[p],page:p+1,pages:parts.length}));
      if(q.overflow){ res.length=0; break; } res.push(q.canvas);
    }
    if(res.length) return res;
  }
  throw new Error('النص طويل جدًّا للتحويل إلى صورة');
}

      const k=c.dataset.k, it=mask(first), T=resolveT(k,it);
      try{
        const r=await drawCard(it,T,{w:300,h:375,header:S.show.hdr?(S.header.trim()||autoHeader(it)):'',stamp:S.show.stamp?S.stamp.trim():'',digits:S.digits,num:0,text:it.text.length>260?it.text.slice(0,260)+'…':it.text,page:1,pages:1,pal:S.pals[k==='auto'?autoTpl(it):k]||0,over:k===S.tpl?S.over:null});
        const cv=c.querySelector('canvas'); if(r.canvas){ cv.width=r.canvas.width; cv.height=r.canvas.height; cv.getContext('2d').drawImage(r.canvas,0,0); }
      }catch(e){}
      await new Promise(r=>setTimeout(r,0));
    }
  };
  const syncPals=(T)=>{
    const w=$('#palw'); if(!w) return;
    if(!T.nw){ w.style.display='none'; return; }
    w.style.display='block'; const cur=curPal(), key=S.tpl==='auto'?autoTpl(first):S.tpl;
    $('#pals').innerHTML=T.pals.map((p,i)=>`<button class="chip${i===cur?' on':''}" data-i="${i}" style="display:inline-flex;gap:6px;align-items:center"><span style="width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,${p.bg[0]} 45%,${p.accent} 55%);border:1px solid rgba(0,0,0,.25)"></span>${esc(p.n)}</button>`).join('');
    const P=T.pals[cur]; $('#oc_ac').value=S.over.accent||P.accent; $('#oc_ink').value=S.over.ink||P.ink;
  };
  $('#tp').onclick=e=>{ const b=e.target.closest('.tcell'); if(!b) return; S.tpl=b.dataset.k; S.over={}; [...$('#tp').children].forEach(c=>c.classList.toggle('on',c===b)); savePrefs(); rerender(); };
  $('#pals').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; S.pals[S.tpl==='auto'?autoTpl(first):S.tpl]=+b.dataset.i; S.over={}; savePrefs(); rerender(); thumbs(); };
  $('#oc_ac').oninput=e=>{ S.over.accent=e.target.value; rerender(); };
  $('#oc_ink').oninput=e=>{ S.over.ink=e.target.value; rerender(); };
  $('#oc_rs').onclick=()=>{ S.over={}; rerender(); };
  $('#sz').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; S.size=b.dataset.k; [...$('#sz').children].forEach(c=>c.classList.toggle('on',c===b)); persist(); rerender(); };
  $('#pgs').onclick=e=>{ const b=e.target.closest('button[data-p]'); if(!b) return; S.page=+b.dataset.p; rerender(); };
  $('#im_hd').oninput=e=>{ S.header=e.target.value; rerender(); refreshThumbs(); };
  $('#im_st').oninput=e=>{ S.stamp=e.target.value; rerender(); refreshThumbs(); };
  $('#im_dg').onchange=e=>{ S.digits=e.target.checked; persist(); rerender(); refreshThumbs(); };
  if(owner){
    $('#im_no').onchange=e=>{ S.numOn=e.target.checked; $('#im_nw').style.display=S.numOn?'block':'none'; rerender(); };
    $('#im_num').oninput=e=>{ S.num=Math.max(1,Number(e.target.value)||1); rerender(); };
  }
  const produce=async()=>{
    const all=[];
    for(let n=0;n<items.length;n++){
      if(items.length>1) busy(true,'جارٍ تجهيز '+arDigits(n+1)+' من '+arDigits(items.length)+'…');
      const it=items[n], T=resolveT(S.tpl,it), ps=await buildPages(mask(it),T,optsFor(it,n));
      ps.forEach((c,pi)=>all.push({c,name:'kunnasha-'+it.id.replace(/[^\w-]/g,'')+(ps.length>1?'-'+(pi+1):'')+'.png'}));
    }
    return all;
  };
  const register=async()=>{
    if(!owner||!S.numOn) return;
    const now=new Date().toISOString();
    for(let n=0;n<items.length;n++){ try{ await db.setField(items[n].id,'pubNo',String(S.num+n)); await db.setField(items[n].id,'pubDate',now); }catch(e){} }
    refresh();
  };
  const go=async(mode)=>{
    busy(true,'جارٍ تجهيز الصور…');
    try{
      const all=await produce();
      const files=await Promise.all(all.map(async x=>new File([await new Promise(r=>x.c.toBlob(r,'image/png'))],x.name,{type:'image/png'})));
      busy(false);
      let shared=false;
      if(mode==='share' && navigator.canShare && navigator.canShare({files})){
        try{ await navigator.share({files,text:multi?'':citeText(first)}); shared=true; }catch(e){ if(e&&e.name==='AbortError') return; }
      }
      if(!shared){ for(let k=0;k<files.length;k++){ download(files[k].name,files[k]); await new Promise(r=>setTimeout(r,350)); } toast(files.length>1?'حُفظت '+files.length+' صور':'حُفظت الصورة'); }
      await register();
    }catch(e){ busy(false); toast(e.message); }
  };
  $('#im_share').onclick=()=>go('share'); $('#im_save').onclick=()=>go('save');
  rerender().then(()=>thumbs());
}

/* ---------- إدارة القوالب (قوالب بخلفياتك) ---------- */
function bgPrompt(w,h,s,theme){
  const pc=n=>Math.round(n*100);
  return `صمّم صورة خلفية لبطاقة نشر فوائد علمية، بأبعاد ${w}×${h} بكسل بالضبط (النسبة ${(w/h).toFixed(2)}).${theme?'\nالموضوع والأجواء: '+theme+'.':''}

شروط لازمة:
١) اترك المنطقة الوسطى فارغة تمامًا: من ${pc(s.x)}٪ إلى ${pc(s.x+s.w)}٪ من العرض، ومن ${pc(s.y)}٪ إلى ${pc(s.y+s.h)}٪ من الارتفاع. لون هادئ متجانس بلا أي تفاصيل أو أشياء، لأن النص سيُكتب فوقها.
٢) ضع الزخارف والعناصر (نباتات، أوراق، كتب، إطار، نقوش) على الأطراف والزوايا فقط، خارج المنطقة الوسطى.
٣) لا تكتب أي نص أو حروف أو أرقام أو شعارات داخل الصورة.
٤) ألوان هادئة منسجمة، وتباين منخفض في الوسط ليسهل قراءة النص فوقه.
٥) أخرج صورة واحدة بالأبعاد المذكورة، بجودة عالية.`;
}
async function templatesSheet(){
  openSheet(`${shhd('قوالب الصور')}<p class="hint">القوالب الجاهزة (قرآني، حديثي، عام…) موجودة دائمًا. هنا تضيف قوالب بخلفياتك أنت (تُحفظ في جدولك). تحصل على الخلفية بنص أمر جاهز تعطيه لأي أداة توليد صور، ثم ترفعها هنا.</p><div id="tl"></div><button class="btn" id="tn" style="margin-top:8px">＋ قالب جديد</button>`);
  st.tpls=null; await loadTemplates();
  const box=$('#tl'); box.innerHTML='';
  if(!st.tpls.length) box.innerHTML='<p class="mini">لا قوالب مخصصة بعد.</p>';
  st.tpls.forEach(t=>{
    const row=el('div','pbtn',`<span>🖼 ${esc(t.name)}</span><small>${t.cfg.w}×${t.cfg.h}</small>`);
    row.style.cursor='default'; const acts=el('span',null,''); acts.style.cssText='display:flex;gap:6px;margin-inline-start:10px';
    const e=el('button','sbtn','تعديل'); e.onclick=()=>tplEditor(t);
    const d=el('button','sbtn','حذف'); d.style.color='var(--danger)';
    d.onclick=async()=>{ if(!confirm('حذف القالب «'+t.name+'»؟'))return; busy(true,'جارٍ الحذف…'); try{ await db.deleteTemplate(t.id); delete tplImgCache[t.id]; st.tpls=null; busy(false); templatesSheet(); }catch(er){ busy(false); toast(er.message); } };
    acts.append(e,d); row.appendChild(acts); box.appendChild(row);
  });
  $('#tn').onclick=()=>tplEditor(null);
}
async function fileToJpegB64(file,w,h){
  const bmp=await new Promise((res,rej)=>{ const u=URL.createObjectURL(file), im=new Image(); im.onload=()=>{URL.revokeObjectURL(u);res(im)}; im.onerror=()=>rej(new Error('تعذّر قراءة الصورة')); im.src=u; });
  for(const sc of [1,.8,.65,.5,.4]){
    const c=document.createElement('canvas'); c.width=Math.round(w*sc); c.height=Math.round(h*sc); const x=c.getContext('2d');
    const s=Math.max(c.width/bmp.width,c.height/bmp.height), dw=bmp.width*s, dh=bmp.height*s; x.drawImage(bmp,(c.width-dw)/2,(c.height-dh)/2,dw,dh);
    for(const q of [.86,.76,.66,.56]){ const b64=c.toDataURL('image/jpeg',q).split(',')[1]; if(b64.length<=640000) return {b64,img:c}; }
  }
  throw new Error('الصورة كبيرة جدًّا — جرّب صورة أصغر');
}
function tplEditor(t){
  const isNew=!t;
  const C=t?JSON.parse(JSON.stringify(t.cfg)):{w:1080,h:1350,text:'auto',overlay:0,safe:{x:.1,y:.12,w:.8,h:.76},header:true};
  let imgEl=null, b64=null; const sample=st.items[0]||{text:'العلمُ قبل القولِ والعملِ، وبه يُعرفُ الحقُّ من الباطل.',speaker:'ابن تيمية',dua:'رحمه الله',ref:'مجموع الفتاوى',locus:'٢/٣٨٨',medium:'قراءة'};
  openSheet(`${shhd(isNew?'قالب جديد':'تعديل القالب')}
    <div class="pv"><canvas id="te_c" width="270" height="338"></canvas></div>
    <label class="fld"><span>اسم القالب</span><input class="t" id="te_name" value="${esc(t?t.name:'')}"></label>
    <label class="fld"><span>صورة الخلفية ${isNew?'':'(اتركها فارغة لإبقاء القديمة)'}</span><input class="t" type="file" id="te_file" accept="image/*"></label>
    ${isNew?`<label class="fld"><span>المقاس</span><select class="t" id="te_size">${Object.keys(SIZES).map(k=>`<option value="${k}" ${k==='portrait'?'selected':''}>${esc(SIZES[k].n)} — ${SIZES[k].w}×${SIZES[k].h}</option>`).join('')}</select></label>`:`<p class="hint">المقاس: ${C.w}×${C.h}</p>`}
    <div class="sectitle">منطقة النص الآمنة</div>
    <label class="fld"><span>الهامش العلوي: <b id="v_top"></b>٪</span><input type="range" id="te_top" min="0" max="35" value="${Math.round(C.safe.y*100)}"></label>
    <label class="fld"><span>الهامش السفلي: <b id="v_bot"></b>٪</span><input type="range" id="te_bot" min="0" max="35" value="${Math.round((1-C.safe.y-C.safe.h)*100)}"></label>
    <label class="fld"><span>الهامش الجانبي: <b id="v_side"></b>٪</span><input type="range" id="te_side" min="0" max="35" value="${Math.round(C.safe.x*100)}"></label>
    <label class="fld"><span>تعتيم/تفتيح الخلفية لقراءة أوضح: <b id="v_ov"></b>٪</span><input type="range" id="te_ov" min="0" max="70" value="${Math.round(C.overlay*100)}"></label>
    <div class="grid2"><label class="fld"><span>لون النص</span><select class="t" id="te_tx"><option value="auto">تلقائي بحسب الخلفية</option><option value="light">فاتح</option><option value="dark">داكن</option></select></label>
    <label class="tgl" style="align-self:end"><input type="checkbox" id="te_hd" ${C.header!==false?'checked':''}> إظهار العنوان العلوي</label></div>
    <details class="more"><summary>نص أمر لتوليد الخلفية بالذكاء الاصطناعي</summary>
      <label class="fld"><span>الموضوع أو الأجواء (اختياري)</span><input class="t" id="te_theme" placeholder="مثل: مصحف وأغصان زيتون بألوان هادئة"></label>
      <div class="pre" id="te_prompt"></div><button class="btn ghost" id="te_cp" style="margin-top:8px">نسخ نص الأمر</button></details>
    <button class="btn" id="te_save" style="margin-top:10px">حفظ القالب</button>`);
  $('#te_tx').value=C.text;
  const dims=()=>isNew?SIZES[$('#te_size').value]:{w:C.w,h:C.h};
  const read=()=>{
    const top=+$('#te_top').value/100, bot=+$('#te_bot').value/100, side=+$('#te_side').value/100;
    C.safe={x:side,y:top,w:Math.max(.3,1-2*side),h:Math.max(.3,1-top-bot)};
    C.overlay=+$('#te_ov').value/100; C.text=$('#te_tx').value; C.header=$('#te_hd').checked;
    const d=dims(); C.w=d.w; C.h=d.h;
    $('#v_top').textContent=Math.round(top*100); $('#v_bot').textContent=Math.round(bot*100); $('#v_side').textContent=Math.round(side*100); $('#v_ov').textContent=Math.round(C.overlay*100);
    $('#te_prompt').textContent=bgPrompt(C.w,C.h,C.safe,$('#te_theme').value.trim());
  };
  let rb=false;
  const paint=async()=>{
    read(); if(rb) return; rb=true;
    try{
      const pc=$('#te_c'); if(!pc) return;
      if(!imgEl && !t){ const g=pc.getContext('2d'); pc.width=270; pc.height=Math.round(270*C.h/C.w); g.fillStyle='#e8e2d2'; g.fillRect(0,0,pc.width,pc.height); g.strokeStyle='#b08d57'; g.setLineDash([6,5]);
        g.strokeRect(C.safe.x*pc.width,C.safe.y*pc.height,C.safe.w*pc.width,C.safe.h*pc.height); g.fillStyle='#6b7b85'; g.font='14px sans-serif'; g.textAlign='center'; g.fillText('ارفع صورة الخلفية',pc.width/2,pc.height/2); return; }
      const T={custom:true,cfg:C,id:t&&t.id,img:imgEl||undefined};
      const r=await drawCard(sample,T,{header:'فوائد من القراءة',num:0,stamp:'',digits:true,text:sample.text,page:1,pages:1});
      const src=r.canvas||document.createElement('canvas'); pc.width=src.width; pc.height=src.height; const g=pc.getContext('2d'); g.drawImage(src,0,0);
      g.save(); g.strokeStyle='#e0245e'; g.lineWidth=3; g.setLineDash([14,10]); g.strokeRect(C.safe.x*pc.width,C.safe.y*pc.height,C.safe.w*pc.width,C.safe.h*pc.height); g.restore();
    }catch(e){ toast(e.message); } finally{ rb=false; }
  };
  ['te_top','te_bot','te_side','te_ov','te_tx','te_hd','te_size','te_theme'].forEach(id=>{ const n=$('#'+id); if(n) n.addEventListener('input',paint); if(n) n.addEventListener('change',paint); });
  $('#te_file').onchange=async e=>{
    const f=e.target.files[0]; if(!f) return; busy(true,'جارٍ تجهيز الصورة…');
    try{ read(); const d=dims(); const r=await fileToJpegB64(f,d.w,d.h); b64=r.b64; imgEl=r.img; busy(false); paint(); }
    catch(er){ busy(false); toast(er.message); }
  };
  $('#te_cp').onclick=()=>copyText($('#te_prompt').textContent,'نُسخ نص الأمر');
  $('#te_save').onclick=async()=>{
    const name=$('#te_name').value.trim(); if(!name) return toast('اكتب اسم القالب');
    if(isNew&&!b64) return toast('ارفع صورة الخلفية أولًا');
    read(); busy(true,'جارٍ الحفظ…');
    try{
      await db.saveTemplate({id:t?t.id:undefined,name,cfg:C,image:b64||undefined});
      if(t) delete tplImgCache[t.id];
      st.tpls=null; busy(false); toast('حُفظ القالب'); templatesSheet();
    }catch(er){ busy(false); toast(er.message); }
  };
  paint();
}

function platformSheet(){
  const link=safeUrl(cfg('رابط المنصة'));
  openSheet(`${shhd('منصتك')}
    <p class="hint">أعجبتك هذه الكُنّاشة؟ يمكنك أن تحصل على منصة مثلها لنفسك، بجدول Google الخاص بك وبياناتك عندك أنت.</p>
    <div class="menu">
      <button class="pbtn" id="pl_get"><span class="ic">⬇</span><b>أحصل على المنصة بنفسي</b></button>
      <button class="pbtn" id="pl_ask"><span class="ic">✉</span><b>أطلب منصة مثلها · أو أتواصل معكم</b></button>
    </div><div id="pl_body" style="margin-top:12px"></div>`);
  $('#pl_get').onclick=()=>{
    $('#pl_body').innerHTML=link

      :`<div class="empty" style="padding:24px 10px"><div class="big">⏳</div><p><b>قريبًا إن شاء الله</b></p><p class="hint">سيتوفر هنا الدليل والملفات اللازمة وطريقة التثبيت ونص أمر للذكاء الاصطناعي ليرشدك أثناء الإعداد.</p></div>`;
  };

}
/** نموذج التواصل. fact: فائدة (ملاحظة عليها). */
function contactSheet(o){
  o=o||{}; const fact=o.fact, isNote=!!fact;
  openSheet(`${shhd(isNote?'ملاحظة على الفائدة':'اطلب منصة أو تواصل معنا')}
    ${isNote?`<div class="quote" style="margin-top:0">${esc((fact.text||'').slice(0,220))}${(fact.text||'').length>220?'…':''}</div>`:
      `<div class="seg" id="ct_k">${[['طلب منصة','أريد منصة مثلها'],['سؤال','سؤال'],['اقتراح','اقتراح'],['تواصل','تواصل عام']].map(([v,l],n)=>`<button class="chip${n===0?' on':''}" data-v="${v}">${l}</button>`).join('')}</div>`}
    <label class="fld"><span>اسمك (اختياري)</span><input class="t" id="ct_name" maxlength="60"></label>
    <label class="fld"><span>${isNote?'وسيلة تواصل (اختيارية)':'وسيلة التواصل — بريد أو رقم واتساب أو حساب (إلزامية ليتمكّن صاحب المنصة من الرد)'}</span><input class="t" id="ct_contact" dir="ltr" maxlength="120"></label>
    <label class="fld"><span>${isNote?'ملاحظتك أو التصحيح':'رسالتك أو تعليقك (اختياري)'}</span><textarea class="t" id="ct_msg" rows="4" maxlength="1500"></textarea></label>
    ${isNote?'':'<label class="tgl"><input type="checkbox" id="ct_show"> أوافق على ذكر اسمي كصاحب منصة (إن كتبت اسمك)</label>'}
    <div class="hp"><input id="ct_hp" tabindex="-1" autocomplete="off" aria-hidden="true"></div>
    <button class="btn" id="ct_go">إرسال</button><p class="hint" id="ct_msgx" style="margin-top:8px"></p>`);
  let kind=isNote?'ملاحظة':'طلب منصة';
  if($('#ct_k')) $('#ct_k').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; kind=b.dataset.v; [...$('#ct_k').children].forEach(c=>c.classList.toggle('on',c===b)); };
  $('#ct_go').onclick=async()=>{
    const contact=$('#ct_contact').value.trim(), msg=$('#ct_msg').value.trim();
    const say=m=>{$('#ct_msgx').innerHTML='<span class="badc">'+esc(m)+'</span>'};
    if(isNote&&!msg) return say('اكتب ملاحظتك');
    if(!isNote&&contact.length<5) return say('اكتب وسيلة تواصل صحيحة ليتمكّن صاحب المنصة من الرد عليك');
    busy(true,'جارٍ الإرسال…');
    try{
      await db.contact({kind,name:$('#ct_name').value.trim(),contact,message:msg,showName:!!($('#ct_show')&&$('#ct_show').checked),factId:fact?fact.id:'',hp:$('#ct_hp').value});
      busy(false); closeSheet(); toast(isNote?'وصلت ملاحظتك — جزاك الله خيرًا':'وصلت رسالتك — سيردّ عليك صاحب المنصة بإذن الله');
    }catch(e){ busy(false); say(e.message); }
  };
}
function noteSheet(fact){ contactSheet({fact}); }
