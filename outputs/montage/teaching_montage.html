:root{
  --ink:#0b3f38;--ink2:#0e4d45;--pri:#17695e;--gold:#c9a24a;--gold-l:#f3e7c6;--sand:#f7f2e8;--card:#fffdf8;--line:#e2dccd;
  --text:#1b2826;--muted:#6c7774;--ok:#2e7d4f;--ok-l:#d9eee1;--warn:#b5472b;--warn-l:#f8d9cc;--amber:#d98a1d;--amber-l:#fcebc2;--blue:#1f6fa8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#050f0d;overflow:hidden;font-family:"CairoM","Segoe UI","Noto Naskh Arabic",Tahoma,Arial,sans-serif;direction:rtl}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1920px;height:1080px;transform-origin:center center;overflow:hidden;
  background:radial-gradient(1400px 900px at 85% 0%,#17695e 0%,#0e4d45 38%,#0a3a34 100%);color:#fff}
#stage::before{content:"";position:absolute;inset:0;opacity:.07;
  background-image:repeating-linear-gradient(45deg,#fff 0 2px,transparent 2px 46px),repeating-linear-gradient(-45deg,#fff 0 2px,transparent 2px 46px)}

/* ---------- chrome ---------- */
.brand{position:absolute;top:34px;right:80px;display:flex;align-items:center;gap:16px;font-weight:700;font-size:30px;color:#fff;opacity:.95;z-index:5}
.brand i{width:46px;height:46px;border-radius:14px;background:var(--gold);display:grid;place-items:center}
.brand i::after{content:"";width:20px;height:11px;border-left:5px solid #0b3f38;border-bottom:5px solid #0b3f38;transform:rotate(-45deg) translate(2px,-2px)}
.brand small{font-weight:500;opacity:.75;font-size:22px}
.badge{position:absolute;top:34px;left:80px;z-index:5;font-weight:700;font-size:26px;color:#0b3f38;background:var(--gold);padding:6px 24px;border-radius:999px;opacity:0}
#progress{position:absolute;bottom:0;left:0;right:0;height:8px;background:rgba(255,255,255,.12);z-index:9}
#progress i{display:block;height:100%;width:0;margin-inline-start:auto;background:linear-gradient(270deg,var(--gold),#f0d98f)}
#dots{position:absolute;bottom:22px;left:0;right:0;display:flex;gap:12px;justify-content:center;z-index:9}
#dots b{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.25);transition:.3s}
#dots b.on{background:var(--gold);transform:scale(1.35)}
#cap{position:absolute;left:160px;right:160px;bottom:56px;z-index:8;text-align:center;font-size:30px;line-height:1.6;padding:14px 28px;border-radius:18px;
  background:rgba(4,22,19,.82);color:#fff;opacity:0;transition:opacity .3s}
#cap.show{opacity:1}

.scene{position:absolute;inset:0;opacity:0;pointer-events:none}
.h1{position:absolute;right:110px;top:170px;width:660px;font-size:64px;font-weight:800;line-height:1.25;color:#fff}
.h1 em{font-style:normal;color:var(--gold)}
.txt{position:absolute;right:110px;width:660px;font-size:38px;line-height:1.7;color:#e9f1ee;font-weight:500}
.txt b{color:var(--gold);font-weight:700}
.w{display:inline-block;opacity:0;white-space:pre}

/* ---------- window ---------- */
.win{position:absolute;left:70px;top:150px;width:1060px;height:830px;background:var(--card);border-radius:22px;overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 2px rgba(255,255,255,.08);color:var(--text)}
.win .bar{height:52px;background:linear-gradient(180deg,#10564d,#0e4d45);display:flex;align-items:center;gap:10px;padding:0 20px;color:#fff;font-size:22px;font-weight:600}
.win .bar i{width:14px;height:14px;border-radius:50%;background:#c9a24a}.win .bar i:nth-child(2){background:#e9d08a}.win .bar i:nth-child(3){background:#f6ecc9}
.win .bar span{margin-inline-start:12px;opacity:.9}
.win .body{position:absolute;top:52px;left:0;right:0;bottom:0;padding:18px 20px;background:var(--sand)}

/* ---------- mock sheet ---------- */
.stats{display:grid;grid-template-columns:1.1fr 2.2fr 1.2fr 1.4fr .9fr .9fr;gap:6px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;text-align:center}
.stat u{display:block;text-decoration:none;background:var(--gold);color:#fff;font-size:17px;font-weight:700;padding:3px 4px}
.stat span{display:block;font-size:23px;font-weight:700;color:var(--ink2);padding:6px 4px;min-height:44px;transition:background .4s}
.stat.hot span{background:var(--ok-l)}.stat.bad span{background:var(--warn-l);color:var(--warn)}
.grid{display:grid;grid-template-columns:44px 112px 214px 92px repeat(5,104px);direction:rtl;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.c{height:52px;border-bottom:1px solid var(--line);border-inline-start:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:23px;position:relative;overflow:hidden;white-space:nowrap;padding:0 6px;transition:background .35s,color .35s,opacity .4s}
.c.h{background:var(--ink2);color:#fff;font-weight:700;font-size:20px}
.c.lab{background:var(--pri);color:#fff;font-weight:700;font-size:19px}
.c.seg{font-size:17px;font-weight:700;color:var(--ink2);background:#f3ead0;line-height:1.1;white-space:normal;text-align:center}
.c.nm{justify-content:flex-start;direction:ltr;font-size:21px}
.c.id{font-size:21px;color:#58625f}
.c.avg{font-weight:800;font-size:27px;color:var(--ink2);background:var(--ok-l)}
.c.avg.low{background:var(--warn-l);color:var(--warn)}
.c.in{background:var(--amber-l)}
.c.cur{background:#fff8e0}
.c.done{background:var(--ok-l)}
.c.act{box-shadow:inset 0 0 0 4px #2b7de0;background:#fff;z-index:2}
.c.g{font-weight:600}.c.g.lo{color:var(--warn);font-weight:800}.c.g.ab{color:#8c8c8c;font-style:italic;background:#ececec}
.c.dim{opacity:.28}
.dd{position:absolute;z-index:20;min-width:210px;background:#fff;border:2px solid #2b7de0;border-radius:10px;box-shadow:0 14px 30px rgba(0,0,0,.28);overflow:hidden;opacity:0}
.dd div{padding:9px 16px;font-size:21px;white-space:nowrap}
.dd div.on{background:#2b7de0;color:#fff}

/* dashboard mock */
.tbl{display:grid;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.tbl .c{height:60px;font-size:22px}
.lnk{color:var(--blue);font-weight:700;text-decoration:underline;text-underline-offset:5px}
.tag{display:inline-block;border-radius:10px;padding:2px 14px;font-size:19px;font-weight:700}
.tag.w{background:var(--warn-l);color:var(--warn)}.tag.i{background:#dfeaf5;color:var(--blue)}.tag.o{background:var(--ok-l);color:var(--ok)}.tag.a{background:var(--amber-l);color:#8a5a06}

/* cursor & callout */
.cur-svg{position:absolute;left:0;top:0;width:44px;height:44px;z-index:50;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4));opacity:0}
.rip{position:absolute;width:70px;height:70px;border-radius:50%;border:5px solid #2b7de0;z-index:49;opacity:0;margin:-35px 0 0 -35px}
.callout{position:absolute;z-index:40;background:var(--gold);color:#0b3f38;font-size:28px;font-weight:700;padding:12px 24px;border-radius:16px;line-height:1.45;opacity:0;
  box-shadow:0 12px 28px rgba(0,0,0,.35);max-width:520px;text-align:center}
.callout::after{content:"";position:absolute;width:22px;height:22px;background:var(--gold);transform:rotate(45deg)}
.callout.up::after{top:-11px;left:50%;margin-left:-11px}.callout.down::after{bottom:-11px;left:50%;margin-left:-11px}
.callout.side::after{right:-11px;top:50%;margin-top:-11px}

/* chips & cards */
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:74px;height:64px;padding:0 14px;border-radius:14px;background:#fff;border:2px solid var(--line);
  font-size:30px;font-weight:700;color:var(--ink2);opacity:0}
.chip.z{background:var(--warn-l);color:var(--warn);border-color:#e9b7a4}.chip.ab{background:#ececec;color:#8c8c8c;font-style:italic}
.chip.em{background:#f4f0e4;color:#b9b19b;border-style:dashed}
.card{position:absolute;background:var(--card);color:var(--text);border-radius:26px;padding:28px 34px;box-shadow:0 22px 60px rgba(0,0,0,.35);opacity:0}
.num{width:84px;height:84px;border-radius:50%;background:var(--gold);color:#0b3f38;display:grid;place-items:center;font-size:48px;font-weight:800}
.kicker{font-size:26px;color:var(--gold);font-weight:700;letter-spacing:.3px}
.big{font-size:54px;font-weight:800;color:var(--ink2)}
.sm{font-size:28px;color:var(--muted);line-height:1.5}
.pbar{height:18px;border-radius:9px;background:#e7e1d2;overflow:hidden}.pbar i{display:block;height:100%;margin-inline-start:auto;background:linear-gradient(270deg,var(--pri),var(--ok))}
.row{display:grid;direction:rtl;align-items:center}
.lrow .c{height:62px;font-size:22px}
.lrow .c.t{justify-content:flex-start;padding-inline:16px;white-space:normal;line-height:1.2;font-size:21px;text-align:right}

/* start overlay + controls */
#start{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:rgba(5,15,13,.55);cursor:pointer}
#start div{background:var(--gold);color:#0b3f38;font-size:44px;font-weight:800;padding:22px 64px;border-radius:999px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
#ctl{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:100;display:flex;gap:10px;align-items:center;background:rgba(5,22,19,.9);
  padding:10px 16px;border-radius:16px;color:#fff;font:600 16px "CairoM","Segoe UI",Tahoma;opacity:0;transition:opacity .3s;direction:rtl}
#ctl.show{opacity:1}
#ctl button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;padding:6px 14px;cursor:pointer;font:inherit}
#ctl button:hover{background:var(--gold);color:#0b3f38}
#ctl input[type=range]{width:380px;accent-color:#c9a24a;direction:ltr}
body.render #ctl,body.render #start{display:none}
body.hidecur{cursor:none}

.callout.sl::after{left:-11px;top:50%;margin-top:-11px}
.ring{position:absolute;border:5px solid var(--gold);border-radius:12px;box-shadow:0 0 0 8px rgba(201,162,74,.28);opacity:0;z-index:45;pointer-events:none}
body.render *{transition:none!important}

<body>
<div id="viewport"><div id="stage"></div></div>
<script src="audio/manifest.js" onerror="void 0"></script>
<script>/* مونتاج: الاستخدام اليومي لمنصة متابعة التدريس
   - كل مشهد دالة في الزمن (قابلة للتقديم والإرجاع) ولذلك يصلح للعرض وللتحويل إلى فيديو.
   - التعليق الصوتي لاحقًا: ضع ملفات audio/s01.mp3 ... وملف audio/manifest.js (انظر الدليل). */
(function () {
  'use strict';
  const $ = s => document.querySelector(s);
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const P = (t, a, b) => clamp((t - a) / (b - a));
  const eo = x => 1 - Math.pow(1 - x, 3);
  const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const lerp = (a, b, k) => a + (b - a) * k;
  function mk(tag, cls, html, parent) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; }
  const ST = $('#stage');

  /* ---------------------------------------------------------------- helpers */
  function fade(e, t, a, b, dy) { const p = eo(P(t, a, b == null ? a + .7 : b)); e.style.opacity = p; e.style.transform = 'translateY(' + ((1 - p) * (dy == null ? 22 : dy)) + 'px)'; return p; }
  function words(html) {
    let out = '', bold = false;
    html.split(/(<\/?b>)/).forEach(seg => {
      if (seg === '<b>') bold = true; else if (seg === '</b>') bold = false;
      else seg.split(/(\s+)/).forEach(w => { if (!w) return; if (/^\s+$/.test(w)) out += ' '; else out += '<span class="w">' + (bold ? '<b>' + w + '</b>' : w) + '</span>'; });
    });
    return out;
  }
  function revealWords(root, t, a, gap) {
    const ws = root.querySelectorAll('.w'); gap = gap || .3;
    ws.forEach((w, i) => { const p = eo(P(t, a + i * gap, a + i * gap + .55)); w.style.opacity = p; w.style.transform = 'translateY(' + ((1 - p) * 14) + 'px)'; });
    return a + ws.length * gap + .55;
  }
  function centerOf(e) { const r = e.getBoundingClientRect(), s = ST.getBoundingClientRect(), k = s.width / 1920; return {x: (r.left + r.width / 2 - s.left) / k, y: (r.top + r.height / 2 - s.top) / k, w: r.width / k, h: r.height / k, l: (r.left - s.left) / k, t: (r.top - s.top) / k}; }

  function Cursor(root) {
    const svg = mk('div', 'cur-svg', '<svg viewBox="0 0 44 44"><path d="M6 3 L6 33 L14 26 L20 40 L27 37 L21 24 L32 24 Z" fill="#fff" stroke="#111" stroke-width="2.6" stroke-linejoin="round"/></svg>', root);
    const rips = [];
    const o = {keys: [], clicks: [], res: null,
      go(t, target, d, dx, dy) { o.keys.push({t, target, d: d == null ? 1.1 : d, dx: dx || 0, dy: dy || 0}); return o; },
      click(t) { o.clicks.push(t); const r = mk('div', 'rip', '', root); rips.push(r); return o; },
      resolve() { o.res = o.keys.map(k => { const c = k.target && k.target.nodeType ? centerOf(k.target) : k.target; return {t: k.t, d: k.d, x: c.x + k.dx, y: c.y + k.dy}; }); },
      pos(t) {
        if (!o.res) o.resolve(); const R = o.res; if (!R.length) return null;
        let p = {x: R[0].x + 260, y: R[0].y + 230};
        for (let i = 0; i < R.length; i++) { const k = R[i], s = k.t - k.d; if (t < s) break; if (t >= k.t) { p = {x: k.x, y: k.y}; continue; } const q = eio((t - s) / k.d); return {x: lerp(p.x, k.x, q), y: lerp(p.y, k.y, q)}; }
        return p;
      },
      update(t) {
        if (!o.res) o.resolve(); const R = o.res; if (!R.length) return;
        const p = o.pos(t), vis = (t >= R[0].t - R[0].d - .5 && (o.hideAfter == null || t < o.hideAfter)) ? 1 : 0;
        svg.style.opacity = vis; svg.style.transform = 'translate(' + (p.x - 6) + 'px,' + (p.y - 3) + 'px)';
        o.clicks.forEach((tc, i) => { const q = P(t, tc, tc + .75), pc = o.pos(tc); const r = rips[i]; r.style.left = pc.x + 'px'; r.style.top = pc.y + 'px'; r.style.opacity = q > 0 && q < 1 ? (1 - q) : 0; r.style.transform = 'scale(' + (.3 + q * 1.5) + ')'; });
      }};
    return o;
  }
  function callout(root, text, cls, left, top, w) { const c = mk('div', 'callout ' + cls, text, root); c.style.left = left + 'px'; c.style.top = top + 'px'; if (w) c.style.width = w + 'px'; return c; }
  function typeInto(cell, str, t, a, dur) { const n = Math.floor(P(t, a, a + dur) * str.length + 1e-6); cell.textContent = t >= a ? str.slice(0, n) : ''; return t >= a + dur; }
  const LTR = x => '\u2066' + x + '\u2069';
  function Notes(root) {
    const box = mk('div', 'callout sl', '', root); box.style.cssText = 'left:1180px;top:650px;width:620px'; const ring = mk('div', 'ring', '', root);
    const o = {list: [], add(a, b, text, target, pad) { o.list.push({a, b, text, target, pad: pad == null ? 8 : pad}); return o; },
      update(t) { let cur = null; for (const n of o.list) if (t >= n.a && t < n.b) { cur = n; break; } if (!cur) { box.style.opacity = 0; ring.style.opacity = 0; return; }
        if (box._n !== cur) { box._n = cur; box.innerHTML = typeof cur.text === 'function' ? cur.text() : cur.text; } else if (typeof cur.text === 'function') box.innerHTML = cur.text();
        const p = eo(P(t, cur.a, cur.a + .6)) * (1 - P(t, cur.b - .5, cur.b)); box.style.opacity = p; box.style.transform = 'translateX(' + ((1 - p) * -24) + 'px)';
        const c = centerOf(cur.target); ring.style.left = (c.l - cur.pad) + 'px'; ring.style.top = (c.t - cur.pad) + 'px'; ring.style.width = (c.w + 2 * cur.pad) + 'px'; ring.style.height = (c.h + 2 * cur.pad) + 'px'; ring.style.opacity = p; ring.style.transform = 'scale(' + (1 + .025 * Math.sin(t * 5)) + ')'; }};
    return o;
  }
  function showIf(e, on) { e.style.opacity = on ? 1 : 0; }

  function header(root, step) {
    const b = mk('div', 'badge', step, root); return b;
  }
  function panel(root, kicker, title, lines, top) {
    const wrap = mk('div', '', '', root);
    const k = mk('div', 'kicker', kicker, wrap); k.style.cssText = 'position:absolute;right:110px;top:' + (top || 168) + 'px;width:660px';
    const h = mk('div', 'h1', title, wrap); h.style.top = ((top || 168) + 44) + 'px';
    const ps = lines.map((ln, i) => { const p = mk('div', 'txt', words(ln), wrap); return p; });
    return {k, h, ps, wrap};
  }
  function layoutPanel(R, y0) { let y = y0; R.ps.forEach(p => { p.style.top = y + 'px'; y += p.getBoundingClientRect().height / (ST.getBoundingClientRect().width / 1920) + 26; }); }

  function windowFrame(root, title, h) {
    const w = mk('div', 'win', '<div class="bar"><i></i><i></i><i></i><span>' + title + '</span></div><div class="body"></div>', root); if (h) w.style.height = h + 'px';
    return {win: w, body: w.querySelector('.body')};
  }

  /* ---------------------------------------------------------------- data */
  const NAMES = ['Faisal Alshehri', 'Omar Alshammari', 'Khalid Alruwaili', 'Hamad Alshehri', 'Ziyad Alyami', 'Rayan Alotaibi', 'Turki Aldosari', 'Nawaf Alqahtani'];
  const IDS = ['2545001', '2545002', '2545003', '2545004', '2545005', '2545006', '2545007', '2545008'];
  const PRIOR = [[9, 9.5, 9, 10], [8, 8.5, 9, 8.5], [10, 10, 9.5, 10], [6, 7, 6.5, 6], [9, 8, 9.5, 9], [5, 6, 4.5, 6], [8.5, 9, 8, 9], [7, 6, 7.5, 6.5]];
  const NEWG = [9.5, 8, 10, 10, 9, 5.5, 'ab', null];
  const SEGS = ['الأحزاب 1<br>(1-8)', 'الأحزاب 2<br>(9-20)', 'الأحزاب 3<br>(21-27)', 'الأحزاب 4<br>(28-35)', 'الأحزاب 5<br>(36-44)'];
  const DATES = ['2026/10/18', '2026/10/20', '2026/11/01', '2026/11/08'];
  const avgOf = g => { const n = g.filter(v => typeof v === 'number'); return n.length ? Math.ceil(Math.round(n.reduce((a, b) => a + b, 0) / n.length * 10 * 1e6) / 1e6) : null; };
  const AVG0 = PRIOR.map(g => avgOf(g));
  const AVG1 = PRIOR.map((g, i) => avgOf(g.concat([NEWG[i]])));
  const meanR = a => Math.round(a.reduce((x, y) => x + y, 0) / a.length);
  const cls = v => 'c avg' + (v < 70 ? ' low' : '');

  /* ---------------------------------------------------------------- quran sheet mock */
  function quranSheet(body, o) {
    o = o || {};
    const R = {cells: []};
    const st = mk('div', 'stats', '', body);
    const sdefs = [['المقاطع المنفذة', LTR('4 / 34'), 'seg'], ['آخر مقطع', 'الأحزاب 4 (28-35)', 'last'], ['تاريخه', DATES[3], 'date'], ['بواسطة', 'سالم العتيبي', 'by'], ['معدل الفصل', meanR(AVG0), 'avg'], ['دون الحد', AVG0.filter(a => a < 70).length, 'low']];
    R.st = {};
    sdefs.forEach(d => { const s = mk('div', 'stat', '<u>' + d[0] + '</u><span>' + d[1] + '</span>', st); R.st[d[2]] = s; R.st[d[2] + 'V'] = s.querySelector('span'); });
    const g = mk('div', 'grid', '', body); R.grid = g;
    const row = (r, arr) => { R.cells[r] = arr; };
    // row 0..2 : segment / date / executor
    const labels = ['المقطع', 'التاريخ', 'المنفذ'];
    for (let r = 0; r < 3; r++) {
      const sp = mk('div', 'c', r === 0 ? '<span style="font-size:17px;color:#6c7774;line-height:1.3;white-space:normal;text-align:right">الصق الأسماء في B و C. الدرجة من 10 أو «غائب».</span>' : '', g);
      sp.style.gridColumn = 'span 3'; sp.style.background = '#f7f2e8';
      const lab = mk('div', 'c lab', labels[r], g); const arr = [sp, null, null, lab];
      for (let k = 0; k < 5; k++) {
        const c = mk('div', 'c ' + (r === 0 ? 'seg' : '') + (k === 4 ? ' cur' : ''), '', g);
        if (r === 0) c.innerHTML = SEGS[k];
        else if (k < 4) c.textContent = r === 1 ? DATES[k] : 'سالم العتيبي', c.style.fontSize = r === 1 ? '19px' : '17px';
        if (k < 4 && r > 0) c.classList.add('done');
        arr.push(c);
      }
      row(r, arr);
    }
    const hd = ['م', 'الرقم', 'الاسم', 'المعدل'], harr = [];
    hd.forEach(h => harr.push(mk('div', 'c h', h, g)));
    for (let k = 0; k < 5; k++) harr.push(mk('div', 'c h', String(k + 1), g));
    row(3, harr);
    for (let i = 0; i < 8; i++) {
      const arr = [mk('div', 'c', String(i + 1), g), mk('div', 'c id', IDS[i], g), mk('div', 'c nm', NAMES[i], g), mk('div', cls(AVG0[i]), String(AVG0[i]), g)];
      for (let k = 0; k < 5; k++) {
        const v = k < 4 ? PRIOR[i][k] : '';
        const c = mk('div', 'c g' + (k === 4 ? ' cur' : '') + (typeof v === 'number' && v < 7 ? ' lo' : ''), String(v), g); arr.push(c);
      }
      row(4 + i, arr);
    }
    R.stu = i => R.cells[4 + i];
    R.setSt = (key, txt, on) => { R.st[key + 'V'].textContent = (typeof txt === 'string' && txt.indexOf(' / ') > 0) ? LTR(txt) : txt; R.st[key].classList.toggle('hot', !!on); };
    return R;
  }

  function ddMenu(root, items) { const d = mk('div', 'dd', items.map(x => '<div>' + x + '</div>').join(''), root); return d; }
  function ddUpdate(d, cell, t, a, pick, tPick, close) {
    const vis = t >= a && t < close; const p = eo(P(t, a, a + .35));
    if (!d._pos) { const c = centerOf(cell); d._pos = {x: c.l, y: c.t + c.h + 4}; d.style.left = d._pos.x + 'px'; d.style.top = d._pos.y + 'px'; }
    d.style.opacity = vis ? p : 0;
    const it = d.children; for (let i = 0; i < it.length; i++) it[i].classList.toggle('on', t >= tPick - .6 && i === pick);
  }

  /* ---------------------------------------------------------------- scenes */
  const SC = [];
  function scene(def) { SC.push(def); }

  /* ===== 1. العنوان ===== */
  scene({id: 's01', dur: 12, narr: ['مرحبًا بكم في هذا العرض.', 'سنتعرف معًا على الاستخدام اليومي لمنصة متابعة التدريس، من فتح الفصل، إلى تسجيل الحصة، ثم رصد الدرجات، وكيف تنعكس النتائج أمامكم.'],
    build(r) {
      const R = {};
      const logo = mk('div', '', '<div style="width:150px;height:150px;border-radius:44px;background:var(--gold);position:relative;box-shadow:0 20px 60px rgba(0,0,0,.4)"><div style="position:absolute;left:38px;top:44px;width:74px;height:40px;border-left:16px solid #0b3f38;border-bottom:16px solid #0b3f38;transform:rotate(-45deg)"></div></div>', r);
      logo.style.cssText = 'position:absolute;left:885px;top:230px'; R.logo = logo;
      R.h = mk('div', '', words('منصة متابعة التدريس'), r); R.h.style.cssText = 'position:absolute;left:0;right:0;top:440px;text-align:center;font-size:118px;font-weight:800;color:#fff';
      R.s = mk('div', '', words('الاستخدام اليومي: <b>سجّل الحصة</b> · <b>ارصد الدرجات</b> · <b>شاهد النتيجة</b>'), r); R.s.style.cssText = 'position:absolute;left:0;right:0;top:672px;text-align:center;font-size:46px;color:#d9e7e3;font-weight:600';
      R.l = mk('div', '', '', r); R.l.style.cssText = 'position:absolute;left:660px;width:600px;top:626px;height:4px;background:var(--gold);transform-origin:center;border-radius:4px';
      R.f = mk('div', '', 'دليل المدرس', r); R.f.style.cssText = 'position:absolute;left:0;right:0;top:880px;text-align:center;font-size:34px;color:var(--gold);font-weight:700;letter-spacing:1px';
